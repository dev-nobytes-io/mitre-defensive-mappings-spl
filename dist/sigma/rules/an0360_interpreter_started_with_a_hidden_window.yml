# Generated by mitremap from content/analytics/AN0360.yml
title: Interpreter started with a hidden window
id: bb1923e4-5321-5e62-a034-d9bc77f37b3c
name: an0360_0
status: experimental
description: PowerShell is started with a hidden WindowStyle argument, or cmd uses start /min or /b to launch an interpreter,
  from a parent that is not a known management agent.
references:
- https://attack.mitre.org/detectionstrategies/DET0128#AN0360
- https://attack.mitre.org/techniques/T1564/003
author: mitremap
date: '2026-11-05'
tags:
- attack.stealth
- attack.t1564.003
logsource:
  product: windows
  category: process_creation
detection:
  powershell:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    CommandLine|contains:
    - -w hidden
    - -wi hidden
    - -win hidden
    - -windowstyle hidden
    - -WindowStyle 1
  cmd_start:
    Image|endswith: \cmd.exe
    CommandLine|contains:
    - 'start /min '
    - 'start /b '
  cmd_target:
    CommandLine|contains:
    - powershell
    - wscript
    - cscript
    - mshta
    - rundll32
  condition: powershell or (cmd_start and cmd_target)
falsepositives:
- Logon scripts, scheduled maintenance tasks and software updaters.
level: low
mitre_analytic: AN0360
mitre_detection_strategy: DET0128
mitre_data_components:
- DC0032
