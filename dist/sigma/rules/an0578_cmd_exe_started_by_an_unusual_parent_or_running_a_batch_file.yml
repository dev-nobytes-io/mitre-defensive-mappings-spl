# Generated by mitremap from content/analytics/AN0578.yml
title: cmd.exe started by an unusual parent or running a batch file from a staging path
id: 8903f210-8797-5068-abc9-6d0b42ef1b51
name: an0578_0
status: experimental
description: cmd.exe is started by a browser, mail or chat client, Java, the print spooler, SQL Server or LSASS, or it runs
  a .bat/.cmd file located in Users\Public, a Temp directory or Downloads.
references:
- https://attack.mitre.org/detectionstrategies/DET0202#AN0578
- https://attack.mitre.org/techniques/T1059/003
author: mitremap
date: '2026-11-05'
tags:
- attack.execution
- attack.t1059.003
logsource:
  product: windows
  category: process_creation
detection:
  cmd:
    Image|endswith: \cmd.exe
  parent:
    ParentImage|endswith:
    - \msedge.exe
    - \chrome.exe
    - \firefox.exe
    - \iexplore.exe
    - \outlook.exe
    - \thunderbird.exe
    - \java.exe
    - \javaw.exe
    - \spoolsv.exe
    - \lsass.exe
    - \sqlservr.exe
  script:
    CommandLine|contains:
    - \Users\Public\
    - \AppData\Local\Temp\
    - \Windows\Temp\
    - \Downloads\
    CommandLine|re: (?i)\.(bat|cmd)
  native_messaging:
    CommandLine|contains: chrome-extension://
  condition: cmd and (parent or script) and not native_messaging
falsepositives:
- Browser native-messaging hosts, Java application launchers, SQL Agent jobs and installers that unpack batch files to Temp.
level: low
mitre_analytic: AN0578
mitre_detection_strategy: DET0202
mitre_data_components:
- DC0032
