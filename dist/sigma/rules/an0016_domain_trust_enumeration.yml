name: an0016_trust_command
status: experimental
description: nltest /domain_trusts, /all_trusts or /trusted_domains, dsquery or AdFind filters for trustedDomain objects,
  Get-ADTrust, PowerView Get-DomainTrust and Get-NetDomainTrust, or the .NET GetAllTrustRelationships call, from a process
  command line or a PowerShell script block. Trust mapping is a standard step before moving between domains and appears in
  most pre-ransomware discovery bursts.
