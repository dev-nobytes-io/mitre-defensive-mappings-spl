# Generated by mitremap from content/analytics/AN0589.yml
title: Registry queries for environment, software and security configuration
id: 50e521f1-bdf4-5241-af35-edc1e2370bab
name: an0589_0
status: experimental
description: 'Lists reg query, reg export and PowerShell registry reads against keys that reveal the environment: OS version,
  installed software, security products, saved RDP and PuTTY sessions, autoruns, and stored credentials (Winlogon, SNMP, VNC).'
references:
- https://attack.mitre.org/detectionstrategies/DET0209#AN0589
- https://attack.mitre.org/techniques/T1012
author: mitremap
date: '2026-11-05'
tags:
- attack.discovery
- attack.t1012
logsource:
  product: windows
  category: process_creation
detection:
  reg:
    Image|endswith: \reg.exe
    CommandLine|contains:
    - ' query '
    - ' export '
  keys:
    CommandLine|contains:
    - CurrentVersion\Uninstall
    - Windows NT\CurrentVersion
    - \Terminal Server Client
    - SimonTatham\PuTTY
    - \Winlogon
    - \SNMP\Parameters
    - RealVNC
    - TightVNC
    - Windows Defender
    - \Control\Lsa
  condition: reg and keys
falsepositives:
- Inventory agents and installers reading the Uninstall key; administrators.
level: informational
mitre_analytic: AN0589
mitre_detection_strategy: DET0209
mitre_data_components:
- DC0032
