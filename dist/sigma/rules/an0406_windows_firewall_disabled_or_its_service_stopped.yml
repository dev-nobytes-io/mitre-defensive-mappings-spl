# Generated by mitremap from content/analytics/AN0406.yml
title: Windows Firewall disabled or its service stopped (an0406_command)
id: ad4ea395-5532-5d00-af1a-8b4b6da08418
name: an0406_command
status: experimental
description: netsh turns a firewall profile off, PowerShell sets a profile to disabled, the firewall service (MpsSvc) is stopped
  or disabled, or a FirewallPolicy EnableFirewall registry value is set to 0.
references:
- https://attack.mitre.org/detectionstrategies/DET0145#AN0406
- https://attack.mitre.org/techniques/T1686
author: mitremap
date: '2026-11-05'
tags:
- attack.defense-impairment
- attack.t1686
logsource:
  product: windows
  category: process_creation
detection:
  netsh:
    Image|endswith: \netsh.exe
    CommandLine|contains:
    - state off
    - opmode disable
    - opmode mode=disable
  powershell:
    CommandLine|contains|all:
    - Set-NetFirewallProfile
    - -Enabled
    - 'False'
  service:
    CommandLine|contains|all:
    - mpssvc
    CommandLine|contains:
    - ' stop'
    - disabled
  condition: 1 of them
falsepositives:
- Troubleshooting by administrators; third-party firewalls that disable the Windows one at install.
level: high
mitre_analytic: AN0406
mitre_detection_strategy: DET0145
mitre_data_components:
- DC0032
- DC0063
