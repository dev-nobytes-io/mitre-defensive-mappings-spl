# Generated by mitremap from content/analytics/AN1229.yml
title: Script host or LOLBin accepting inbound network connections
id: ec454cba-624a-5951-9607-0b75e1370577
name: an1229_0
status: experimental
description: Sysmon network connection events (3) with Initiated=false, meaning the process accepted an inbound connection,
  where the process is a script interpreter, shell or proxy-execution utility. A host that relays traffic for an attacker
  (SOCKS or port-forward implants in PowerShell or rundll32) has to listen; these processes almost never do.
references:
- https://attack.mitre.org/detectionstrategies/DET0445#AN1229
- https://attack.mitre.org/techniques/T1090
author: mitremap
date: '2026-11-05'
tags:
- attack.command-and-control
- attack.t1090
logsource:
  product: windows
  category: network_connection
detection:
  selection:
    Initiated: 'false'
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    - \cmd.exe
    - \rundll32.exe
    - \regsvr32.exe
    - \mshta.exe
    - \wscript.exe
    - \cscript.exe
    - \msbuild.exe
    - \installutil.exe
  loopback:
    SourceIp|startswith:
    - '127.'
    - ::1
  condition: selection and not loopback
falsepositives:
- PowerShell remoting endpoints are wsmprovhost, not powershell, so they do not match; developer test servers run from scripts.
level: high
mitre_analytic: AN1229
mitre_detection_strategy: DET0445
mitre_data_components:
- DC0082
