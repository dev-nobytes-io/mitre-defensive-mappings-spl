name: an0965_clipboard_command
status: experimental
description: Get-Clipboard, the .NET Windows.Forms Clipboard GetText/GetDataObject calls, or the user32 GetClipboardData API
  referenced from a PowerShell script block (4104) or a process command line. Clipboard stealers and crypto wallet swappers
  read the clipboard on a loop.
references:
