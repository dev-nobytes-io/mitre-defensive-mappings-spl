- https://attack.mitre.org/techniques/T1115
author: mitremap
date: '2026-11-05'
tags:
- attack.collection
- attack.t1115
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
    - Get-Clipboard
    - Clipboard]::GetText
    - GetClipboardData
  condition: selection
falsepositives:
- Helpdesk and productivity scripts that paste into forms; PowerShell modules that wrap the clipboard.
level: low
