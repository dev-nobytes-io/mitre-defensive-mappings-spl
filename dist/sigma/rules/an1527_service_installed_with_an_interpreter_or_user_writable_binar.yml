title: Service installed with an interpreter or user-writable binary path
id: 8a172415-f69c-5c9c-864e-4bc7bbcd14ef
name: an1527_0
status: experimental
description: A new service is registered (System 7045 or Security 4697) whose image path runs a command interpreter or LOLBin,
  or points into Users, ProgramData, Temp, AppData, PerfLogs or an ADMIN$ / loopback UNC path. Covers PsExec-style and malware
  service persistence.
references:
- https://attack.mitre.org/detectionstrategies/DET0552#AN1527
- https://attack.mitre.org/techniques/T1543/003
author: mitremap
date: '2026-11-05'
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1543.003
logsource:
  product: windows
  service: system
detection:
  selection:
    EventID: 7045
    ImagePath|contains:
    - \Users\
    - \ProgramData\
    - \Windows\Temp\
    - \AppData\
    - \PerfLogs\
    - '%COMSPEC%'
    - cmd.exe
    - powershell
    - rundll32
    - regsvr32
    - mshta
    - \ADMIN$\
  filter:
    ImagePath|contains: \ProgramData\Microsoft\Windows Defender\
  condition: selection and not filter
falsepositives:
- Vendor software that installs services from ProgramData; remote administration with PsExec-like tools.
level: medium
mitre_analytic: AN1527
mitre_detection_strategy: DET0552
