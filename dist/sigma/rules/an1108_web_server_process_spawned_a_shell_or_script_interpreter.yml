title: Web server process spawned a shell or script interpreter
id: bb003ec8-2ff7-5fe7-9ac3-facb5db91229
name: an1108_0
status: experimental
description: A web server worker (IIS w3wp, Apache, nginx, PHP, Tomcat, Exchange UM worker) starts cmd, PowerShell, a script
  host or a discovery/LOLBin utility. Legitimate web applications rarely do this; web shells and exploited upload handlers
  always do.
references:
- https://attack.mitre.org/detectionstrategies/DET0394#AN1108
- https://attack.mitre.org/techniques/T1505/003
author: mitremap
date: '2026-11-05'
tags:
- attack.persistence
- attack.t1505.003
logsource:
  product: windows
  category: process_creation
detection:
  parent:
    ParentImage|endswith:
    - \w3wp.exe
    - \httpd.exe
    - \nginx.exe
    - \php-cgi.exe
    - \php.exe
    - \UMWorkerProcess.exe
  child:
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
    - \wscript.exe
    - \cscript.exe
    - \mshta.exe
    - \rundll32.exe
    - \regsvr32.exe
    - \certutil.exe
    - \bitsadmin.exe
    - \whoami.exe
    - \net.exe
    - \net1.exe
    - \ipconfig.exe
    - \systeminfo.exe
    - \tasklist.exe
    - \nltest.exe
    - \wmic.exe
  condition: parent and child
falsepositives:
- Applications that shell out by design (CGI wrappers, some CMS plugins, deployment hooks).
