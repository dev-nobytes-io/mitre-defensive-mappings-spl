# Generated by mitremap from content/analytics/AN0105.yml
title: Browser credential store read by a non-browser process
id: 9d3b2bdb-a557-5166-8b95-14cd05c3c831
name: an0105_0
status: experimental
description: A process that is not the browser itself opens a browser credential or cookie database (Chromium Login Data,
  Cookies and Local State; Firefox logins.json and key4.db), seen as Security 4663 on the file.
references:
- https://attack.mitre.org/detectionstrategies/DET0037#AN0105
- https://attack.mitre.org/techniques/T1555/003
author: mitremap
date: '2026-11-05'
tags:
- attack.credential-access
- attack.t1555.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4663
    ObjectName|contains:
    - \User Data\Default\Login Data
    - \User Data\Local State
    - \Network\Cookies
    - \Firefox\Profiles\
  firefox_files:
    ObjectName|endswith:
    - \logins.json
    - \key4.db
    - Login Data
    - Local State
    - Cookies
  browser:
    ProcessName|endswith:
    - \chrome.exe
    - \msedge.exe
    - \msedgewebview2.exe
    - \firefox.exe
    - \brave.exe
    - \opera.exe
    - \MsMpEng.exe
  condition: selection and firefox_files and not browser
falsepositives:
- Profile backup and migration tools, password managers importing saved logins, endpoint DLP agents.
level: high
mitre_analytic: AN0105
mitre_detection_strategy: DET0037
mitre_data_components:
- DC0055
