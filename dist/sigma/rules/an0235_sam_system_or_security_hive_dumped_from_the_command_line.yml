# Generated by mitremap from content/analytics/AN0235.yml
title: SAM, SYSTEM or SECURITY hive dumped from the command line
id: 4b06a06f-70f2-5487-a442-40e47338aefa
name: an0235_0
status: experimental
description: A process saves or exports the SAM, SYSTEM or SECURITY registry hive (reg save / reg export and PowerShell equivalents)
  or reads the hive files under System32\config directly, including through a shadow-copy path. Either gives offline access
  to local account hashes.
references:
- https://attack.mitre.org/detectionstrategies/DET0085#AN0235
- https://attack.mitre.org/techniques/T1003/002
author: mitremap
date: '2026-11-05'
tags:
- attack.credential-access
- attack.t1003.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_cmd:
    CommandLine|contains:
    - ' save '
    - ' export '
  selection_hive:
    CommandLine|contains:
    - 'hklm\sam '
    - 'hklm\system '
    - 'hklm\security '
    - 'hkey_local_machine\sam '
    - 'hkey_local_machine\system '
    - 'hkey_local_machine\security '
  selection_file:
    CommandLine|contains:
    - \system32\config\sam
    - \system32\config\security
  condition: (selection_cmd and selection_hive) or selection_file
falsepositives:
- System-state backup software and some imaging tools save these hives.
level: high
mitre_analytic: AN0235
mitre_detection_strategy: DET0085
mitre_data_components:
- DC0032
