# Generated by mitremap from content/detection_strategies/DET0085.yml
title: SYSTEM hive saved together with SAM or SECURITY (det0085_system_hive)
id: 208cb9f5-5f48-55a9-b632-cacbf07dc6c0
name: det0085_system_hive
status: experimental
description: The same user on the same host saves or exports the SYSTEM hive and the SAM or SECURITY hive within three minutes.
  SAM hashes are encrypted with the boot key stored in SYSTEM, so both together are what offline hash extraction needs; either
  alone (AN0235) is a weaker signal.
references:
- https://attack.mitre.org/detectionstrategies/DET0085
author: mitremap
date: '2026-11-05'
tags:
- attack.credential-access
- attack.t1003.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
    - ' save '
    - ' export '
  hive:
    CommandLine|contains:
    - 'hklm\system '
    - 'hkey_local_machine\system '
  condition: selection and hive
falsepositives:
- System-state backups that export every hive.
level: informational
mitre_detection_strategy: DET0085
mitre_data_components:
- DC0032
