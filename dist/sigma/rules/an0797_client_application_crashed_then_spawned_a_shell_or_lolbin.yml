title: Client application crashed, then spawned a shell or LOLBin (an0797_client_crash)
id: 7bb59547-06bf-5a08-a42d-5a89677902f2
name: an0797_client_crash
status: experimental
description: A browser, Office application or document reader launches WerFault (it crashed), and within ten minutes the same
  application on the same host starts a shell, script host or proxy-execution utility. A crash followed by unexpected children
  is the footprint of a client-side exploit that partly failed or recovered.
references:
- https://attack.mitre.org/detectionstrategies/DET0287#AN0797
- https://attack.mitre.org/techniques/T1203
author: mitremap
date: '2026-11-05'
tags:
- attack.execution
- attack.t1203
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: \WerFault.exe
    ParentImage|endswith:
    - \chrome.exe
    - \msedge.exe
    - \firefox.exe
    - \winword.exe
    - \excel.exe
    - \powerpnt.exe
    - \outlook.exe
    - \acrord32.exe
    - \acrobat.exe
  condition: selection
falsepositives:
- An add-in that both crashes and legitimately shells out (rare); unstable plug-ins in browsers.
level: informational
mitre_analytic: AN0797
mitre_detection_strategy: DET0287
