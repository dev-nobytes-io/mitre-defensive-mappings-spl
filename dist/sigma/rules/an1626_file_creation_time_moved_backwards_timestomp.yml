# Generated by mitremap from content/analytics/AN1626.yml
title: File creation time moved backwards (timestomp) (an1626_creation_time_changed)
id: c4bc4155-4b29-501a-b083-83996cbe306d
name: an1626_creation_time_changed
status: experimental
description: Sysmon 2 (a process changed a file's creation time) where the new creation time is earlier than the previous
  one by more than a day, written by a process that does not normally restore timestamps; or a PowerShell script block that
  assigns CreationTime, LastWriteTime or LastAccessTime. Backdating makes a dropped file blend in with the operating system
  files around it.
references:
- https://attack.mitre.org/detectionstrategies/DET0591#AN1626
- https://attack.mitre.org/techniques/T1070/006
author: mitremap
date: '2026-11-05'
tags:
- attack.stealth
- attack.t1070.006
logsource:
  product: windows
  category: file_change
detection:
  selection:
    TargetFilename|endswith:
    - .exe
    - .dll
    - .sys
    - .ps1
    - .bat
    - .vbs
  benign:
    Image|endswith:
    - \7z.exe
    - \WinRAR.exe
    - \explorer.exe
    - \msiexec.exe
    - \TiWorker.exe
    - \OneDrive.exe
  condition: selection and not benign
falsepositives:
- Archive extraction and copy tools that preserve original timestamps (allow-list them in the benign-writers macro).
- Build systems and package managers that normalise timestamps for reproducible output.
level: medium
mitre_analytic: AN1626
mitre_detection_strategy: DET0591
mitre_data_components:
- DC0061
- DC0029
