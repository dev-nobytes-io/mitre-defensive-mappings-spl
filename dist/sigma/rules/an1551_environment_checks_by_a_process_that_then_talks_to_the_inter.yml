title: Environment checks by a process that then talks to the internet
id: 3621aab4-2b8b-5899-b683-e74baeacc0a5
name: an1551_discovery_child
status: experimental
description: One parent process spawns several distinct environment-discovery commands (whoami, hostname, ipconfig, systeminfo,
  nltest, wmic computersystem/csproduct/bios, reg query MachineGuid) within the search window and the same parent process
  (matched by Sysmon ProcessGuid) makes an outbound connection to an external address. Guardrailed payloads collect host,
  domain and hardware identifiers, check them, and only then fetch or run the next stage.
references:
- https://attack.mitre.org/detectionstrategies/DET0562#AN1551
- https://attack.mitre.org/techniques/T1480
author: mitremap
date: '2026-11-05'
tags:
- attack.stealth
- attack.t1480
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
    - \whoami.exe
    - \hostname.exe
    - \ipconfig.exe
    - \systeminfo.exe
    - \nltest.exe
    - \getmac.exe
  condition: selection
falsepositives:
- Inventory, monitoring and RMM agents that shell out for host facts; login scripts that also map drives over the internet.
level: informational
