# Generated by mitremap from content/analytics/AN1419.yml
title: Vulnerable or out-of-place driver loaded, or SYSTEM process spawned by a user process (an1419_vulnerable_driver)
id: a661ed6b-e7d4-51df-8887-38f931a3795e
name: an1419_vulnerable_driver
status: experimental
description: 'Two footprints of local privilege escalation: a kernel driver load (Sysmon 6) whose name is a known vulnerable
  driver used for BYOVD, that is unsigned, or that loads from a user-writable folder; and a process running at System integrity
  whose parent runs as an ordinary user, which is what a token-stealing or kernel exploit leaves behind.'
references:
- https://attack.mitre.org/detectionstrategies/DET0514#AN1419
- https://attack.mitre.org/techniques/T1068
author: mitremap
date: '2026-11-05'
tags:
- attack.privilege-escalation
- attack.t1068
logsource:
  product: windows
  category: driver_load
detection:
  names:
    ImageLoaded|endswith:
    - \RTCore64.sys
    - \gdrv.sys
    - \dbutil_2_3.sys
    - \aswArPot.sys
    - \mhyprot2.sys
    - \kprocesshacker.sys
    - \iqvw64e.sys
    - \AsIO2.sys
    - \WinRing0x64.sys
    - \zamguard64.sys
    - \truesight.sys
  unsigned:
    Signed: 'false'
  condition: names or unsigned
falsepositives:
- Hardware monitoring, overclocking and anti-cheat utilities that ship the listed drivers legitimately.
- Management agents that start SYSTEM processes on behalf of a user session (check the parent and allow-list it in the filter).
level: high
mitre_analytic: AN1419
mitre_detection_strategy: DET0514
mitre_data_components:
- DC0079
- DC0032
