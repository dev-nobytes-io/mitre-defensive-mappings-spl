# Generated by mitremap from content/analytics/AN0531.yml
title: Bulk copy of user documents into a staging location
id: 2f3e60d0-483c-58b9-8664-248d95c3c63d
name: an0531_0
status: experimental
description: robocopy, xcopy or copy, or PowerShell Copy-Item / Get-ChildItem with document-type filters, copying from user
  profile folders (Documents, Desktop, Downloads, mail stores) into a staging location (Temp, Users\Public, ProgramData, PerfLogs,
  a mapped share) or recursively collecting document extensions.
references:
- https://attack.mitre.org/detectionstrategies/DET0186#AN0531
- https://attack.mitre.org/techniques/T1119
author: mitremap
date: '2026-11-05'
tags:
- attack.collection
- attack.t1119
logsource:
  product: windows
  category: process_creation
detection:
  copy_tool:
    Image|endswith:
    - \robocopy.exe
    - \xcopy.exe
    CommandLine|contains:
    - \Documents
    - \Desktop
    - \Downloads
    - .pst
  powershell:
    CommandLine|contains:
    - Copy-Item
    - Get-ChildItem
  doc_filter:
    CommandLine|contains:
    - .doc
    - .xls
    - .pdf
    - .ppt
    - .pst
    - .kdbx
  condition: copy_tool or (powershell and doc_filter)
falsepositives:
- Profile migrations, backup scripts and users copying their own files to a share.
level: medium
mitre_analytic: AN0531
mitre_detection_strategy: DET0186
mitre_data_components:
- DC0032
