# Generated by mitremap from content/analytics/AN0237.yml
title: Binary written by a decoding utility, then executed or loaded (an0237_decoder_writes_pe)
id: e9e4fa42-83bf-5657-8028-0ed35d7b094b
name: an0237_decoder_writes_pe
status: experimental
description: 'A decoder or script host (certutil, PowerShell, cmd, expand, esentutl, extrac32, makecab, mshta, script hosts)
  writes a PE file into a staging path (Sysmon 11), and within ten minutes that file is started as a process (Sysmon 1) or
  loaded as a module (Sysmon 7). Joined on host and file path: the decode-then-run chain ATT&CK describes, where AN0767 only
  sees the decode command.'
references:
- https://attack.mitre.org/detectionstrategies/DET0087#AN0237
- https://attack.mitre.org/techniques/T1027/013
author: mitremap
date: '2026-11-05'
tags:
- attack.stealth
- attack.t1027.013
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
    - \certutil.exe
    - \powershell.exe
    - \pwsh.exe
    - \cmd.exe
    - \expand.exe
    - \esentutl.exe
    - \extrac32.exe
    - \mshta.exe
    - \wscript.exe
    - \cscript.exe
    TargetFilename|endswith:
    - .exe
    - .dll
    - .scr
    - .cpl
    TargetFilename|contains:
    - \AppData\
    - \Users\Public\
    - \Windows\Temp\
    - \ProgramData\
    - \PerfLogs\
  condition: selection
falsepositives:
- Installers launched from PowerShell or cmd that unpack and run their own binaries from Temp.
level: informational
mitre_analytic: AN0237
mitre_detection_strategy: DET0087
mitre_data_components:
- DC0039
- DC0032
- DC0016
