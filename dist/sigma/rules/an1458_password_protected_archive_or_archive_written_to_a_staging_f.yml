# Generated by mitremap from content/analytics/AN1458.yml
title: Password-protected archive or archive written to a staging folder (an1458_password_archive)
id: 66426149-4616-57ad-a69a-2dd681c04d16
name: an1458_password_archive
status: experimental
description: An archiver (7-Zip, RAR, WinRAR, makecab, tar, PowerShell Compress-Archive) run with a password or header encryption
  switch, or an archive file written to a staging folder (Public, ProgramData, Windows\Temp, PerfLogs, the Recycle Bin, user
  Temp). Encrypted archives in odd places are how collected data is packed before exfiltration.
references:
- https://attack.mitre.org/detectionstrategies/DET0526#AN1458
- https://attack.mitre.org/techniques/T1560
author: mitremap
date: '2026-11-05'
tags:
- attack.collection
- attack.t1560
logsource:
  product: windows
  category: process_creation
detection:
  archiver:
    Image|endswith:
    - \7z.exe
    - \7za.exe
    - \rar.exe
    - \WinRAR.exe
  password:
    CommandLine|contains:
    - ' -p'
    - ' -hp'
    - ' -mhe=on'
  condition: archiver and password
falsepositives:
- Backup and log-rotation jobs writing archives to ProgramData or Windows\Temp; users sending encrypted archives on purpose.
level: medium
mitre_analytic: AN1458
mitre_detection_strategy: DET0526
mitre_data_components:
- DC0032
- DC0039
