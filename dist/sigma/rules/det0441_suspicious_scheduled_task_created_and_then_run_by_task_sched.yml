# Generated by mitremap from content/detection_strategies/DET0441.yml
title: Suspicious scheduled task created and then run by Task Scheduler (det0441_task_created)
id: 12502ffa-8978-51d1-bde0-06ae76111bea
name: det0441_task_created
status: experimental
description: A scheduled task whose action runs an interpreter or a user-writable binary is registered (Security 4698), and
  within ten minutes Task Scheduler starts a process from the task's command (Sysmon 1 with the Schedule service or taskeng
  as parent). Joined on host and the executable path in the task XML.
references:
- https://attack.mitre.org/detectionstrategies/DET0441
author: mitremap
date: '2026-11-05'
tags:
- attack.execution
- attack.persistence
- attack.privilege-escalation
- attack.t1053.005
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4698
    TaskContent|contains:
    - \AppData\
    - \Users\Public\
    - \Windows\Temp\
    - \ProgramData\
    - powershell
    - cmd.exe
    - wscript
    - cscript
    - mshta
    - rundll32
    - regsvr32
  condition: selection
falsepositives:
- Software deployment that registers and immediately runs a PowerShell-based task.
level: informational
mitre_detection_strategy: DET0441
mitre_data_components:
- DC0001
- DC0032
