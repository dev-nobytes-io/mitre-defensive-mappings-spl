# Generated by mitremap from content/analytics/AN1468.yml
title: Shell or LOLBin executed inside a network logon session (an1468_network_logon)
id: c28af449-1110-53eb-beff-9d5ef39dce38
name: an1468_network_logon
status: experimental
description: A process from a watch list (cmd, PowerShell, script hosts, rundll32, regsvr32, mshta, certutil, net, sc, schtasks,
  wmic, reg) runs on a host inside a logon session that was created by a network logon (4624 type 3) from another address.
  Sysmon's LogonId is joined to the 4624 TargetLogonId, so the source address and account of the remote execution are reported.
references:
- https://attack.mitre.org/detectionstrategies/DET0530#AN1468
- https://attack.mitre.org/techniques/T1021/002
author: mitremap
date: '2026-11-05'
tags:
- attack.lateral-movement
- attack.t1021.002
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 3
  machine:
    TargetUserName|endswith: $
  local:
    IpAddress:
    - '-'
    - 127.0.0.1
    - ::1
  condition: selection and not machine and not local
falsepositives:
- Remote management (SCCM, PDQ, WinRM-based tooling, vulnerability scanners with credentials).
level: informational
mitre_analytic: AN1468
mitre_detection_strategy: DET0530
mitre_data_components:
- DC0067
- DC0032
