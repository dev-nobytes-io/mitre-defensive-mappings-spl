title: Search for credential files or sensitive document types
id: ff089961-0c83-57f9-8c2a-c5b8913f16c7
name: an1070_0
status: experimental
description: 'Commands that look for secrets or high-value files on the local system: findstr or Select-String for password
  strings; dir, where or Get-ChildItem for key, certificate, password-database and RDP files (kdbx, pfx, p12, pem, ppk, id_rsa,
  rdp, ovpn, unattend.xml).'
references:
- https://attack.mitre.org/detectionstrategies/DET0380#AN1070
- https://attack.mitre.org/techniques/T1005
author: mitremap
date: '2026-11-05'
tags:
- attack.collection
- attack.t1005
logsource:
  product: windows
  category: process_creation
detection:
  findstr:
    CommandLine|contains|all:
    - findstr
    CommandLine|contains:
    - password
    - passwd
    - pwd=
    - credential
    - connectionstring
  select_string:
    CommandLine|contains|all:
    - Select-String
    CommandLine|contains:
    - password
    - credential
  secret_files:
    CommandLine|contains:
    - .kdbx
    - .pfx
    - .p12
    - .ppk
    - id_rsa
    - .ovpn
    - unattend.xml
    - sysprep.inf
  listing:
    CommandLine|contains:
    - 'dir '
    - 'where '
    - Get-ChildItem
    - 'gci '
    - /s
    - -Recurse
  condition: findstr or select_string or (secret_files and listing)
falsepositives:
- Certificate administration, developers grepping configuration for connection strings.
level: medium
mitre_analytic: AN1070
mitre_detection_strategy: DET0380
mitre_data_components:
- DC0032
