# Generated by mitremap from content/analytics/AN0785.yml
title: Regsvr32 running a scriptlet, a remote or user-folder DLL, or connecting out (an0785_regsvr32_args)
id: 6b670eac-14ff-50f9-9c47-f12cbfdcc63b
name: an0785_regsvr32_args
status: experimental
description: 'regsvr32 invoked with scrobj.dll or a .sct scriptlet, with /i: pointing at a URL (Squiblydoo), or registering
  a DLL from a user-writable folder; or regsvr32 itself opening an outbound connection to an external address. Legitimate
  registration targets signed DLLs under Program Files and System32 and never needs the network.'
references:
- https://attack.mitre.org/detectionstrategies/DET0282#AN0785
- https://attack.mitre.org/techniques/T1218/010
author: mitremap
date: '2026-11-05'
tags:
- attack.stealth
- attack.t1218.010
logsource:
  product: windows
  category: process_creation
detection:
  image:
  - Image|endswith: \regsvr32.exe
  - OriginalFileName: REGSVR32.EXE
  args:
    CommandLine|contains:
    - scrobj.dll
    - .sct
    - /i:http
    - -i:http
    - \AppData\Local\Temp\
    - \Downloads\
    - \Users\Public\
  condition: image and args
falsepositives:
- Installers that register COM DLLs from their extraction folder in Temp or ProgramData.
level: medium
mitre_analytic: AN0785
mitre_detection_strategy: DET0282
mitre_data_components:
- DC0032
- DC0082
