title: Script host chain from Office or into a second-stage interpreter
id: a09f24da-8f4d-527b-97d2-b5c6e69b2fc3
name: an0209_0
status: experimental
description: 'Two links of the Visual Basic execution chain: an Office application starts wscript, cscript or mshta; or one
  of those script hosts starts PowerShell, cmd or a proxy-execution utility.'
references:
- https://attack.mitre.org/detectionstrategies/DET0076#AN0209
- https://attack.mitre.org/techniques/T1059/005
author: mitremap
date: '2026-11-05'
tags:
- attack.execution
- attack.t1059.005
logsource:
  product: windows
  category: process_creation
detection:
  office_parent:
    ParentImage|endswith:
    - \winword.exe
    - \excel.exe
    - \powerpnt.exe
    - \outlook.exe
    - \msaccess.exe
    - \mspub.exe
    - \onenote.exe
  script_host:
    Image|endswith:
    - \wscript.exe
    - \cscript.exe
    - \mshta.exe
  script_parent:
    ParentImage|endswith:
    - \wscript.exe
    - \cscript.exe
    - \mshta.exe
  second_stage:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    - \cmd.exe
    - \rundll32.exe
    - \regsvr32.exe
    - \certutil.exe
    - \bitsadmin.exe
    - \schtasks.exe
    - \msiexec.exe
    - \wmic.exe
  condition: (office_parent and script_host) or (script_parent and second_stage)
falsepositives:
- Logon scripts, software deployment and legacy line-of-business automation written in VBScript.
