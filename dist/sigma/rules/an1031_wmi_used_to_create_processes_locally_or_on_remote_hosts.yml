# Generated by mitremap from content/analytics/AN1031.yml
title: WMI used to create processes locally or on remote hosts
id: 78f0f7f8-259d-53e1-a238-2fa434669f2f
name: an1031_0
status: experimental
description: WMI process creation from the command line (wmic process call create, Invoke-WmiMethod or Invoke-CimMethod on
  Win32_Process), WMI-launched shells and LOLBins (WmiPrvSE as parent, the target side of remote WMI execution), and one host
  directing wmic /node at several remote systems.
references:
- https://attack.mitre.org/detectionstrategies/DET0364#AN1031
- https://attack.mitre.org/techniques/T1047
author: mitremap
date: '2026-11-05'
tags:
- attack.execution
- attack.t1047
logsource:
  product: windows
  category: process_creation
detection:
  wmic_create:
    Image|endswith: \wmic.exe
    CommandLine|contains|all:
    - process
    - call
    - create
  powershell:
    CommandLine|contains:
    - Invoke-WmiMethod
    - Invoke-CimMethod
    - '[wmiclass]'
  wmiprvse_child:
    ParentImage|endswith: \WmiPrvSE.exe
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
    - \rundll32.exe
    - \regsvr32.exe
    - \mshta.exe
    - \wscript.exe
    - \cscript.exe
    - \certutil.exe
  condition: wmic_create or powershell or wmiprvse_child
falsepositives:
- Configuration Manager, monitoring products and administrators using WMI remoting.
level: medium
mitre_analytic: AN1031
mitre_detection_strategy: DET0364
mitre_data_components:
- DC0032
