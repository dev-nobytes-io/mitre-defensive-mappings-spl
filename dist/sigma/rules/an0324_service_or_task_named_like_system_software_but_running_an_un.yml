# Generated by mitremap from content/analytics/AN0324.yml
title: Service or task named like system software but running an untrusted binary (an0324_service)
id: 26648fdd-60cc-5227-8f33-f55248136e86
name: an0324_service
status: experimental
description: A service (System 7045) or scheduled task (Security 4698) is created with a name that imitates Windows, Microsoft
  or common vendor updaters, while its binary is outside System32 and Program Files. Legitimate software with those names
  installs into Program Files; impostors usually run from ProgramData, AppData or Temp.
references:
- https://attack.mitre.org/detectionstrategies/DET0117#AN0324
- https://attack.mitre.org/techniques/T1036/004
author: mitremap
date: '2026-11-05'
tags:
- attack.stealth
- attack.t1036.004
logsource:
  product: windows
  service: system
detection:
  selection:
    EventID: 7045
    ServiceName|contains:
    - svchost
    - Windows
    - Microsoft
    - update
    - Defender
    - Google
    - Chrome
    - Adobe
    - OneDrive
  trusted:
    ImagePath|contains:
    - \Windows\System32\
    - \Windows\SysWOW64\
    - \Program Files
  condition: selection and not trusted
falsepositives:
- Vendor updaters installed per user (some browser and conferencing updaters run from AppData or ProgramData).
level: medium
mitre_analytic: AN0324
mitre_detection_strategy: DET0117
mitre_data_components:
- DC0060
- DC0001
