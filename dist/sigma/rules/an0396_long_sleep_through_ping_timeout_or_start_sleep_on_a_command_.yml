title: Long sleep through ping, timeout or Start-Sleep on a command line
id: cfd300bb-242a-57bd-afd5-8039a706966f
name: an0396_0
status: experimental
description: A command line that delays for a long time (ping -n N to loopback, timeout /t N, choice /t N, Start-Sleep N)
  above a threshold, launched by something other than an interactive shell. Payloads stall to outlast sandbox analysis windows
  and to separate stages in time.
references:
- https://attack.mitre.org/detectionstrategies/DET0141#AN0396
- https://attack.mitre.org/techniques/T1497/003
author: mitremap
date: '2026-11-05'
tags:
- attack.stealth
- attack.discovery
- attack.t1497.003
logsource:
  product: windows
  category: process_creation
detection:
  ping:
    Image|endswith: \ping.exe
    CommandLine|contains|all:
    - ' -n '
    - 127.0.0.1
  timeout:
    Image|endswith: \timeout.exe
    CommandLine|contains: /t
  sleep:
    CommandLine|contains: Start-Sleep
  interactive:
    ParentImage|endswith:
    - \explorer.exe
    - \WindowsTerminal.exe
  condition: (ping or timeout or sleep) and not interactive
falsepositives:
- Batch and installer scripts that wait for services or reboots; scheduled maintenance jobs.
