# Generated by mitremap from content/analytics/AN1287.yml
title: Login to the firewall with a default account name
id: 6bb41e79-1f47-5423-ab50-3cd0196fcb56
name: an1287_0
status: experimental
description: A successful administrator login to a Palo Alto firewall (system log "logged in" or auth-success) using a vendor
  default account name such as admin. Named accounts should replace the default, so its use is either legacy practice or someone
  who knows the default.
references:
- https://attack.mitre.org/detectionstrategies/DET0465#AN1287
- https://attack.mitre.org/techniques/T1078/001
author: mitremap
date: '2026-11-05'
tags:
- attack.stealth
- attack.persistence
- attack.privilege-escalation
- attack.initial-access
- attack.t1078.001
logsource:
  product: paloalto
  service: system
detection:
  success:
    description|contains: logged in
  default_user:
    description|contains:
    - 'admin '
    - user 'admin'
    - administrator
    - '''root'''
  condition: success and default_user
falsepositives:
- Teams that still administer with the built-in admin account; rename or disable it rather than excluding it.
level: medium
mitre_analytic: AN1287
mitre_detection_strategy: DET0465
