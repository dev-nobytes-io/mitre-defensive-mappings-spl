# Generated by mitremap from content/analytics/AN1032.yml
title: Run key value pointing to a script or user-writable path
id: 22bb4c6b-1012-5fc8-a932-b33f94858cf7
name: an1032_0
status: experimental
description: A value is written under a Run, RunOnce, RunOnceEx, Policies\Explorer\Run or Startup shell-folder registry key
  and its data references a script interpreter or a binary in AppData, Users\Public, Temp or ProgramData.
references:
- https://attack.mitre.org/detectionstrategies/DET0365#AN1032
- https://attack.mitre.org/techniques/T1547/001
author: mitremap
date: '2026-11-05'
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1547.001
logsource:
  product: windows
  category: registry_set
detection:
  key:
    TargetObject|contains:
    - \CurrentVersion\Run\
    - \CurrentVersion\RunOnce\
    - \CurrentVersion\RunOnceEx\
    - \CurrentVersion\Policies\Explorer\Run\
  data:
    Details|contains:
    - \AppData\
    - \Users\Public\
    - \Temp\
    - \ProgramData\
    - powershell
    - cmd.exe
    - wscript
    - cscript
    - mshta
    - rundll32
    - regsvr32
    - http://
    - https://
  condition: key and data
falsepositives:
- Collaboration clients, updaters and other per-user software that autostart from AppData.
level: medium
mitre_analytic: AN1032
mitre_detection_strategy: DET0365
mitre_data_components:
- DC0063
