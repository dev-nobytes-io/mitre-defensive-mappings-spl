title: NTDS.dit extracted with ntdsutil, shadow copies or esentutl
id: ecc20706-ba16-5e08-98d5-16db79f06c8d
name: an1611_0
status: experimental
description: 'Commands that copy the Active Directory database: ntdsutil IFM or "create full", copying ntds.dit out of a volume
  shadow copy path, esentutl copying ntds.dit with /vss, or diskshadow/vssadmin creating a shadow copy on a domain controller
  followed by access to NTDS paths in the same command.'
references:
- https://attack.mitre.org/detectionstrategies/DET0586#AN1611
- https://attack.mitre.org/techniques/T1003/003
author: mitremap
date: '2026-11-05'
tags:
- attack.credential-access
- attack.t1003.003
logsource:
  product: windows
  category: process_creation
detection:
  ntdsutil:
    Image|endswith: \ntdsutil.exe
    CommandLine|contains:
    - ifm
    - create full
  shadow_copy_ntds:
    CommandLine|contains|all:
    - HarddiskVolumeShadowCopy
    - ntds
  esentutl:
    Image|endswith: \esentutl.exe
    CommandLine|contains: ntds
  condition: 1 of them
falsepositives:
- Domain controller backups and IFM media creation for new DCs; vssadmin shadow creation by backup agents.
level: critical
mitre_analytic: AN1611
mitre_detection_strategy: DET0586
