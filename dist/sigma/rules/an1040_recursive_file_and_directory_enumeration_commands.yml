detection:
  cmd:
    Image|endswith: \cmd.exe
    CommandLine|contains:
    - dir /s
    - dir/s
    - tree /f
    - tree/f
  powershell:
    CommandLine|contains|all:
    - -Recurse
    CommandLine|contains:
    - Get-ChildItem
    - 'gci '
  tools:
    Image|endswith:
    - \tree.com
    - \forfiles.exe
  condition: cmd or powershell or tools
