# Generated by mitremap from content/analytics/AN0411.yml
title: Mass file deletion by one process, or disk wipe commands (an0411_wipe_command)
id: 84c9e678-c15a-572f-aa3b-09f046faa2ca
name: an0411_wipe_command
status: experimental
description: One process deletes more than a threshold of distinct files in five minutes (Sysmon 23 and 26), or a command
  line wipes a disk or volume (diskpart clean, format /y, Clear-Disk, Remove-Partition) or recursively deletes a profile or
  share root. Destructive actors and wipers delete at a rate no normal application does outside cleanup tools.
references:
- https://attack.mitre.org/detectionstrategies/DET0146#AN0411
- https://attack.mitre.org/techniques/T1485
author: mitremap
date: '2026-11-05'
tags:
- attack.impact
- attack.t1485
logsource:
  product: windows
  category: process_creation
detection:
  diskpart:
    Image|endswith: \diskpart.exe
    CommandLine|contains: clean
  powershell:
    CommandLine|contains:
    - Clear-Disk
    - Remove-Partition
    - Format-Volume
  condition: diskpart or powershell
falsepositives:
- Build and test tooling cleaning output folders; profile cleanup and re-imaging scripts; storage administrators formatting
  new volumes.
level: informational
mitre_analytic: AN0411
mitre_detection_strategy: DET0146
mitre_data_components:
- DC0040
- DC0032
