title: File upload over cleartext HTTP, FTP or TFTP from the command line (an0423_ftp_tftp)
id: ba446a18-116b-50d8-a66f-e5e3d857a9ad
name: an0423_ftp_tftp
status: experimental
description: 'A command line uploads a file over an unencrypted protocol: ftp.exe running a command script (-s:), tftp PUT,
  or curl, PowerShell or certutil/bitsadmin posting or putting a file to an http:// or ftp:// URL. Native and built-in clients
  are a common way to push staged data out over a channel separate from C2.'
references:
- https://attack.mitre.org/detectionstrategies/DET0149#AN0423
- https://attack.mitre.org/techniques/T1048/003
author: mitremap
date: '2026-11-05'
tags:
- attack.exfiltration
- attack.t1048.003
logsource:
  product: windows
  category: process_creation
detection:
  ftp:
    Image|endswith: \ftp.exe
    CommandLine|contains: '-s:'
  tftp:
    Image|endswith: \tftp.exe
    CommandLine|contains: put
  condition: ftp or tftp
falsepositives:
- Build agents and scripts pushing artefacts to internal HTTP or FTP repositories (allow-list them, or extend the filter to
  drop internal URLs).
level: medium
mitre_analytic: AN0423
mitre_detection_strategy: DET0149
mitre_data_components:
- DC0032
