# Generated by mitremap from content/analytics/AN0933.yml
title: Shadow copies, backups or boot recovery disabled with native utilities
id: e2bbd600-1591-526c-a1e9-e0acd332baa0
name: an0933_0
status: experimental
description: vssadmin, wbadmin, wmic, diskshadow, bcdedit, REAgentC or PowerShell is run with arguments that delete volume
  shadow copies, remove backup catalogs or disable Windows recovery. This is the standard pre-encryption step of ransomware.
references:
- https://attack.mitre.org/detectionstrategies/DET0329#AN0933
- https://attack.mitre.org/techniques/T1490
author: mitremap
date: '2026-11-05'
tags:
- attack.impact
- attack.t1490
logsource:
  product: windows
  category: process_creation
detection:
  vssadmin:
    Image|endswith: \vssadmin.exe
    CommandLine|contains|all:
    - delete
    - shadows
  wbadmin:
    Image|endswith: \wbadmin.exe
    CommandLine|contains:
    - catalog
    - systemstatebackup
    CommandLine|contains|all:
    - delete
  wmic:
    Image|endswith: \wmic.exe
    CommandLine|contains|all:
    - shadowcopy
    - delete
  bcdedit:
    Image|endswith: \bcdedit.exe
    CommandLine|contains:
    - recoveryenabled
    - ignoreallfailures
  reagentc:
    Image|endswith: \reagentc.exe
    CommandLine|contains: /disable
  condition: 1 of them
falsepositives:
- Backup software resizing shadow storage; administrators running diskshadow scripts.
level: high
mitre_analytic: AN0933
mitre_detection_strategy: DET0329
mitre_data_components:
- DC0032
