title: UAC bypass through auto-elevated binary hijack (an1094_registry_hijack)
id: 9dcf4d8b-d2af-54f1-a077-6192369b04b3
name: an1094_registry_hijack
status: experimental
description: Either a registry value used by known UAC bypasses is written (ms-settings / mscfile / exefile / Folder shell
  open command, DelegateExecute, IsolatedCommand, per-user windir or systemroot environment overrides), or an auto-elevating
  binary (eventvwr, sdclt, fodhelper, computerdefaults, slui, wsreset) spawns a shell or LOLBin. Results list which signals
  were seen per host.
references:
- https://attack.mitre.org/detectionstrategies/DET0388#AN1094
- https://attack.mitre.org/techniques/T1548/002
author: mitremap
date: '2026-11-05'
tags:
- attack.privilege-escalation
- attack.t1548.002
logsource:
  product: windows
  category: registry_set
detection:
  selection:
    TargetObject|contains:
    - \ms-settings\shell\open\command
    - \mscfile\shell\open\command
    - \exefile\shell\open\command
    - \Folder\shell\open\command
    - \shell\runas\command\IsolatedCommand
  condition: selection
falsepositives:
- Rare. Some software installers set per-user shell open commands for their own file classes; the listed classes are not among
  them.
level: high
mitre_analytic: AN1094
mitre_detection_strategy: DET0388
mitre_data_components:
- DC0063
- DC0032
