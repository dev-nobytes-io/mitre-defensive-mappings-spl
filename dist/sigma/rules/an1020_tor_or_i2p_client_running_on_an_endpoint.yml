title: Tor or I2P client running on an endpoint (an1020_tor_client)
id: 4968f974-c240-5a3f-9741-dafdba350377
name: an1020_tor_client
status: experimental
description: A Tor or I2P client process starts, a process connects to a local Tor SOCKS port (9050, 9150) or out to Tor relay
  ports (9001, 9030), or a host resolves an .onion or .i2p name. Anonymity networks on a managed endpoint are either policy
  violations or C2 hiding behind multi-hop relays.
references:
- https://attack.mitre.org/detectionstrategies/DET0359#AN1020
- https://attack.mitre.org/techniques/T1090/003
author: mitremap
date: '2026-11-05'
tags:
- attack.command-and-control
- attack.t1090.003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
    - \tor.exe
    - \i2p.exe
    - \obfs4proxy.exe
    - \snowflake-client.exe
  condition: selection
falsepositives:
- Sanctioned research use; other software that happens to use port 9001 outbound (check the process before allow-listing).
level: medium
mitre_analytic: AN1020
mitre_detection_strategy: DET0359
mitre_data_components:
- DC0032
- DC0082
- DC0085
