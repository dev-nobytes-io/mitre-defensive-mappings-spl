title: Password store read by something other than its owner (an1198_vault_enumeration)
id: 94785b5b-2422-57a6-8e39-38d3f2b7805f
name: an1198_vault_enumeration
status: experimental
description: Windows Credential Manager and vault enumeration (vaultcmd /list, cmdkey /list, keymgr KRShowKeyMgr, the PasswordVault
  class, Get-StoredCredential), a command line naming browser credential databases (Login Data, logins.json, key4.db), or,
  with SACLs, a Security 4663 read of a browser credential database, the Local State key file or the Credentials and Vault
  folders by a process that is not the browser or the OS.
references:
- https://attack.mitre.org/detectionstrategies/DET0430#AN1198
- https://attack.mitre.org/techniques/T1555
author: mitremap
date: '2026-11-05'
tags:
- attack.credential-access
- attack.t1555
logsource:
  product: windows
  category: process_creation
detection:
  vaultcmd:
    Image|endswith: \vaultcmd.exe
    CommandLine|contains: /list
  cmdkey:
    Image|endswith: \cmdkey.exe
    CommandLine|contains: /l
  strings:
    CommandLine|contains:
    - KRShowKeyMgr
    - Security.Credentials.PasswordVault
    - Get-StoredCredential
    - \Login Data
    - logins.json
    - key4.db
  condition: vaultcmd or cmdkey or strings
falsepositives:
- Password-manager import tools and browser migration; administrators listing saved credentials with cmdkey.
level: high
mitre_analytic: AN1198
mitre_detection_strategy: DET0430
mitre_data_components:
