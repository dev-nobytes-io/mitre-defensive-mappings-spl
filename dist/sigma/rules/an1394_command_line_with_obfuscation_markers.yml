# Generated by mitremap from content/analytics/AN1394.yml
title: Command line with obfuscation markers
id: f1b9866b-c21e-5071-b275-a9f375e66d73
name: an1394_0
status: experimental
description: Interpreter command lines (cmd, PowerShell, script hosts, mshta) that are unusually long, contain a long base64-like
  token, use many caret escapes or string concatenations, or use cmd environment variable substring expansion. Each marker
  is reported so the analyst can see why it fired.
references:
- https://attack.mitre.org/detectionstrategies/DET0505#AN1394
- https://attack.mitre.org/techniques/T1027/010
author: mitremap
date: '2026-11-05'
tags:
- attack.stealth
- attack.t1027.010
logsource:
  product: windows
  category: process_creation
detection:
  image:
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
    - \wscript.exe
    - \cscript.exe
    - \mshta.exe
  b64:
    CommandLine|re: '[A-Za-z0-9+/]{120,}={0,2}'
  carets:
    CommandLine|re: (\^[^\^]{0,8}){6,}
  env_substring:
    CommandLine|re: '%[A-Za-z]+:~-?[0-9]+,-?[0-9]+%'
  condition: image and (b64 or carets or env_substring)
falsepositives:
- Management agents passing long encoded scripts; build systems generating long command lines.
level: medium
mitre_analytic: AN1394
mitre_detection_strategy: DET0505
mitre_data_components:
- DC0032
