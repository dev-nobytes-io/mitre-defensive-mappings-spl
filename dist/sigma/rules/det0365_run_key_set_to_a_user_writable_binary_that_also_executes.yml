# Generated by mitremap from content/detection_strategies/DET0365.yml
title: Run key set to a user-writable binary that also executes (det0365_run_key_user_path)
id: fd6f47f4-e706-5ac9-aa27-7463bfdd99a8
name: det0365_run_key_user_path
status: experimental
description: A Run or RunOnce value is written pointing to a file in a user-writable location (Sysmon 13), and a process runs
  from that same file within ten minutes either side (Sysmon 1). Malware usually registers the binary it is already running
  from, so the execution often precedes the registry write.
references:
- https://attack.mitre.org/detectionstrategies/DET0365
author: mitremap
date: '2026-11-05'
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1547.001
logsource:
  product: windows
  category: registry_set
detection:
  key:
    TargetObject|contains:
    - \CurrentVersion\Run\
    - \CurrentVersion\RunOnce\
    - \CurrentVersion\Policies\Explorer\Run\
  data:
    Details|contains:
    - \AppData\
    - \Users\Public\
    - \Temp\
    - \ProgramData\
    - \Downloads\
  condition: key and data
falsepositives:
- Per-user applications that register themselves at install and start immediately (collaboration clients, updaters).
level: informational
mitre_detection_strategy: DET0365
mitre_data_components:
- DC0063
- DC0032
