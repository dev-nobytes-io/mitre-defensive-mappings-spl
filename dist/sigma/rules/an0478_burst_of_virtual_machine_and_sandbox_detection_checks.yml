# Generated by mitremap from content/analytics/AN0478.yml
title: Burst of virtual-machine and sandbox detection checks
id: 8d1f9100-1b64-5d80-a3a4-d3af438e63d5
name: an0478_vm_check
status: experimental
description: 'One user on one host runs several distinct VM-detection checks within ten minutes: hardware model and manufacturer
  queries, BIOS and disk serials, video controller, and registry or file lookups for VirtualBox, VMware, QEMU, Hyper-V or
  sandbox artefacts. Malware does this before deciding whether to detonate.'
references:
- https://attack.mitre.org/detectionstrategies/DET0168#AN0478
- https://attack.mitre.org/techniques/T1497/001
author: mitremap
date: '2026-11-05'
tags:
- attack.stealth
- attack.discovery
- attack.t1497.001
logsource:
  product: windows
  category: process_creation
detection:
  wmi:
    CommandLine|contains:
    - Win32_ComputerSystem
    - Win32_BIOS
    - Win32_DiskDrive
    - Win32_VideoController
    - MSAcpi_ThermalZoneTemperature
  artefacts:
    CommandLine|contains:
    - VBOX
    - VirtualBox
    - VMware
    - vmtools
    - QEMU
    - HARDWARE\ACPI\DSDT
    - SystemBiosVersion
    - Sandboxie
    - SbieDll
  condition: wmi or artefacts
falsepositives:
- Hardware inventory scripts and virtualisation-aware installers (VMware Tools, Hyper-V integration).
level: informational
mitre_analytic: AN0478
mitre_detection_strategy: DET0168
mitre_data_components:
- DC0032
