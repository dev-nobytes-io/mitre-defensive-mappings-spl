title: Burst of remote system discovery commands
id: 60c826b2-10fd-5f6e-acd1-55129855cedf
name: an1583_discovery_command
status: experimental
description: 'One user on one host runs several distinct network enumeration commands within ten minutes: net view, net group
  "domain computers", nltest, ping, tracert, nslookup, arp, nbtstat -A, adfind, dsquery computer, Get-ADComputer, Test-Connection.
  A ping sweep counts because each target is a distinct command line.'
references:
- https://attack.mitre.org/detectionstrategies/DET0574#AN1583
- https://attack.mitre.org/techniques/T1018
author: mitremap
date: '2026-11-05'
tags:
- attack.discovery
- attack.t1018
logsource:
  product: windows
  category: process_creation
detection:
  net:
    Image|endswith:
    - \net.exe
    - \net1.exe
    CommandLine|contains:
    - ' view'
    - domain computers
    - domain controllers
  tools:
    Image|endswith:
    - \nltest.exe
    - \ping.exe
    - \tracert.exe
    - \nslookup.exe
    - \adfind.exe
    - \nbtscan.exe
  powershell:
    CommandLine|contains:
    - Get-ADComputer
    - Get-DomainComputer
    - Test-Connection
    - Test-NetConnection
  condition: net or tools or powershell
falsepositives:
- Monitoring scripts, network troubleshooting and software deployment.
level: informational
mitre_analytic: AN1583
mitre_detection_strategy: DET0574
