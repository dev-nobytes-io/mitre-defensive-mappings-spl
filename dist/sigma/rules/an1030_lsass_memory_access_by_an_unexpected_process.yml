# Generated by mitremap from content/analytics/AN1030.yml
title: LSASS memory access by an unexpected process
id: b85efd46-462c-5ab6-96e0-ad8ae1d8dada
name: an1030_0
status: experimental
description: A process outside the Windows system and security-product set opens lsass.exe with an access mask that permits
  reading process memory (Sysmon EventCode 10). This is the handle acquisition step of Mimikatz, comsvcs MiniDump, procdump
  and similar credential dumpers.
references:
- https://attack.mitre.org/detectionstrategies/DET0363#AN1030
- https://attack.mitre.org/techniques/T1003/001
author: mitremap
date: '2026-11-05'
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage|endswith: \lsass.exe
    GrantedAccess:
    - '0x1010'
    - '0x1410'
    - '0x1438'
    - '0x143a'
    - '0x1418'
    - '0x1f0fff'
    - '0x1f1fff'
    - '0x1f2fff'
    - '0x1f3fff'
    - '0x1fffff'
  filter_system:
    SourceImage|startswith:
    - C:\Windows\System32\wbem\WmiPrvSE.exe
    - C:\Windows\System32\svchost.exe
    - C:\Windows\System32\csrss.exe
    - C:\Windows\System32\wininit.exe
    - C:\Windows\System32\lsm.exe
    - C:\ProgramData\Microsoft\Windows Defender\
    - C:\Program Files\Windows Defender
  condition: selection and not filter_system
falsepositives:
- EDR, antivirus, vulnerability scanners and some backup or monitoring agents read LSASS; add them to mitre_allowlist_processes.
level: high
mitre_analytic: AN1030
mitre_detection_strategy: DET0363
mitre_data_components:
- DC0035
