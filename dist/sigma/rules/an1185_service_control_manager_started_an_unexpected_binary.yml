# Generated by mitremap from content/analytics/AN1185.yml
title: Service control manager started an unexpected binary
id: 44565c40-3243-5e2c-b31c-ecd3d38384d7
name: an1185_0
status: experimental
description: services.exe starts a command interpreter or script host, or a binary whose path is outside the Windows, Program
  Files and Defender directories. Transient services created by PsExec, Impacket and sc.exe-based lateral movement look like
  this.
references:
- https://attack.mitre.org/detectionstrategies/DET0421#AN1185
- https://attack.mitre.org/techniques/T1569/002
author: mitremap
date: '2026-11-05'
tags:
- attack.execution
- attack.t1569.002
logsource:
  product: windows
  category: process_creation
detection:
  parent:
    ParentImage|endswith: \services.exe
  interpreter:
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
    - \rundll32.exe
    - \regsvr32.exe
    - \mshta.exe
    - \wscript.exe
    - \cscript.exe
  expected:
    Image|startswith:
    - C:\Windows\System32\
    - C:\Windows\SysWOW64\
    - C:\Windows\Microsoft.NET\
    - C:\Windows\servicing\
    - C:\Windows\WinSxS\
    - C:\Program Files\
    - C:\Program Files (x86)\
    - C:\ProgramData\Microsoft\Windows Defender\
  condition: parent and (interpreter or not expected)
falsepositives:
- Services installed outside Program Files, software deployment tools, and services that wrap cmd.exe.
level: medium
mitre_analytic: AN1185
mitre_detection_strategy: DET0421
mitre_data_components:
- DC0032
