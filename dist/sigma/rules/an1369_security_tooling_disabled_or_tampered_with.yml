  services and drivers (Defender, Sysmon, Trellix, Splunk forwarder).
references:
- https://attack.mitre.org/detectionstrategies/DET0497#AN1369
- https://attack.mitre.org/techniques/T1685
author: mitremap
date: '2026-11-05'
tags:
- attack.defense-impairment
