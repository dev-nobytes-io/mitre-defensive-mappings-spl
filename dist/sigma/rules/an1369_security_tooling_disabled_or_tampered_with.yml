logsource:
  product: windows
  category: process_creation
detection:
  tool:
    Image|endswith:
    - \sc.exe
    - \net.exe
    - \net1.exe
    - \taskkill.exe
    - \fltmc.exe
    CommandLine|contains:
    - ' stop '
    - ' delete '
    - disabled
    - '/im '
    - ' unload '
  target:
    CommandLine|contains:
    - windefend
    - wdnissvc
    - sysmon
    - mfemms
    - mfefire
    - mcshield
    - splunkforwarder
  powershell:
    CommandLine|contains:
    - Set-MpPreference
    - Add-MpPreference
    CommandLine|contains|all:
    - '-'
  condition: (tool and target) or powershell
falsepositives:
- Product upgrades and migrations, group policy or management agents writing Defender policy, administrators adding exclusions.
