description: Lists hosts and users running ipconfig, route print, arp -a, nbtstat, getmac, netsh interface or wlan show, wmic
  nicconfig, or the Get-NetIPConfiguration / Get-NetAdapter / Get-NetRoute / Get-DnsClientServerAddress cmdlets, in ten-minute
  buckets.
references:
- https://attack.mitre.org/detectionstrategies/DET0195#AN0559
- https://attack.mitre.org/techniques/T1016
author: mitremap
