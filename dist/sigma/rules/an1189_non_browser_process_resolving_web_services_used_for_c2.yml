description: Sysmon DNS queries (22) for paste sites, code hosting raw content, chat-platform APIs and webhooks, and consumer
  cloud-storage APIs, made by a process that is not a browser or the vendor's own client. Malware uses these services for
  C2 and staging because they are trusted and encrypted.
references:
- https://attack.mitre.org/detectionstrategies/DET0425#AN1189
- https://attack.mitre.org/techniques/T1102
