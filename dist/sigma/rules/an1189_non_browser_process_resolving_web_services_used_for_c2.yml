    - api.telegram.org
    - cdn.discordapp.com
    - hooks.slack.com
    - api.dropboxapi.com
    - ngrok-free.app
    - trycloudflare.com
    - transfer.sh
  clients:
    Image|endswith:
    - \chrome.exe
    - \msedge.exe
