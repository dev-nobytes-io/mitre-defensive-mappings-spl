description: 7-Zip or WinRAR adds files to an archive with a password or volume-split switch; makecab or diantz is run; PowerShell
  Compress-Archive is used; or tar.exe creates an archive. These are the common staging steps before exfiltration.
references:
- https://attack.mitre.org/detectionstrategies/DET0298#AN0831
- https://attack.mitre.org/techniques/T1560/001
