  product: windows
  category: process_creation
detection:
  packer:
    Image|endswith:
    - \7z.exe
    - \7za.exe
    - \7zr.exe
    - \rar.exe
    - \winrar.exe
    CommandLine|contains|all:
    - ' a '
    CommandLine|contains:
    - ' -p'
    - ' -hp'
    - ' -v'
  builtin:
    Image|endswith:
    - \makecab.exe
    - \diantz.exe
  powershell:
    CommandLine|contains: Compress-Archive
  condition: packer or builtin or powershell
falsepositives:
