# Generated by mitremap from content/analytics/AN0363.yml
title: Domain account enumeration from a non-domain-controller (an0363_process)
id: 8a303677-789c-5e98-a348-2b411ddf9d81
name: an0363_process
status: experimental
description: net user/group/accounts with /domain, dsquery, adfind, ldifde or csvde is run, or PowerShell executes Get-ADUser,
  Get-ADGroupMember, PowerView account cmdlets or a DirectorySearcher user filter (seen in the process command line or in
  a 4104 script block), on a host that is not listed as a domain controller in mitre_asset_roles.
references:
- https://attack.mitre.org/detectionstrategies/DET0129#AN0363
- https://attack.mitre.org/techniques/T1087/002
author: mitremap
date: '2026-11-05'
tags:
- attack.discovery
- attack.t1087.002
logsource:
  product: windows
  category: process_creation
detection:
  net:
    Image|endswith:
    - \net.exe
    - \net1.exe
    CommandLine|contains:
    - ' user'
    - ' group'
    - ' accounts'
    CommandLine|contains|all:
    - ' /do'
  tools:
    Image|endswith:
    - \dsquery.exe
    - \adfind.exe
    - \ldifde.exe
    - \csvde.exe
  cmdlets:
    CommandLine|contains:
    - Get-ADUser
    - Get-ADGroupMember
    - Get-DomainUser
    - Get-NetUser
  condition: net or tools or cmdlets
falsepositives:
- Identity administrators, help desk and HR or provisioning scripts.
level: low
mitre_analytic: AN0363
mitre_detection_strategy: DET0129
mitre_data_components:
- DC0032
- DC0064
