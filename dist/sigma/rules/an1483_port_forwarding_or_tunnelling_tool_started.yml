title: Port forwarding or tunnelling tool started
id: effb2314-c59c-5377-8ecd-9c7ae7674dff
name: an1483_0
status: experimental
description: plink or ssh is started with a local, remote or dynamic port-forward switch; netsh adds a portproxy rule; or
  a known tunnelling client (chisel, ngrok, frpc, cloudflared tunnel, ligolo) is started.
references:
- https://attack.mitre.org/detectionstrategies/DET0538#AN1483
- https://attack.mitre.org/techniques/T1572
author: mitremap
date: '2026-11-05'
tags:
- attack.command-and-control
- attack.t1572
logsource:
  product: windows
  category: process_creation
detection:
  ssh:
    Image|endswith:
    - \plink.exe
    - \ssh.exe
    CommandLine|contains:
    - ' -R '
    - ' -L '
    - ' -D '
  netsh:
    Image|endswith: \netsh.exe
    CommandLine|contains|all:
    - portproxy
    - add
  tools:
    Image|endswith:
    - \chisel.exe
    - \ngrok.exe
    - \frpc.exe
    - \gost.exe
  condition: ssh or netsh or tools
falsepositives:
- Administrators and developers using SSH port forwarding or approved tunnel clients.
