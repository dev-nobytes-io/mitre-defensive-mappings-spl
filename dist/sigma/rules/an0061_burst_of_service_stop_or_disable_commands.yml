# Generated by mitremap from content/analytics/AN0061.yml
title: Burst of service stop or disable commands
id: 6579d2ae-b2f7-526e-9ded-028ae85f6ad2
name: an0061_service_stop_command
status: experimental
description: One user on one host runs several distinct service stop, delete or disable commands (net stop, sc stop/delete/config
  disabled, taskkill /f, Stop-Service, Set-Service Disabled) within ten minutes. Ransomware and wipers stop databases, mail
  and backup services this way before encrypting.
references:
- https://attack.mitre.org/detectionstrategies/DET0021#AN0061
- https://attack.mitre.org/techniques/T1489
author: mitremap
date: '2026-11-05'
tags:
- attack.impact
- attack.t1489
logsource:
  product: windows
  category: process_creation
detection:
  net:
    Image|endswith:
    - \net.exe
    - \net1.exe
    CommandLine|contains: ' stop '
  sc:
    Image|endswith: \sc.exe
    CommandLine|contains:
    - ' stop '
    - ' delete '
    - disabled
  taskkill:
    Image|endswith: \taskkill.exe
    CommandLine|contains: /f
  powershell:
    CommandLine|contains:
    - Stop-Service
    - Set-Service
  condition: net or sc or taskkill or powershell
falsepositives:
- Patch orchestration, application upgrades and clean shutdown scripts.
level: informational
mitre_analytic: AN0061
mitre_detection_strategy: DET0021
mitre_data_components:
- DC0032
