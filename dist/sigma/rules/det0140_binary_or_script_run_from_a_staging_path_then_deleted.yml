title: Binary or script run from a staging path, then deleted (det0140_staged_exec)
id: a5a6bfd7-c206-50a6-ab85-b8092a270a92
name: det0140_staged_exec
status: experimental
description: A program or script runs from a staging path (Sysmon 1, directly or on an interpreter's command line) and the
  same file is deleted within ten minutes (Sysmon 23/26). Droppers and hands-on-keyboard tooling clean up this way; legitimate
  software rarely deletes its own binary minutes after running it.
references:
- https://attack.mitre.org/detectionstrategies/DET0140
author: mitremap
date: '2026-11-05'
tags:
- attack.stealth
- attack.t1070.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|contains:
    - \AppData\Local\Temp\
    - \Windows\Temp\
    - \Users\Public\
    - \ProgramData\
    - \PerfLogs\
    - \Downloads\
  condition: selection
falsepositives:
- Installers and updaters that run a bootstrapper from Temp and remove it when done.
level: informational
mitre_detection_strategy: DET0140
mitre_data_components:
- DC0032
- DC0040
