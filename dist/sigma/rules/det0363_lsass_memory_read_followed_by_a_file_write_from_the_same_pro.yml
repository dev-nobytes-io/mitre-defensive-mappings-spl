# Generated by mitremap from content/detection_strategies/DET0363.yml
title: LSASS memory read followed by a file write from the same process (det0363_lsass_access)
id: 2191b4b4-5396-533c-b6a9-3f47b0b772d3
name: det0363_lsass_access
status: experimental
description: The process that opened lsass.exe with a memory-read access mask (Sysmon 10) then writes a dump-like file (Sysmon
  11) within five minutes. The two events are joined on the process GUID, so this is the access-then-dump chain ATT&CK describes
  rather than two coincidences on one host.
references:
- https://attack.mitre.org/detectionstrategies/DET0363
author: mitremap
date: '2026-11-05'
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage|endswith: \lsass.exe
    GrantedAccess:
    - '0x1010'
    - '0x1410'
    - '0x1438'
    - '0x143a'
    - '0x1418'
    - '0x1f0fff'
    - '0x1f1fff'
    - '0x1f2fff'
    - '0x1f3fff'
    - '0x1fffff'
  condition: selection
falsepositives:
- Crash-dump tooling (WerFault, procdump run by administrators for support cases).
level: informational
mitre_detection_strategy: DET0363
mitre_data_components:
- DC0035
- DC0039
