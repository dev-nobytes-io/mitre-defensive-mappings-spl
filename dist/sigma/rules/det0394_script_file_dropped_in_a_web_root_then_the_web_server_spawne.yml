# Generated by mitremap from content/detection_strategies/DET0394.yml
title: Script file dropped in a web root, then the web server spawned a shell (det0394_web_root_script)
id: 106df974-1daf-5695-843f-940f8c8339c8
name: det0394_web_root_script
status: experimental
description: A server-side script file (aspx, ashx, asmx, asp, php, jsp, cfm) is created under a web root (Sysmon 11) and
  within an hour a web server worker on the same host starts a shell or LOLBin (Sysmon 1). This is the write-then-use chain
  of a web shell; AN1108 alone sees only the second half.
references:
- https://attack.mitre.org/detectionstrategies/DET0394
author: mitremap
date: '2026-11-05'
tags:
- attack.persistence
- attack.t1505.003
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains:
    - \inetpub\
    - \FrontEnd\HttpProxy\
    - \ClientAccess\
    - \htdocs\
    - \webapps\
    - \wwwroot\
    TargetFilename|endswith:
    - .aspx
    - .ashx
    - .asmx
    - .asp
    - .php
    - .jsp
    - .jspx
    - .cfm
  condition: selection
falsepositives:
- Application deployments that publish pages and then run setup scripts through the application pool.
level: informational
mitre_detection_strategy: DET0394
mitre_data_components:
- DC0039
- DC0032
