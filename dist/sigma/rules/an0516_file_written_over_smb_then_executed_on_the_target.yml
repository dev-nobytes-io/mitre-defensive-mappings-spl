# Generated by mitremap from content/analytics/AN0516.yml
title: File written over SMB, then executed on the target (an0516_smb_write)
id: 09718881-d0cd-5766-9b7a-7f9d50628559
name: an0516_smb_write
status: experimental
description: A file arrives over SMB (Sysmon 11 with Image "System", which is how the kernel SMB server appears) in a staging
  location, and within ten minutes it runs on the same host, either directly as a process or as a script on an interpreter's
  command line. This is tool transfer followed by remote execution.
references:
- https://attack.mitre.org/detectionstrategies/DET0183#AN0516
- https://attack.mitre.org/techniques/T1570
author: mitremap
date: '2026-11-05'
tags:
- attack.lateral-movement
- attack.t1570
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image: System
    TargetFilename|contains:
    - \Windows\Temp\
    - \ProgramData\
    - \Users\Public\
    - \PerfLogs\
    TargetFilename|endswith:
    - .exe
    - .dll
    - .ps1
    - .bat
    - .cmd
    - .vbs
    - .js
    - .hta
    - .scr
  condition: selection
falsepositives:
- Software deployment that copies installers to targets over SMB and runs them (SCCM, PDQ, GPO scripts).
level: informational
mitre_analytic: AN0516
mitre_detection_strategy: DET0183
mitre_data_components:
- DC0039
- DC0032
