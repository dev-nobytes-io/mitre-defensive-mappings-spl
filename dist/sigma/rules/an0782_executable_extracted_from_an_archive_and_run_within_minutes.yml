# Generated by mitremap from content/analytics/AN0782.yml
title: Executable extracted from an archive and run within minutes
id: 88ced348-2b40-5d33-851f-fb70a099da22
name: an0782_archiver_writes_executable
status: experimental
description: An archiver or Explorer's built-in extraction writes an executable, script or library (Sysmon 11) into a user-writable
  folder, and a process starts from that exact path within five minutes. Compressed delivery (ZIP, RAR, 7z, ISO-in-ZIP, self-extractors)
  hides the payload from gateway scanning until the user runs it.
references:
- https://attack.mitre.org/detectionstrategies/DET0281#AN0782
- https://attack.mitre.org/techniques/T1027/015
author: mitremap
date: '2026-11-05'
tags:
- attack.stealth
- attack.t1027.015
logsource:
  product: windows
  category: file_event
detection:
  extractor:
    Image|endswith:
    - \7z.exe
    - \7zG.exe
    - \WinRAR.exe
    - \expand.exe
    - \extrac32.exe
    - \tar.exe
  payload:
    TargetFilename|endswith:
    - .exe
    - .scr
    - .bat
    - .cmd
    - .vbs
    - .js
    - .hta
    - .ps1
    - .lnk
  condition: extractor and payload
falsepositives:
- Users unzipping and running installers or portable tools from Downloads; software updaters that unpack into Temp.
level: medium
