title: File written by a document or archive application, then executed (det0294_document_app_write)
id: 06215583-d805-538c-92c0-e13176054c98
name: det0294_document_app_write
status: experimental
description: A document, mail, PDF or archive application writes an executable or script into a user-controlled path (Sysmon
  11), and within five minutes a process is started from that file, or a script host or shell is started with that file on
  its command line (Sysmon 1). Joined on host and file path.
references:
- https://attack.mitre.org/detectionstrategies/DET0294
author: mitremap
date: '2026-11-05'
tags:
- attack.execution
- attack.t1204.002
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
    - \winword.exe
    - \excel.exe
    - \powerpnt.exe
    - \outlook.exe
    - \acrord32.exe
    - \acrobat.exe
    - \winrar.exe
    - \7zfm.exe
    - \explorer.exe
    TargetFilename|contains:
    - \Downloads\
    - \AppData\Local\Temp\
    - \Desktop\
    - \Users\Public\
    - \INetCache\
    - \Content.Outlook\
    TargetFilename|endswith:
    - .exe
    - .scr
    - .com
    - .pif
    - .cpl
  condition: selection
falsepositives:
- Users installing software downloaded through the browser and opened from Explorer; signed installers can be excluded by
  path in the filter macro.
level: informational
mitre_detection_strategy: DET0294
mitre_data_components:
- DC0039
- DC0032
