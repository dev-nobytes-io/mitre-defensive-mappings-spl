# Generated by mitremap from content/analytics/AN0392.yml
title: Secure deletion, self-deletion or interpreter removing executables (an0392_delete_command)
id: c8154b0b-5f36-5385-937c-f2acc8fb69c9
name: an0392_delete_command
status: experimental
description: 'Three deletion patterns used to remove artifacts: secure-delete tools (SDelete, cipher /w, fsutil USN journal
  deletion); a command line that waits and then deletes, the usual self-deletion idiom (ping/timeout/choice followed by del);
  and a script interpreter or LOLBin deleting an executable or script from a staging path (Sysmon 23/26).'
references:
- https://attack.mitre.org/detectionstrategies/DET0140#AN0392
- https://attack.mitre.org/techniques/T1070/004
author: mitremap
date: '2026-11-05'
tags:
- attack.stealth
- attack.t1070.004
logsource:
  product: windows
  category: process_creation
detection:
  sdelete:
    Image|endswith:
    - \sdelete.exe
    - \sdelete64.exe
  cipher:
    Image|endswith: \cipher.exe
    CommandLine|contains: ' /w:'
  fsutil:
    Image|endswith: \fsutil.exe
    CommandLine|contains|all:
    - usn
    - deletejournal
  self_delete:
    Image|endswith: \cmd.exe
    CommandLine|contains|all:
    - '&'
    - 'del '
    CommandLine|contains:
    - 127.0.0.1
    - timeout
    - choice /c
  condition: 1 of them
falsepositives:
- Installers and updaters that remove their own temporary executables; administrators wiping free space.
level: medium
mitre_analytic: AN0392
mitre_detection_strategy: DET0140
mitre_data_components:
- DC0032
- DC0040
