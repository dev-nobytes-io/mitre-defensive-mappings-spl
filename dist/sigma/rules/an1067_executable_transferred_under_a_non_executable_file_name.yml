title: Executable transferred under a non-executable file name
id: 6251dd1c-21ab-51fe-b9bb-08b5179db792
name: an1067_0
status: experimental
description: Corelight files.log records a file whose content type is a Windows or Linux executable while its name ends in
  a document, image, archive or text extension. Disguising payloads this way is how they slip past extension-based filtering
  in transit.
references:
- https://attack.mitre.org/detectionstrategies/DET0378#AN1067
- https://attack.mitre.org/techniques/T1027
author: mitremap
date: '2026-11-05'
tags:
- attack.stealth
- attack.t1027
logsource:
  product: zeek
  service: files
detection:
  selection:
    mime_type:
    - application/x-dosexec
    - application/x-executable
    - application/x-elf
    filename|endswith:
    - .jpg
    - .jpeg
    - .png
    - .gif
    - .txt
    - .pdf
    - .doc
    - .docx
    - .xls
    - .xlsx
    - .csv
    - .zip
    - .css
    - .html
  condition: selection
falsepositives:
- Software updaters that download executables under generic names (.dat, .tmp).
