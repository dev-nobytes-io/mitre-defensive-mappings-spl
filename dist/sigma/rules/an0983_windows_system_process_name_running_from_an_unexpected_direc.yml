title: Windows system process name running from an unexpected directory
id: 126e5998-99ad-545e-9c71-c7f7de8cb617
name: an0983_0
status: experimental
description: A process named like a core Windows binary (svchost, lsass, services, csrss, smss, wininit, winlogon, explorer,
  spoolsv, taskhostw, dllhost, conhost, rundll32, RuntimeBroker, sihost, ctfmon, dwm, fontdrvhost) whose image path is outside
  System32, SysWOW64, WinSxS and the other expected locations.
references:
- https://attack.mitre.org/detectionstrategies/DET0347#AN0983
- https://attack.mitre.org/techniques/T1036/005
author: mitremap
date: '2026-11-05'
tags:
- attack.stealth
- attack.t1036.005
logsource:
  product: windows
  category: process_creation
detection:
  name:
    Image|endswith:
    - \svchost.exe
    - \lsass.exe
    - \services.exe
    - \csrss.exe
    - \smss.exe
    - \wininit.exe
    - \winlogon.exe
    - \explorer.exe
    - \spoolsv.exe
    - \taskhostw.exe
    - \dllhost.exe
    - \conhost.exe
    - \rundll32.exe
    - \RuntimeBroker.exe
    - \sihost.exe
    - \ctfmon.exe
    - \dwm.exe
    - \fontdrvhost.exe
  trusted:
    Image|startswith:
    - C:\Windows\System32\
    - C:\Windows\SysWOW64\
    - C:\Windows\explorer.exe
    - C:\Windows\WinSxS\
    - C:\Windows\servicing\
    - C:\Windows\SystemApps\
    - C:\Windows\ImmersiveControlPanel\
  condition: name and not trusted
falsepositives:
- Windows upgrade staging directories ($WINDOWS.~BT), container or WSL images, and software that ships its own conhost or
  rundll32.
