title: Mshta running inline script or remote HTA, connecting out, or spawning a shell (an1397_mshta_args)
id: ace4483a-2fb8-52b7-8673-d1af0599fef4
name: an1397_mshta_args
status: experimental
description: 'mshta with javascript:, vbscript: or an http(s) URL on the command line, or an HTA from Downloads, Temp, Public
  or ProgramData; mshta opening an outbound connection to an external address; or mshta starting a shell, script host or download
  utility. Enterprises rarely run HTAs at all, and none of these shapes are normal administration.'
references:
- https://attack.mitre.org/detectionstrategies/DET0506#AN1397
- https://attack.mitre.org/techniques/T1218/005
author: mitremap
date: '2026-11-05'
tags:
- attack.stealth
- attack.t1218.005
logsource:
  product: windows
  category: process_creation
detection:
  image:
  - Image|endswith: \mshta.exe
  - OriginalFileName: MSHTA.EXE
  args:
    CommandLine|contains:
    - 'javascript:'
    - 'vbscript:'
    - http://
    - https://
    - \AppData\Local\Temp\
    - \Downloads\
    - \Users\Public\
  condition: image and args
falsepositives:
- Legacy line-of-business HTA applications served from an intranet URL.
level: high
mitre_analytic: AN1397
mitre_detection_strategy: DET0506
mitre_data_components:
- DC0032
- DC0082
