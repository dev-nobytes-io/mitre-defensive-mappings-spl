# ---- telemetry health (generated from config/stack.yml)
[mitre_health_feeds]
definition = feed=*
description = Feeds this site collects, for HEALTH0001. Set to e.g. feed IN (sysmon, wineventlog); the default checks every in-scope feed.
iseval = 0

[mitre_health_index_scope]
definition = index IN (azure, corelight, edr, epo, etw, k8s, linux, netflow, netops, osquery, pan_logs, perfmon, sysmon, vmware, web, wineventlog)
description = Indexes of in-scope feeds (generated from config/stack.yml).
iseval = 0

[mitre_health_host_scope]
definition = ((index=wineventlog source="XmlWinEventLog:Security") OR (index=sysmon source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational"))
description = Feeds that report per endpoint (stack.yml host_feed), for per-host dropout checks.
iseval = 0

[mitre_health_silence_hours]
definition = 4
description = Hours without events before expected telemetry counts as silent (HEALTH0001).
iseval = 0

[mitre_health_host_silence_hours]
definition = 4
description = Hours without events before a host counts as having stopped reporting (HEALTH0002).
iseval = 0

# ---- environment / tuning macros
[mitre_time_window(1)]
args = span
definition = _time>=relative_time(now(), "-$span$")
description = Where-clause fragment for the ATT&CK TimeWindow mutable element, e.g. `| where `mitre_time_window(15m)``. Args: span.
iseval = 0

[mitre_is_internal(1)]
args = ip
definition = (cidrmatch("10.0.0.0/8", $ip$) OR cidrmatch("172.16.0.0/12", $ip$) OR cidrmatch("192.168.0.0/16", $ip$))
description = Boolean for RFC1918 space; edit to match your address plan, or use the mitre_internal_networks lookup. Args: ip.
iseval = 0

[mitre_hosts_with_role(1)]
args = role
definition = [| inputlookup mitre_asset_roles where role="$role$" | fields dest | format]
description = Subsearch yielding dest values of a role (domain_controller, jump_host, ...). Args: role.
iseval = 0

[mitre_accounts_with_role(1)]
args = role
definition = [| inputlookup mitre_account_roles where role="$role$" | fields user | format]
description = Subsearch yielding user values of a role (admin, service, ...). Args: role.
iseval = 0

[mitre_not_allowlisted_process]
definition = NOT [| inputlookup mitre_allowlist_processes | fields process_name | format]
description = Exclude allow-listed process names (CIM process_name).
iseval = 0

[mitre_not_allowlisted_user]
definition = NOT [| inputlookup mitre_allowlist_users | fields user | format]
description = Exclude allow-listed users (CIM user).
iseval = 0

[mitre_not_allowlisted_dest]
definition = NOT [| inputlookup mitre_allowlist_hosts | fields dest | format]
description = Exclude allow-listed hosts (CIM dest).
iseval = 0

[mitre_lolbin_processes]
definition = [| inputlookup mitre_lolbins | fields process_name | format]
description = Subsearch of LOLBAS process names.
iseval = 0

[mitre_powershell_processes]
definition = (process_name IN ("powershell.exe", "pwsh.exe", "powershell_ise.exe"))
description = PowerShell host process names.
iseval = 0

[mitre_script_interpreters]
definition = (process_name IN ("powershell.exe", "pwsh.exe", "cscript.exe", "wscript.exe", "mshta.exe", "python.exe", "python3.exe", "perl.exe", "ruby.exe", "node.exe", "bash", "sh", "zsh", "python", "python3", "perl"))
description = Script interpreter process names across Windows and Linux.
iseval = 0

[mitre_shells]
definition = (process_name IN ("cmd.exe", "powershell.exe", "pwsh.exe", "bash", "sh", "zsh", "dash", "ksh", "fish"))
description = Interactive shell process names.
iseval = 0

[mitre_attack_version]
definition = "20.1"
description = ATT&CK release this content was generated from.
iseval = 0

[mitre_summariesonly]
definition = summariesonly=false allow_old_summaries=true
description = tstats arguments for data model searches. Set summariesonly=true once the Endpoint, Network_Traffic, Authentication and Change models are accelerated.
iseval = 0

[mitre_ctime(1)]
args = field
definition = convert timeformat="%Y-%m-%dT%H:%M:%S" ctime($field$)
description = Render an epoch field as a timestamp. Args: field.
iseval = 0

[mitre_normalize_host]
definition = eval dest=coalesce(dest, Computer, dvc, host), user=coalesce(user, User, SubjectUserName, TargetUserName)
description = Normalise host and user for raw Windows/Sysmon searches when the source TA has not aliased them. Edit to match your field extractions.
iseval = 0

[mitre_normalize_zeek]
definition = eval src=coalesce(src, src_ip, 'id.orig_h'), dest=coalesce(dest, dest_ip, 'id.resp_h'), dest_port=coalesce(dest_port, 'id.resp_p'), bytes_out=coalesce(bytes_out, orig_bytes, orig_ip_bytes), bytes_in=coalesce(bytes_in, resp_bytes, resp_ip_bytes)
description = Normalise Corelight/Zeek connection fields to CIM names whichever TA is installed.
iseval = 0

[mitre_normalize_zeek_http]
definition = eval http_user_agent=coalesce(http_user_agent, user_agent), http_host=coalesce(http_host, url_domain, dest_host, site), uri=coalesce(uri, uri_path, url)
description = Normalise Corelight/Zeek HTTP fields. The Zeek 'host' header collides with Splunk's host field; point http_host at whatever your TA extracts it as.
iseval = 0

[mitre_normalize_pan]
definition = eval src=coalesce(src, src_ip), dest=coalesce(dest, dest_ip), user=coalesce(user, src_user, admin), url_category=coalesce(category, raw_category, http_category)
description = Normalise Palo Alto traffic, threat and config fields to CIM names (field names checked against the add-on's transforms: src_ip, dest_ip, src_user, admin, raw_category, http_category).
iseval = 0

[mitre_normalize_pan_system]
definition = rex field=description "(?i)user '(?<pan_desc_user>[^']+)'" | rex field=description "(?i)\buser (?<pan_login_user>\S+) logged in" | rex field=description "(?i)from:?\s+'?(?<pan_desc_src>\d{1,3}(?:\.\d{1,3}){3}|[0-9a-f]*:[0-9a-f:]+)" | eval user=coalesce(user, src_user, pan_desc_user, pan_login_user), src=coalesce(src, pan_desc_src), dvc=coalesce(dvc_name, dvc, host), pan_event_id=coalesce(event_id, signature), pan_subtype=coalesce(log_subtype, subtype)
description = Normalise Palo Alto system logs. Splunk's add-on 1.0+ extracts user and src for authentication events; older Palo Alto-maintained versions only carry them inside description, so they are parsed from it as a fallback.
iseval = 0

