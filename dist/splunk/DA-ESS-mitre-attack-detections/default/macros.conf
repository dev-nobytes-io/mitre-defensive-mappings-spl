# Generated by mitremap. Per-analytic tuning: one filter macro each, plus analytic-specific tunables
# bound to ATT&CK mutable elements. Shared macros and lookups live in TA-mitre-attack-datacomponents.

[mitre_an0165_filter]
definition = search *
description = Exclusions for AN0165 LOLBin or script process connected externally and dropped a file. Example: search NOT (dest=scanner01 OR user=svc_backup)
iseval = 0

[mitre_an0165_download_processes]
definition = Image IN ("*\\certutil.exe", "*\\bitsadmin.exe", "*\\powershell.exe", "*\\pwsh.exe", "*\\curl.exe", "*\\mshta.exe", "*\\regsvr32.exe", "*\\rundll32.exe", "*\\msiexec.exe", "*\\wscript.exe", "*\\cscript.exe", "*\\cmd.exe", "*\\expand.exe", "*\\esentutl.exe", "*\\finger.exe", "*\\wmic.exe")
description = AN0165 tunable for ATT&CK mutable element 'ParentProcessName'. The processes considered. Known updaters are not in this list; exclude specific hosts or users in the filter macro.
iseval = 0

[mitre_an0165_drop_paths]
definition = TargetFilename IN ("*\\Users\\Public\\*", "*\\AppData\\Local\\Temp\\*", "*\\Windows\\Temp\\*", "*\\ProgramData\\*", "*\\Downloads\\*", "*\\PerfLogs\\*") NOT TargetFilename IN ("*__PSScriptPolicyTest_*", "*\\StartupProfileData-*", "*.log", "*.etl")
description = AN0165 tunable for ATT&CK mutable element 'FilePathRegex'.
iseval = 0

