[MITRE - AN0061 - Burst of service stop or disable commands - Rule]
description = One user on one host runs several distinct service stop, delete or disable commands (net stop, sc stop/delete/config disabled, taskkill /f, Stop-Service, Set-Service Disabled) within ten minutes. Ransomware and wipers stop databases, mail and backup services this way before encrypting. ATT&CK AN0061 / DET0021 / T1489 Service Stop. Content type: anomaly.
