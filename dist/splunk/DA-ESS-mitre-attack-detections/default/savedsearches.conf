search = | tstats count latest(_time) as last_seen where `mitre_health_host_scope` earliest=-7d by index host | eval hours_since=round((now() - last_seen) / 3600, 1), dest=host | where hours_since > `mitre_health_host_silence_hours` | search `mitre_not_allowlisted_dest` | stats max(last_seen) as lastTime max(hours_since) as hours_since values(index) as silent_index by dest | `mitre_ctime(lastTime)` | `mitre_health0002_filter`
