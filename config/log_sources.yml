  "WinEventLog:Windows Defender": "WinEventLog:Microsoft-Windows-Windows Defender/Operational"
  "Windows Firewall Log": "windows:firewalllog"
  "wineventlog:dhcp": "WinEventLog:DhcpServer"
  "WinEventLog:iis": "ApplicationLog:IIS"
  "WinEventLog:Kerberos": "WinEventLog:Security"
  "dns:querylog": "dns:query"
  "vpxd.log": "esxi:vpxd"
  "esxi:vob": "esxi:vobd"
  "ESXiLogs:messages": "esxi:syslog"
  "ESXiLogs:authlog": "esxi:auth"
  "zeek:conn": "NSM:Connections"
  "zeek:ssl": "NSM:Content"
  "NSM:TLS/HTTP": "NSM:Content"
  "NSM:Inspection": "NSM:Content"
  "NSM:DNS": "dns:query"
  "NIDS:Flow": "NSM:Flow"
  "networkdevice:Flow": "NSM:Flow"
  "NetworkProxy:HTTPSFlow": "WebProxy:AccessLogs"
  "webproxy:applog": "WebProxy:AccessLogs"
  "Traffic": "Network Traffic"
  "Network": "Network Traffic"
