  "WinEventLog:Sysmon ": "WinEventLog:Sysmon"
  "NSM:FLow": "NSM:Flow"
  "NetFlow:Flow": "netflow:ipfix"
  "NSM:firewall": "NSM:Firewall"
  "esxis:vmkernel": "esxi:vmkernel"
  "macOS:unifiedlog": "macos:unifiedlog"
  "macos:endpointSecurity": "macos:endpointsecurity"
  "macos:fsevents": "fs:fsevents"
  "containerd:Events": "containerd:events"
  "NetworkDevice:Syslog": "networkdevice:syslog"
