  "auditd:SYSCALL+PATH": "auditd:SYSCALL"
  "auditd:AUTH": "auditd:USER_LOGIN"
  "auditd:memprotect": "auditd:SYSCALL"
  "auditd:MMAP": "auditd:SYSCALL"
  "auditd:DAEMON": "auditd:CONFIG_CHANGE"
  "auditd:USER_CMD": "auditd:EXECVE"
  "linux:shell": "linux:cli"
  "journald:Application": "linux:syslog"
  "journald:boot": "linux:syslog"
  "sar:network": "linux:procfs"
  "ApplicationLog:WebServer": "webserver:applog"
  "apache:access_log": "webserver:applog"
