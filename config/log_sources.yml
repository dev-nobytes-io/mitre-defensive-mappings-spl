# ---------------------------------------------------------------------------
# ATT&CK log-source name -> feed(s) in config/stack.yml
#
# ATT&CK v20 names log sources as "<family>:<channel-ish>" with free-text
# channels. This file:
#   aliases  : collapse typos / case variants to one canonical name
#   sources  : explicit mappings for the names that matter
#   rules    : ordered regex fallbacks for the long tail
#
# A source may have several providers (e.g. NSM:Flow is Corelight conn.log and
# Palo Alto traffic logs). Each provider yields one eventtype per data component.
#
# parser: how the free-text `channel` is turned into a search constraint
#   eventcode  "EventCode=1" / "EventCode=4103, 4104"  -> EventCode IN (...)
#   auditd     record type from the name, syscall names from the channel
#   zeek       "conn.log, dns.log" -> Corelight sourcetypes
#   esxi       log file from the name -> vmware:esxlog:<log>
#   k8s        leading verb (create/get/list/delete/patch/exec)
#   none       channel is documentation only
# ---------------------------------------------------------------------------
