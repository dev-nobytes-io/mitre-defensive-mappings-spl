  "snmp:syslog": "networkdevice:snmp"
  "snmp:trap": "networkdevice:snmp"
  "snmp:status": "networkdevice:snmp"
  "snmp:access": "networkdevice:snmp"
  "snmp:config": "networkdevice:snmp"
  "network:runtime": "networkdevice:runtime"
