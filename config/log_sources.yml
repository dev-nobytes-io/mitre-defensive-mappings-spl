  "Microsoft Graph API Logs": "azure:audit"
  "azure:signin": "azure:signinlogs"
  "azure:ad": "azure:audit"
  "ApplicationLog:EntraIDPortal": "azure:audit"
  "Defender for Identity": "m365:defender"
