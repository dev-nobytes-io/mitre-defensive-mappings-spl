# Data component -> Splunk CIM data model. Used for:
#   * tags.conf CIM tags on per-feed eventtypes, only for feeds whose TA already
#     normalises fields for that model (compliant_feeds);
#   * mitre_dcXXXX_dm / _dm_where macros so analytics can use tstats.
# `where` is the datamodel constraint fragment appended after `from datamodel=...`.
components:
  Process Creation:
    datamodel: Endpoint
    dataset: Processes
    tags: [process, report]
    compliant_feeds: [sysmon, wineventlog, auditd, sysmon_linux]
  Process Termination:
    datamodel: Endpoint
    dataset: Processes
    tags: [process, report]
    compliant_feeds: [sysmon]
    where: 'Processes.action=terminated'
  Process Access:
    datamodel: Endpoint
    dataset: Processes
    tags: [process, report]
    compliant_feeds: []
  Process Metadata:
    datamodel: Endpoint
    dataset: Processes
    tags: [process, report]
    compliant_feeds: [sysmon]
