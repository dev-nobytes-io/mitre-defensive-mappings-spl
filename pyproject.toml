[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mitremap"
version = "0.1.0"
description = "MITRE ATT&CK v20 detection model (Detection Strategy -> Analytic -> Data Component -> Log Source) mapped onto Splunk and Sigma"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
sigma = ["pysigma>=0.11", "pysigma-backend-splunk>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
mitremap = "mitremap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
