id: DC0051
name: Firewall Rule Modification
attack:
  url: https://attack.mitre.org/datacomponents/DC0051
  version: '2.0'
  modified: '2026-10-13'
  attack_release: '20.1'
  domains:
  - enterprise-attack
  - ics-attack
  description: "The creation, deletion, or alteration of firewall rules to allow or block specific network traffic.\
    \ Monitoring changes to these rules is critical for detecting misconfigurations, unauthorized access, or malicious\
    \ attempts to bypass network protections. Examples: \n\n- Rule Creation: Adding a new rule to allow inbound\
    \ traffic on port 3389 (RDP).\n- Rule Deletion: Deleting a rule that blocks inbound traffic from untrusted IP\
    \ ranges.\n- Rule Modification: Changing a rule to allow traffic from \"any\" source IP instead of a specific\
    \ trusted range.\n- Audit Log Metadata: Logs indicating \"Firewall rule modified by admin@domain.com.\"\n- Platform-Specific\
    \ Scenarios\n    - Azure: Altering rules in an Azure Network Security Group (NSG).\n    - AWS: Modifying Security\
    \ Group rules to allow traffic.\n    - Windows: Changes tracked in Security Event Logs (EID 4950 or 4951).\n\
    \nThis data component can be collected through the following measures:\n\nCloud Control Plane\n\n- Azure: Collect\
    \ rule modification logs from Azure Firewall Activity Logs.\n    - Example Command: `az network firewall policy\
    \ rule-collection-group rule-collection list --policy-name <policy-name>`\n- AWS: Use CloudTrail to track `AuthorizeSecurityGroupIngress`\
    \ or `RevokeSecurityGroupIngress` actions.\n    Example: `aws ec2 describe-security-groups`\n- Google Cloud:\
    \ Use gcloud commands to extract firewall rules: `gcloud compute firewall-rules list --format=json`\n\nHost-Based\
    \ Firewalls\n\n- Windows: \n    - Collect events from the Windows Security Event Log (EID 4950: A rule has been\
    \ modified).\n    - Use PowerShell to track rule changes: `Get-NetFirewallRule -PolicyStore PersistentStore`\n\
    - Linux:\n    - Monitor iptables or nftables rule modifications: `iptables -L -v`\n    - Use auditd for real-time\
    \ monitoring: `auditctl -w /etc/iptables.rules -p wa`\n- macOS: Use pfctl to monitor rule changes: `sudo pfctl\
    \ -sr`\n\nSIEM Integration\n\n- Collect logs from cloud platforms, host systems, and network appliances for\
    \ centralized monitoring.\n\nAPI Monitoring\n\n- Monitor API calls for firewall rule modifications."
