curated:
  justification: >-
    Credential dumping, injection and process hollowing open handles to other processes. Sysmon EID 10 (with GrantedAccess
    and CallTrace) is the main source; 4656/4663 only fire with SACLs on the target objects.
  requirements:
  - >-
    Sysmon ProcessAccess (EID 10) must be scoped to targets such as lsass.exe, winlogon.exe, csrss.exe; unscoped
    it is unusable.
  - Linux equivalents (ptrace, process_vm_readv) need explicit auditd rules.
  overrides:
    event_codes: {}
    cim: null
    exclude_feeds: []
  notes: []
