id: DC0069
name: Cloud Service Modification
attack:
  url: https://attack.mitre.org/datacomponents/DC0069
  version: '2.0'
  modified: '2025-11-12'
  attack_release: '20.1'
  domains:
  - enterprise-attack
  description: "Cloud service modification refers to changes made to the configuration, settings, or data of a cloud\
    \ service. These modifications can include administrative changes such as enabling or disabling features, altering\
    \ permissions, or deleting critical components. Monitoring these changes is critical to detect potential misconfigurations\
    \ or malicious activity. Examples: \n\n- AWS Cloud Service Modifications: A user disables AWS CloudTrail logging\
    \ (StopLogging) or deletes a CloudWatch configuration rule (DeleteConfigRule).\n- Azure Cloud Service Modifications:\
    \ Changes to Azure Role-Based Access Control (RBAC) roles, such as adding a new Contributor role to a sensitive\
    \ resource.\n- Google Cloud Service Modifications: Deletion of a Google Cloud Storage bucket or disabling a\
    \ Google Cloud Function.\n- Office 365 Cloud Service Modifications: Altering mailbox permissions or disabling\
    \ auditing in Microsoft 365."
