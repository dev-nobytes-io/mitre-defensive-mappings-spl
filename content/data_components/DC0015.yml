id: DC0015
name: Image Creation
attack:
  url: https://attack.mitre.org/datacomponents/DC0015
  version: '2.0'
  modified: '2025-11-12'
  attack_release: '20.1'
  domains:
  - enterprise-attack
  description: "Initial construction of a virtual machine image within a cloud environment. Virtual machine images\
    \ are templates containing an operating system and installed applications, which can be deployed to create new\
    \ virtual machines. Monitoring the creation of these images is important because adversaries may create custom\
    \ images to include malicious software or misconfigurations for later exploitation. Examples: \n\n- Azure Compute\
    \ Service Image Creation\n    - Example: Creating a virtual machine image in Azure using Azure CLI: `az image\
    \ create --resource-group MyResourceGroup --name MyImage --source MyVM`\n- AWS EC2 AMI (Amazon Machine Image)\
    \ Creation\n    - Example: Creating an AMI from an EC2 instance: `aws ec2 create-image --instance-id i-1234567890abcdef0\
    \ --name \"MyAMI\" --description \"An AMI for my app\"`\n- Google Cloud Compute Engine Image Creation\n    -\
    \ Example: Creating a custom image using gcloud: `gcloud compute images create my-custom-image --source-disk\
    \ my-disk --source-disk-zone us-central1-a`\n- VMware vSphere\n    - Example: Exporting a VM to create an OVF\
    \ (Open Virtualization Format) template: This could later be imported into other environments with potential\
    \ tampering."
