id: DC0083
name: Cloud Service Enumeration
attack:
  url: https://attack.mitre.org/datacomponents/DC0083
  version: '3.0'
  modified: '2026-10-13'
  attack_release: '20.1'
  domains:
  - enterprise-attack
  - mobile-attack
  description: "Cloud service enumeration involves listing or querying available cloud services in a cloud control\
    \ plane. This activity is often performed to identify resources such as virtual machines, storage buckets, compute\
    \ clusters, or other services within a cloud environment. Examples include API calls like `AWS ECS ListServices`,\
    \ `Azure ListAllResources`, or `Google Cloud ListInstances`. Examples: \n\nAWS Cloud Service Enumeration: The\
    \ adversary gathers details about existing ECS services to identify opportunities for privilege escalation or\
    \ exfiltration.\n- Azure Resource Enumeration: The adversary collects information about virtual machines, resource\
    \ groups, and other Azure assets for reconnaissance purposes.\n- Google Cloud Resource Enumeration: The attacker\
    \ seeks to map the environment and find misconfigured or underutilized resources for exploitation.\n- Office\
    \ 365 Service Enumeration: The attacker may look for data repositories or collaboration tools to exfiltrate\
    \ sensitive information."
