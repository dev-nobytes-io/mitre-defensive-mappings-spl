id: DC0101
name: Domain Registration
attack:
  url: https://attack.mitre.org/datacomponents/DC0101
  version: '2.0'
  modified: '2025-10-21'
  attack_release: '20.1'
  domains:
  - enterprise-attack
  description: "\"Domain Name: Domain Registration\" data component captures information about the assignment, ownership,\
    \ and metadata of domain names. This information is often sourced from registries like WHOIS and includes details\
    \ such as registrant names, contact information, registration dates, expiration dates, and registrar details.\
    \ This data is invaluable for tracking domain ownership, detecting malicious domain registrations, and identifying\
    \ trends in adversary behavior. Examples: \n\n- Registrant Information: WHOIS lookup of example.com \n- Registration\
    \ and Expiration Dates: A domain registered a week before being used in phishing attacks.\n- Domain Status:\
    \ Status codes like clientTransferProhibited or serverHold indicate domain restrictions or potential hijacking\
    \ activity.\n- Name Server Information: Name servers point to a public DNS provider often associated with malicious\
    \ campaigns.\n- Privacy Protection: A domain uses WHOIS privacy protection to hide registrant details.\n\nThis\
    \ data component can be collected through the following measures:\n\n- WHOIS Services: Use tools or services\
    \ to perform WHOIS lookups:\n- WHOIS APIs: Automate domain registration lookups with APIs:\n- Registrar Platforms:\
    \ Directly query domain registrars (e.g., GoDaddy, Namecheap) for detailed registration data.\n- Threat Intelligence\
    \ Platforms: Integrate domain registration data from services like Recorded Future, RiskIQ, or PassiveTotal\
    \ for enriched analysis."
