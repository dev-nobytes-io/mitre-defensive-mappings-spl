id: DC0042
name: Drive Creation
attack:
  url: https://attack.mitre.org/datacomponents/DC0042
  version: '2.0'
  modified: '2026-10-13'
  attack_release: '20.1'
  domains:
  - ics-attack
  - enterprise-attack
  description: "The activity of assigning a new drive letter or creating a mount point for a data storage device,\
    \ such as a USB, network share, or external hard drive, enabling access to its content on a host system. Examples:\
    \ \n\n- USB Drive Insertion: A USB drive is plugged in and automatically assigned the letter `E:\\` on a Windows\
    \ machine.\n- Network Drive Mapping: A network share `\\\\server\\share` is mapped to the drive `Z:\\`.\n- Virtual\
    \ Drive Creation: A virtual disk is mounted on `/mnt/virtualdrive` using an ISO image or a virtual hard disk\
    \ (VHD).\n- Cloud Storage Mounting: Google Drive is mounted as `G:\\` on a Windows machine using a cloud sync\
    \ tool.\n- External Storage Integration: An external HDD or SSD is connected and assigned `/mnt/external` on\
    \ a Linux system.."
