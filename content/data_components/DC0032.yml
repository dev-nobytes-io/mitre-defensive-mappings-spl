curated:
  justification: >-
    The backbone of endpoint detection: 860 of 1773 analytics read it, and almost every execution, persistence,
    discovery and defense-evasion strategy starts from a process tree. On your stack Sysmon EID 1 is the primary
    feed (image, hashes, parent, command line, user), 4688 is the fallback where Sysmon is absent, and Solidcore
    EXECUTION_DENIED gives a high-signal second opinion on blocked binaries.
  requirements:
  - >-
    Sysmon config must include ProcessCreate with command line and parent command line (the default); hashes SHA256
    at minimum.
  - >-
    4688 is useless without the 'Include command line in process creation events' GPO; also enable Audit Process
    Creation (Detailed Tracking).
  - >-
    For Linux parity tick auditd with an execve rule (-a always,exit -F arch=b64 -S execve,execveat) and log_format=ENRICHED.
  - >-
    ESXi: shell.log is the only process-level record on the hypervisor; forward it and enable ESXi Shell auditing.
  overrides:
    event_codes: {}
    cim: null
    exclude_feeds: []
  notes: []
kql: null
esql: null
