curated:
  justification: >-
    ATT&CK's catch-all for in-process API use (VirtualAllocEx, NtQueueApcThread, keyctl, ptrace). Nothing in your
    stack records API calls directly; Sysmon 8/10/25 and object-access auditing observe the side effects, and ETW
    providers or an EDR would close the gap.
  requirements:
  - >-
    Treat the Sysmon-based eventtype as a partial proxy. The etw feed (Kernel-Process, Win32k, RPC, DotNETRuntime)
    is the honest source and is unticked.
  overrides:
    event_codes: {}
    cim: null
    exclude_feeds: []
  notes:
  - >-
    Most analytics on this component are better implemented against Process Access / Process Modification on your
    stack.
