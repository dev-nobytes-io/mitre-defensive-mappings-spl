  description: "Cloud service metadata refers to the contextual and descriptive information about cloud services,\
    \ including their name, type, purpose, configuration, and activity around them. This metadata is essential for\
    \ understanding the roles and functions of cloud services, their operational status, and their potential misuse.\
    \ Examples: \n\n- Azure Service Metadata: Metadata describing a resource in Azure, such as an Azure Storage\
    \ Account or a Virtual Machine.\n- AWS Cloud Service Metadata: Metadata for an AWS EC2 instance collected using\
    \ the `DescribeInstances` API call.\n- Google Cloud Service Metadata: Metadata for a Google Compute Engine instance\
    \ collected using `gcloud compute instances describe`.\n- Office 365 Metadata: Metadata about an Office 365\
    \ SharePoint site."
