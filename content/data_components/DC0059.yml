curated:
  justification: >-
    Hashes, signatures, attributes, ownership and permission changes. Sysmon EID 11/15/2 and CodeIntegrity carry
    hash/signature data; Solidcore FILE_ATTR_MODIFIED and auditd chmod/chown/setxattr cover attribute changes; Corelight
    files/pe logs give metadata for files crossing the network; PAN-OS WildFire verdicts add a reputation signal.
  requirements:
  - Corelight files.log needs file extraction enabled for hashes; pe.log for PE headers.
  overrides:
    event_codes: {}
    cim: null
    exclude_feeds: []
  notes: []
