curated:
  justification: >-
    DLL side-loading, unsigned module injection, LSASS credential dumpers and COM hijacks all show up as image loads.
    Sysmon EID 7 is the only broadly deployable source and is also the most expensive one; CodeIntegrity 3033/3063
    add the signature-enforcement failures.
  requirements:
  - >-
    Sysmon ImageLoad (EID 7) is off in minimal configs and is high volume; scope it to interesting images (LSASS,
    unsigned, non-system paths) in the Sysmon config rather than in Splunk.
  - >-
    Solidcore PROCESS_HIJACK_ATTEMPTED covers injection attempts into protected processes when Application Control
    memory protection is on.
