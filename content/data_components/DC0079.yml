id: DC0079
name: Driver Load
attack:
  url: https://attack.mitre.org/datacomponents/DC0079
  version: '2.0'
  modified: '2026-10-13'
  attack_release: '20.1'
  domains:
  - enterprise-attack
  - ics-attack
  description: "The process of attaching a driver, which is a software component that allows the operating system\
    \ and applications to interact with hardware devices, to either user-mode or kernel-mode of a system. This can\
    \ include benign actions (e.g., hardware drivers) or malicious behavior (e.g., rootkits or unsigned drivers).\
    \ Examples: \n\n- Legitimate Driver Loading: A new graphics driver from a vendor like NVIDIA or AMD is loaded\
    \ into the system.\n- Unsigned Driver Loading: A driver without a valid digital signature is loaded into the\
    \ kernel.\n- Rootkit Installation: A malicious rootkit driver is loaded to manipulate kernel-mode processes.\n\
    - Anti-Virus or EDR Driver Loading: An Endpoint Detection and Response (EDR) solution loads its driver to monitor\
    \ system activities.\n- Driver Misuse: A legitimate driver is loaded and exploited to execute malicious actions,\
    \ such as using vulnerable drivers for bypassing defenses (e.g., Bring Your Own Vulnerable Driver (BYOVD) attacks)."
