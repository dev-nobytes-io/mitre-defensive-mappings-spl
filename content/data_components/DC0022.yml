id: DC0022
name: Cloud Storage Deletion
attack:
  url: https://attack.mitre.org/datacomponents/DC0022
  version: '2.0'
  modified: '2025-11-12'
  attack_release: '20.1'
  domains:
  - enterprise-attack
  description: "Cloud Storage Deletion refers to the removal or destruction of cloud storage infrastructure, such\
    \ as buckets, containers, or directories, within a cloud environment. Monitoring this activity is critical to\
    \ detecting potential unauthorized or malicious actions, such as data destruction by adversaries or accidental\
    \ deletions that may lead to data loss. Examples: \n\n- AWS S3 Bucket Deletion: An AWS user deletes an S3 bucket\
    \ using the `DeleteBucket` API call.\n- Azure Blob Storage Container Deletion: A user deletes a container in\
    \ Azure Blob Storage using the `Delete Container` operation.\n- Google Cloud Storage Bucket Deletion: A Google\
    \ Cloud user deletes a bucket using the `storage.buckets.delete` API.\n- OpenStack Swift Container Deletion:\
    \ A user deletes a container in OpenStack Swift using the `DELETE` method.\n\nThis data component can be collected\
    \ through the following measures:\n\nEnable Logging for Cloud Storage Services\n\n- AWS S3: Enable AWS CloudTrail\
    \ to log DeleteBucket API actions.\n- Azure Blob Storage: Enable Azure Monitor and Diagnostic Logs to capture\
    \ Delete Container operations. Use Azure Event Grid to capture and trigger alerts for container deletion.\n\
    - Google Cloud Storage: Enable Data Access logs in Cloud Audit Logs to monitor storage.buckets.delete API calls.\n\
    - OpenStack Swift: Configure Swift logging to capture DELETE requests for containers.\n\nCentralized Logging\
    \ and Analysis\n\n- Use platforms like Splunk or native SIEMs to forward and analyze logs for anomalies in cloud\
    \ storage deletions."
