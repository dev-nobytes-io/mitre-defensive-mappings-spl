id: DC0031
name: Kernel Module Load
attack:
  url: https://attack.mitre.org/datacomponents/DC0031
  version: '2.0'
  modified: '2025-10-21'
  attack_release: '20.1'
  domains:
  - enterprise-attack
  description: "The process of loading a kernel module into the operating system kernel. Kernel modules are object\
    \ files that extend the kernel’s functionality, such as adding support for device drivers, new filesystems,\
    \ or additional system calls. This action can be legitimate (e.g., loading a driver) or malicious (e.g., adding\
    \ a rootkit). \n\n*Data Collection Measures:*\n\n- Linux:\n    - Auditd: Enable auditing of kernel module loading.\
    \ Example rule: `-a always,exit -F arch=b64 -S init_module,delete_module`.\n    - Syslog: Monitor `/var/log/syslog`\
    \ or `/var/log/messages` for entries related to kernel module loads.\n    - Systemd Journal: Use `journalctl`\
    \ to query logs for module loading events: `journalctl -k | grep \"Loading kernel module\"`\n- macOS:\n    -\
    \ Unified Logs: Use the `log` command to query kernel module events: `log show --predicate 'eventMessage contains\
    \ \"kextload\"' --info`\n    - Endpoint Security Framework (ESF): Monitor for `ES_EVENT_TYPE_AUTH_KEXTLOAD`\
    \ (kernel extension loading events).\n- Kernel-Specific Tools:\n    - Lsmod: Use `lsmod` to list loaded kernel\
    \ modules in real-time.\n    - Kprobe/eBPF: Use extended Berkeley Packet Filter (eBPF) or Kernel Probes (kprobes)\
    \ to monitor kernel events, including module loading. Example using eBPF tools like BCC:\n`sudo python /path/to/bcc/tools/kprobe\
    \ -v do_init_module`\n- Enable EDR Monitoring:\n    - Configure alerts for: Suspicious kernel module loads from\
    \ non-standard paths (e.g., /tmp). Unexpected or unsigned kernel modules.\n    - Review detailed telemetry data\
    \ provided by the EDR for insight into who initiated the module load, the file path, and whether the module\
    \ was signed."
