curated:
  justification: >-
    Script-level visibility (PowerShell script blocks, cscript/wscript payloads, ESXi shell scripts) is where fileless
    and living-off-the-land activity surfaces. PowerShell Operational is the dominant source; ePO AMSI events add
    the content-inspection angle that EID 1 cannot see.
  requirements:
  - >-
    Script Block Logging produces 4104 fragments for long scripts; the Splunk TA does not reassemble them, so analytics
    must key on ScriptBlockId.
  - ENS AMSI scanning must be enabled for ePO AMSI events to exist.
