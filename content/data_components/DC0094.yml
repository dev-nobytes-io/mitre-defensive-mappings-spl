id: DC0094
name: Group Modification
attack:
  url: https://attack.mitre.org/datacomponents/DC0094
  version: '2.0'
  modified: '2025-10-21'
  attack_release: '20.1'
  domains:
  - enterprise-attack
  description: "Changes made to a group, such as membership, name, or permissions (ex: Windows EID 4728 or 4732,\
    \ AWS IAM UpdateGroup). Examples: \n\n- Active Directory:\n    - Event ID 4728: Member added to a global group.\n\
    \    - Event ID 4732: Member added to a local group.\n- Azure AD: `Set-AzureADGroup -ObjectId <GroupId> -DisplayName\
    \ \"New Name\"`\n- AWS IAM: `aws iam update-group --group-name <GroupName> --new-path \"/admin/\"`\n- Google\
    \ Workspace: Modify permissions via Admin SDK API: `PATCH https://admin.googleapis.com/admin/directory/v1/groups/<groupKey>`\n\
    - Office 365: Modify groups via Graph API: `PATCH https://graph.microsoft.com/v1.0/groups/<groupId>`\n\n*Data\
    \ Collection Measures:*\n\n- Directory Logging:\n    - Windows: Log EIDs 4728 (add), 4729 (remove).\n    - Azure\
    \ AD: Enable \"Audit logs.\"\n    - Google Workspace: Enable Admin Activity logs.\n    - Office 365: Use Unified\
    \ Audit Logs.\n- Cloud Monitoring:\n    - AWS: Log `UpdateGroup`, `AttachGroupPolicy`, `RemoveUserFromGroup`.\n\
    \    - Azure: Track modifications via Audit logs.\n- API Monitoring: Log Google Admin SDK and Microsoft Graph\
    \ API calls.\n- SIEM Integration: Centralize and monitor group modification logs."
