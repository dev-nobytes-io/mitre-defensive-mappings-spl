curated:
  justification: >-
    Ties a process to a socket. Sysmon EID 3 gives process-to-destination on the host; Corelight conn.log and PAN-OS
    traffic logs give the authoritative network-side record and cover everything that is not a Windows host. 246
    analytics depend on it.
  requirements:
  - >-
    Sysmon NetworkConnect (EID 3) is high volume; scope by process or destination port in the config, and keep DNS
    (EID 22) separate.
  - >-
    PAN-OS traffic logs must include session start and end on every rule; Corelight sensors must see east-west traffic
    for lateral-movement analytics.
  overrides:
    event_codes: {}
    cim: null
    exclude_feeds: []
  notes: []
