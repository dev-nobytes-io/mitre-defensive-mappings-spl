curated:
  justification: >-
    The broadest component (209 analytics): application-specific events from Windows Application/System channels,
    IIS, web servers, mail, PAN-OS threat/system, ESXi daemons, Entra audit. Each analytic needs a specific application;
    the eventtype is deliberately wide and should be narrowed per analytic.
  requirements:
  - Treat this as a routing component; phase-2 analytics should pin sourcetype and event IDs explicitly.
