name: Firewall Enumeration
attack:
  url: https://attack.mitre.org/datacomponents/DC0044
  version: '2.0'
  modified: '2025-11-12'
  attack_release: '20.1'
  domains:
  - enterprise-attack
  description: "Querying and extracting a list of available firewalls or their associated configurations and rules.\
    \ This activity can occur across host systems and cloud control planes, providing insight into the state and\
    \ configuration of firewalls that protect the environment. Examples: \n\n- Querying Host-Based Firewalls: Using\
    \ Windows PowerShell commands like `Get-NetFirewallRule` or Linux commands such as `iptables -L` or `firewalld\
    \ --list-all`.\n- Cloud Firewall Rule Listing: Running commands like `az network firewall list` for Azure or\
    \ `aws ec2 describe-security-groups` for AWS.\n- Using Management APIs: Leveraging APIs like Google Cloud Firewall's\
    \ `list` API method or AWS's DescribeSecurityGroups API.\nIdentifying Misconfigurations: Extracting firewall\
    \ rules to identify “allow all” policies or rules that lack logging.\n- Enumerating with CLI Tools: Using CLI\
    \ commands like `gcloud compute firewall-rules list` to extract firewall settings in Google Cloud."
