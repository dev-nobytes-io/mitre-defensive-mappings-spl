name: Cloud Storage Metadata
attack:
  url: https://attack.mitre.org/datacomponents/DC0027
  version: '2.0'
  modified: '2025-11-12'
  attack_release: '20.1'
  domains:
  - enterprise-attack
  description: "Cloud Storage Metadata provides contextual information about cloud storage infrastructure and its\
    \ associated activity. This data may include attributes such as storage name, size, owner, permissions, creation\
    \ date, region, and activity metadata. It is essential for monitoring, auditing, and identifying anomalies in\
    \ cloud storage environments. Examples: \n\n- AWS S3 Bucket Metadata: Metadata about an S3 bucket includes the\
    \ bucket name, region, creation date, owner, storage class, and permissions.\n- Azure Blob Storage Metadata:\
    \ Metadata for an Azure Blob container includes container name, access level (e.g., private or public), size,\
    \ and tags.\n- Google Cloud Storage Metadata: Metadata includes bucket name, storage class, location, labels,\
    \ lifecycle policies, and versioning status.\n- OpenStack Swift Metadata: Metadata for a Swift container includes\
    \ name, access level, quota, and custom attributes."
