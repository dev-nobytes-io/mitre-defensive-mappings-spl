id: DC0090
name: Cloud Service Disable
attack:
  url: https://attack.mitre.org/datacomponents/DC0090
  version: '2.0'
  modified: '2025-11-12'
  attack_release: '20.1'
  domains:
  - enterprise-attack
  description: "This data component refers to monitoring actions that deactivate or stop a cloud service in a cloud\
    \ control plane. Examples include disabling essential logging services like AWS CloudTrail (`StopLogging` API\
    \ call), Microsoft Azure Monitor Logs, or Google Cloud's Operations Suite (formerly Stackdriver). Disabling\
    \ such services can hinder visibility into adversary activities within the cloud environment. Examples: \n\n\
    - AWS CloudTrail StopLogging: This action stops logging of API activity for a particular trail, effectively\
    \ reducing the monitoring and visibility of AWS resources and activities.\n- Microsoft Azure Monitor Logs: Disabling\
    \ these logs hinders the organization’s ability to detect anomalous activities and trace malicious actions.\n\
    - Google Cloud Logging: Disabling cloud logging removes visibility into resource activity, preventing monitoring\
    \ of service access or configuration changes.\n- SaaS Applications: Stopping logging removes visibility into\
    \ user activities, such as email access or file downloads, enabling undetected malicious behavior."
