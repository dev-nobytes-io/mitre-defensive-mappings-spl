id: DC0030
name: Pod Modification
attack:
  url: https://attack.mitre.org/datacomponents/DC0030
  version: '2.0'
  modified: '2025-10-21'
  attack_release: '20.1'
  domains:
  - enterprise-attack
  description: "Changes made to a pod’s configuration or control data within a containerized cluster. This can include\
    \ updating settings such as resource limits, environment variables, annotations, labels, or even the containers\
    \ running within the pod. Pod modifications are often executed using commands like kubectl set, kubectl patch,\
    \ or kubectl edit.\n\n*Data Collection Measures:* \n\n- Kubernetes API Server Audit Logs:\n    - Capture all\
    \ API calls related to pod modification, such as PATCH, PUT, or UPDATE methods on v1/pods.\n- Runtime Security\
    \ Tools:\n    - Tools like Falco, Sysdig, and Kube-bench can monitor pod modifications at runtime and alert\
    \ on policy violations.\n- Container Orchestration Logs:\n    - Monitor events logged by Kubernetes itself (e.g.,\
    \ `kubectl logs -n kube-system kube-controller-manager`).\n- SIEM and EDR Solutions:\n    - Use SIEM platforms\
    \ (e.g., Splunk) to aggregate API server logs and detect patterns of unauthorized or suspicious pod modifications.\n\
    \    - Endpoint Detection and Response (EDR) tools configured with container visibility can monitor commands\
    \ like `kubectl` set or `kubectl patch`.\n- Host-Based Monitoring:\n    - Collect and analyze logs for processes\
    \ executing `kubectl` commands or interacting with Kubernetes configuration files (e.g., `.kube/config`)."
