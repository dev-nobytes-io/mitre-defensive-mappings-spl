id: DC0067
name: Logon Session Creation
attack:
  url: https://attack.mitre.org/datacomponents/DC0067
  version: '2.1'
  modified: '2026-10-13'
  attack_release: '20.1'
  domains:
  - ics-attack
  - enterprise-attack
  description: "The successful establishment of a new user session following a successful authentication attempt.\
    \ This typically signifies that a user has provided valid credentials or authentication tokens, and the system\
    \ has initiated a session associated with that user account. This data is crucial for tracking authentication\
    \ events and identifying potential unauthorized access. Examples: \n\n- Windows Systems\n    - Event ID: 4624\n\
    \        - Logon Type: 2 (Interactive) or 10 (Remote Interactive via RDP).\n        - Account Name: JohnDoe\n\
    \        - Source Network Address: 192.168.1.100\n        - Authentication Package: NTLM\n- Linux Systems\n\
    \    - /var/log/utmp or /var/log/wtmp:\n        - Log format: login user [tty] from [source_ip]\n        - User:\
    \ jane\n        - IP: 10.0.0.5\n        - Timestamp: 2024-12-28 08:30:00\n- macOS Systems\n    - /var/log/asl.log\
    \ or unified logging framework:\n        - Log: com.apple.securityd: Authentication succeeded for user 'admin'\n\
    - Cloud Environments\n    - Azure Sign-In Logs:\n        - Activity: Sign-in successful\n        - Client App:\
    \ Browser\n        - Location: Unknown (Country: X)\n- Google Workspace\n    - Activity: Login\n        - Event\
    \ Type: successful_login\n        - Source IP: 203.0.113.55"
