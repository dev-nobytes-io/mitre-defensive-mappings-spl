curated:
  justification: >-
    4624/4625/4648 are the foundation of lateral movement, brute force and pass-the-hash detection; GlobalProtect
    logs cover VPN logons, Corelight kerberos/ntlm/ssh/rdp see them on the wire, Entra sign-in logs cover cloud.
  requirements:
  - >-
    Audit Logon/Logoff subcategories (Logon, Logoff, Special Logon, Other Logon/Logoff Events) enabled on every
    host, not only domain controllers.
  - 'Linux: linux_secure (sshd, sudo, pam) via the Unix TA; auditd USER_LOGIN records.'
