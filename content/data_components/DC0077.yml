name: Container Start
attack:
  url: https://attack.mitre.org/datacomponents/DC0077
  version: '2.0'
  modified: '2025-10-21'
  attack_release: '20.1'
  domains:
  - enterprise-attack
  description: "\"Container Start\" data component captures events related to the activation or invocation of a\
    \ container within a containerized environment. This includes starting a previously stopped container, restarting\
    \ an existing container, or initializing a container for runtime. Monitoring these activities is critical for\
    \ identifying unauthorized or unexpected container activations, which may indicate potential adversarial activity\
    \ or misconfigurations. Examples: \n\n- Docker Example: `docker start <container_name>`, `docker restart <container_name>`\n\
    - Kubernetes Example: Kubernetes automatically restarts containers as part of pod lifecycle management (e.g.,\
    \ due to health checks or configuration changes).\n- Cloud-Native Example\n    - AWS ECS: API Call: StartTask\
    \ to activate a stopped ECS task.\n    - Azure Container Instances: Command to restart a container group instance.\n\
    \    - GCP Kubernetes Engine: Automatic restarts as part of node or pod management.\n\nThis data component can\
    \ be collected through the following measures:\n\n- Docker Audit Logging: Enable Docker logging to capture start\
    \ and restart events. Use tools like auditd to monitor terminal activity involving container lifecycle commands.\n\
    - Kubernetes Audit Logs: Enable Kubernetes API server audit logging.\n- Cloud Provider Logs\n    - AWS CloudTrail:\
    \ Capture StartTask or related API calls for ECS.\n    - Azure Monitor: Track activity in container groups that\
    \ indicate start or restart events.\n    - GCP Cloud Logging: Record logs related to pod restarts or scaling\
    \ events in Kubernetes Engine.\n- SIEM Integration: Collect logs from Docker, Kubernetes, and cloud services\
    \ to correlate container start events."
