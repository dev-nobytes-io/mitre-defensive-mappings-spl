curated:
  justification: >-
    Configuration tampering, log wiping, timestomping, firewall rule files on Linux/ESXi, and PAN-OS config edits.
    Sysmon EID 2 only sees timestamp changes; Solidcore FILE_MODIFIED and Windows 4663 with SACLs are the real sources
    on Windows, auditd watches on Linux, shell/hostd logs on ESXi.
  requirements:
  - >-
    Windows has no native content-modification event; rely on Solidcore Change Control or SACLs (4663 WriteData)
    on the paths you care about.
  - >-
    ESXi: hostd and shell logs record datastore and config file changes only when ESXi Shell/SSH auditing is enabled.
  overrides:
    event_codes: {}
    cim: null
    exclude_feeds: []
  notes: []
