  description: "Cloud Storage Creation refers to the initial creation of a new cloud storage resource, such as buckets,\
    \ containers, or directories, within a cloud environment. This action is critical to track as it might indicate\
    \ the legitimate provisioning of resources or unauthorized actions taken by adversaries to stage, store, or\
    \ exfiltrate data. Examples: \n\n- AWS S3 Bucket Creation: An AWS user creates a new S3 bucket using the `CreateBucket`\
    \ API call.\n- Azure Blob Storage Container Creation: A user creates a new container in Azure Blob Storage using\
    \ the `Create Container` operation.\n- Google Cloud Storage Bucket Creation: A Google Cloud user creates a new\
    \ bucket using `storage.buckets.create`.\n- OpenStack Swift Container Creation: A user creates a new container\
    \ in OpenStack Swift using the `PUT` method."
