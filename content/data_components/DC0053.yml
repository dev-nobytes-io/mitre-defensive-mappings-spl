id: DC0053
name: Firewall Metadata
attack:
  url: https://attack.mitre.org/datacomponents/DC0053
  version: '2.0'
  modified: '2026-10-13'
  attack_release: '20.1'
  domains:
  - enterprise-attack
  - ics-attack
  description: "Contextual information about firewalls, including their configurations, policies, status, and other\
    \ details such as names and associated rules. This metadata provides valuable insights into the operational\
    \ state and configurations of firewalls, both in cloud control planes and host systems. Examples: \n\n- Firewall\
    \ Name and Configuration: The name, type, and purpose of a firewall such as \"Azure Firewall - Production Environment.\"\
    \n- Policy Details: Capturing firewall policy details, such as \"Allow inbound TCP 443 to web servers.\"\n-\
    \ Firewall Status: Status indicators like \"Active,\" \"Disabled,\" or \"Pending Updates.\"\n- Audit Log Metadata:\
    \ Log entries showing administrative changes, such as \"Policy modified by admin@domain.com.\"\n- Rules Associated\
    \ with Firewalls: Rules specifying source/destination IP ranges, protocols, and ports.\n- Tagging Information:\
    \ Tags like \"Environment: Production\" or \"Owner: NetworkOps.\"\n\nThis data component can be collected through\
    \ the following measures:\n\nCloud Control Plane\n\n- Azure: Use Azure Activity Logs and Network Watcher to\
    \ collect metadata for Azure Firewall.\n    - Example: `az network firewall show --name <firewall-name>`\n-\
    \ AWS: Use AWS CloudTrail and describe commands: `aws ec2 describe-security-groups`\n- Google Cloud: Use gcloud\
    \ commands to extract metadata: `gcloud compute firewall-rules list --format=json`\n\nHost-Based Firewalls\n\
    \n- Windows: Use PowerShell to gather metadata: `Get-NetFirewallRule -PolicyStore PersistentStore`\n- Linux:\
    \ Query iptables or nftables rulesets: `iptables -S`\n- macOS: Use pfctl to extract metadata: `sudo pfctl -sr`\n\
    \nSIEM Integration\n\n- Collect logs from cloud platforms, host systems, and network appliances.\n\nAPI Monitoring\n\
    \n- Monitor API calls for metadata requests. Example (AWS): `Capture DescribeSecurityGroups or DescribeNetworkAcls`\
    \ calls via CloudTrail.\n\nEndpoint Detection and Response (EDR)\n\n- Use EDR solutions to monitor firewall\
    \ management tools for configuration changes or queries."
