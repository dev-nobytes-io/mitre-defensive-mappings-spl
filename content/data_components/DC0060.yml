curated:
  justification: >-
    7045 (System) and 4697 (Security) are among the highest-signal Windows events: PsExec, malicious drivers, persistence.
    On Linux the equivalent is a new systemd unit file (auditd watch) and on Kubernetes a new workload.
  requirements:
  - 4697 requires Audit Security System Extension; 7045 is always on.
  - 'Linux: -w /etc/systemd/system -p wa and /usr/lib/systemd/system.'
