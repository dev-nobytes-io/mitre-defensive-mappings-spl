id: DC0064
name: Command Execution
attack:
  url: https://attack.mitre.org/datacomponents/DC0064
  version: '2.2'
  modified: '2026-10-13'
  attack_release: '20.1'
  domains:
  - ics-attack
  - mobile-attack
  - enterprise-attack
  description: "Command Execution involves monitoring and capturing the execution of textual commands (including\
    \ shell commands, cmdlets, and scripts) within an operating system or application. These commands may include\
    \ arguments or parameters and are typically executed through interpreters such as `cmd.exe`, `bash`, `zsh`,\
    \ `PowerShell`, or programmatic execution. Examples: \n\n- Windows Command Prompt\n    - dir – Lists directory\
    \ contents.\n    - net user – Queries or manipulates user accounts.\n    - tasklist – Lists running processes.\n\
    - PowerShell\n    - Get-Process – Retrieves processes running on a system.\n    - Set-ExecutionPolicy – Changes\
    \ PowerShell script execution policies.\n    - Invoke-WebRequest – Downloads remote resources.\n- Linux Shell\n\
    \    - ls – Lists files in a directory.\n    - cat /etc/passwd – Reads the user accounts file.\n    - curl http://malicious-site.com\
    \ – Retrieves content from a malicious URL.\n- Container Environments\n    - docker exec – Executes a command\
    \ inside a running container.\n    - kubectl exec – Runs commands in Kubernetes pods.\n- macOS Terminal\n  \
    \  - open – Opens files or URLs.\n    - dscl . -list /Users – Lists all users on the system.\n    - osascript\
    \ -e – Executes AppleScript commands."
