curated:
  justification: >-
    Separates the command line from the process record: analytics here look at arguments, encoded payloads, interpreter
    switches and the operator's shell on devices and hypervisors. For Windows it is served by Sysmon EID 1 and 4688
    plus PowerShell 4103/4104; for PAN-OS and ESXi it is the config/system and shell logs; Linux needs auditd EXECVE
    records, which carry the full argv.
  requirements:
  - >-
    PowerShell Script Block Logging (4104) and Module Logging (4103) via GPO; add the PowerShell/Operational channel
    as an input.
  - >-
    auditd EXECVE records require the execve rule; argv is split across a0..aN unless ENRICHED or the TA reassembles
    it.
  - PAN-OS config logs need config-log forwarding enabled per device group or Panorama.
  overrides:
    event_codes: {}
    cim: null
    exclude_feeds: []
  notes: []
