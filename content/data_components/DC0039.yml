curated:
  justification: >-
    Dropped payloads, staged archives, web shells, LNK/startup persistence and ransomware notes are file creations.
    Sysmon EID 11 (plus 15 for ADS) is the workhorse; Solidcore Change Control adds integrity-monitored directories;
    4663 covers SACL-protected paths.
  requirements:
  - >-
    Sysmon FileCreate (EID 11) should be scoped to interesting paths and extensions in the config; FileCreateStreamHash
    (EID 15) for downloads with Zone.Identifier.
  - >-
    Solidcore file monitoring rules must list the directories; verify the field carrying FILE_CREATED in your ePO
    TA.
  - 'Linux: auditd watch rules (-w /path -p wa) or open/creat syscall rules on sensitive directories.'
  overrides:
    event_codes: {}
    cim: null
    exclude_feeds: []
