id: DC0074
name: Driver Metadata
attack:
  url: https://attack.mitre.org/datacomponents/DC0074
  version: '2.1'
  modified: '2026-05-12'
  attack_release: '20.1'
  domains:
  - enterprise-attack
  description: "to contextual data about a driver, including its attributes, functionality, and activity. This can\
    \ involve details such as the driver's origin, integrity, cryptographic signature, issues reported during its\
    \ use, and runtime behavior. Examples include metadata captured during driver integrity checks, hash validation,\
    \ or error reporting. Examples: \n\n- Driver Signature Validation: A driver is validated to ensure it is signed\
    \ by a trusted Certificate Authority (CA).\n- Driver Hash Verification: The hash of a driver is compared to\
    \ a known good hash stored in a database.\n- Driver Compatibility Issues: A driver error is logged due to compatibility\
    \ issues with a particular version of the operating system.\n- Vulnerable Driver Identification: Metadata indicates\
    \ the driver version is outdated or contains a known vulnerability.\n- Monitoring Driver Integrity: Drivers\
    \ are monitored for any unauthorized modifications to their binary or associated files.\n\nThis data component\
    \ can be collected through the following measures:\n\nWindows\n\n- Windows Event Logs:\n    - Event ID 3000-3006:\
    \ Logs metadata about driver signature validation.\n    - Event ID 2000-2011 (Windows Defender Application Control):\
    \ Tracks driver integrity and policy enforcement.\n- Sysmon Logs: Configure Sysmon to capture driver loading\
    \ metadata (Event ID 6).\n- Driver Verifier: Use Driver Verifier to collect diagnostic and performance data\
    \ about drivers, including stability and compatibility metrics.\n- PowerShell: Use commands to retrieve metadata\
    \ about installed drivers:\n`Get-WindowsDriver -Online | Select-Object Driver, ProviderName, Version`\n\nLinux\n\
    \n- Auditd: Configure audit rules to monitor driver interactions and collect metadata: `auditctl -w /lib/modules/\
    \ -p rwxa -k driver_metadata`\n- dmesg: Use `dmesg` to extract kernel logs with driver metadata: `dmesg | grep\
    \ \"module\"`\n- lsmod and modinfo: Commands to list loaded modules and retrieve metadata about drivers: `lsmod`\
    \ | `modinfo <module_name>`\n\nmacOS\n\n- Unified Logs: Collect metadata from system logs about kernel extensions\
    \ (kexts): `log show --predicate 'eventMessage contains \"kext load\"' --info`\n- kextstat: Command to retrieve\
    \ information about loaded kernel extensions: `kextstat`\n\nSIEM Tools\n\n- Ingest Driver Metadata: Collect\
    \ driver metadata logs from Sysmon, Auditd, or macOS logs into SIEMs like Splunk or Elastic.\n\nVulnerability\
    \ Management Tools\n\n- Use these tools to collect metadata about vulnerable drivers across enterprise systems."
