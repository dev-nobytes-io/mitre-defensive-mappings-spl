curated:
  justification: >-
    Protocol-level content: DNS names, HTTP URIs and user agents, TLS SNI and certificates, SMB file names, Kerberos
    tickets, SMTP. Corelight's protocol logs are the richest source; PAN-OS threat/URL logs add signature and category
    context; Sysmon EID 22 gives client-side DNS; Wireshark captures are for hunting.
  requirements:
  - >-
    Corelight log set: dns, http, ssl, x509, files, smtp, ftp, ssh, rdp, smb_files, dce_rpc, kerberos, ntlm, ldap,
    notice, weird.
  - >-
    PAN-OS URL filtering and Threat Prevention licenses are required for pan:threat url/vulnerability/virus subtypes;
    decryption logs need SSL decryption policies.
  - >-
    Sysmon DnsQuery (EID 22) is often disabled for volume; enable it with exclusions for noisy resolvers.
  overrides:
    event_codes: {}
    cim: null
    exclude_feeds: []
  notes: []
