  description: "Cloud storage access refers to the retrieval or interaction with data stored in cloud infrastructure.\
    \ This data component includes activities such as reading, downloading, or accessing files and objects within\
    \ cloud storage systems. Common examples include API calls like GetObject in AWS S3, which retrieves objects\
    \ from cloud buckets. Examples: \n\n- AWS S3 Access: An adversary uses the `GetObject` API to retrieve sensitive\
    \ data from an AWS S3 bucket.\n- Azure Blob Storage Access: A user accesses a blob in Azure Storage using `Get\
    \ Blob` or `Get Blob Properties`.\n- Google Cloud Storage Access: An adversary uses `storage.objects.get` to\
    \ download objects from - OpenStack Swift Storage Access: A user retrieves an object from OpenStack Swift using\
    \ the `GET` method."
