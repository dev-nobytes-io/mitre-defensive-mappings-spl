id: DC0103
name: Active DNS
attack:
  url: https://attack.mitre.org/datacomponents/DC0103
  version: '2.0'
  modified: '2025-10-21'
  attack_release: '20.1'
  domains:
  - enterprise-attack
  description: "\"Domain Name: Active DNS\" data component captures queried DNS registry data that highlights current\
    \ domain-to-IP address resolutions. This data includes both direct queries to DNS servers and records that provide\
    \ mappings between domain names and associated IP addresses. It serves as a critical resource for tracking active\
    \ infrastructure and understanding the network footprint of an organization or adversary. Examples: \n\n- DNS\
    \ Query Example: `nslookup example.com`, `dig example.com A`\n- PTR Record Example: `dig -x 192.168.1.1`\n-\
    \ Tracking Malicious Domains: DNS logs reveal repeated queries to suspicious domains like malicious-site.com.\
    \ The IPs resolved by these domains may be indicators of compromise (IOCs).\n- DNS Record Types\n    - A/AAAA\
    \ Record: Maps domain names to IP addresses (IPv4/IPv6).\n    - CNAME Record: Canonical name records, often\
    \ used for redirects.\n    - MX Record: Mail exchange records, used to route emails.\n    - TXT Record: Can\
    \ include security information like SPF or DKIM policies.\n    - SOA Record: Start of authority record for domain\
    \ management.\n    - NS Record: Lists authoritative name servers for the domain.\n\nThis data component can\
    \ be collected through the following measures:\n\n- System Utilities: Use built-in tools like `nslookup`, `dig`,\
    \ or host on Linux, macOS, and Windows to perform active DNS queries.\n- DNS Logging\n    - Windows DNS Server:\
    \ Enable DNS Analytical Logging to capture DNS queries and responses.\n    - Bind DNS: Enable query logging\
    \ in the named.conf file.\n- Cloud Provider DNS Logging\n    - AWS Route 53: Enable query logging through CloudWatch\
    \ or S3:\n    - Google Cloud DNS: Enable logging for Cloud DNS queries through Google Cloud Logging.\n- Network\
    \ Traffic Monitoring: Use tools like Wireshark or Zeek to analyze DNS queries within network traffic.\n- Security\
    \ Information and Event Management (SIEM) Integration: Aggregate DNS logs in a SIEM like Splunk to create alerts\
    \ and monitor patterns.\n- Public OSINT Tools: Use OSINT platforms like VirusTotal, or PassiveTotal to collect\
    \ information on domains and their associated IP addresses."
