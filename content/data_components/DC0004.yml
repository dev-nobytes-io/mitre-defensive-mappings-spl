id: DC0004
name: Firmware Modification
attack:
  url: https://attack.mitre.org/datacomponents/DC0004
  version: '2.0'
  modified: '2026-10-13'
  attack_release: '20.1'
  domains:
  - ics-attack
  - enterprise-attack
  description: "Changes made to firmware, which may include its settings, configurations, or underlying data. This\
    \ can encompass alterations to the Master Boot Record (MBR), Volume Boot Record (VBR), or other firmware components\
    \ critical to system boot and functionality. Such modifications are often indicators of adversary activity,\
    \ including malware persistence and system compromise. Examples: \n\n- Changes to Master Boot Record (MBR):\
    \ Modifying the MBR to load malicious code during the boot process.\n- Changes to Volume Boot Record (VBR):\
    \ Altering the VBR to redirect boot processes to malicious locations.\n- Firmware Configuration Changes: Modifying\
    \ BIOS/UEFI settings such as disabling Secure Boot.\n- Firmware Image Tampering: Updating firmware with a malicious\
    \ or unauthorized image.\n- Logs or Errors Indicating Firmware Changes: Logs showing unauthorized firmware updates\
    \ or checksum mismatches.\n\nThis data component can be collected through the following measures:\n\n- BIOS/UEFI\
    \ Logs: Enable and monitor BIOS/UEFI logs to capture settings changes or firmware updates.\n- Firmware Integrity\
    \ Monitoring: Use tools or firmware security features to detect changes to firmware components.\n- Endpoint\
    \ Detection and Response (EDR) Solutions: Many EDR platforms can detect abnormal firmware activity, such as\
    \ changes to MBR/VBR or unauthorized firmware updates.\n- File System Monitoring: Monitor changes to MBR/VBR-related\
    \ files using tools like Sysmon or auditd.\n    - Windows Example (Sysmon): Monitor Event ID 7 (Raw disk access).\n\
    \    - Linux Example (auditd): `auditctl -w /dev/sda -p wa -k firmware_modification`\n- Network Traffic Analysis:\
    \ Capture firmware updates downloaded over the network, particularly from untrusted sources. Use network monitoring\
    \ tools like Zeek or Wireshark to analyze firmware-related traffic.\n- Secure Boot Logs: Collect and analyze\
    \ Secure Boot logs for signs of tampering or unauthorized configurations. Example: Use PowerShell to retrieve\
    \ Secure Boot settings on Windows: `Confirm-SecureBootUEFI`\n- Vendor-Specific Firmware Tools: Many hardware\
    \ vendors provide tools for firmware integrity checks.Examples:\n    - Intel Platform Firmware Resilience (PFR).\n\
    \    - Lenovo UEFI diagnostics."
