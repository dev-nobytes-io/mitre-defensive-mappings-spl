curated:
  justification: >-
    Reads of credential stores, SSH keys, browser databases, ntds.dit and Kubernetes service-account tokens. Windows
    needs SACL-driven 4663 ReadData; Sysmon does not record reads, so it is excluded here; Linux needs auditd open/read
    watches; Solidcore READ_DENIED fires on protected files.
  requirements:
  - >-
    Deploy SACLs (or a Defender/EDR equivalent) on the specific files from mitre_sensitive_paths; broad object-access
    auditing is unusable.
  - 'Linux: -w /etc/shadow -p r style rules, and k8s audit at RequestResponse level for secrets.'
