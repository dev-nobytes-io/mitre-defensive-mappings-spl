# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1024
name: Analytic 1024
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0359#AN1024
  attack_release: '20.1'
  detection_strategy:
    id: DET0359
    name: Multi-hop Proxy Behavior via Relay Node Chaining, Onion Routing, and Network Tunneling
  technique:
    id: T1090.003
    name: Multi-hop Proxy
    tactics:
    - command-and-control
    usage_score: 65
  platforms:
  - Network Devices
  description: >-
    Encrypted traffic or ICMP tunneling from border routers to internal routers or unknown external IPs. Forwarded
    traffic shows consistent hop-to-hop relaying without matching configured VPN or expected network topology.
  log_source_references:
  - dc: DC0078
    dc_name: Network Traffic Flow
    name: NSM:Flow
    channel: Relayed session pathing (multi-hop)
  - dc: DC0085
    dc_name: Network Traffic Content
    name: NSM:Firewall
    channel: Outbound encrypted traffic
  - dc: DC0004
    dc_name: Firmware Modification
    name: networkdevice:syslog
    channel: Custom firmware or routing changes
  mutable_elements:
  - field: VPNConfigWhitelist
    description: Define allowed internal router communication paths.
  - field: ICMPPayloadEntropy
    description: High entropy ICMP payloads may indicate tunneling activity.
  - field: RelayChainSignature
    description: Track known multi-hop pattern signatures or port hopping techniques.
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: VPNConfigWhitelist
    bind: macro
    name: mitre_an1024_vpnconfigwhitelist
  - element: ICMPPayloadEntropy
    bind: macro
    name: mitre_an1024_icmppayloadentropy
  - element: RelayChainSignature
    bind: filter
    name: mitre_an1024_filter
curated:
  status: implemented
  title: Tor or other onion-routing traffic through the firewall
  content_type: ttp
  severity: high
  summary: >-
    Palo Alto traffic logs where App-ID identifies an onion-routing or multi-hop anonymity network (Tor, Tor2web,
    I2P, Freenet). Enterprise hosts have little reason to relay through these, and implants use them to hide C2.
  gaps: >-
    Tor over pluggable transports (obfs4, meek) may not be identified as tor by App-ID; router-to-router relaying
    and ICMP tunnelling between network devices are not covered.
  data_components:
  - DC0078
  feeds:
  - palo_alto
  tuning:
  - element: RelayChainSignature
    bind: macro
    name: mitre_an1024_apps
    default: app IN ("tor", "tor2web", "i2p", "freenet", "zeronet", "tor-*")
    note: Palo Alto App-ID names.
  - element: VPNConfigWhitelist
    bind: lookup
    name: mitre_allowlist_ips
    note: Research or threat-intel hosts allowed to use Tor (cidr column).
  spl: |-
    `mitre_dc0078_palo_alto` `mitre_st_palo_alto_traffic` `mitre_an1024_apps`
    | `mitre_normalize_pan`
    | lookup mitre_allowlist_ips cidr AS src OUTPUT reason AS allow_reason
    | where isnull(allow_reason)
    | stats count min(_time) as firstTime max(_time) as lastTime sum(bytes_out) as bytes_out sum(bytes_in) as bytes_in values(app) as app values(action) as action dc(dest) as distinct_destinations by src user
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1024_filter`
  risk:
    message: $src$ used an anonymity network ($app$) through the firewall
    objects:
    - field: src
      type: system
      score: 60
    - field: user
      type: user
      score: 40
  schedule: {}
  throttle:
    fields:
    - src
    period: 14400s
  false_positives:
  - Security research and threat-intelligence workstations; allow-list their addresses.
  baselines: []
  sigma:
    logsource:
      product: paloalto
      service: traffic
    detection:
      selection:
        app:
        - tor
        - tor2web
        - i2p
        - freenet
        - zeronet
      condition: selection
kql: null
esql: null
