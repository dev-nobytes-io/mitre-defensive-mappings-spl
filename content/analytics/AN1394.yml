# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1394
name: Analytic 1394
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0505#AN1394
  attack_release: '20.1'
  detection_strategy:
    id: DET0505
    name: Detection Strategy for Command Obfuscation
  technique:
    id: T1027.010
    name: Command Obfuscation
    tactics:
    - stealth
    usage_score: 112
  platforms:
  - Windows
  description: >-
    Detection of command-line activity exhibiting syntactic obfuscation patterns, such as excessive escape characters,
    base64 encoding, command concatenation, or outlier command length and entropy.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  mutable_elements:
  - field: CommandLineEntropyThreshold
    description: Used to flag base64 or token-heavy command-line strings
  - field: SuspiciousCharacterCount
    description: Escape character and symbol frequency in command-line strings
  - field: TimeWindow
    description: Window between command execution and follow-up child or file write behavior
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: CommandLineEntropyThreshold
    bind: macro
    name: mitre_an1394_commandlineentropythreshold
  - element: SuspiciousCharacterCount
    bind: macro
    name: mitre_an1394_suspiciouscharactercount
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: Command line with obfuscation markers
  content_type: anomaly
  severity: medium
  summary: >-
    Interpreter command lines (cmd, PowerShell, script hosts, mshta) that are unusually long, contain a long base64-like
    token, use many caret escapes or string concatenations, or use cmd environment variable substring expansion.
    Each marker is reported so the analyst can see why it fired.
  gaps: >-
    Shannon entropy is not computed (stock SPL has no entropy function; URL Toolbox ut_shannon can be added in the
    filter macro). Follow-on child or file activity within the TimeWindow is not correlated.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: CommandLineEntropyThreshold
    bind: macro
    name: mitre_an1394_length_threshold
    default: '2000'
    note: Command-line length used as a proxy for encoded payloads.
  - element: SuspiciousCharacterCount
    bind: macro
    name: mitre_an1394_symbol_threshold
    default: '6'
    note: Minimum number of caret escapes or quote-plus concatenations.
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where` Processes.process_name IN ("cmd.exe", "powershell.exe", "pwsh.exe", "wscript.exe", "cscript.exe", "mshta.exe")
        by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process
    | `drop_dm_object_name(Processes)`
    | eval cmd_length=len(process), caret_count=mvcount(split(process, "^"))-1, concat_count=max(mvcount(split(process, "'+'"))-1, mvcount(split(process, "\"+\""))-1)
    | eval has_b64_blob=if(match(process, "[A-Za-z0-9+/]{120,}={0,2}"), 1, 0), has_env_substring=if(match(process, "%[A-Za-z]+:~-?[0-9]+,-?[0-9]+%"), 1, 0)
    | where cmd_length >= `mitre_an1394_length_threshold` OR caret_count >= `mitre_an1394_symbol_threshold` OR concat_count >= `mitre_an1394_symbol_threshold` OR has_b64_blob=1 OR has_env_substring=1
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1394_filter`
  risk:
    message: Obfuscated command line on $dest$ run by $user$
    objects:
    - field: dest
      type: system
      score: 35
    - field: user
      type: user
      score: 35
    threat_objects:
    - field: process
      type: process
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    - process_name
    period: 3600s
  false_positives:
  - Management agents passing long encoded scripts; build systems generating long command lines.
  baselines: []
  sigma:
    note: >-
      Sigma expresses the base64-blob, caret and environment-substring markers by regex; the length and count thresholds
      are Splunk only.
    logsource:
      product: windows
      category: process_creation
    detection:
      image:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        - \cscript.exe
        - \mshta.exe
      b64:
        CommandLine|re: '[A-Za-z0-9+/]{120,}={0,2}'
      carets:
        CommandLine|re: (\^[^\^]{0,8}){6,}
      env_substring:
        CommandLine|re: '%[A-Za-z]+:~-?[0-9]+,-?[0-9]+%'
      condition: image and (b64 or carets or env_substring)
kql: null
esql: null
