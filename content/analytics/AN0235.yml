# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0235
name: Analytic 0235
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0085#AN0235
  attack_release: '20.1'
  detection_strategy:
    id: DET0085
    name: Credential Dumping from SAM via Registry Dump and Local File Access
  technique:
    id: T1003.002
    name: Security Account Manager
    tactics:
    - credential-access
    usage_score: 59
  platforms:
  - Windows
  description: >-
    An adversary running with SYSTEM-level privileges executes commands or accesses registry keys to dump the SAM
    hive or directly reads sensitive local files from the config directory. This behavior often involves sequential
    access to HKLM\SAM, HKLM\SYSTEM, and creation of .save or .dmp files, enabling offline hash extraction.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0063
    dc_name: Windows Registry Key Modification
    name: WinEventLog:Sysmon
    channel: EventCode=13, 14
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  - dc: DC0061
    dc_name: File Modification
    name: WinEventLog:Sysmon
    channel: EventCode=2
  mutable_elements:
  - field: CommandLinePattern
    description: >-
      Detectable variations include `reg save`, `reg.exe save`, or PowerShell equivalents for dumping SAM/SYSTEM
      hives.
  - field: TargetFilePath
    description: >-
      Defenders can tune based on dump file path patterns (e.g., `%TEMP%\sam.save`, `C:\Users\Public\*.dmp`).
  - field: RegistryPath
    description: Tune for HKLM\SAM, HKLM\SYSTEM or access via direct \Device\Harddisk paths.
  - field: TimeWindow
    description: Temporal gap between SAM and SYSTEM hive dumping can be tuned (e.g., 3 minutes).
  - field: ParentProcessName
    description: Useful for suppressing known-good access (e.g., backup tools).
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: CommandLinePattern
    bind: macro
    name: mitre_an0235_commandlinepattern
  - element: TargetFilePath
    bind: lookup
    name: mitre_sensitive_paths
  - element: RegistryPath
    bind: lookup
    name: mitre_sensitive_paths
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: ParentProcessName
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: SAM, SYSTEM or SECURITY hive dumped from the command line
  content_type: ttp
  severity: high
  summary: >-
    A process saves or exports the SAM, SYSTEM or SECURITY registry hive (reg save / reg export and PowerShell equivalents)
    or reads the hive files under System32\config directly, including through a shadow-copy path. Either gives offline
    access to local account hashes.
  gaps: >-
    Registry and file-creation legs of ATT&CK's chain (hive key access, .save/.dmp file creation) and the TimeWindow
    between SAM and SYSTEM dumps are not correlated; one command is enough to fire.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: RegistryPath
    bind: macro
    name: mitre_an0235_hives
    default: >-
      Processes.process IN ("*hklm\\sam *", "*hklm\\system *", "*hklm\\security *", "*hkey_local_machine\\sam *",
      "*hkey_local_machine\\system *", "*hkey_local_machine\\security *")
    note: Hive roots followed by a space, so sub-key exports by administrators do not match.
  - element: ParentProcessName
    bind: lookup
    name: mitre_allowlist_processes
    note: Backup tools that save hives (process_name column).
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where`
        ((Processes.process_name IN ("reg.exe", "powershell.exe", "pwsh.exe", "cmd.exe") Processes.process IN ("* save *", "* export *") `mitre_an0235_hives`)
          OR Processes.process IN ("*\\system32\\config\\sam*", "*\\system32\\config\\security*"))
        by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_process`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0235_filter`
  risk:
    message: Registry credential hive dumped by $process_name$ on $dest$
    objects:
    - field: dest
      type: system
      score: 70
    - field: user
      type: user
      score: 70
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 3600s
  false_positives:
  - System-state backup software and some imaging tools save these hives.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_cmd:
        CommandLine|contains:
        - ' save '
        - ' export '
      selection_hive:
        CommandLine|contains:
        - 'hklm\sam '
        - 'hklm\system '
        - 'hklm\security '
        - 'hkey_local_machine\sam '
        - 'hkey_local_machine\system '
        - 'hkey_local_machine\security '
      selection_file:
        CommandLine|contains:
        - \system32\config\sam
        - \system32\config\security
      condition: (selection_cmd and selection_hive) or selection_file
kql: null
esql: null
