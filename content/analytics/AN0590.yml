# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0590
name: Analytic 0590
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0210#AN0590
  attack_release: '20.1'
  detection_strategy:
    id: DET0210
    name: Abuse of Domain Accounts
  technique:
    id: T1078.002
    name: Domain Accounts
    tactics:
    - stealth
    - persistence
    - privilege-escalation
    - initial-access
    usage_score: 67
  platforms:
  - Windows
  description: >-
    Detection of suspicious logon behavior using valid domain accounts across multiple hosts, off-hours, or simultaneous
    sessions from geographically distant locations.
  log_source_references:
  - dc: DC0088
    dc_name: Logon Session Metadata
    name: WinEventLog:Security
    channel: EventCode=4624, 4625, 4768, 4769
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  mutable_elements:
  - field: TimeWindow
    description: Tune for detection of off-hours or abnormal logon spikes.
  - field: UserContext
    description: Scope to sensitive domain accounts (e.g., Domain Admins).
  - field: LogonType
    description: Distinguish between interactive, service, and network logons.
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
  - element: LogonType
    bind: filter
    name: mitre_an0590_filter
curated:
  status: implemented
  title: One domain account logging on to many hosts in an hour
  content_type: anomaly
  severity: medium
  summary: >-
    A user account (not a computer account) has network or remote-interactive logons (4624 types 3 and 10) on many
    distinct hosts within an hour: credential reuse across the estate after a domain account is compromised.
  gaps: >-
    Off-hours and geographic anomalies are not evaluated; service and scanner accounts must be allow-listed or this
    is noisy on day one.
  data_components:
  - DC0067
  feeds:
  - wineventlog
  tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_an0590_threshold
    default: '15'
    note: Distinct hosts per account per hour.
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
    note: Service, scanner and admin-automation accounts.
  - element: LogonType
    bind: filter
    name: mitre_an0590_filter
  spl: |-
    `mitre_dc0067_wineventlog` EventCode=4624 LogonType IN (3, 10) NOT TargetUserName="*$" NOT TargetUserName IN ("ANONYMOUS LOGON", "-")
    | `mitre_normalize_host`
    | eval user=TargetUserName, src=IpAddress
    | search `mitre_not_allowlisted_user`
    | bin _time span=1h
    | stats dc(dest) as distinct_hosts values(dest) as dest_list dc(src) as distinct_sources min(_time) as firstTime max(_time) as lastTime by user _time
    | where distinct_hosts >= `mitre_an0590_threshold`
    | eval dest_list=mvindex(dest_list, 0, 19)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0590_filter`
  risk:
    message: $user$ logged on to $distinct_hosts$ hosts in an hour
    objects:
    - field: user
      type: user
      score: 40
  schedule:
    cron: 13 * * * *
    earliest: -65m@m
    latest: -5m@m
  throttle:
    fields:
    - user
    period: 14400s
  false_positives:
  - >-
    Vulnerability scanners, software deployment and inventory accounts; administrators doing estate-wide work.
  baselines: []
  sigma:
    rules:
    - name: an0590_network_logon
      logsource:
        product: windows
        service: security
      detection:
        selection:
          EventID: 4624
          LogonType:
          - 3
          - 10
        machine:
          TargetUserName|endswith: $
        condition: selection and not machine
    correlation:
      type: value_count
      group-by:
      - TargetUserName
      timespan: 1h
      condition:
        field: Computer
        gte: 15
kql: null
esql: null
