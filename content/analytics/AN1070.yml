# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1070
name: Analytic 1070
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0380#AN1070
  attack_release: '20.1'
  detection_strategy:
    id: DET0380
    name: Detection of Local Data Collection Prior to Exfiltration
  technique:
    id: T1005
    name: Data from Local System
    tactics:
    - collection
    usage_score: 298
  platforms:
  - Windows
  description: >-
    Adversaries collecting local files via PowerShell, WMI, or direct file API calls often include recursive file
    listings, targeted file reads, and temporary file staging.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  mutable_elements:
  - field: TargetFilePathRegex
    description: Allows tuning for file extensions or paths of sensitive data (e.g., *.xls, *.db, *.pdf).
  - field: ParentProcessFilter
    description: >-
      Used to scope monitoring to suspicious parent/child process trees like PowerShell or WMI spawning file reads.
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: TargetFilePathRegex
    bind: lookup
    name: mitre_sensitive_paths
  - element: ParentProcessFilter
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Search for credential files or sensitive document types
  content_type: anomaly
  severity: medium
  summary: >-
    Commands that look for secrets or high-value files on the local system: findstr or Select-String for password
    strings; dir, where or Get-ChildItem for key, certificate, password-database and RDP files (kdbx, pfx, p12,
    pem, ppk, id_rsa, rdp, ovpn, unattend.xml).
  gaps: >-
    The follow-on file reads and staging writes are not correlated (AN0724 covers staging volume). Searches for
    ordinary document types are too common to score and are left to hunting.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: TargetFilePathRegex
    bind: macro
    name: mitre_an1070_patterns
    default: >-
      ((Processes.process_name IN ("findstr.exe", "cmd.exe") Processes.process="*findstr*" Processes.process IN
      ("*password*", "*passwd*", "*pwd=*", "*credential*", "*connectionstring*")) OR (Processes.process_name IN
      ("powershell.exe", "pwsh.exe") Processes.process="*select-string*" Processes.process IN ("*password*", "*credential*"))
      OR Processes.process IN ("*.kdbx*", "*.pfx*", "*.p12*", "*.pem*", "*.ppk*", "*id_rsa*", "*.ovpn*", "*unattend.xml*",
      "*sysprep.inf*", "*.rdp *") Processes.process IN ("*dir *", "*where *", "*get-childitem*", "*gci *", "*findstr*",
      "*/s*", "*-recurse*"))
  - element: ParentProcessFilter
    bind: lookup
    name: mitre_allowlist_users
    note: Allow-list accounts of backup and certificate-management tooling.
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where` `mitre_an1070_patterns`
        by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_user`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1070_filter`
  risk:
    message: Search for credential files or password strings on $dest$ by $user$
    objects:
    - field: dest
      type: system
      score: 40
    - field: user
      type: user
      score: 40
    threat_objects:
    - field: process
      type: process
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 3600s
  false_positives:
  - Certificate administration, developers grepping configuration for connection strings.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      findstr:
        CommandLine|contains|all:
        - findstr
        CommandLine|contains:
        - password
        - passwd
        - pwd=
        - credential
        - connectionstring
      select_string:
        CommandLine|contains|all:
        - Select-String
        CommandLine|contains:
        - password
        - credential
      secret_files:
        CommandLine|contains:
        - .kdbx
        - .pfx
        - .p12
        - .ppk
        - id_rsa
        - .ovpn
        - unattend.xml
        - sysprep.inf
      listing:
        CommandLine|contains:
        - 'dir '
        - 'where '
        - Get-ChildItem
        - 'gci '
        - /s
        - -Recurse
      condition: findstr or select_string or (secret_files and listing)
kql: null
esql: null
