# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1032
name: Analytic 1032
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0365#AN1032
  attack_release: '20.1'
  detection_strategy:
    id: DET0365
    name: Detect Registry and Startup Folder Persistence (Windows)
  technique:
    id: T1547.001
    name: Registry Run Keys / Startup Folder
    tactics:
    - persistence
    - privilege-escalation
    usage_score: 329
  platforms:
  - Windows
  description: >-
    Correlation of Registry key creation/modification events under known Run/Startup keys with new or unusual binary
    paths or script-based payloads. Multi-event detection includes registry modification followed by process execution
    from non-standard directories or abnormal parent-child process relationships.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0063
    dc_name: Windows Registry Key Modification
    name: WinEventLog:Sysmon
    channel: EventCode=13, 14
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Microsoft-Windows-Shell-Core
    channel: New startup folder shortcut or binary placed in Startup directory
  mutable_elements:
  - field: ImagePath
    description: >-
      Full path of the binary/script being registered in Run keys. Tunable to exclude known software baselines.
  - field: RegistryKeyPath
    description: >-
      Tunable list of startup-related registry keys to monitor more/less aggressively based on enterprise software
      context.
  - field: TimeWindow
    description: >-
      Correlate registry key creation and process execution within this window. Defaults between 5–10 minutes.
  - field: UserContext
    description: Filter for specific user SIDs or exclude known admin/script accounts.
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: ImagePath
    bind: lookup
    name: mitre_allowlist_processes
  - element: RegistryKeyPath
    bind: lookup
    name: mitre_sensitive_paths
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
curated:
  status: implemented
  title: Run key value pointing to a script or user-writable path
  content_type: anomaly
  severity: medium
  summary: >-
    A value is written under a Run, RunOnce, RunOnceEx, Policies\Explorer\Run or Startup shell-folder registry key
    and its data references a script interpreter or a binary in AppData, Users\Public, Temp or ProgramData.
  gaps: >-
    Startup-folder file drops and the follow-on process execution within the TimeWindow are not correlated. Much
    legitimate per-user software autostarts from AppData, so this is scored as an anomaly.
  data_components:
  - DC0063
  feeds:
  - sysmon
  tuning:
  - element: RegistryKeyPath
    bind: macro
    name: mitre_an1032_run_keys
    default: >-
      Registry.registry_path IN ("*\\currentversion\\run\\*", "*\\currentversion\\runonce\\*", "*\\currentversion\\runonceex\\*",
      "*\\currentversion\\policies\\explorer\\run\\*", "*\\explorer\\shell folders\\startup", "*\\explorer\\user
      shell folders\\startup")
  - element: ImagePath
    bind: macro
    name: mitre_an1032_suspicious_data
    default: >-
      Registry.registry_value_data IN ("*\\appdata\\*", "*\\users\\public\\*", "*\\temp\\*", "*\\programdata\\*",
      "*powershell*", "*pwsh*", "*cmd.exe*", "*cmd /c*", "*wscript*", "*cscript*", "*mshta*", "*rundll32*", "*regsvr32*",
      "*http://*", "*https://*")
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0063_dm` where `mitre_dc0063_dm_where` `mitre_an1032_run_keys` `mitre_an1032_suspicious_data`
        by Registry.dest Registry.user Registry.registry_path Registry.registry_value_name Registry.registry_value_data
    | `drop_dm_object_name(Registry)`
    | search `mitre_not_allowlisted_user`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1032_filter`
  risk:
    message: Autostart registry value set on $dest$ pointing to $registry_value_data$
    objects:
    - field: dest
      type: system
      score: 30
    - field: user
      type: user
      score: 30
    threat_objects:
    - field: registry_path
      type: registry_path
    - field: registry_value_data
      type: registry_value_text
  schedule: {}
  throttle:
    fields:
    - dest
    - registry_path
    period: 86400s
  false_positives:
  - Collaboration clients, updaters and other per-user software that autostart from AppData.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: registry_set
    detection:
      key:
        TargetObject|contains:
        - \CurrentVersion\Run\
        - \CurrentVersion\RunOnce\
        - \CurrentVersion\RunOnceEx\
        - \CurrentVersion\Policies\Explorer\Run\
      data:
        Details|contains:
        - \AppData\
        - \Users\Public\
        - \Temp\
        - \ProgramData\
        - powershell
        - cmd.exe
        - wscript
        - cscript
        - mshta
        - rundll32
        - regsvr32
        - http://
        - https://
      condition: key and data
kql: null
esql: null
