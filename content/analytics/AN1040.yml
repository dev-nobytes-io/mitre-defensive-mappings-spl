# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1040
name: Analytic 1040
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0370#AN1040
  attack_release: '20.1'
  detection_strategy:
    id: DET0370
    name: Recursive Enumeration of Files and Directories Across Privilege Contexts
  technique:
    id: T1083
    name: File and Directory Discovery
    tactics:
    - discovery
    usage_score: 447
  platforms:
  - Windows
  description: >-
    Execution of file enumeration commands (e.g., 'dir', 'tree') from non-standard processes or unusual user contexts,
    followed by recursive directory traversal or access to sensitive locations.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  mutable_elements:
  - field: CommandLineRegex
    description: Allows tuning based on tools/scripts used for enumeration (e.g., tree, dir /s /b)
  - field: UserContext
    description: Scoping for standard vs elevated or service accounts
  - field: TimeWindow
    description: Defines burst activity over short periods (e.g., >50 directory queries in 30s)
derived:
  coverage: live
  suggested_content_type: hunting
  suggested_tuning:
  - element: CommandLineRegex
    bind: macro
    name: mitre_an1040_commandlineregex
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: Recursive file and directory enumeration commands
  content_type: hunting
  severity: informational
  summary: >-
    Lists hosts and users running recursive listings (dir /s, tree /f, where /r, forfiles /s, Get-ChildItem -Recurse)
    in ten-minute buckets with the distinct commands seen.
  gaps: >-
    Access to sensitive locations after the listing and the File Creation leg ATT&CK mentions are not evaluated.
    No finding or risk is produced.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: CommandLineRegex
    bind: filter
    name: mitre_an1040_filter
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
  - element: TimeWindow
    bind: filter
    name: mitre_an1040_filter
    note: Bucket fixed at 10 minutes; add e.g. where distinct_commands >= 3 in the filter macro.
  spl: |-
    | tstats `mitre_summariesonly` count from `mitre_dc0032_dm` where `mitre_dc0032_dm_where`
        ((Processes.process_name="cmd.exe" Processes.process IN ("*dir */s*", "*dir/s*", "*tree */f*", "*tree/f*"))
          OR (Processes.process_name="tree.com")
          OR (Processes.process_name="where.exe" Processes.process="* /r *")
          OR (Processes.process_name="forfiles.exe" Processes.process="* /s*")
          OR (Processes.process_name IN ("powershell.exe", "pwsh.exe") Processes.process IN ("*get-childitem*-recurse*", "*gci *-recurse*", "*ls *-recurse*", "*dir *-recurse*")))
        by Processes.dest Processes.user Processes.parent_process_name Processes.process _time span=10m
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_user`
    | stats sum(count) as count dc(process) as distinct_commands values(process) as process values(parent_process_name) as parent_process_name by dest user _time
    | sort - distinct_commands
    | `mitre_an1040_filter`
  risk:
    message: ''
    objects: []
    threat_objects: []
  schedule: {}
  throttle: {}
  false_positives:
  - Administrators, build scripts and backup jobs.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    level: informational
    detection:
      cmd:
        Image|endswith: \cmd.exe
        CommandLine|contains:
        - dir /s
        - dir/s
        - tree /f
        - tree/f
      powershell:
        CommandLine|contains|all:
        - -Recurse
        CommandLine|contains:
        - Get-ChildItem
        - 'gci '
      tools:
        Image|endswith:
        - \tree.com
        - \forfiles.exe
      condition: cmd or powershell or tools
kql: null
esql: null
