# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1287
name: Analytic 1287
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0465#AN1287
  attack_release: '20.1'
  detection_strategy:
    id: DET0465
    name: Detection of Default Account Abuse Across Platforms
  technique:
    id: T1078.001
    name: Default Accounts
    tactics:
    - stealth
    - persistence
    - privilege-escalation
    - initial-access
    usage_score: 12
  platforms:
  - Network Devices
  description: >-
    Login activity from default admin credentials (e.g., 'admin', 'cisco') on routers, firewalls, and switches.
  log_source_references:
  - dc: DC0002
    dc_name: User Account Authentication
    name: networkdevice:syslog
    channel: authentication logs
  mutable_elements:
  - field: Username
    description: Default usernames vary by vendor; defenders should adapt logic to their specific appliance list.
  - field: InterfaceType
    description: Telnet and HTTP-based access to network devices should be blocked and monitored if enabled.
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: Username
    bind: lookup
    name: mitre_account_roles
  - element: InterfaceType
    bind: filter
    name: mitre_an1287_filter
curated:
  status: implemented
  title: Login to the firewall with a default account name
  content_type: anomaly
  severity: medium
  summary: >-
    A successful administrator login to a Palo Alto firewall (system log "logged in" or auth-success) using a vendor
    default account name such as admin. Named accounts should replace the default, so its use is either legacy practice
    or someone who knows the default.
  gaps: >-
    Whether the default password is still set cannot be seen from logs. Routers and switches need the netdev_syslog
    feed.
  data_components:
  - DC0002
  feeds:
  - palo_alto
  tuning:
  - element: Username
    bind: macro
    name: mitre_an1287_default_accounts
    default: user IN ("admin", "administrator", "root", "cisco", "panadmin", "netscreen", "manager")
  - element: InterfaceType
    bind: filter
    name: mitre_an1287_filter
  spl: |-
    `mitre_dc0002_palo_alto` `mitre_st_palo_alto_system`
    | `mitre_normalize_pan_system`
    | where (pan_subtype=="auth" AND pan_event_id=="auth-success") OR match(description, "(?i)logged in")
    | search `mitre_an1287_default_accounts`
    | stats count min(_time) as firstTime max(_time) as lastTime values(src) as src values(description) as description by dvc user
    | rename dvc as dest
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1287_filter`
  risk:
    message: Default account $user$ logged in to firewall $dest$
    objects:
    - field: dest
      type: system
      score: 30
    - field: user
      type: user
      score: 30
    threat_objects:
    - field: src
      type: ip_address
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 86400s
  false_positives:
  - >-
    Teams that still administer with the built-in admin account; rename or disable it rather than excluding it.
  baselines: []
  sigma:
    logsource:
      product: paloalto
      service: system
    detection:
      success:
        description|contains: logged in
      default_user:
        description|contains:
        - 'admin '
        - user 'admin'
        - administrator
        - '''root'''
      condition: success and default_user
kql: null
esql: null
