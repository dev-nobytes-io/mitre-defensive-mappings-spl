# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0516
name: Analytic 0516
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0183#AN0516
  attack_release: '20.1'
  detection_strategy:
    id: DET0183
    name: Detection Strategy for Lateral Tool Transfer across OS platforms
  technique:
    id: T1570
    name: Lateral Tool Transfer
    tactics:
    - lateral-movement
    usage_score: 83
  platforms:
  - Windows
  description: >-
    Correlate suspicious file transfers over SMB or Admin$ shares with process creation events (e.g., cmd.exe, powershell.exe,
    certutil.exe) that do not align with normal administrative behavior. Detect remote file writes followed by execution
    of transferred binaries.
  log_source_references:
  - dc: DC0102
    dc_name: Network Share Access
    name: WinEventLog:Security
    channel: EventCode=5140
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  mutable_elements:
  - field: TimeWindow
    description: Time period between file transfer and execution used to correlate events
  - field: UserContext
    description: Accounts allowed to perform legitimate administrative transfers
  - field: FilePathWhitelist
    description: Exclude known legitimate software update directories
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
  - element: FilePathWhitelist
    bind: lookup
    name: mitre_sensitive_paths
curated:
  status: implemented
  title: File written over SMB, then executed on the target
  content_type: ttp
  severity: high
  summary: >-
    A file arrives over SMB (Sysmon 11 with Image "System", which is how the kernel SMB server appears) in a staging
    location, and within ten minutes it runs on the same host, either directly as a process or as a script on an
    interpreter's command line. This is tool transfer followed by remote execution.
  gaps: >-
    Files dropped directly into C:\Windows (PsExec's service binary) are excluded for volume; AN1527 and AN1185
    catch those. Share access events (5140/5145) and the source host are not joined, so the remote side comes from
    AN1468 or Corelight smb_files.
  data_components:
  - DC0039
  - DC0032
  feeds:
  - sysmon
  tuning:
  - element: FilePathWhitelist
    bind: macro
    name: mitre_an0516_staging_paths
    default: >-
      ("*\\Windows\\Temp\\*", "*\\ProgramData\\*", "*\\Users\\Public\\*", "*\\PerfLogs\\*", "*\\Users\\*\\AppData\\Local\\Temp\\*")
    note: >-
      A parenthesised value list used with IN; software-distribution shares writing into these paths belong in the
      filter macro.
  - element: TimeWindow
    bind: macro
    name: mitre_an0516_window_seconds
    default: '600'
  - element: UserContext
    bind: filter
    name: mitre_an0516_filter
    note: The SMB write carries no user; exclude deployment targets or files here.
  spl: |-
    (`mitre_dc0039_sysmon` EventCode=11 Image="System" TargetFilename IN `mitre_an0516_staging_paths` TargetFilename IN ("*.exe", "*.dll", "*.ps1", "*.bat", "*.cmd", "*.vbs", "*.js", "*.hta", "*.scr"))
      OR (`mitre_dc0032_sysmon` EventCode=1 (Image IN `mitre_an0516_staging_paths` OR CommandLine IN `mitre_an0516_staging_paths`))
    | `mitre_normalize_host`
    | rex field=CommandLine "(?i)(?<cmd_path>[a-z]:\\\\[^\"]+?\.(ps1|bat|cmd|vbs|js|hta|dll))"
    | eval file_path=lower(case(EventCode==11, TargetFilename, isnotnull(cmd_path), cmd_path, true(), Image))
    | eval write_time=if(EventCode==11, _time, null()), exec_time=if(EventCode==1, _time, null()), process_name=if(EventCode==1, replace(Image, "^.*\\\\", ""), null())
    | stats min(write_time) as write_time min(exec_time) as exec_time values(process_name) as process_name values(eval(if(EventCode==1, CommandLine, null()))) as process values(eval(if(EventCode==1, ParentImage, null()))) as parent_process values(user) as user by dest file_path
    | where isnotnull(write_time) AND isnotnull(exec_time) AND exec_time >= write_time AND exec_time - write_time <= `mitre_an0516_window_seconds`
    | eval firstTime=write_time, lastTime=exec_time
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0516_filter`
  risk:
    message: $file_path$ arrived over SMB on $dest$ and was executed
    objects:
    - field: dest
      type: system
      score: 70
    threat_objects:
    - field: file_path
      type: file_path
  schedule:
    earliest: -75m@m
    latest: -5m@m
  throttle:
    fields:
    - dest
    - file_path
    period: 86400s
  false_positives:
  - >-
    Software deployment that copies installers to targets over SMB and runs them (SCCM, PDQ, GPO scripts).
  baselines: []
  sigma:
    note: >-
      Uses a temporal (unordered) correlation because the Splunk pySigma backend does not implement temporal_ordered;
      scripts run through an interpreter are joined only in the Splunk search.
    rules:
    - name: an0516_smb_write
      logsource:
        product: windows
        category: file_event
      detection:
        selection:
          Image: System
          TargetFilename|contains:
          - \Windows\Temp\
          - \ProgramData\
          - \Users\Public\
          - \PerfLogs\
          TargetFilename|endswith:
          - .exe
          - .dll
          - .ps1
          - .bat
          - .cmd
          - .vbs
          - .js
          - .hta
          - .scr
        condition: selection
    - name: an0516_staged_exec
      logsource:
        product: windows
        category: process_creation
      detection:
        selection:
          Image|contains:
          - \Windows\Temp\
          - \ProgramData\
          - \Users\Public\
          - \PerfLogs\
        condition: selection
    correlation:
      type: temporal
      aliases:
        file_path:
          an0516_smb_write: TargetFilename
          an0516_staged_exec: Image
      group-by:
      - Computer
      - file_path
      timespan: 10m
kql: null
esql: null
