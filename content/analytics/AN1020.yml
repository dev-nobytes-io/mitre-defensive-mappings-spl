# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1020
name: Analytic 1020
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0359#AN1020
  attack_release: '20.1'
  detection_strategy:
    id: DET0359
    name: Multi-hop Proxy Behavior via Relay Node Chaining, Onion Routing, and Network Tunneling
  technique:
    id: T1090.003
    name: Multi-hop Proxy
    tactics:
    - command-and-control
    usage_score: 65
  platforms:
  - Windows
  description: >-
    Suspicious processes (e.g., Tor clients, relays, unknown binaries) launch with sustained encrypted outbound
    traffic to known anonymity infrastructure (e.g., Tor, I2P), and may relay to additional internal systems via
    reverse proxying, ICMP tunneling, or socket forwarding.
  log_source_references:
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0078
    dc_name: Network Traffic Flow
    name: dns:query
    channel: Outbound resolution to hidden service domains (e.g., `.onion`)
  mutable_elements:
  - field: DomainCategory
    description: Can be tuned to `.onion`, I2P, or suspicious CDN domains.
  - field: ProcessParent
    description: Detect known-good vs. abnormal launching binaries (e.g., mshta spawning Tor).
  - field: ConnectionDuration
    description: Threshold for persistent connections over known relay ports (e.g., 9050).
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: DomainCategory
    bind: lookup
    name: mitre_allowlist_domains
  - element: ProcessParent
    bind: lookup
    name: mitre_allowlist_processes
  - element: ConnectionDuration
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: Tor or I2P client running on an endpoint
  content_type: ttp
  severity: medium
  summary: >-
    A Tor or I2P client process starts, a process connects to a local Tor SOCKS port (9050, 9150) or out to Tor
    relay ports (9001, 9030), or a host resolves an .onion or .i2p name. Anonymity networks on a managed endpoint
    are either policy violations or C2 hiding behind multi-hop relays.
  gaps: >-
    Pluggable transports (obfs4, meek, snowflake) use 443 and are only caught by the process leg; renamed Tor binaries
    need the OriginalFileName or hash. The network sensor view is AN1024.
  data_components:
  - DC0032
  - DC0082
  - DC0085
  feeds:
  - sysmon
  tuning:
  - element: ProcessParent
    bind: macro
    name: mitre_an1020_clients
    default: >-
      (Image IN ("*\\tor.exe", "*\\Tor Browser\\*", "*\\i2p.exe", "*\\i2psvc.exe", "*\\obfs4proxy.exe", "*\\snowflake-client.exe",
      "*\\lyrebird.exe") OR OriginalFileName IN ("tor.exe", "i2p.exe"))
  - element: ConnectionDuration
    bind: macro
    name: mitre_an1020_ports
    default: >-
      ((DestinationPort IN (9050, 9150, 4444, 7656) DestinationIp IN ("127.0.0.1", "::1")) OR DestinationPort IN
      (9001, 9030))
  - element: DomainCategory
    bind: lookup
    name: mitre_allowlist_processes
    note: Security research or threat-intelligence workstations allowed to use Tor.
  spl: |-
    (`mitre_dc0032_sysmon` EventCode=1 `mitre_an1020_clients`)
    OR (`mitre_dc0082_sysmon` EventCode=3 Initiated="true" `mitre_an1020_ports`)
    OR (`mitre_dc0085_sysmon` EventCode=22 QueryName IN ("*.onion", "*.i2p"))
    | `mitre_normalize_host`
    | eval process_name=lower(replace(Image, "^.*\\\\", "")), signal=case(EventCode==1, "client started: ".CommandLine, EventCode==3, "connection to ".DestinationIp.":".DestinationPort, EventCode==22, "lookup ".QueryName)
    | search `mitre_not_allowlisted_process`
    | stats count min(_time) as firstTime max(_time) as lastTime values(signal) as signal values(process_name) as process_name values(user) as user by dest
    | eval signal=mvindex(signal, 0, 9)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1020_filter`
  risk:
    message: Anonymity network client activity on $dest$ ($process_name$)
    objects:
    - field: dest
      type: system
      score: 50
    - field: user
      type: user
      score: 40
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    period: 86400s
  false_positives:
  - >-
    Sanctioned research use; other software that happens to use port 9001 outbound (check the process before allow-listing).
  baselines: []
  sigma:
    rules:
    - name: an1020_tor_client
      logsource:
        product: windows
        category: process_creation
      detection:
        selection:
          Image|endswith:
          - \tor.exe
          - \i2p.exe
          - \obfs4proxy.exe
          - \snowflake-client.exe
        condition: selection
    - name: an1020_tor_socks
      logsource:
        product: windows
        category: network_connection
      detection:
        selection:
          Initiated: 'true'
          DestinationIp:
          - 127.0.0.1
          - ::1
          DestinationPort:
          - 9050
          - 9150
        condition: selection
    - name: an1020_onion_lookup
      logsource:
        product: windows
        category: dns_query
      detection:
        selection:
          QueryName|endswith:
          - .onion
          - .i2p
        condition: selection
kql: null
esql: null
