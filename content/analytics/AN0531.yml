# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0531
name: Analytic 0531
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0186#AN0531
  attack_release: '20.1'
  detection_strategy:
    id: DET0186
    name: Automated File and API Collection Detection Across Platforms
  technique:
    id: T1119
    name: Automated Collection
    tactics:
    - collection
    usage_score: 106
  platforms:
  - Windows
  description: >-
    Automated execution of native utilities and scripts to discover, enumerate, and exfiltrate files and clipboard
    content. Focus is on detecting repeated file access, scripting engine use, and use of command-line utilities
    commonly leveraged by collection scripts.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  mutable_elements:
  - field: TimeWindow
    description: Defines the lookback period for identifying burst activity or patterns in process/file events.
  - field: SuspiciousFileExtensions
    description: Tunable list of file extensions associated with collection (e.g., .pdf, .docx).
  - field: ProcessCountThreshold
    description: The number of times a process executes before considered anomalous.
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: SuspiciousFileExtensions
    bind: lookup
    name: mitre_sensitive_paths
  - element: ProcessCountThreshold
    bind: macro
    name: mitre_an0531_processcountthreshold
curated:
  status: implemented
  title: Bulk copy of user documents into a staging location
  content_type: anomaly
  severity: medium
  summary: >-
    robocopy, xcopy or copy, or PowerShell Copy-Item / Get-ChildItem with document-type filters, copying from user
    profile folders (Documents, Desktop, Downloads, mail stores) into a staging location (Temp, Users\Public, ProgramData,
    PerfLogs, a mapped share) or recursively collecting document extensions.
  gaps: >-
    Clipboard collection and API-level file reads are not seen; the volume leg is AN0724 and archiving is AN0831.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: SuspiciousFileExtensions
    bind: macro
    name: mitre_an0531_patterns
    default: >-
      ((Processes.process_name IN ("robocopy.exe", "xcopy.exe", "cmd.exe") Processes.process IN ("*\\documents*",
      "*\\desktop*", "*\\downloads*", "*.pst*", "*.ost*") Processes.process IN ("*\\temp*", "*\\users\\public*",
      "*\\programdata*", "*\\perflogs*", "*\\\\*\\*$*")) OR (Processes.process_name IN ("powershell.exe", "pwsh.exe")
      Processes.process IN ("*copy-item*", "*get-childitem*") Processes.process IN ("*-include*", "*-filter*") Processes.process
      IN ("*.doc*", "*.xls*", "*.pdf*", "*.ppt*", "*.pst*", "*.kdbx*")))
  - element: ProcessCountThreshold
    bind: lookup
    name: mitre_allowlist_users
    note: Backup and migration accounts.
  - element: TimeWindow
    bind: filter
    name: mitre_an0531_filter
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where` `mitre_an0531_patterns`
        by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_user`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0531_filter`
  risk:
    message: Bulk document collection by $process_name$ on $dest$
    objects:
    - field: dest
      type: system
      score: 35
    - field: user
      type: user
      score: 35
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 3600s
  false_positives:
  - Profile migrations, backup scripts and users copying their own files to a share.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      copy_tool:
        Image|endswith:
        - \robocopy.exe
        - \xcopy.exe
        CommandLine|contains:
        - \Documents
        - \Desktop
        - \Downloads
        - .pst
      powershell:
        CommandLine|contains:
        - Copy-Item
        - Get-ChildItem
      doc_filter:
        CommandLine|contains:
        - .doc
        - .xls
        - .pdf
        - .ppt
        - .pst
        - .kdbx
      condition: copy_tool or (powershell and doc_filter)
kql: null
esql: null
