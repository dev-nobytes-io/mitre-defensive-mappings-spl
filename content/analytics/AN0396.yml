# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0396
name: Analytic 0396
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0141#AN0396
  attack_release: '20.1'
  detection_strategy:
    id: DET0141
    name: Detect Time-Based Evasion via Sleep, Timer Loops, and Delayed Execution
  technique:
    id: T1497.003
    name: Time Based Checks
    tactics:
    - stealth
    - discovery
    usage_score: 51
  platforms:
  - Windows
  description: >-
    Process creation involving suspicious delays (e.g., Sleep, ping -n loops, WaitForSingleObject), followed by
    sensitive system access or lateral movement behaviors.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0016
    dc_name: Module Load
    name: WinEventLog:Sysmon
    channel: EventCode=7
  mutable_elements:
  - field: SleepDurationThreshold
    description: Defines maximum allowable sleep duration in milliseconds before triggering anomaly detection.
  - field: TimeBetweenExecutionAndNextStage
    description: >-
      Temporal window between initial process and next stage (e.g., lateral movement or persistence), used to correlate
      dormant activity.
  - field: UserContext
    description: Whether the activity occurs in SYSTEM or user context may affect legitimacy scoring.
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: SleepDurationThreshold
    bind: macro
    name: mitre_time_window(1)
  - element: TimeBetweenExecutionAndNextStage
    bind: filter
    name: mitre_an0396_filter
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
curated:
  status: implemented
  title: Long sleep through ping, timeout or Start-Sleep on a command line
  content_type: anomaly
  severity: low
  summary: >-
    A command line that delays for a long time (ping -n N to loopback, timeout /t N, choice /t N, Start-Sleep N)
    above a threshold, launched by something other than an interactive shell. Payloads stall to outlast sandbox
    analysis windows and to separate stages in time.
  gaps: >-
    Sleeps inside a binary (Sleep, WaitForSingleObject, NtDelayExecution) are invisible; short ping-then-delete
    chains are AN0392's self-deletion leg.
  data_components:
  - DC0032
  feeds:
  - sysmon
  tuning:
  - element: SleepDurationThreshold
    bind: macro
    name: mitre_an0396_min_delay_seconds
    default: '60'
  - element: UserContext
    bind: macro
    name: mitre_an0396_interactive_parents
    default: ParentImage IN ("*\\explorer.exe", "*\\WindowsTerminal.exe", "*\\OpenConsole.exe", "*\\conhost.exe")
  - element: TimeBetweenExecutionAndNextStage
    bind: filter
    name: mitre_an0396_filter
  spl: |-
    `mitre_dc0032_sysmon` EventCode=1 CommandLine IN ("*ping*-n *", "*timeout*/t *", "*choice*/t *", "*Start-Sleep*", "*sleep -*") NOT `mitre_an0396_interactive_parents`
    | `mitre_normalize_host`
    | rex field=CommandLine "(?i)(?:ping[^|&]*\s-n\s+|timeout(?:\.exe)?\s+/t\s+|choice[^|&]*/t\s+|start-sleep\s+(?:-s(?:econds)?\s+)?|sleep\s+-s\s+)(?<delay>\d+)"
    | eval delay=tonumber(delay), process_name=lower(replace(Image, "^.*\\\\", "")), parent_process_name=lower(replace(ParentImage, "^.*\\\\", ""))
    | where delay >= `mitre_an0396_min_delay_seconds`
    | search `mitre_not_allowlisted_process`
    | stats count min(_time) as firstTime max(_time) as lastTime max(delay) as delay values(CommandLine) as process by dest user parent_process_name
    | eval process=mvindex(process, 0, 9)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0396_filter`
  risk:
    message: $parent_process_name$ on $dest$ slept $delay$ seconds from the command line
    objects:
    - field: dest
      type: system
      score: 20
    threat_objects:
    - field: parent_process_name
      type: parent_process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - parent_process_name
    period: 86400s
  false_positives:
  - Batch and installer scripts that wait for services or reboots; scheduled maintenance jobs.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      ping:
        Image|endswith: \ping.exe
        CommandLine|contains|all:
        - ' -n '
        - 127.0.0.1
      timeout:
        Image|endswith: \timeout.exe
        CommandLine|contains: /t
      sleep:
        CommandLine|contains: Start-Sleep
      interactive:
        ParentImage|endswith:
        - \explorer.exe
        - \WindowsTerminal.exe
      condition: (ping or timeout or sleep) and not interactive
kql: null
esql: null
