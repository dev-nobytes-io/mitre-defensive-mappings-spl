# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0427
name: Analytic 0427
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0149#AN0427
  attack_release: '20.1'
  detection_strategy:
    id: DET0149
    name: Detection of Exfiltration Over Unencrypted Non-C2 Protocol
  technique:
    id: T1048.003
    name: Exfiltration Over Unencrypted Non-C2 Protocol
    tactics:
    - exfiltration
    usage_score: 48
  platforms:
  - Network Devices
  description: >-
    Detects use of unencrypted protocols (e.g., TFTP, FTP, HTTP) to transfer configuration files, routing tables,
    or logs to untrusted IP addresses, especially using administrative commands like `copy run ftp:`.
  log_source_references:
  - dc: DC0064
    dc_name: Command Execution
    name: networkdevice:cli
    channel: CLI command logs
  - dc: DC0078
    dc_name: Network Traffic Flow
    name: networkdevice:syslog
    channel: flow records
  - dc: DC0085
    dc_name: Network Traffic Content
    name: NSM:Flow
    channel: PCAP inspection
  mutable_elements:
  - field: ProtocolCommandWatchlist
    description: Flag commands like `copy`, `archive tar`, or `upload` directed at external hosts.
  - field: DestinationIPBlocklist
    description: Define external IP ranges unauthorized to receive router/switch configs.
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: ProtocolCommandWatchlist
    bind: macro
    name: mitre_an0427_protocolcommandwatchlist
  - element: DestinationIPBlocklist
    bind: lookup
    name: mitre_internal_networks
curated:
  status: implemented
  title: Large cleartext upload to an external host
  content_type: anomaly
  severity: medium
  summary: >-
    One internal host sends a large volume to external hosts within an hour over cleartext protocols (HTTP, FTP,
    FTP data, TFTP), seen in Corelight conn.log. Exfiltration over unencrypted protocols that are not the C2 channel.
  gaps: >-
    Device-side copy commands (copy run ftp:) need network-device CLI logs; encrypted channels are covered by AN0988-style
    analytics, not here.
  data_components:
  - DC0078
  feeds:
  - corelight
  tuning:
  - element: ProtocolCommandWatchlist
    bind: macro
    name: mitre_an0427_cleartext
    default: service IN ("http", "ftp", "ftp-data", "tftp")
  - element: DestinationIPBlocklist
    bind: macro
    name: mitre_an0427_bytes_threshold
    default: '104857600'
    note: Bytes sent per source per hour (100 MB).
  spl: |-
    `mitre_dc0078_corelight` `mitre_st_corelight_conn`
    | `mitre_normalize_zeek`
    | search `mitre_an0427_cleartext`
    | where NOT `mitre_is_internal(dest)` AND `mitre_is_internal(src)`
    | lookup mitre_allowlist_ips cidr AS src OUTPUT reason AS allow_reason
    | where isnull(allow_reason)
    | stats sum(bytes_out) as bytes_out sum(bytes_in) as bytes_in dc(dest) as distinct_destinations values(service) as service min(_time) as firstTime max(_time) as lastTime by src
    | where bytes_out >= `mitre_an0427_bytes_threshold`
    | eval mb_out=round(bytes_out / 1048576, 1)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0427_filter`
  risk:
    message: $src$ uploaded $mb_out$ MB to external hosts over cleartext protocols
    objects:
    - field: src
      type: system
      score: 40
  schedule:
    cron: 29 * * * *
    earliest: -65m@m
    latest: -5m@m
  throttle:
    fields:
    - src
    period: 14400s
  false_positives:
  - Backup or log shipping to an external service over HTTP; software update mirrors.
  baselines: []
  sigma:
    not_expressible: >-
      The condition is a byte sum per source over an hour, which is a Splunk aggregation; Sigma has no sum correlation.
kql: null
esql: null
