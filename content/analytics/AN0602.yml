# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0602
name: Analytic 0602
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0215#AN0602
  attack_release: '20.1'
  detection_strategy:
    id: DET0215
    name: Detection of Multi-Platform File Encryption for Impact
  technique:
    id: T1486
    name: Data Encrypted for Impact
    tactics:
    - impact
    usage_score: 111
  platforms:
  - Windows
  description: >-
    High-frequency file write operations using uncommon extensions, followed by ransom note creation, registry tampering,
    or shadow copy deletion. Often uses CLI tools like vssadmin, wbadmin, cipher, or PowerShell.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  - dc: DC0061
    dc_name: File Modification
    name: WinEventLog:Sysmon
    channel: EventCode=2
  mutable_elements:
  - field: FileExtension
    description: Non-standard or randomly generated file extensions may indicate encrypted content.
  - field: TargetFolder
    description: Focus on user document folders, network shares, or system paths like %System32%.
  - field: TimeWindow
    description: Correlate rapid writes and renames within seconds across high file count.
  - field: CommandLine
    description: Flag common ransomware tools or functions (vssadmin delete shadows /all /quiet).
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: FileExtension
    bind: lookup
    name: mitre_sensitive_paths
  - element: TargetFolder
    bind: lookup
    name: mitre_sensitive_paths
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: CommandLine
    bind: macro
    name: mitre_an0602_commandline
curated:
  status: implemented
  title: Ransom-note style file dropped across many directories
  content_type: ttp
  severity: critical
  summary: >-
    One process creates files with ransom-note style names (README, DECRYPT, RECOVER, RESTORE, HOW_TO, HELP, RANSOM)
    in many distinct directories within five minutes. Ransomware writes its note into every folder it encrypts.
  gaps: >-
    High-frequency renames to new extensions and file-time changes (Sysmon 2) are not counted, and the shadow-copy
    deletion leg is AN0933. Requires Sysmon FileCreate rules that include .txt/.hta/.html in user and share paths;
    many reduced configs exclude them.
  data_components:
  - DC0039
  feeds:
  - sysmon
  tuning:
  - element: FileExtension
    bind: macro
    name: mitre_an0602_note_names
    default: >-
      TargetFilename IN ("*README*.txt", "*READ_ME*", "*DECRYPT*", "*RECOVER*", "*RESTORE*FILES*", "*HOW_TO*", "*HOW
      TO*", "*HELP_*", "*RANSOM*", "*!!!*.txt", "*.hta")
  - element: TimeWindow
    bind: macro
    name: mitre_an0602_dir_threshold
    default: '10'
    note: Distinct directories receiving a note from one process per 5-minute bucket.
  spl: |-
    `mitre_dc0039_sysmon` EventCode=11 `mitre_an0602_note_names`
    | `mitre_normalize_host`
    | eval directory=replace(TargetFilename, "\\\\[^\\\\]+$", ""), process_name=replace(Image, "^.*\\\\", "")
    | bin _time span=5m
    | stats count min(_time) as firstTime max(_time) as lastTime dc(directory) as directory_count values(TargetFilename) as file_path by dest user process_name _time
    | where directory_count >= `mitre_an0602_dir_threshold`
    | eval file_path=mvindex(file_path, 0, 9)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0602_filter`
  risk:
    message: $process_name$ dropped ransom-note style files in $directory_count$ directories on $dest$
    objects:
    - field: dest
      type: system
      score: 90
    - field: user
      type: user
      score: 70
    threat_objects:
    - field: process_name
      type: process_name
  schedule:
    cron: '*/5 * * * *'
    earliest: -11m@m
    latest: -1m@m
  throttle:
    fields:
    - dest
    - process_name
    period: 3600s
  false_positives:
  - >-
    Source-code checkouts and installers that write a README into many folders; exclude the process in the filter
    macro.
  baselines: []
  sigma:
    rules:
    - name: an0602_note_file
      logsource:
        product: windows
        category: file_event
      detection:
        selection:
          TargetFilename|contains:
          - README
          - READ_ME
          - DECRYPT
          - RECOVER
          - HOW_TO
          - HOW TO
          - HELP_
          - RANSOM
        condition: selection
    correlation:
      type: event_count
      group-by:
      - Computer
      - Image
      timespan: 5m
      condition:
        gte: 10
kql: null
esql: null
