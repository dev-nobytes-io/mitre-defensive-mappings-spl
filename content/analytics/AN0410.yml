# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0410
name: Analytic 0410
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0145#AN0410
  attack_release: '20.1'
  detection_strategy:
    id: DET0145
    name: Detection of Disabled or Modified System Firewalls across OS Platforms.
  technique:
    id: T1686
    name: Disable or Modify System Firewall
    tactics:
    - defense-impairment
    usage_score: 45
  platforms:
  - Network Devices
  description: >-
    Detection of firewall ACL or rule base changes through CLI (e.g., no access-list, permit any any). Monitor configuration
    commits from unusual users or sessions.
  log_source_references:
  - dc: DC0051
    dc_name: Firewall Rule Modification
    name: networkdevice:cli
    channel: firewall disable commands or suspicious ACL modifications
  mutable_elements:
  - field: AuthorizedAdmins
    description: List of approved admin accounts allowed to modify firewall ACLs.
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: AuthorizedAdmins
    bind: lookup
    name: mitre_account_roles
curated:
  status: implemented
  title: Security rules deleted or default rules changed on the firewall
  content_type: anomaly
  severity: medium
  summary: >-
    A Palo Alto configuration change deletes, moves or renames security policy rules, or edits the default intrazone
    and interzone rules, by an administrator outside the allow-list. These are the changes that quietly widen what
    the firewall permits.
  gaps: >-
    Whether an edited rule became more permissive (any/any allow, disabled) cannot be seen, because the current
    add-on drops the change detail fields. Routers and switches need the netdev_syslog feed.
  data_components:
  - DC0051
  feeds:
  - palo_alto
  tuning:
  - element: AuthorizedAdmins
    bind: lookup
    name: mitre_allowlist_users
    note: Firewall change administrators.
  spl: |-
    `mitre_dc0051_palo_alto` `mitre_st_palo_alto_config` path="*rulebase*security*"
        (cmd IN ("delete", "move", "rename") OR path IN ("*intrazone-default*", "*interzone-default*", "*default-security-rules*"))
    | `mitre_normalize_pan`
    | eval dest=coalesce(dvc_name, dest, host), config_path=path
    | search `mitre_not_allowlisted_user`
    | stats count min(_time) as firstTime max(_time) as lastTime values(cmd) as config_action values(config_path) as config_path values(client) as client by dest user
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0410_filter`
  risk:
    message: Security rules removed or default rules changed on firewall $dest$ by $user$
    objects:
    - field: dest
      type: system
      score: 40
    - field: user
      type: user
      score: 40
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 3600s
  false_positives:
  - Rule-base clean-ups and reordering during change windows.
  baselines: []
  sigma:
    logsource:
      product: paloalto
      service: config
    detection:
      selection:
        path|contains|all:
        - rulebase
        - security
      structural:
        cmd:
        - delete
        - move
        - rename
      defaults:
        path|contains:
        - intrazone-default
        - interzone-default
        - default-security-rules
      condition: selection and (structural or defaults)
kql: null
esql: null
