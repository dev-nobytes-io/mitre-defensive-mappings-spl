# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0363
name: Analytic 0363
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0129#AN0363
  attack_release: '20.1'
  detection_strategy:
    id: DET0129
    name: Domain Account Enumeration Across Platforms
  technique:
    id: T1087.002
    name: Domain Account
    tactics:
    - discovery
    usage_score: 96
  platforms:
  - Windows
  description: >-
    Adversary enumeration of domain accounts using net.exe, PowerShell, WMI, or LDAP queries from non-domain controllers
    or non-admin endpoints.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0064
    dc_name: Command Execution
    name: WinEventLog:PowerShell
    channel: EventCode=4103, 4104, 4105, 4106
  - dc: DC0085
    dc_name: Network Traffic Content
    name: NSM:Flow
    channel: LDAP Bind/Search
  mutable_elements:
  - field: CommandLinePattern
    description: Detect variations of 'net user /domain', 'Get-ADUser', 'Get-ADGroupMember'.
  - field: TimeWindow
    description: Tune detection for bursts of enumeration commands or search queries.
  - field: SourceHost
    description: Restrict detection to non-DC or non-admin systems where such commands are unexpected.
derived:
  coverage: live
  suggested_content_type: hunting
  suggested_tuning:
  - element: CommandLinePattern
    bind: macro
    name: mitre_an0363_commandlinepattern
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: SourceHost
    bind: lookup
    name: mitre_allowlist_domains
curated:
  status: implemented
  title: Domain account enumeration from a non-domain-controller
  content_type: anomaly
  severity: low
  summary: >-
    net user/group/accounts with /domain, dsquery, adfind, ldifde or csvde is run, or PowerShell executes Get-ADUser,
    Get-ADGroupMember, PowerView account cmdlets or a DirectorySearcher user filter (seen in the process command
    line or in a 4104 script block), on a host that is not listed as a domain controller in mitre_asset_roles.
  gaps: >-
    LDAP bind and search volume seen by Corelight (ldap_search.log) is not correlated; the TimeWindow burst condition
    is left to the filter macro.
  data_components:
  - DC0032
  - DC0064
  feeds:
  - sysmon
  - powershell_logging
  tuning:
  - element: CommandLinePattern
    bind: macro
    name: mitre_an0363_commands
    default: >-
      ((Image IN ("*\\net.exe", "*\\net1.exe") CommandLine IN ("* user* /do*", "* group* /do*", "* accounts* /do*"))
      OR Image IN ("*\\dsquery.exe", "*\\adfind.exe", "*\\ldifde.exe", "*\\csvde.exe") OR CommandLine IN ("*Get-ADUser*",
      "*Get-ADGroupMember*", "*Get-DomainUser*", "*Get-NetUser*", "*samaccounttype=805306368*"))
  - element: SourceHost
    bind: lookup
    name: mitre_asset_roles
    note: Rows with role=domain_controller are excluded through the shared macro mitre_hosts_with_role(1).
  - element: TimeWindow
    bind: filter
    name: mitre_an0363_filter
  spl: |-
    (`mitre_dc0032_sysmon` EventCode=1 `mitre_an0363_commands`)
      OR (`mitre_dc0064_powershell_logging` EventCode=4104 ScriptBlockText IN ("*Get-ADUser*", "*Get-ADGroupMember*", "*Get-DomainUser*", "*Get-NetUser*", "*Get-DomainGroupMember*", "*samaccounttype=805306368*"))
    | `mitre_normalize_host`
    | search NOT `mitre_hosts_with_role(domain_controller)`
    | eval command=coalesce(CommandLine, substr(ScriptBlockText, 1, 500)), source=if(EventCode==4104, "script_block", "process")
    | stats count min(_time) as firstTime max(_time) as lastTime values(source) as source values(command) as command by dest user
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0363_filter`
  risk:
    message: Domain account enumeration on $dest$ by $user$
    objects:
    - field: dest
      type: system
      score: 25
    - field: user
      type: user
      score: 25
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 14400s
  false_positives:
  - Identity administrators, help desk and HR or provisioning scripts.
  baselines: []
  sigma:
    rules:
    - name: an0363_process
      logsource:
        product: windows
        category: process_creation
      detection:
        net:
          Image|endswith:
          - \net.exe
          - \net1.exe
          CommandLine|contains:
          - ' user'
          - ' group'
          - ' accounts'
          CommandLine|contains|all:
          - ' /do'
        tools:
          Image|endswith:
          - \dsquery.exe
          - \adfind.exe
          - \ldifde.exe
          - \csvde.exe
        cmdlets:
          CommandLine|contains:
          - Get-ADUser
          - Get-ADGroupMember
          - Get-DomainUser
          - Get-NetUser
        condition: net or tools or cmdlets
    - name: an0363_script_block
      logsource:
        product: windows
        category: ps_script
      detection:
        selection:
          ScriptBlockText|contains:
          - Get-ADUser
          - Get-ADGroupMember
          - Get-DomainUser
          - Get-NetUser
          - Get-DomainGroupMember
        condition: selection
kql: null
esql: null
