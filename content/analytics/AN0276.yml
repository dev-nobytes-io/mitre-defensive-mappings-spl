# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0276
name: Analytic 0276
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0099#AN0276
  attack_release: '20.1'
  detection_strategy:
    id: DET0099
    name: 'Detection Strategy for T1542.001 Pre-OS Boot: System Firmware'
  technique:
    id: T1542.001
    name: System Firmware
    tactics:
    - stealth
    - persistence
    usage_score: 3
  platforms:
  - Network Devices
  description: >-
    Unauthorized firmware uploads to routers, switches, or firewalls via TFTP/FTP/SCP. Logs showing boot variable
    or startup image path changes redirecting to non-standard firmware images. Abnormal reboots or firmware rollback
    attempts following configuration modification events.
  log_source_references:
  - dc: DC0004
    dc_name: Firmware Modification
    name: networkdevice:config
    channel: Boot image path or firmware configuration variable modified outside of maintenance windows
  - dc: DC0046
    dc_name: Drive Modification
    name: networkdevice:runtime
    channel: Firmware image uploaded via TFTP/FTP/SCP
  mutable_elements:
  - field: ApprovedFirmwareHashes
    description: Known good firmware image hashes stored for validation.
  - field: MaintenanceWindows
    description: Expected time periods when firmware uploads or reboots are considered normal.
  - field: SourceIPWhitelist
    description: List of trusted management IPs allowed to initiate firmware uploads.
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: ApprovedFirmwareHashes
    bind: filter
    name: mitre_an0276_filter
  - element: MaintenanceWindows
    bind: macro
    name: mitre_time_window(1)
  - element: SourceIPWhitelist
    bind: lookup
    name: mitre_internal_networks
curated:
  status: implemented
  title: PAN-OS software installed, upgraded or downgraded
  content_type: anomaly
  severity: medium
  summary: >-
    A Palo Alto system log records a PAN-OS software image being installed, upgraded, downgraded or a boot image
    changed. Firmware changes outside a planned upgrade are how network-device implants persist.
  gaps: >-
    Image hashes (ApprovedFirmwareHashes) and the uploading source are not in the system log; dynamic content updates
    (apps, threats, antivirus) are excluded. Routers and switches need the netdev_syslog feed.
  data_components:
  - DC0004
  feeds:
  - palo_alto
  tuning:
  - element: MaintenanceWindows
    bind: filter
    name: mitre_an0276_filter
  - element: SourceIPWhitelist
    bind: macro
    name: mitre_an0276_patterns
    default: >-
      (description IN ("*software*install*", "*panos*install*", "*pan-os*install*", "*upgrade*", "*downgrade*",
      "*boot image*", "*software image*") NOT description IN ("*content*", "*antivirus*", "*wildfire*", "*threat*",
      "*app*"))
  - element: ApprovedFirmwareHashes
    bind: filter
    name: mitre_an0276_filter
  spl: |-
    `mitre_dc0004_palo_alto` `mitre_st_palo_alto_system` `mitre_an0276_patterns`
    | `mitre_normalize_pan_system`
    | stats count min(_time) as firstTime max(_time) as lastTime values(description) as description values(user) as user by dvc
    | rename dvc as dest
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0276_filter`
  risk:
    message: PAN-OS software change on firewall $dest$
    objects:
    - field: dest
      type: system
      score: 30
  schedule: {}
  throttle:
    fields:
    - dest
    period: 86400s
  false_positives:
  - Planned PAN-OS upgrades.
  baselines: []
  sigma:
    logsource:
      product: paloalto
      service: system
    detection:
      selection:
        description|contains:
        - software install
        - upgrade
        - downgrade
        - boot image
      content:
        description|contains:
        - content
        - antivirus
        - wildfire
        - threat
      condition: selection and not content
kql: null
esql: null
