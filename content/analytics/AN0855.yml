# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0855
name: Analytic 0855
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0306#AN0855
  attack_release: '20.1'
  detection_strategy:
    id: DET0306
    name: Detection of Unauthorized Network Firewall Rule Modification
  technique:
    id: T1686.002
    name: Network Device Firewall
    tactics:
    - defense-impairment
    usage_score: 8
  platforms:
  - Network Devices
  description: >-
    Defender observes configuration changes on firewall/network appliance involving rule creation, modification,
    or deletion from abnormal management IPs or non-console channels (e.g., remote CLI, API). These are often correlated
    with a spike in previously blocked outbound traffic, unexpected allow-all rules, or bulk rule deletions. Behavior
    often follows unauthorized login, privilege escalation, or API abuse.
  log_source_references:
  - dc: DC0051
    dc_name: Firewall Rule Modification
    name: networkdevice:Firewall
    channel: 'update_rule: Access control or NAT rule modified or disabled outside maintenance window'
  - dc: DC0067
    dc_name: Logon Session Creation
    name: networkdevice:Firewall
    channel: Login from untrusted IP, or new admin account accessing firewall console/API
  - dc: DC0064
    dc_name: Command Execution
    name: networkdevice:Firewall
    channel: Audit trail or CLI/API access indicating commands like no access-list, delete rule-set, clear config
  - dc: DC0082
    dc_name: Network Connection Creation
    name: NSM:Flow
    channel: Outbound traffic spike through formerly blocked ports/subnets following config change
  mutable_elements:
  - field: TrustedAdminIPs
    description: Allowlisted IPs/subnets where administrative access is expected (e.g., jump box, VPN mgmt)
  - field: ConfigChangeWindow
    description: Expected maintenance window (e.g., 02:00–04:00 UTC) to filter benign changes
  - field: RuleScopeThreshold
    description: Number of rules affected or port ranges modified to determine severity
  - field: NewUserPrivilegeThreshold
    description: Flag new users making changes without observed privilege elevation path
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: TrustedAdminIPs
    bind: lookup
    name: mitre_account_roles
  - element: ConfigChangeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: RuleScopeThreshold
    bind: macro
    name: mitre_an0855_rulescopethreshold
  - element: NewUserPrivilegeThreshold
    bind: macro
    name: mitre_an0855_newuserprivilegethreshold
curated:
  status: implemented
  title: Bulk or API-driven security and NAT rule changes on the firewall
  content_type: anomaly
  severity: medium
  summary: >-
    An administrator changes many security or NAT rules on a Palo Alto firewall within ten minutes, or changes them
    through the XML or REST API rather than the web UI or CLI. ATT&CK calls out bulk rule changes and non-console
    channels as the signs of rule tampering.
  gaps: >-
    The outbound-traffic spike through newly allowed ports is not correlated; rule content is not visible with the
    current add-on.
  data_components:
  - DC0051
  feeds:
  - palo_alto
  tuning:
  - element: RuleScopeThreshold
    bind: macro
    name: mitre_an0855_threshold
    default: '10'
    note: Rule changes per administrator per firewall per 10 minutes.
  - element: TrustedAdminIPs
    bind: lookup
    name: mitre_allowlist_users
    note: Automation accounts that manage rules through the API.
  - element: ConfigChangeWindow
    bind: filter
    name: mitre_an0855_filter
  spl: |-
    `mitre_dc0051_palo_alto` `mitre_st_palo_alto_config` path IN ("*rulebase*security*", "*rulebase*nat*")
    | `mitre_normalize_pan`
    | eval dest=coalesce(dvc_name, dest, host), api=if(match(client, "(?i)api|xml|rest"), 1, 0)
    | search `mitre_not_allowlisted_user`
    | bin _time span=10m
    | stats count as rule_changes max(api) as via_api min(_time) as firstTime max(_time) as lastTime values(cmd) as config_action values(client) as client by dest user _time
    | where rule_changes >= `mitre_an0855_threshold` OR via_api=1
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0855_filter`
  risk:
    message: $rule_changes$ rule changes on firewall $dest$ by $user$ (API $via_api$)
    objects:
    - field: dest
      type: system
      score: 35
    - field: user
      type: user
      score: 35
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 3600s
  false_positives:
  - >-
    Automation (Terraform, Ansible, Panorama) that changes rules through the API; allow-list its service account.
  baselines: []
  sigma:
    logsource:
      product: paloalto
      service: config
    detection:
      rules:
        path|contains:
        - rulebase
      api:
        client|contains:
        - API
        - XML
        - REST
      condition: rules and api
kql: null
esql: null
