# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1094
name: Analytic 1094
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0388#AN1094
  attack_release: '20.1'
  detection_strategy:
    id: DET0388
    name: Detection Strategy for T1548.002 – Bypass User Account Control (UAC)
  technique:
    id: T1548.002
    name: Bypass User Account Control
    tactics:
    - privilege-escalation
    usage_score: 76
  platforms:
  - Windows
  description: >-
    Detects a multi-event behavior chain involving UAC bypass attempts via known auto-elevated binaries (e.g., eventvwr.exe,
    sdclt.exe), unauthorized Registry changes to UAC-related keys, and anomalous process execution with elevated
    privileges but lacking standard parent-child lineage. Suspicious patterns include invocation of auto-elevated
    COM objects or manipulation of isolatedCommand Registry entries without consent prompts.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0088
    dc_name: Logon Session Metadata
    name: WinEventLog:Security
    channel: EventCode=4672
  - dc: DC0063
    dc_name: Windows Registry Key Modification
    name: WinEventLog:Sysmon
    channel: EventCode=13, 14
  - dc: DC0035
    dc_name: Process Access
    name: WinEventLog:Sysmon
    channel: EventCode=10
  - dc: DC0016
    dc_name: Module Load
    name: WinEventLog:Sysmon
    channel: EventCode=7
  mutable_elements:
  - field: TimeWindow
    description: >-
      Correlate registry tampering and elevation within a tunable time window (e.g., 30 seconds) to reduce noise
      from benign admin activity.
  - field: ElevatedProcessNameList
    description: >-
      Tunable list of suspicious elevated binaries (e.g., sdclt.exe, eventvwr.exe, computerdefaults.exe) known to
      support UAC bypass.
  - field: ParentProcessAnomalyThreshold
    description: >-
      Define logic for parent-child mismatch (e.g., non-elevated process spawning auto-elevated one) to flag uncommon
      elevation paths.
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: ElevatedProcessNameList
    bind: lookup
    name: mitre_allowlist_processes
  - element: ParentProcessAnomalyThreshold
    bind: macro
    name: mitre_an1094_parentprocessanomalythreshold
curated:
  status: implemented
  title: UAC bypass through auto-elevated binary hijack
  content_type: ttp
  severity: high
  summary: >-
    Either a registry value used by known UAC bypasses is written (ms-settings / mscfile / exefile / Folder shell
    open command, DelegateExecute, IsolatedCommand, per-user windir or systemroot environment overrides), or an
    auto-elevating binary (eventvwr, sdclt, fodhelper, computerdefaults, slui, wsreset) spawns a shell or LOLBin.
    Results list which signals were seen per host.
  gaps: >-
    4672 privilege assignment, process-access and module-load legs are not correlated. Auto-elevated COM object
    abuse without these registry keys is not covered.
  data_components:
  - DC0063
  - DC0032
  feeds:
  - sysmon
  tuning:
  - element: ElevatedProcessNameList
    bind: macro
    name: mitre_an1094_autoelevate
    default: >-
      ParentImage IN ("*\\eventvwr.exe", "*\\sdclt.exe", "*\\fodhelper.exe", "*\\computerdefaults.exe", "*\\slui.exe",
      "*\\wsreset.exe", "*\\cmstp.exe")
  - element: TimeWindow
    bind: filter
    name: mitre_an1094_filter
    note: No window is applied; each signal fires on its own within the search window.
  spl: |-
    (`mitre_dc0063_sysmon` EventCode=13 TargetObject IN ("*\\ms-settings\\shell\\open\\command*", "*\\mscfile\\shell\\open\\command*", "*\\exefile\\shell\\open\\command*", "*\\Folder\\shell\\open\\command*", "*\\shell\\open\\command\\DelegateExecute", "*\\shell\\runas\\command\\IsolatedCommand", "HKU\\*\\Environment\\windir", "HKU\\*\\Environment\\systemroot"))
      OR (`mitre_dc0032_sysmon` EventCode=1 `mitre_an1094_autoelevate` Image IN ("*\\cmd.exe", "*\\powershell.exe", "*\\pwsh.exe", "*\\wscript.exe", "*\\cscript.exe", "*\\mshta.exe", "*\\rundll32.exe", "*\\regsvr32.exe"))
    | `mitre_normalize_host`
    | eval signal=if(EventCode==13, "registry_hijack", "autoelevate_child"), process_name=replace(Image, "^.*\\\\", "")
    | stats count min(_time) as firstTime max(_time) as lastTime values(signal) as signals values(TargetObject) as registry_path values(Details) as registry_value_data values(ParentImage) as parent_process values(CommandLine) as process by dest user process_name
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1094_filter`
  risk:
    message: UAC bypass behaviour on $dest$ involving $process_name$
    objects:
    - field: dest
      type: system
      score: 70
    - field: user
      type: user
      score: 60
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process_name
    period: 3600s
  false_positives:
  - >-
    Rare. Some software installers set per-user shell open commands for their own file classes; the listed classes
    are not among them.
  baselines: []
  sigma:
    rules:
    - name: an1094_registry_hijack
      logsource:
        product: windows
        category: registry_set
      detection:
        selection:
          TargetObject|contains:
          - \ms-settings\shell\open\command
          - \mscfile\shell\open\command
          - \exefile\shell\open\command
          - \Folder\shell\open\command
          - \shell\runas\command\IsolatedCommand
        condition: selection
    - name: an1094_autoelevate_child
      logsource:
        product: windows
        category: process_creation
      detection:
        parent:
          ParentImage|endswith:
          - \eventvwr.exe
          - \sdclt.exe
          - \fodhelper.exe
          - \computerdefaults.exe
          - \slui.exe
          - \wsreset.exe
        child:
          Image|endswith:
          - \cmd.exe
          - \powershell.exe
          - \pwsh.exe
          - \wscript.exe
          - \cscript.exe
          - \mshta.exe
          - \rundll32.exe
          - \regsvr32.exe
        condition: parent and child
kql: null
esql: null
