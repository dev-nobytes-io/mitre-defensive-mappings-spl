# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1275
name: Analytic 1275
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0463#AN1275
  attack_release: '20.1'
  detection_strategy:
    id: DET0463
    name: Brute Force Authentication Failures with Multi-Platform Log Correlation
  technique:
    id: T1110
    name: Brute Force
    tactics:
    - credential-access
    usage_score: 45
  platforms:
  - Windows
  description: >-
    High volume of failed logon attempts followed by a successful one from a suspicious user, host, or timeframe
  log_source_references:
  - dc: DC0002
    dc_name: User Account Authentication
    name: WinEventLog:Security
    channel: EventCode=4776, 4625
  mutable_elements:
  - field: TimeWindow
    description: Adjustable window to correlate failed logons, e.g., 5-10 minutes
  - field: UserContext
    description: Define scope of monitored users (e.g., service accounts, admins)
  - field: FailureThreshold
    description: Count of failed logons before raising an alert (e.g., 10-15)
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
  - element: FailureThreshold
    bind: macro
    name: mitre_an1275_failurethreshold
curated:
  status: implemented
  title: Many logon failures followed by a success for the same account and source
  content_type: ttp
  severity: medium
  summary: >-
    For one account and source address on one host, Windows Security shows many failed logons (4625) and then a
    successful logon (4624) within the hour: a password guessed rather than mistyped.
  gaps: >-
    NTLM validation events (4776) carry no source address and are not joined; failures spread across many hosts
    are AN0590-style fan-out, not this.
  data_components:
  - DC0002
  feeds:
  - wineventlog
  tuning:
  - element: FailureThreshold
    bind: macro
    name: mitre_an1275_threshold
    default: '10'
    note: Failures before the success, per account, source and host per hour.
  - element: TimeWindow
    bind: filter
    name: mitre_an1275_filter
    note: The window is the search range (65 minutes).
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
  spl: |-
    `mitre_dc0002_wineventlog` EventCode IN (4624, 4625) NOT TargetUserName="*$"
    | `mitre_normalize_host`
    | eval user=TargetUserName, src=if(IpAddress IN ("-", "::1", "127.0.0.1"), WorkstationName, IpAddress), fail_time=if(EventCode==4625, _time, null()), success_time=if(EventCode==4624, _time, null())
    | search `mitre_not_allowlisted_user`
    | stats count(fail_time) as failures min(fail_time) as firstTime max(fail_time) as last_failure max(success_time) as lastTime by dest user src
    | where failures >= `mitre_an1275_threshold` AND isnotnull(lastTime) AND lastTime > firstTime
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1275_filter`
  risk:
    message: $user$ logged on to $dest$ from $src$ after $failures$ failures
    objects:
    - field: user
      type: user
      score: 60
    - field: dest
      type: system
      score: 40
    threat_objects:
    - field: src
      type: ip_address
  schedule:
    earliest: -65m@m
    latest: -5m@m
  throttle:
    fields:
    - dest
    - user
    - src
    period: 3600s
  false_positives:
  - >-
    A user who forgot a changed password and eventually typed it; mapped drives retrying cached credentials.
  baselines: []
  sigma:
    rules:
    - name: an1275_logon_failure
      logsource:
        product: windows
        service: security
      detection:
        selection:
          EventID: 4625
        condition: selection
    correlation:
      type: event_count
      group-by:
      - Computer
      - TargetUserName
      - IpAddress
      timespan: 1h
      condition:
        gte: 10
    note: Sigma counts the failures; the following success is required only in the Splunk search.
kql: null
esql: null
