# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0324
name: Analytic 0324
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0117#AN0324
  attack_release: '20.1'
  detection_strategy:
    id: DET0117
    name: Detection of Masqueraded Tasks or Services with Suspicious Naming and Execution
  technique:
    id: T1036.004
    name: Masquerade Task or Service
    tactics:
    - stealth
    usage_score: 126
  platforms:
  - Windows
  description: >-
    Creation or modification of Windows services or scheduled tasks with names or descriptions mimicking legitimate
    entries, followed by anomalous execution of untrusted binaries or LOLBAS.
  log_source_references:
  - dc: DC0060
    dc_name: Service Creation
    name: WinEventLog:System
    channel: EventCode=7045
  - dc: DC0001
    dc_name: Scheduled Job Creation
    name: WinEventLog:Security
    channel: EventCode=4698
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  mutable_elements:
  - field: TaskNameSimilarityThreshold
    description: >-
      Similarity threshold for comparing new task/service names to known legitimate names (e.g., Levenshtein distance)
  - field: BinaryReputationScore
    description: Confidence level required for allowing a binary, often from unsigned or untrusted source
  - field: ExecutionContext
    description: Whether the execution came from SYSTEM, service accounts, or user contexts
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: TaskNameSimilarityThreshold
    bind: macro
    name: mitre_an0324_tasknamesimilaritythreshold
  - element: BinaryReputationScore
    bind: lookup
    name: mitre_allowlist_processes
  - element: ExecutionContext
    bind: filter
    name: mitre_an0324_filter
curated:
  status: implemented
  title: Service or task named like system software but running an untrusted binary
  content_type: anomaly
  severity: medium
  summary: >-
    A service (System 7045) or scheduled task (Security 4698) is created with a name that imitates Windows, Microsoft
    or common vendor updaters, while its binary is outside System32 and Program Files. Legitimate software with
    those names installs into Program Files; impostors usually run from ProgramData, AppData or Temp.
  gaps: >-
    Name similarity is a keyword list, not an edit-distance comparison (SPL has no Levenshtein function); binary
    reputation is not checked.
  data_components:
  - DC0060
  - DC0001
  feeds:
  - wineventlog
  tuning:
  - element: TaskNameSimilarityThreshold
    bind: macro
    name: mitre_an0324_impersonated_names
    default: >-
      (ServiceName IN ("*svchost*", "*windows*", "*microsoft*", "*wuauserv*", "*update*", "*defender*", "*google*",
      "*chrome*", "*adobe*", "*onedrive*", "*edge*", "*intel*", "*nvidia*") OR TaskName IN ("*svchost*", "*windows*",
      "*microsoft*", "*update*", "*defender*", "*google*", "*chrome*", "*adobe*", "*onedrive*", "*edge*", "*intel*",
      "*nvidia*"))
  - element: BinaryReputationScore
    bind: macro
    name: mitre_an0324_trusted_paths
    default: >-
      binary IN ("c:\\windows\\system32\\*", "\"c:\\windows\\system32\\*", "%systemroot%\\system32\\*", "\"%systemroot%\\system32\\*",
      "%windir%\\system32\\*", "c:\\windows\\syswow64\\*", "c:\\program files*", "\"c:\\program files*", "%programfiles%*",
      "\"%programfiles%*", "system32\\*", "c:\\windows\\microsoft.net\\*")
    note: Matched with NOT; add vendor install roots here.
  - element: ExecutionContext
    bind: filter
    name: mitre_an0324_filter
  spl: |-
    (`mitre_dc0060_wineventlog` EventCode=7045 `mitre_an0324_impersonated_names`)
      OR (`mitre_dc0001_wineventlog` EventCode=4698 `mitre_an0324_impersonated_names`)
    | `mitre_normalize_host`
    | rex field=TaskContent "(?i)(?:<|&lt;)Command(?:>|&gt;)\s*(?<task_command>[^<&]+?)\s*(?:<|&lt;)/Command"
    | eval object_name=coalesce(ServiceName, TaskName), object_type=if(EventCode==7045, "service", "scheduled_task"), binary=lower(trim(coalesce(ImagePath, task_command)))
    | where isnotnull(binary)
    | search NOT `mitre_an0324_trusted_paths`
    | stats count min(_time) as firstTime max(_time) as lastTime values(binary) as binary values(object_type) as object_type by dest user object_name
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0324_filter`
  risk:
    message: $object_name$ on $dest$ imitates system software but runs $binary$
    objects:
    - field: dest
      type: system
      score: 45
    - field: user
      type: user
      score: 30
    threat_objects:
    - field: binary
      type: file_path
  schedule: {}
  throttle:
    fields:
    - dest
    - object_name
    period: 86400s
  false_positives:
  - >-
    Vendor updaters installed per user (some browser and conferencing updaters run from AppData or ProgramData).
  baselines: []
  sigma:
    rules:
    - name: an0324_service
      logsource:
        product: windows
        service: system
      detection:
        selection:
          EventID: 7045
          ServiceName|contains:
          - svchost
          - Windows
          - Microsoft
          - update
          - Defender
          - Google
          - Chrome
          - Adobe
          - OneDrive
        trusted:
          ImagePath|contains:
          - \Windows\System32\
          - \Windows\SysWOW64\
          - \Program Files
        condition: selection and not trusted
    - name: an0324_task
      logsource:
        product: windows
        service: security
      detection:
        selection:
          EventID: 4698
          TaskName|contains:
          - svchost
          - Windows
          - Microsoft
          - Update
          - Defender
          - Google
          - Chrome
          - Adobe
          - OneDrive
        untrusted_action:
          TaskContent|contains:
          - \AppData\
          - \ProgramData\
          - \Users\Public\
          - \Temp\
        condition: selection and untrusted_action
kql: null
esql: null
