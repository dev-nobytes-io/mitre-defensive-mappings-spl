# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1452
name: Analytic 1452
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0525#AN1452
  attack_release: '20.1'
  detection_strategy:
    id: DET0525
    name: System Discovery via Native and Remote Utilities
  technique:
    id: T1082
    name: System Information Discovery
    tactics:
    - discovery
    usage_score: 511
  platforms:
  - Windows
  description: >-
    Detection of processes executing system environment inspection operations followed by access to OS configuration
    APIs or registry locations that expose OS version, architecture, patch level, or hardware characteristics. Defenders
    observe process execution retrieving system configuration metadata immediately after process startup.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0064
    dc_name: Command Execution
    name: WinEventLog:PowerShell
    channel: EventCode=4103, 4104, 4105, 4106
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0063
    dc_name: Windows Registry Key Modification
    name: WinEventLog:Sysmon
    channel: EventCode=13, 14
  mutable_elements:
  - field: TimeWindow
    description: Detect multiple discovery commands executed in short succession.
  - field: UserContext
    description: Scope alerts to unusual user accounts or service accounts.
derived:
  coverage: mapped
  suggested_content_type: hunting
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
curated:
  status: implemented
  title: System information discovery commands
  content_type: hunting
  severity: informational
  summary: >-
    Lists hosts and users running OS, hardware and patch-level enumeration (systeminfo, hostname, msinfo32, wmic
    os/computersystem/bios/qfe, reg query of version keys, Get-ComputerInfo, Win32_OperatingSystem, Get-HotFix),
    grouped into ten-minute buckets with the distinct commands seen.
  gaps: >-
    PowerShell script-block content and registry reads are not included. On its own this is routine administration,
    so it produces no finding or risk; use it to scope an investigation.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
  - element: TimeWindow
    bind: filter
    name: mitre_an1452_filter
    note: Bucket size is fixed at 10 minutes; add a threshold here, e.g. where distinct_commands >= 3.
  spl: |-
    | tstats `mitre_summariesonly` count from `mitre_dc0032_dm` where `mitre_dc0032_dm_where`
        (Processes.process_name IN ("systeminfo.exe", "hostname.exe", "msinfo32.exe")
          OR (Processes.process_name="wmic.exe" Processes.process IN ("* os *", "*computersystem*", "* bios *", "*csproduct*", "* qfe *"))
          OR (Processes.process_name="reg.exe" Processes.process="*query*" Processes.process IN ("*\\windows nt\\currentversion*", "*\\control\\systeminformation*"))
          OR (Processes.process_name IN ("powershell.exe", "pwsh.exe") Processes.process IN ("*get-computerinfo*", "*win32_operatingsystem*", "*win32_computersystem*", "*get-hotfix*")))
        by Processes.dest Processes.user Processes.parent_process_name Processes.process _time span=10m
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_user`
    | stats sum(count) as count dc(process) as distinct_commands values(process) as process values(parent_process_name) as parent_process_name by dest user _time
    | sort - distinct_commands
    | `mitre_an1452_filter`
  risk:
    message: ''
    objects: []
    threat_objects: []
  schedule: {}
  throttle: {}
  false_positives:
  - Inventory agents, help-desk scripts and administrators.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    level: informational
    detection:
      tools:
        Image|endswith:
        - \systeminfo.exe
        - \hostname.exe
        - \msinfo32.exe
      wmic:
        Image|endswith: \wmic.exe
        CommandLine|contains:
        - ' os '
        - computersystem
        - ' bios '
        - csproduct
        - ' qfe '
      powershell:
        CommandLine|contains:
        - Get-ComputerInfo
        - Win32_OperatingSystem
        - Win32_ComputerSystem
        - Get-HotFix
      condition: tools or wmic or powershell
kql: null
esql: null
