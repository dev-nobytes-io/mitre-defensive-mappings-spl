# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1198
name: Analytic 1198
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0430#AN1198
  attack_release: '20.1'
  detection_strategy:
    id: DET0430
    name: Detect Credentials Access from Password Stores
  technique:
    id: T1555
    name: Credentials from Password Stores
    tactics:
    - credential-access
    usage_score: 58
  platforms:
  - Windows
  description: >-
    Monitors suspicious access to password stores such as LSASS, DPAPI, Windows Credential Manager, or browser credential
    databases. Detects anomalous process-to-process access (e.g., Mimikatz accessing LSASS) and correlation of credential
    store file reads with execution of non-standard processes.
  log_source_references:
  - dc: DC0035
    dc_name: Process Access
    name: WinEventLog:Sysmon
    channel: EventCode=10
  - dc: DC0055
    dc_name: File Access
    name: WinEventLog:Security
    channel: EventCode=4663, 4670, 4656
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  mutable_elements:
  - field: TargetProcesses
    description: List of sensitive processes to monitor (e.g., lsass.exe, svchost.exe)
  - field: KeywordPatterns
    description: Regex for suspicious command-line arguments such as 'dpapi', 'credman', 'mimikatz'
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: TargetProcesses
    bind: lookup
    name: mitre_allowlist_processes
  - element: KeywordPatterns
    bind: macro
    name: mitre_an1198_keywordpatterns
curated:
  status: implemented
  title: Password store read by something other than its owner
  content_type: ttp
  severity: high
  summary: >-
    Windows Credential Manager and vault enumeration (vaultcmd /list, cmdkey /list, keymgr KRShowKeyMgr, the PasswordVault
    class, Get-StoredCredential), a command line naming browser credential databases (Login Data, logins.json, key4.db),
    or, with SACLs, a Security 4663 read of a browser credential database, the Local State key file or the Credentials
    and Vault folders by a process that is not the browser or the OS.
  gaps: >-
    LSASS memory access is AN1030 and AN1095. The 4663 leg needs object-access auditing and SACLs on the browser
    profile and Credentials folders; without them only the command leg fires.
  data_components:
  - DC0032
  - DC0055
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: KeywordPatterns
    bind: macro
    name: mitre_an1198_commands
    default: >-
      ((Image="*\\vaultcmd.exe" CommandLine="*/list*") OR (Image="*\\cmdkey.exe" CommandLine IN ("*/l*", "*-l*"))
      OR CommandLine IN ("*keymgr.dll*KRShowKeyMgr*", "*Security.Credentials.PasswordVault*", "*Get-StoredCredential*",
      "*\\Login Data*", "*logins.json*", "*key4.db*", "*\\Local State*", "*\\Microsoft\\Credentials\\*", "*\\Microsoft\\Vault\\*"))
  - element: TargetProcesses
    bind: macro
    name: mitre_an1198_store_files
    default: >-
      ObjectName IN ("*\\User Data\\*\\Login Data*", "*\\User Data\\Local State", "*\\Mozilla\\Firefox\\Profiles\\*\\logins.json",
      "*\\Mozilla\\Firefox\\Profiles\\*\\key4.db", "*\\AppData\\*\\Microsoft\\Credentials\\*", "*\\AppData\\*\\Microsoft\\Vault\\*")
  - element: ExpectedReaders
    bind: macro
    name: mitre_an1198_expected_readers
    default: >-
      ProcessName IN ("*\\chrome.exe", "*\\msedge.exe", "*\\firefox.exe", "*\\brave.exe", "*\\opera.exe", "*\\vivaldi.exe",
      "*\\lsass.exe", "*\\svchost.exe", "*\\MsMpEng.exe", "*\\SearchProtocolHost.exe", "*\\SearchIndexer.exe", "*\\explorer.exe",
      "*\\msedgewebview2.exe")
  spl: |-
    (`mitre_dc0032_sysmon` EventCode=1 `mitre_an1198_commands`)
    OR (`mitre_dc0055_wineventlog` EventCode=4663 `mitre_an1198_store_files` NOT `mitre_an1198_expected_readers`)
    | `mitre_normalize_host`
    | eval process_name=lower(replace(coalesce(Image, ProcessName), "^.*\\\\", "")), signal=if(EventCode==4663, "read ".ObjectName, CommandLine)
    | search `mitre_not_allowlisted_process`
    | stats count min(_time) as firstTime max(_time) as lastTime values(signal) as signal values(process_name) as process_name by dest user
    | eval signal=mvindex(signal, 0, 9)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1198_filter`
  risk:
    message: Password store accessed on $dest$ by $user$ via $process_name$
    objects:
    - field: dest
      type: system
      score: 50
    - field: user
      type: user
      score: 60
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 86400s
  false_positives:
  - >-
    Password-manager import tools and browser migration; administrators listing saved credentials with cmdkey.
  baselines: []
  sigma:
    rules:
    - name: an1198_vault_enumeration
      logsource:
        product: windows
        category: process_creation
      detection:
        vaultcmd:
          Image|endswith: \vaultcmd.exe
          CommandLine|contains: /list
        cmdkey:
          Image|endswith: \cmdkey.exe
          CommandLine|contains: /l
        strings:
          CommandLine|contains:
          - KRShowKeyMgr
          - Security.Credentials.PasswordVault
          - Get-StoredCredential
          - \Login Data
          - logins.json
          - key4.db
        condition: vaultcmd or cmdkey or strings
    - name: an1198_browser_store_read
      logsource:
        product: windows
        service: security
      detection:
        selection:
          EventID: 4663
          ObjectName|contains:
          - \Login Data
          - \logins.json
          - \key4.db
          - \Microsoft\Credentials\
          - \Microsoft\Vault\
        owners:
          ProcessName|endswith:
          - \chrome.exe
          - \msedge.exe
          - \firefox.exe
          - \lsass.exe
          - \svchost.exe
          - \MsMpEng.exe
        condition: selection and not owners
kql: null
esql: null
