# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1121
name: Analytic 1121
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0400#AN1121
  attack_release: '20.1'
  detection_strategy:
    id: DET0400
    name: Behavioral Detection of DNS Tunneling and Application Layer Abuse
  technique:
    id: T1071.004
    name: DNS
    tactics:
    - command-and-control
    usage_score: 68
  platforms:
  - Windows
  description: >-
    Detects high-frequency or anomalous DNS queries initiated by non-browser, non-system processes (e.g., PowerShell,
    rundll32, python.exe) used to establish command and control via DNS tunneling.
  log_source_references:
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  - dc: DC0085
    dc_name: Network Traffic Content
    name: NSM:Flow
    channel: dns.log
  mutable_elements:
  - field: QueryLengthThreshold
    description: Subdomain length for detecting base32/base64-encoded payloads
  - field: ProcessImageFilter
    description: Flag non-standard executables making DNS queries
  - field: TimeWindow
    description: Rate of queries in short interval per process
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: QueryLengthThreshold
    bind: macro
    name: mitre_an1121_querylengththreshold
  - element: ProcessImageFilter
    bind: lookup
    name: mitre_allowlist_processes
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: DNS tunnelling pattern from a non-browser process
  content_type: anomaly
  severity: medium
  summary: >-
    Sysmon DNS query events (EventCode 22) from a process that is not a browser, mail client or svchost, where in
    ten minutes the process either resolves many distinct names under one parent domain or queries a name with a
    very long subdomain portion.
  gaps: >-
    The network-side view (Corelight dns.log) is AN1124. Parent-domain extraction is the last two labels, which
    over-groups multi-part public suffixes such as co.uk. Requires Sysmon DnsQuery logging.
  data_components:
  - DC0085
  feeds:
  - sysmon
  tuning:
  - element: QueryLengthThreshold
    bind: macro
    name: mitre_an1121_length_threshold
    default: '50'
    note: Characters in the subdomain portion of a single query.
  - element: TimeWindow
    bind: macro
    name: mitre_an1121_query_threshold
    default: '100'
    note: Distinct query names under one parent domain per process per 10 minutes.
  - element: ProcessImageFilter
    bind: lookup
    name: mitre_allowlist_domains
    note: Parent domains that legitimately use long or numerous names (CDNs, security products, telemetry).
  spl: |-
    `mitre_dc0085_sysmon` EventCode=22 NOT Image IN ("*\\chrome.exe", "*\\msedge.exe", "*\\msedgewebview2.exe", "*\\firefox.exe", "*\\brave.exe", "*\\opera.exe", "*\\iexplore.exe", "*\\outlook.exe", "*\\teams.exe", "*\\ms-teams.exe", "*\\svchost.exe")
    | `mitre_normalize_host`
    | eval query=lower(QueryName)
    | lookup mitre_allowlist_domains domain as query OUTPUT reason as allow_reason
    | where isnull(allow_reason)
    | eval labels=split(query, "."), label_count=mvcount(labels), parent_domain=mvjoin(mvindex(labels, -2, -1), "."), subdomain_length=if(label_count > 2, len(query) - len(parent_domain) - 1, 0), process_name=replace(Image, "^.*\\\\", "")
    | bin _time span=10m
    | stats count min(_time) as firstTime max(_time) as lastTime dc(query) as unique_queries max(subdomain_length) as max_subdomain_length by dest process_name parent_domain _time
    | where unique_queries >= `mitre_an1121_query_threshold` OR max_subdomain_length >= `mitre_an1121_length_threshold`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1121_filter`
  risk:
    message: $process_name$ on $dest$ shows DNS tunnelling patterns towards $parent_domain$
    objects:
    - field: dest
      type: system
      score: 45
    threat_objects:
    - field: parent_domain
      type: domain
    - field: process_name
      type: process_name
  schedule:
    earliest: -30m@m
    latest: -5m@m
  throttle:
    fields:
    - dest
    - parent_domain
    period: 14400s
  false_positives:
  - Security agents and CDNs that encode data in DNS labels (reputation lookups, some AV cloud queries).
  baselines: []
  sigma:
    note: >-
      The rule matches a single very long query name; the distinct-name rate is a correlation over all DNS queries
      and is left to the SPL.
    logsource:
      product: windows
      category: dns_query
    detection:
      selection:
        QueryName|re: ^[^.]{50,}\.|^([^.]+\.){1,6}[^.]{40,}\.
      browser:
        Image|endswith:
        - \chrome.exe
        - \msedge.exe
        - \firefox.exe
        - \outlook.exe
        - \svchost.exe
      condition: selection and not browser
kql: null
esql: null
