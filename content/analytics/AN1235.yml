# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1235
name: Analytic 1235
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0447#AN1235
  attack_release: '20.1'
  detection_strategy:
    id: DET0447
    name: T1136.001 Detection Strategy - Local Account Creation Across Platforms
  technique:
    id: T1136.001
    name: Local Account
    tactics:
    - persistence
    usage_score: 49
  platforms:
  - Windows
  description: >-
    Adversary uses built-in tools like 'net user /add', PowerShell, or WMI to create a local user. Sequence: Account
    creation event (4720) follows process creation of a suspicious executable (e.g., powershell.exe or net.exe).
  log_source_references:
  - dc: DC0014
    dc_name: User Account Creation
    name: WinEventLog:Security
    channel: EventCode=4720
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  mutable_elements:
  - field: ParentProcessName
    description: Attackers may use cmd.exe, wscript.exe, or renamed binaries to evade detection
  - field: TimeWindow
    description: Define time threshold between process start and user creation event (e.g., 5s–2m)
  - field: UserContext
    description: Correlate if process runs under SYSTEM, Administrator, or untrusted account
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: ParentProcessName
    bind: lookup
    name: mitre_allowlist_processes
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
curated:
  status: implemented
  title: Local account created on a host that is not a domain controller
  content_type: anomaly
  severity: medium
  summary: >-
    Security event 4720 (user account created) on a host not listed as a domain controller, which means a local
    SAM account. When Sysmon saw the command that created it (net user /add, New-LocalUser, wmic useraccount create)
    it is reported alongside.
  gaps: Accounts created through the API without a command line show only the 4720 half.
  data_components:
  - DC0014
  - DC0032
  feeds:
  - wineventlog
  - sysmon
  tuning:
  - element: ParentProcessName
    bind: macro
    name: mitre_an1235_commands
    default: >-
      ((Image IN ("*\\net.exe", "*\\net1.exe") CommandLine="* user *" CommandLine="*/ad*") OR CommandLine="*New-LocalUser*"
      OR (Image="*\\wmic.exe" CommandLine="*useraccount*create*"))
  - element: UserContext
    bind: lookup
    name: mitre_asset_roles
    note: Hosts with role=domain_controller are excluded through mitre_hosts_with_role(domain_controller).
  - element: TimeWindow
    bind: filter
    name: mitre_an1235_filter
    note: Command and event are matched within the search range on the same host.
  spl: |-
    (`mitre_dc0014_wineventlog` EventCode=4720) OR (`mitre_dc0032_sysmon` EventCode=1 `mitre_an1235_commands`)
    | `mitre_normalize_host`
    | search NOT `mitre_hosts_with_role(domain_controller)`
    | eval new_account=if(EventCode==4720, TargetUserName, null()), creator=if(EventCode==4720, SubjectUserName, user), command=if(EventCode==1, CommandLine, null())
    | stats count min(_time) as firstTime max(_time) as lastTime values(new_account) as new_account values(creator) as user values(command) as process by dest
    | where isnotnull(new_account)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1235_filter`
  risk:
    message: Local account $new_account$ created on $dest$ by $user$
    objects:
    - field: dest
      type: system
      score: 45
    - field: user
      type: user
      score: 40
    threat_objects:
    - field: new_account
      type: user
  schedule: {}
  throttle:
    fields:
    - dest
    - new_account
    period: 86400s
  false_positives:
  - Imaging and provisioning that create a local support account; LAPS-style tooling.
  baselines: []
  sigma:
    rules:
    - name: an1235_account_created
      logsource:
        product: windows
        service: security
      detection:
        selection:
          EventID: 4720
        condition: selection
    - name: an1235_create_command
      logsource:
        product: windows
        category: process_creation
      detection:
        net:
          Image|endswith:
          - \net.exe
          - \net1.exe
          CommandLine|contains|all:
          - ' user '
          - /ad
        powershell:
          CommandLine|contains: New-LocalUser
        condition: net or powershell
kql: null
esql: null
