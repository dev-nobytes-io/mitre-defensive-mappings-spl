# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1500
name: Analytic 1500
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0543#AN1500
  attack_release: '20.1'
  detection_strategy:
    id: DET0543
    name: Detection Strategy for Encrypted Channel via Asymmetric Cryptography across OS Platforms
  technique:
    id: T1573.002
    name: Asymmetric Cryptography
    tactics:
    - command-and-control
    usage_score: 116
  platforms:
  - Network Devices
  description: >-
    Encrypted sessions detected with asymmetric key exchange anomalies on non-standard ports or with invalid/malformed
    certs. Defender correlates NetFlow/IPFIX with IDS/IPS detecting RSA exchanges outside expected TLS flows.
  log_source_references:
  - dc: DC0078
    dc_name: Network Traffic Flow
    name: NSM:Flow
    channel: Flow records with RSA key exchange on unexpected port
  - dc: DC0085
    dc_name: Network Traffic Content
    name: IDS:TLSInspection
    channel: Malformed certs, incomplete asymmetric handshakes, or invalid CAs
  mutable_elements:
  - field: PortProfiles
    description: Define expected ports for asymmetric cryptography (e.g., 443, 993).
  - field: CertValidationPolicy
    description: Thresholds for rejecting untrusted/self-signed certs.
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: PortProfiles
    bind: lookup
    name: mitre_sensitive_paths
  - element: CertValidationPolicy
    bind: filter
    name: mitre_an1500_filter
curated:
  status: implemented
  title: TLS to an external host on an unusual port with an unvalidated certificate
  content_type: anomaly
  severity: medium
  summary: >-
    Corelight ssl.log sessions to external hosts on ports outside the usual TLS set, where the certificate failed
    validation or the client sent no server name. Implants bring their own self-signed certificates and often skip
    SNI.
  gaps: >-
    validation_status is only populated when the sensor validates certificates (Corelight default; plain Zeek needs
    the validation script). Malformed handshakes without a completed session are not in ssl.log.
  data_components:
  - DC0085
  feeds:
  - corelight
  tuning:
  - element: PortProfiles
    bind: macro
    name: mitre_an1500_tls_ports
    default: dest_port IN (443, 8443, 993, 995, 465, 587, 636, 853, 989, 990, 5061, 3389)
    note: Ports on which TLS is expected; matched with NOT.
  - element: CertValidationPolicy
    bind: lookup
    name: mitre_allowlist_domains
    note: Server names known to use private certificates (domain column).
  spl: |-
    `mitre_dc0085_corelight` `mitre_st_corelight_ssl`
    | `mitre_normalize_zeek`
    | where NOT `mitre_is_internal(dest)`
    | search NOT `mitre_an1500_tls_ports`
    | where (isnotnull(validation_status) AND validation_status!="ok") OR isnull(server_name) OR server_name=="-"
    | lookup mitre_allowlist_domains domain AS server_name OUTPUT reason AS allow_reason
    | where isnull(allow_reason)
    | stats count min(_time) as firstTime max(_time) as lastTime values(validation_status) as validation_status values(server_name) as server_name values(ja3) as ja3 by src dest dest_port
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1500_filter`
  risk:
    message: $src$ used TLS with an unvalidated certificate to $dest$ on port $dest_port$
    objects:
    - field: src
      type: system
      score: 30
    threat_objects:
    - field: dest
      type: ip_address
  schedule: {}
  throttle:
    fields:
    - src
    - dest
    period: 14400s
  false_positives:
  - Vendor appliances and VPNs with self-signed certificates on custom ports.
  baselines: []
  sigma:
    logsource:
      product: zeek
      service: ssl
    detection:
      unvalidated:
        validation_status|contains:
        - self signed
        - unable to get
        - expired
        - unknown
      tls_port:
        id.resp_p:
        - 443
        - 8443
        - 993
        - 995
        - 465
        - 587
        - 636
        - 853
        - 3389
      condition: unvalidated and not tls_port
kql: null
esql: null
