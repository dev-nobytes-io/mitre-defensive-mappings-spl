# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0577
name: Analytic 0577
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0201#AN0577
  attack_release: '20.1'
  detection_strategy:
    id: DET0201
    name: Detection Strategy for Hijack Execution Flow for DLLs
  technique:
    id: T1574.001
    name: DLL
    tactics:
    - stealth
    - execution
    usage_score: 162
  platforms:
  - Windows
  description: >-
    DLL hijacking behaviors including unexpected DLL loads from non-standard directories, replacement of DLLs, phantom
    DLL insertion, redirection file creation, and substitution of legitimate DLLs. Defender correlates file system
    modifications, registry changes, and module load telemetry to detect abnormal DLL behavior in trusted processes.
  log_source_references:
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  - dc: DC0059
    dc_name: File Metadata
    name: WinEventLog:Sysmon
    channel: EventCode=15
  - dc: DC0016
    dc_name: Module Load
    name: WinEventLog:Sysmon
    channel: EventCode=7
  - dc: DC0063
    dc_name: Windows Registry Key Modification
    name: WinEventLog:Security
    channel: EventCode=4657
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  mutable_elements:
  - field: AllowedDllPaths
    description: Known safe DLL directories to suppress false positives (e.g., C:\Windows\System32).
  - field: ProcessAllowList
    description: Applications expected to load DLLs from non-standard locations (e.g., development tools).
  - field: TimeWindow
    description: Correlation interval between DLL file creation, registry changes, and module load.
  - field: HashBaseline
    description: Baseline hashes for legitimate DLLs used to detect substitution.
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: AllowedDllPaths
    bind: lookup
    name: mitre_sensitive_paths
  - element: ProcessAllowList
    bind: lookup
    name: mitre_allowlist_processes
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: HashBaseline
    bind: filter
    name: mitre_an0577_filter
curated:
  status: implemented
  title: Unsigned DLL loaded from a user-writable path by a trusted or relocated program
  content_type: anomaly
  severity: medium
  summary: >-
    Sysmon ImageLoad (7) of an unsigned or invalidly signed DLL from a user-writable directory, either into a program
    running from Windows or Program Files, or into a program running from the same user-writable directory as the
    DLL (the copied-signed-binary side-loading pattern).
  gaps: >-
    Hash baselines for substituted DLLs, phantom-DLL registry redirection (4657) and the DLL file creation are not
    correlated. Depends on Sysmon ImageLoad being enabled, which is high volume; scope it in the Sysmon config to
    unsigned images or user-writable paths.
  data_components:
  - DC0016
  feeds:
  - sysmon
  tuning:
  - element: AllowedDllPaths
    bind: macro
    name: mitre_an0577_untrusted_dll_paths
    default: >-
      ImageLoaded IN ("*\\AppData\\*", "*\\Users\\Public\\*", "*\\Windows\\Temp\\*", "*\\ProgramData\\*", "*\\PerfLogs\\*",
      "*\\Downloads\\*")
  - element: ProcessAllowList
    bind: lookup
    name: mitre_allowlist_processes
    note: Applications that load their own unsigned plug-ins from AppData (process_name column).
  - element: HashBaseline
    bind: filter
    name: mitre_an0577_filter
    note: Not implemented; exclude known-good Hashes values here.
  spl: |-
    `mitre_dc0016_sysmon` EventCode=7 `mitre_an0577_untrusted_dll_paths` (Signed="false" OR SignatureStatus!="Valid")
    | `mitre_normalize_host`
    | eval process_name=replace(Image, "^.*\\\\", ""), image_dir=lower(replace(Image, "\\\\[^\\\\]+$", "")), dll_dir=lower(replace(ImageLoaded, "\\\\[^\\\\]+$", ""))
    | eval pattern=case(match(lower(Image), "^c:\\\\(windows|program files)"), "trusted_program_loaded_user_dll", image_dir==dll_dir, "relocated_program_sideload", true(), null())
    | where isnotnull(pattern)
    | search `mitre_not_allowlisted_process`
    | stats count min(_time) as firstTime max(_time) as lastTime values(ImageLoaded) as file_path values(pattern) as pattern values(Hashes) as file_hash by dest user process_name
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0577_filter`
  risk:
    message: $process_name$ loaded an unsigned DLL from a user-writable path on $dest$
    objects:
    - field: dest
      type: system
      score: 40
    - field: user
      type: user
      score: 30
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process_name
    period: 3600s
  false_positives:
  - >-
    Per-user applications and plug-ins (collaboration clients, browser extensions with native code) that ship unsigned
    DLLs in AppData.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        ImageLoaded|contains:
        - \AppData\
        - \Users\Public\
        - \Windows\Temp\
        - \ProgramData\
        - \PerfLogs\
        - \Downloads\
        Signed: 'false'
      trusted_host:
        Image|startswith:
        - C:\Windows\
        - C:\Program Files\
        - C:\Program Files (x86)\
      condition: selection and trusted_host
kql: null
esql: null
