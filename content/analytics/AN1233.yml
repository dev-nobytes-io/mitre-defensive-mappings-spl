# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1233
name: Analytic 1233
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0445#AN1233
  attack_release: '20.1'
  detection_strategy:
    id: DET0445
    name: Detection of Proxy Infrastructure Setup and Traffic Bridging
  technique:
    id: T1090
    name: Proxy
    tactics:
    - command-and-control
    usage_score: 108
  platforms:
  - Network Devices
  description: >-
    Dynamic or static port forwarding rules added to route traffic through an internal host, or configuration changes
    to proxy firewall rules not aligned with baselined policy.
  log_source_references:
  - dc: DC0051
    dc_name: Firewall Rule Modification
    name: NSM:Firewall
    channel: Policy Change / Rule Update
  - dc: DC0078
    dc_name: Network Traffic Flow
    name: NSM:Flow
    channel: Flow Creation (NetFlow/sFlow)
  - dc: DC0064
    dc_name: Command Execution
    name: networkdevice:cli
    channel: Interface commands
  mutable_elements:
  - field: RuleType
    description: Focus on new allow/permit rules with dynamic NAT or port forwarders.
  - field: ChangeUser
    description: Flag any non-admins initiating proxy config changes.
  - field: FlowVolumeDelta
    description: Detect sharp changes in bi-directional traffic patterns.
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: RuleType
    bind: filter
    name: mitre_an1233_filter
  - element: ChangeUser
    bind: lookup
    name: mitre_account_roles
  - element: FlowVolumeDelta
    bind: macro
    name: mitre_an1233_flowvolumedelta
curated:
  status: implemented
  title: NAT, port-forwarding or policy-based forwarding rule changed on the firewall
  content_type: anomaly
  severity: medium
  summary: >-
    A Palo Alto configuration log entry where a NAT rule, policy-based forwarding rule, tunnel or proxy object is
    added or modified by an administrator who is not on the allow-list. New forwarding rules are how a compromised
    firewall is turned into a traffic relay.
  gaps: >-
    The change in flow volume through the new rule (FlowVolumeDelta) and interface-level CLI commands are not correlated.
    Covers the firewall only.
  data_components:
  - DC0051
  feeds:
  - palo_alto
  tuning:
  - element: RuleType
    bind: macro
    name: mitre_an1233_rule_paths
    default: >-
      path IN ("*nat*rules*", "*rulebase*nat*", "*pbf*rules*", "*rulebase*pbf*", "*tunnel*", "*proxy*", "*network*virtual-router*")
  - element: ChangeUser
    bind: lookup
    name: mitre_allowlist_users
    note: Firewall administrators expected to change forwarding rules.
  spl: |-
    `mitre_dc0051_palo_alto` `mitre_st_palo_alto_config` cmd IN ("set", "edit", "add", "clone", "move", "rename") `mitre_an1233_rule_paths`
    | `mitre_normalize_pan`
    | eval dest=coalesce(dvc_name, dvc, host), config_path=path
    | search `mitre_not_allowlisted_user`
    | stats count min(_time) as firstTime max(_time) as lastTime values(cmd) as config_action values(config_path) as config_path values(client) as client by dest user
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1233_filter`
  risk:
    message: Forwarding or NAT configuration changed on firewall $dest$ by $user$
    objects:
    - field: dest
      type: system
      score: 40
    - field: user
      type: user
      score: 40
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 3600s
  false_positives:
  - Routine network changes; add the network team's admin accounts to mitre_allowlist_users.
  baselines: []
  sigma:
    logsource:
      product: paloalto
      service: config
    detection:
      selection:
        cmd:
        - set
        - edit
        - add
        - clone
        - move
        - rename
        path|contains:
        - nat
        - pbf
        - tunnel
        - proxy
      condition: selection
kql: null
esql: null
