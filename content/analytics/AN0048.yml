# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0048
name: Analytic 0048
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0016#AN0048
  attack_release: '20.1'
  detection_strategy:
    id: DET0016
    name: Security Software Discovery Across Platforms
  technique:
    id: T1518.001
    name: Security Software Discovery
    tactics:
    - discovery
    usage_score: 172
  platforms:
  - Windows
  description: >-
    Adversary executes commands to enumerate installed antivirus, EDR, or firewall agents using WMI, registry queries,
    and built-in tools (e.g., tasklist, netsh, sc query). Correlated with elevated process privileges or scripting
    engine usage.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0016
    dc_name: Module Load
    name: WinEventLog:Sysmon
    channel: EventCode=7
  mutable_elements:
  - field: ParentProcess
    description: Defenders can tune based on trusted or known-good parent process relationships
  - field: ImagePathContains
    description: Regex match on adversary tool or enumeration script used
derived:
  coverage: mapped
  suggested_content_type: hunting
  suggested_tuning:
  - element: ParentProcess
    bind: lookup
    name: mitre_allowlist_processes
  - element: ImagePathContains
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Security software enumeration
  content_type: anomaly
  severity: low
  summary: >-
    A process queries which security products are present: WMI SecurityCenter2 AntiVirusProduct or FirewallProduct,
    Get-MpComputerStatus / Get-MpPreference, netsh firewall show, sc query of security services, findstr for security
    product names, or reg query of Defender, Trellix or Sysmon keys.
  gaps: >-
    Module loads and the elevated-privilege correlation are not evaluated. Generic tasklist or sc query without
    a security-product filter is covered by AN0095.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: ImagePathContains
    bind: macro
    name: mitre_an0048_patterns
    default: >-
      ((Processes.process_name="wmic.exe" Processes.process IN ("*securitycenter*", "*antivirusproduct*", "*firewallproduct*",
      "*antispywareproduct*")) OR (Processes.process_name IN ("powershell.exe", "pwsh.exe") Processes.process IN
      ("*antivirusproduct*", "*securitycenter2*", "*get-mpcomputerstatus*", "*get-mppreference*")) OR (Processes.process_name="netsh.exe"
      Processes.process IN ("*advfirewall*show*", "*firewall*show*")) OR (Processes.process_name="sc.exe" Processes.process="*query*"
      Processes.process IN ("*windefend*", "*sysmon*", "*mfe*", "*sense*")) OR (Processes.process_name IN ("cmd.exe",
      "findstr.exe") Processes.process="*findstr*" Processes.process IN ("*defender*", "*sysmon*", "*crowdstrike*",
      "*carbon*", "*mcafee*", "*trellix*", "*sentinel*", "*symantec*", "*virus*", "*sophos*")) OR (Processes.process_name="reg.exe"
      Processes.process="*query*" Processes.process IN ("*windows defender*", "*\\mcafee*", "*\\trellix*", "*\\sysmon*")))
  - element: ParentProcess
    bind: lookup
    name: mitre_allowlist_users
    note: Compliance and inventory accounts.
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where` `mitre_an0048_patterns`
        by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_user`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0048_filter`
  risk:
    message: Security software enumerated on $dest$ by $user$
    objects:
    - field: dest
      type: system
      score: 25
    - field: user
      type: user
      score: 25
    threat_objects:
    - field: process
      type: process
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 14400s
  false_positives:
  - Compliance checks, installers verifying prerequisites and help-desk scripts.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      wmi:
        CommandLine|contains:
        - SecurityCenter2
        - AntiVirusProduct
        - FirewallProduct
        - AntiSpywareProduct
      defender:
        CommandLine|contains:
        - Get-MpComputerStatus
        - Get-MpPreference
      netsh:
        Image|endswith: \netsh.exe
        CommandLine|contains|all:
        - firewall
        - show
      findstr:
        CommandLine|contains|all:
        - findstr
        CommandLine|contains:
        - defender
        - sysmon
        - crowdstrike
        - mcafee
        - trellix
        - sentinel
        - symantec
        - virus
        - sophos
      condition: wmi or defender or netsh or findstr
kql: null
esql: null
