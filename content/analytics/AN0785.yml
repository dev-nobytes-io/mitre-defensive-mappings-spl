# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0785
name: Analytic 0785
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0282#AN0785
  attack_release: '20.1'
  detection_strategy:
    id: DET0282
    name: 'Detection Strategy for System Binary Proxy Execution: Regsvr32'
  technique:
    id: T1218.010
    name: Regsvr32
    tactics:
    - stealth
    usage_score: 49
  platforms:
  - Windows
  description: >-
    Detection focuses on identifying anomalous regsvr32.exe executions that deviate from normal administrative or
    system use. Defenders may observe regsvr32.exe loading scriptlets or DLLs from unusual paths (especially temporary
    directories or remote URLs), command-line arguments invoking /i or /u with suspicious file references, network
    connections initiated by regsvr32.exe, and unsigned or untrusted DLLs being loaded shortly after regsvr32.exe
    invocation. Correlated sequences include regsvr32.exe process creation, module load of DLL/scriptlet, and optional
    outbound network traffic.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0016
    dc_name: Module Load
    name: WinEventLog:Sysmon
    channel: EventCode=7
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  mutable_elements:
  - field: AllowedDLLPaths
    description: Directories where DLL loading via regsvr32.exe is expected (e.g., C:\Windows\System32).
  - field: ScriptletExtensions
    description: File extensions considered suspicious when executed by regsvr32.exe (e.g., .sct, .ocx).
  - field: TimeWindow
    description: >-
      Timeframe to correlate regsvr32.exe process creation with subsequent module loads and network connections.
  - field: ParentProcessWhitelist
    description: >-
      Parent processes from which regsvr32.exe is expected (e.g., explorer.exe during legitimate COM object registration).
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: AllowedDLLPaths
    bind: lookup
    name: mitre_sensitive_paths
  - element: ScriptletExtensions
    bind: lookup
    name: mitre_sensitive_paths
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: ParentProcessWhitelist
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Regsvr32 running a scriptlet, a remote or user-folder DLL, or connecting out
  content_type: anomaly
  severity: medium
  summary: >-
    regsvr32 invoked with scrobj.dll or a .sct scriptlet, with /i: pointing at a URL (Squiblydoo), or registering
    a DLL from a user-writable folder; or regsvr32 itself opening an outbound connection to an external address.
    Legitimate registration targets signed DLLs under Program Files and System32 and never needs the network.
  gaps: >-
    The module-load leg (unsigned DLL loaded by regsvr32) is not joined; renamed copies of regsvr32 are caught only
    through OriginalFileName on the process leg.
  data_components:
  - DC0032
  - DC0082
  feeds:
  - sysmon
  tuning:
  - element: ScriptletExtensions
    bind: macro
    name: mitre_an0785_suspicious_args
    default: >-
      (CommandLine IN ("*scrobj.dll*", "*.sct*", "*/i:http*", "*-i:http*", "*/i:ftp*", "*/i:\\\\*") OR CommandLine
      IN ("*\\AppData\\Local\\Temp\\*", "*\\Downloads\\*", "*\\Users\\Public\\*", "*\\ProgramData\\*", "*\\Windows\\Temp\\*",
      "*\\AppData\\Roaming\\*", "*\\PerfLogs\\*"))
  - element: AllowedDLLPaths
    bind: lookup
    name: mitre_allowlist_processes
    note: >-
      Installers that register DLLs from their own ProgramData or Temp folders (process_name regsvr32.exe with a
      parent).
  - element: ParentProcessWhitelist
    bind: filter
    name: mitre_an0785_filter
  - element: TimeWindow
    bind: filter
    name: mitre_an0785_filter
  spl: |-
    (`mitre_dc0032_sysmon` EventCode=1 (Image="*\\regsvr32.exe" OR OriginalFileName="REGSVR32.EXE") `mitre_an0785_suspicious_args`)
    OR (`mitre_dc0082_sysmon` EventCode=3 Initiated="true" Image="*\\regsvr32.exe")
    | `mitre_normalize_host`
    | where EventCode==1 OR NOT `mitre_is_internal(DestinationIp)`
    | eval process_name="regsvr32.exe", parent_process_name=lower(replace(ParentImage, "^.*\\\\", "")), signal=if(EventCode==1, CommandLine, "connection to ".DestinationIp.":".DestinationPort)
    | search `mitre_not_allowlisted_process`
    | stats count min(_time) as firstTime max(_time) as lastTime values(signal) as signal values(parent_process_name) as parent_process_name values(user) as user by dest
    | eval signal=mvindex(signal, 0, 9)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0785_filter`
  risk:
    message: Suspicious regsvr32 use on $dest$ ($signal$)
    objects:
    - field: dest
      type: system
      score: 50
    - field: user
      type: user
      score: 35
    threat_objects:
    - field: parent_process_name
      type: parent_process_name
  schedule: {}
  throttle:
    fields:
    - dest
    period: 86400s
  false_positives:
  - Installers that register COM DLLs from their extraction folder in Temp or ProgramData.
  baselines: []
  sigma:
    rules:
    - name: an0785_regsvr32_args
      logsource:
        product: windows
        category: process_creation
      detection:
        image:
        - Image|endswith: \regsvr32.exe
        - OriginalFileName: REGSVR32.EXE
        args:
          CommandLine|contains:
          - scrobj.dll
          - .sct
          - /i:http
          - -i:http
          - \AppData\Local\Temp\
          - \Downloads\
          - \Users\Public\
        condition: image and args
    - name: an0785_regsvr32_network
      logsource:
        product: windows
        category: network_connection
      detection:
        selection:
          Image|endswith: \regsvr32.exe
          Initiated: 'true'
        condition: selection
kql: null
esql: null
