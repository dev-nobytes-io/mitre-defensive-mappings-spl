# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0423
name: Analytic 0423
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0149#AN0423
  attack_release: '20.1'
  detection_strategy:
    id: DET0149
    name: Detection of Exfiltration Over Unencrypted Non-C2 Protocol
  technique:
    id: T1048.003
    name: Exfiltration Over Unencrypted Non-C2 Protocol
    tactics:
    - exfiltration
    usage_score: 48
  platforms:
  - Windows
  description: >-
    Detects data access or staging events followed by outbound data flows using unencrypted protocols (e.g., FTP,
    HTTP) initiated by unexpected processes or to rare destinations.
  log_source_references:
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0055
    dc_name: File Access
    name: WinEventLog:Security
    channel: EventCode=4663, 4670, 4656
  - dc: DC0085
    dc_name: Network Traffic Content
    name: NSM:Flow
    channel: http.log, ftp.log
  mutable_elements:
  - field: UnencryptedProtocolList
    description: Set of protocols considered suspicious for outbound data exfiltration (e.g., FTP, HTTP).
  - field: DataTransferSizeThreshold
    description: Defines what amount of outbound data is considered abnormal for a host/user.
  - field: ParentProcessDenylist
    description: Processes that should not launch FTP/HTTP clients (e.g., winword.exe launching ftp.exe).
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: UnencryptedProtocolList
    bind: macro
    name: mitre_an0423_unencryptedprotocollist
  - element: DataTransferSizeThreshold
    bind: macro
    name: mitre_an0423_datatransfersizethreshold
  - element: ParentProcessDenylist
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: File upload over cleartext HTTP, FTP or TFTP from the command line
  content_type: anomaly
  severity: medium
  summary: >-
    A command line uploads a file over an unencrypted protocol: ftp.exe running a command script (-s:), tftp PUT,
    or curl, PowerShell or certutil/bitsadmin posting or putting a file to an http:// or ftp:// URL. Native and
    built-in clients are a common way to push staged data out over a channel separate from C2.
  gaps: >-
    Uploads by custom tooling with no telling command line are left to the network analytics (AN0005 large cleartext
    uploads, AN1173 FTP/TFTP to the internet); bytes sent are not joined from Corelight here.
  data_components:
  - DC0032
  feeds:
  - sysmon
  tuning:
  - element: UnencryptedProtocolList
    bind: macro
    name: mitre_an0423_upload_commands
    default: >-
      ((Image="*\\ftp.exe" CommandLine="*-s:*") OR (Image="*\\tftp.exe" CommandLine="*put*") OR (CommandLine IN
      ("*http://*", "*ftp://*") CommandLine IN ("* -T *", "*--upload-file*", "* -F *", "*--form*", "*--data-binary*@*",
      "* -d @*", "*-InFile*", "*UploadFile*", "*UploadData*", "* /upload *", "*-Method Put*", "*-Method Post*")))
  - element: ParentProcessDenylist
    bind: lookup
    name: mitre_allowlist_processes
    note: Sanctioned transfer jobs (process_name with the parent that runs them).
  - element: DataTransferSizeThreshold
    bind: filter
    name: mitre_an0423_filter
  spl: |-
    `mitre_dc0032_sysmon` EventCode=1 `mitre_an0423_upload_commands`
    | `mitre_normalize_host`
    | eval process_name=lower(replace(Image, "^.*\\\\", "")), parent_process_name=lower(replace(ParentImage, "^.*\\\\", "")), url=mvindex(split(replace(CommandLine, "^.*?((?:https?|ftp)://\S+).*$", "\1"), " "), 0)
    | search `mitre_not_allowlisted_process`
    | stats count min(_time) as firstTime max(_time) as lastTime values(CommandLine) as process values(url) as url values(parent_process_name) as parent_process_name by dest user process_name
    | eval process=mvindex(process, 0, 9)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0423_filter`
  risk:
    message: Cleartext upload by $process_name$ on $dest$ as $user$
    objects:
    - field: dest
      type: system
      score: 35
    - field: user
      type: user
      score: 35
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 86400s
  false_positives:
  - >-
    Build agents and scripts pushing artefacts to internal HTTP or FTP repositories (allow-list them, or extend
    the filter to drop internal URLs).
  baselines: []
  sigma:
    rules:
    - name: an0423_ftp_tftp
      logsource:
        product: windows
        category: process_creation
      detection:
        ftp:
          Image|endswith: \ftp.exe
          CommandLine|contains: '-s:'
        tftp:
          Image|endswith: \tftp.exe
          CommandLine|contains: put
        condition: ftp or tftp
    - name: an0423_http_upload
      logsource:
        product: windows
        category: process_creation
      detection:
        cleartext:
          CommandLine|contains:
          - http://
          - ftp://
        upload:
          CommandLine|contains:
          - ' -T '
          - --upload-file
          - ' -F '
          - -InFile
          - UploadFile
          - ' /upload '
        condition: cleartext and upload
kql: null
esql: null
