# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1458
name: Analytic 1458
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0526#AN1458
  attack_release: '20.1'
  detection_strategy:
    id: DET0526
    name: Detect Archiving and Encryption of Collected Data (T1560)
  technique:
    id: T1560
    name: Archive Collected Data
    tactics:
    - collection
    usage_score: 70
  platforms:
  - Windows
  description: >-
    Detects adversarial archiving of files prior to exfiltration by correlating execution of compression/encryption
    utilities (e.g., makecab.exe, rar.exe, 7z.exe, powershell Compress-Archive) with subsequent creation of large
    compressed or encrypted files. Identifies abnormal process lineage involving crypt32.dll usage, command-line
    arguments invoking compression switches, and file write operations to temporary or staging directories.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  - dc: DC0016
    dc_name: Module Load
    name: WinEventLog:Sysmon
    channel: EventCode=7
  mutable_elements:
  - field: ArchiveExtensions
    description: List of file extensions treated as suspicious when created outside of expected paths.
  - field: ProcessAllowlist
    description: Known business processes permitted to use compression/encryption utilities.
  - field: FileSizeThresholdMB
    description: Minimum file size for flagging archive creation to reduce noise from benign small compressions.
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: ArchiveExtensions
    bind: lookup
    name: mitre_sensitive_paths
  - element: ProcessAllowlist
    bind: lookup
    name: mitre_allowlist_processes
  - element: FileSizeThresholdMB
    bind: macro
    name: mitre_an1458_filesizethresholdmb
curated:
  status: implemented
  title: Password-protected archive or archive written to a staging folder
  content_type: anomaly
  severity: medium
  summary: >-
    An archiver (7-Zip, RAR, WinRAR, makecab, tar, PowerShell Compress-Archive) run with a password or header encryption
    switch, or an archive file written to a staging folder (Public, ProgramData, Windows\Temp, PerfLogs, the Recycle
    Bin, user Temp). Encrypted archives in odd places are how collected data is packed before exfiltration.
  gaps: >-
    Sysmon 11 has no file size, so "large" archives are not distinguished; archiving through libraries (crypt32,
    .NET ZipFile) without an archiver process is only caught by the staging-folder leg.
  data_components:
  - DC0032
  - DC0039
  feeds:
  - sysmon
  tuning:
  - element: ProcessAllowlist
    bind: macro
    name: mitre_an1458_archivers
    default: >-
      (Image IN ("*\\7z.exe", "*\\7za.exe", "*\\7zr.exe", "*\\7zG.exe", "*\\rar.exe", "*\\WinRAR.exe", "*\\makecab.exe",
      "*\\tar.exe") OR OriginalFileName IN ("7z.exe", "7za.exe", "rar.exe", "WinRAR.exe", "makecab.exe") OR CommandLine="*Compress-Archive*")
  - element: ArchiveExtensions
    bind: macro
    name: mitre_an1458_archive_extensions
    default: TargetFilename IN ("*.zip", "*.7z", "*.rar", "*.cab", "*.tar", "*.tgz", "*.gz", "*.z01", "*.001")
  - element: StagingPaths
    bind: macro
    name: mitre_an1458_staging_paths
    default: >-
      TargetFilename IN ("C:\\Users\\Public\\*", "C:\\ProgramData\\*", "C:\\Windows\\Temp\\*", "C:\\PerfLogs\\*",
      "C:\\$Recycle.Bin\\*", "*\\AppData\\Local\\Temp\\*")
  - element: FileSizeThresholdMB
    bind: lookup
    name: mitre_allowlist_processes
    note: Backup agents and log shippers that archive into these folders.
  spl: |-
    (`mitre_dc0032_sysmon` EventCode=1 `mitre_an1458_archivers`)
    OR (`mitre_dc0039_sysmon` EventCode=11 `mitre_an1458_archive_extensions` `mitre_an1458_staging_paths`)
    | `mitre_normalize_host`
    | eval process_name=lower(replace(Image, "^.*\\\\", "")), protected=if(EventCode==1 AND match(CommandLine, "(?i)( -p| -hp| -mhe=on|-password)"), 1, 0), archive=if(EventCode==11, TargetFilename, null()), command=if(EventCode==1, CommandLine, null())
    | search `mitre_not_allowlisted_process`
    | stats count min(_time) as firstTime max(_time) as lastTime max(protected) as password_protected values(command) as process values(archive) as archive values(user) as user by dest process_name
    | where password_protected=1 OR isnotnull(archive)
    | eval archive=mvindex(archive, 0, 19), process=mvindex(process, 0, 9)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1458_filter`
  risk:
    message: $process_name$ packed data on $dest$ (password protected $password_protected$)
    objects:
    - field: dest
      type: system
      score: 35
    - field: user
      type: user
      score: 30
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process_name
    period: 86400s
  false_positives:
  - >-
    Backup and log-rotation jobs writing archives to ProgramData or Windows\Temp; users sending encrypted archives
    on purpose.
  baselines: []
  sigma:
    rules:
    - name: an1458_password_archive
      logsource:
        product: windows
        category: process_creation
      detection:
        archiver:
          Image|endswith:
          - \7z.exe
          - \7za.exe
          - \rar.exe
          - \WinRAR.exe
        password:
          CommandLine|contains:
          - ' -p'
          - ' -hp'
          - ' -mhe=on'
        condition: archiver and password
    - name: an1458_archive_in_staging
      logsource:
        product: windows
        category: file_event
      detection:
        selection:
          TargetFilename|endswith:
          - .zip
          - .7z
          - .rar
          - .cab
        staging:
          TargetFilename|contains:
          - \Users\Public\
          - \ProgramData\
          - \Windows\Temp\
          - \PerfLogs\
          - \$Recycle.Bin\
        condition: selection and staging
kql: null
esql: null
