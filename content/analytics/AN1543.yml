# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1543
name: Analytic 1543
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0560#AN1543
  attack_release: '20.1'
  detection_strategy:
    id: DET0560
    name: Detection of Valid Account Abuse Across Platforms
  technique:
    id: T1078
    name: Valid Accounts
    tactics:
    - stealth
    - persistence
    - privilege-escalation
    - initial-access
    usage_score: 129
  platforms:
  - Windows
  description: >-
    Detection of compromised or misused valid accounts via anomalous logon patterns, abnormal logon types, and inconsistent
    geographic or time-based activity across Windows endpoints.
  log_source_references:
  - dc: DC0067
    dc_name: Logon Session Creation
    name: WinEventLog:Security
    channel: EventCode=4624
  - dc: DC0002
    dc_name: User Account Authentication
    name: WinEventLog:Security
    channel: EventCode=4776, 4625
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  mutable_elements:
  - field: LogonType
    description: Flag unexpected logon types (e.g., Type 10 for remote interactive logins) for sensitive accounts.
  - field: TimeWindow
    description: Define acceptable hours for interactive logon activity (e.g., 9AM-6PM local).
  - field: GeoIPMismatch
    description: Trigger on location anomalies based on prior user behavior or policy.
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: LogonType
    bind: filter
    name: mitre_an1543_filter
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: GeoIPMismatch
    bind: lookup
    name: mitre_internal_networks
curated:
  status: implemented
  title: Interactive or remote logon by a service account
  content_type: anomaly
  severity: medium
  summary: >-
    An account whose role in the mitre_account_roles lookup is "service" logs on interactively (type 2), over RDP
    (type 10) or with cached credentials at the console (type 11). Service accounts should only produce service
    and network logons.
  gaps: >-
    Geographic and time-of-day anomalies, failed-logon patterns (4625/4776) and follow-on process activity from
    ATT&CK's description are not evaluated. The analytic only works once service accounts are listed in mitre_account_roles.
  data_components:
  - DC0067
  feeds:
  - wineventlog
  tuning:
  - element: LogonType
    bind: macro
    name: mitre_an1543_logon_types
    default: LogonType IN (2, 10, 11)
  - element: TimeWindow
    bind: lookup
    name: mitre_account_roles
    note: Populate with role=service rows; the shared macro mitre_accounts_with_role(1) reads it.
  spl: |-
    `mitre_dc0067_wineventlog` EventCode=4624 `mitre_an1543_logon_types`
    | `mitre_normalize_host`
    | eval user=TargetUserName, src=IpAddress
    | search `mitre_accounts_with_role(service)`
    | stats count min(_time) as firstTime max(_time) as lastTime values(LogonType) as logon_type values(src) as src by dest user
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1543_filter`
  risk:
    message: Service account $user$ logged on interactively to $dest$
    objects:
    - field: user
      type: user
      score: 45
    - field: dest
      type: system
      score: 30
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 14400s
  false_positives:
  - Administrators troubleshooting with a service account; accounts mislabelled in the lookup.
  baselines: []
  sigma:
    not_expressible: >-
      The condition depends on the mitre_account_roles lookup (which accounts are service accounts); Sigma has no
      lookup construct.
kql: null
esql: null
