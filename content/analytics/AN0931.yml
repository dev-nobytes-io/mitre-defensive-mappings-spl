# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0931
name: Analytic 0931
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0327#AN0931
  attack_release: '20.1'
  detection_strategy:
    id: DET0327
    name: Multi-event Detection Strategy for RDP-Based Remote Logins and Post-Access Activity
  technique:
    id: T1021.001
    name: Remote Desktop Protocol
    tactics:
    - lateral-movement
    usage_score: 114
  platforms:
  - Windows
  description: >-
    Remote Desktop (RDP) logon by a user followed by unusual process execution, file access, or lateral movement
    activity within a short timeframe.
  log_source_references:
  - dc: DC0067
    dc_name: Logon Session Creation
    name: WinEventLog:Security
    channel: EventCode=4624, 4648
  - dc: DC0088
    dc_name: Logon Session Metadata
    name: WinEventLog:Security
    channel: EventCode=4778, EventCode=4779
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  mutable_elements:
  - field: TimeWindow
    description: Temporal threshold to correlate login with post-login activity (e.g., 5 minutes)
  - field: UserContext
    description: Tune for non-admin users or service accounts expected to use RDP
  - field: ProcessList
    description: Define suspicious post-login processes such as cmd.exe, powershell.exe, certutil.exe
  - field: HostAccessPatterns
    description: Scope detection to uncommon or first-time access between source and destination hosts
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
  - element: ProcessList
    bind: lookup
    name: mitre_allowlist_processes
  - element: HostAccessPatterns
    bind: lookup
    name: mitre_allowlist_domains
curated:
  status: implemented
  title: First-seen RDP logon for a user, source and destination
  content_type: anomaly
  severity: medium
  summary: >-
    A RemoteInteractive logon (4624 type 10) for a user, source address and destination host combination that is
    not in the 30-day baseline of RDP logons. The baseline is built daily by an attached search.
  gaps: >-
    Post-logon process, file and network activity is not correlated in this search; pair the risk event with other
    analytics on the same host in the detection strategy. Session reconnects (4778) are not used.
  data_components:
  - DC0067
  feeds:
  - wineventlog
  tuning:
  - element: HostAccessPatterns
    bind: lookup
    name: mitre_baseline_rdp_pairs
    note: >-
      Written by the baseline search; do not edit by hand. Shorten or lengthen history with the baseline's dispatch.earliest_time.
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
    note: Accounts expected to RDP widely (jump-host admins).
  spl: |-
    `mitre_dc0067_wineventlog` EventCode=4624 LogonType=10
    | `mitre_normalize_host`
    | eval src=IpAddress, user=TargetUserName
    | search NOT src IN ("-", "127.0.0.1", "::1") `mitre_not_allowlisted_user`
    | lookup mitre_baseline_rdp_pairs user src dest OUTPUT first_seen
    | where isnull(first_seen)
    | stats count min(_time) as firstTime max(_time) as lastTime by dest user src
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0931_filter`
  risk:
    message: First-seen RDP logon to $dest$ by $user$ from $src$
    objects:
    - field: dest
      type: system
      score: 35
    - field: user
      type: user
      score: 35
    threat_objects:
    - field: src
      type: ip_address
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    - src
    period: 86400s
  false_positives:
  - New administrators, new jump hosts, DHCP address changes on the source.
  baselines:
  - name: RDP logon pairs
    description: User, source and destination combinations seen in RemoteInteractive logons.
    lookup: mitre_baseline_rdp_pairs
    fields:
    - user
    - src
    - dest
    - first_seen
    - last_seen
    - count
    cron: 17 3 * * *
    earliest: -30d@d
    latest: -1h@h
    search: |-
      `mitre_dc0067_wineventlog` EventCode=4624 LogonType=10
      | `mitre_normalize_host`
      | eval src=IpAddress, user=TargetUserName
      | stats min(_time) as first_seen max(_time) as last_seen count by user src dest
      | outputlookup mitre_baseline_rdp_pairs
  sigma:
    note: Sigma has no state, so the rule matches every RDP logon; apply the first-seen condition in the SIEM.
    level: low
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4624
        LogonType: 10
      local:
        IpAddress:
        - '-'
        - 127.0.0.1
        - ::1
      condition: selection and not local
kql: null
esql: null
