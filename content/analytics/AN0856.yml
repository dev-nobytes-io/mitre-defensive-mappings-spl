# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0856
name: Analytic 0856
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0307#AN0856
  attack_release: '20.1'
  detection_strategy:
    id: DET0307
    name: Detect Access to Unsecured Credential Files Across Platforms
  technique:
    id: T1552.001
    name: Credentials In Files
    tactics:
    - credential-access
    usage_score: 63
  platforms:
  - Windows
  description: >-
    Correlated file access to insecure credential files (e.g., *.env, *.xml, *.ps1) followed by suspicious process
    execution or authentication using retrieved credentials. Detected through Sysmon logs and Windows Security Event
    logs.
  log_source_references:
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0067
    dc_name: Logon Session Creation
    name: WinEventLog:Security
    channel: EventCode=4624, 4648
  mutable_elements:
  - field: FileNamePattern
    description: Patterns like *.env, *credential* can be tuned to reduce noise or catch custom implementations
  - field: ProcessAccessScope
    description: Defines scope of access (e.g., only untrusted parent processes or high-risk processes)
  - field: TimeWindow
    description: Time delta between credential file access and use in logon attempt
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: FileNamePattern
    bind: lookup
    name: mitre_sensitive_paths
  - element: ProcessAccessScope
    bind: lookup
    name: mitre_allowlist_processes
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: Command-line search for credentials in files
  content_type: ttp
  severity: medium
  summary: >-
    findstr or Select-String searching for password, cpassword or credential strings, or a shell, script host or
    copy utility touching well-known credential files (unattend.xml, sysprep, Group Policy Preferences XML, web.config,
    KeePass databases, SSH private keys, cloud CLI credential files).
  gaps: >-
    Reads by the adversary's own tooling through file APIs need Security 4663 with SACLs on the files; the follow-on
    use of found credentials (4624/4648) is left to the logon analytics and the risk correlation.
  data_components:
  - DC0032
  feeds:
  - sysmon
  tuning:
  - element: FileNamePattern
    bind: macro
    name: mitre_an0856_commands
    default: >-
      ((Image="*\\findstr.exe" CommandLine IN ("*password*", "*passwd*", "*cpassword*", "*pwd=*", "*credential*"))
      OR (CommandLine="*Select-String*" CommandLine IN ("*password*", "*cpassword*", "*credential*")) OR (Image
      IN ("*\\cmd.exe", "*\\powershell.exe", "*\\pwsh.exe", "*\\findstr.exe", "*\\more.com", "*\\xcopy.exe", "*\\robocopy.exe",
      "*\\certutil.exe") CommandLine IN ("*unattend.xml*", "*sysprep.xml*", "*sysprep.inf*", "*\\Groups.xml*", "*\\Services.xml*",
      "*\\ScheduledTasks.xml*", "*\\DataSources.xml*", "*\\.aws\\credentials*", "*\\.azure\\accessTokens.json*",
      "*.kdbx*", "*\\.ssh\\id_*", "*web.config*", "*\\.git-credentials*")))
  - element: ProcessAccessScope
    bind: lookup
    name: mitre_allowlist_processes
    note: Configuration-management and audit tools that grep configs for secrets on purpose.
  - element: TimeWindow
    bind: filter
    name: mitre_an0856_filter
  spl: |-
    `mitre_dc0032_sysmon` EventCode=1 `mitre_an0856_commands`
    | `mitre_normalize_host`
    | eval process_name=lower(replace(Image, "^.*\\\\", "")), parent_process_name=lower(replace(ParentImage, "^.*\\\\", ""))
    | search `mitre_not_allowlisted_process`
    | stats count min(_time) as firstTime max(_time) as lastTime values(CommandLine) as process values(parent_process_name) as parent_process_name by dest user process_name
    | eval process=mvindex(process, 0, 9)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0856_filter`
  risk:
    message: $user$ searched for credentials in files on $dest$ with $process_name$
    objects:
    - field: dest
      type: system
      score: 40
    - field: user
      type: user
      score: 50
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 86400s
  false_positives:
  - >-
    Administrators and auditors hunting for plaintext secrets; deployment scripts that template unattend.xml or
    web.config.
  baselines: []
  sigma:
    rules:
    - name: an0856_findstr_password
      logsource:
        product: windows
        category: process_creation
      detection:
        findstr:
          Image|endswith: \findstr.exe
          CommandLine|contains:
          - password
          - cpassword
          - credential
        select_string:
          CommandLine|contains|all:
          - Select-String
          - password
        condition: findstr or select_string
    - name: an0856_credential_files
      logsource:
        product: windows
        category: process_creation
      detection:
        tools:
          Image|endswith:
          - \cmd.exe
          - \powershell.exe
          - \pwsh.exe
          - \findstr.exe
          - \xcopy.exe
          - \robocopy.exe
        files:
          CommandLine|contains:
          - unattend.xml
          - sysprep.inf
          - \Groups.xml
          - \.aws\credentials
          - .kdbx
          - \.ssh\id_
          - .git-credentials
        condition: tools and files
kql: null
esql: null
