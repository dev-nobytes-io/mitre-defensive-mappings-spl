# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1325
name: Analytic 1325
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0483#AN1325
  attack_release: '20.1'
  detection_strategy:
    id: DET0483
    name: Detection of System Service Discovery Commands Across OS Platforms
  technique:
    id: T1007
    name: System Service Discovery
    tactics:
    - discovery
    usage_score: 88
  platforms:
  - Windows
  description: >-
    Enumeration of services via native CLI tools (e.g., `sc query`, `tasklist /svc`, `net start`) or API calls via
    PowerShell and WMI.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0064
    dc_name: Command Execution
    name: WinEventLog:PowerShell
    channel: EventCode=4103, 4104, 4105, 4106
  mutable_elements:
  - field: ProcessName
    description: Can be tuned to specific binaries used for service enumeration (e.g., `sc.exe`, `tasklist.exe`).
  - field: CommandLineMatch
    description: Filters for variations like `sc query`, `net start`, `Get-Service`.
  - field: ParentProcess
    description: Used to suppress known admin scripts or automation jobs.
derived:
  coverage: live
  suggested_content_type: hunting
  suggested_tuning:
  - element: ProcessName
    bind: lookup
    name: mitre_allowlist_processes
  - element: CommandLineMatch
    bind: macro
    name: mitre_an1325_commandlinematch
  - element: ParentProcess
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Service enumeration commands
  content_type: hunting
  severity: informational
  summary: >-
    Lists sc query/queryex/qc, tasklist /svc, net start with no service name, wmic service and Get-Service / Get-CimInstance
    Win32_Service, with parent process, in ten-minute buckets.
  gaps: >-
    Service enumeration through APIs and remote sc \\host queries are not separated out. No finding or risk.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: ProcessName
    bind: filter
    name: mitre_an1325_filter
  - element: CommandLineMatch
    bind: filter
    name: mitre_an1325_filter
  - element: ParentProcess
    bind: lookup
    name: mitre_allowlist_users
    note: >-
      Allow-list the accounts that run admin scripts rather than parents, which are usually cmd or PowerShell.
  spl: |-
    | tstats `mitre_summariesonly` count from `mitre_dc0032_dm` where `mitre_dc0032_dm_where`
        ((Processes.process_name="sc.exe" Processes.process IN ("* query*", "* qc *"))
          OR (Processes.process_name="tasklist.exe" Processes.process="*/svc*")
          OR (Processes.process_name IN ("net.exe", "net1.exe") Processes.process IN ("*net start", "*net1 start", "*net.exe start", "*net1.exe start"))
          OR (Processes.process_name="wmic.exe" Processes.process="*service*")
          OR (Processes.process_name IN ("powershell.exe", "pwsh.exe") Processes.process IN ("*get-service*", "*win32_service*")))
        by Processes.dest Processes.user Processes.parent_process_name Processes.process _time span=10m
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_user`
    | stats sum(count) as count dc(process) as distinct_commands values(process) as process by dest user parent_process_name _time
    | sort - count
    | `mitre_an1325_filter`
  risk:
    message: ''
    objects: []
    threat_objects: []
  schedule: {}
  throttle: {}
  false_positives:
  - Monitoring, patching and inventory tooling.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    level: informational
    detection:
      sc:
        Image|endswith: \sc.exe
        CommandLine|contains:
        - ' query'
        - ' qc '
      tasklist:
        Image|endswith: \tasklist.exe
        CommandLine|contains: /svc
      powershell:
        CommandLine|contains:
        - Get-Service
        - Win32_Service
      condition: sc or tasklist or powershell
kql: null
esql: null
