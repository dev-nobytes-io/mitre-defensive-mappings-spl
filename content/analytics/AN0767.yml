# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0767
name: Analytic 0767
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0275#AN0767
  attack_release: '20.1'
  detection_strategy:
    id: DET0275
    name: Detect Adversary Deobfuscation or Decoding of Files and Payloads
  technique:
    id: T1140
    name: Deobfuscate/Decode Files or Information
    tactics:
    - stealth
    usage_score: 410
  platforms:
  - Windows
  description: >-
    An adversary leverages built-in tools such as certutil.exe, powershell.exe, or copy.exe to decode, reassemble,
    or extract hidden malicious content from obfuscated containers or encoded formats. The decoding utility often
    spawns shortly after file staging or download and may be chained with script interpreters or further payload
    execution.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  - dc: DC0035
    dc_name: Process Access
    name: WinEventLog:Sysmon
    channel: EventCode=10
  mutable_elements:
  - field: ToolName
    description: May vary across environments (e.g., certutil, powershell, copy, expand, 7zip)
  - field: FileExtensionFilter
    description: Targets may use .txt, .cer, .enc, .b64, .zip, etc. to disguise payloads
  - field: CommandLineRegex
    description: Command syntax varies between base64 decoding, copy /b, and expand switches
  - field: TimeWindow
    description: Deobfuscation typically follows staging/download within a short timeframe
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: ToolName
    bind: lookup
    name: mitre_allowlist_processes
  - element: FileExtensionFilter
    bind: lookup
    name: mitre_sensitive_paths
  - element: CommandLineRegex
    bind: macro
    name: mitre_an0767_commandlineregex
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: Built-in utility used to decode or reassemble a payload
  content_type: ttp
  severity: medium
  summary: >-
    certutil -decode / -decodehex, cmd copy /b concatenation of files, PowerShell FromBase64String written to disk,
    or expand.exe unpacking into a user-writable directory.
  gaps: >-
    The staged-file creation that precedes decoding, the FileExtensionFilter element and the process-access leg
    are not correlated.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: ToolName
    bind: macro
    name: mitre_an0767_patterns
    default: >-
      ((Processes.process_name="certutil.exe" Processes.process IN ("*-decode *", "*/decode *", "*-decodehex *",
      "*/decodehex *")) OR (Processes.process_name="cmd.exe" Processes.process="*copy */b *+*") OR (Processes.process_name
      IN ("powershell.exe", "pwsh.exe") Processes.process="*frombase64string*" Processes.process IN ("*writeallbytes*",
      "*set-content*", "*out-file*")) OR (Processes.process_name="expand.exe" Processes.process IN ("*\\users\\*",
      "*\\programdata\\*", "*\\windows\\temp\\*")))
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where` `mitre_an0767_patterns`
        by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process
    | `drop_dm_object_name(Processes)`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0767_filter`
  risk:
    message: Payload decoded with $process_name$ on $dest$
    objects:
    - field: dest
      type: system
      score: 50
    - field: user
      type: user
      score: 40
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process
    period: 3600s
  false_positives:
  - Certificate administration with certutil -decode; build and packaging scripts.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      certutil:
        Image|endswith: \certutil.exe
        CommandLine|contains:
        - '-decode '
        - '/decode '
        - '-decodehex '
        - '/decodehex '
      copy_b:
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - 'copy '
        - '/b '
        - +
      powershell:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains:
        - WriteAllBytes
        - Set-Content
        - Out-File
        CommandLine|contains|all:
        - FromBase64String
      condition: certutil or copy_b or powershell
kql: null
esql: null
