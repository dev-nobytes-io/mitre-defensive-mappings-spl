# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0933
name: Analytic 0933
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0329#AN0933
  attack_release: '20.1'
  detection_strategy:
    id: DET0329
    name: Behavioral Detection for T1490 - Inhibit System Recovery
  technique:
    id: T1490
    name: Inhibit System Recovery
    tactics:
    - impact
    usage_score: 65
  platforms:
  - Windows
  description: >-
    Process chains that use native utilities (vssadmin, wbadmin, diskshadow, bcdedit, REAgentC, wmic) with arguments
    to delete shadow copies, disable recovery, or remove backup catalogs
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0040
    dc_name: File Deletion
    name: WinEventLog:Microsoft-Windows-Backup
    channel: Windows Backup Catalog deletion or catalog corruption
  - dc: DC0041
    dc_name: Service Metadata
    name: WinEventLog:System
    channel: Service stopped or RecoveryDisabled set via REAgentC
  - dc: DC0063
    dc_name: Windows Registry Key Modification
    name: WinEventLog:Sysmon
    channel: EventCode=13, 14
  mutable_elements:
  - field: TimeWindow
    description: Used to track rapid recovery feature changes over short intervals
  - field: CommandLinePattern
    description: Can be tuned to catch variations in destructive flags (/all, /quiet, -delete)
  - field: ParentProcessContext
    description: Tune based on common parent-child chains (e.g., powershell → diskshadow)
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: CommandLinePattern
    bind: macro
    name: mitre_an0933_commandlinepattern
  - element: ParentProcessContext
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Shadow copies, backups or boot recovery disabled with native utilities
  content_type: ttp
  severity: high
  summary: >-
    vssadmin, wbadmin, wmic, diskshadow, bcdedit, REAgentC or PowerShell is run with arguments that delete volume
    shadow copies, remove backup catalogs or disable Windows recovery. This is the standard pre-encryption step
    of ransomware.
  gaps: >-
    Backup-catalog deletion events, service state changes and the registry leg are not included; the command line
    alone is high fidelity.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: CommandLinePattern
    bind: macro
    name: mitre_an0933_patterns
    default: >-
      ((Processes.process_name="vssadmin.exe" Processes.process IN ("*delete*shadows*", "*resize*shadowstorage*"))
      OR (Processes.process_name="wbadmin.exe" Processes.process IN ("*delete*catalog*", "*delete*systemstatebackup*",
      "*delete*backup*")) OR (Processes.process_name="wmic.exe" Processes.process="*shadowcopy*delete*") OR (Processes.process_name="diskshadow.exe"
      Processes.process IN ("*delete*shadows*", "*/s *")) OR (Processes.process_name="bcdedit.exe" Processes.process
      IN ("*recoveryenabled*no*", "*bootstatuspolicy*ignoreallfailures*")) OR (Processes.process_name="reagentc.exe"
      Processes.process="*/disable*") OR (Processes.process_name IN ("powershell.exe", "pwsh.exe") Processes.process
      IN ("*win32_shadowcopy*delete*", "*win32_shadowcopy*remove-*")))
  - element: ParentProcessContext
    bind: lookup
    name: mitre_allowlist_processes
    note: >-
      Backup products that prune shadow copies (process_name column matches the utility; prefer the filter macro
      to scope by parent).
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where` `mitre_an0933_patterns`
        by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_process`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0933_filter`
  risk:
    message: System recovery inhibited with $process_name$ on $dest$
    objects:
    - field: dest
      type: system
      score: 80
    - field: user
      type: user
      score: 60
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process_name
    period: 3600s
  false_positives:
  - Backup software resizing shadow storage; administrators running diskshadow scripts.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      vssadmin:
        Image|endswith: \vssadmin.exe
        CommandLine|contains|all:
        - delete
        - shadows
      wbadmin:
        Image|endswith: \wbadmin.exe
        CommandLine|contains:
        - catalog
        - systemstatebackup
        CommandLine|contains|all:
        - delete
      wmic:
        Image|endswith: \wmic.exe
        CommandLine|contains|all:
        - shadowcopy
        - delete
      bcdedit:
        Image|endswith: \bcdedit.exe
        CommandLine|contains:
        - recoveryenabled
        - ignoreallfailures
      reagentc:
        Image|endswith: \reagentc.exe
        CommandLine|contains: /disable
      condition: 1 of them
kql: null
esql: null
