# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0061
name: Analytic 0061
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0021#AN0061
  attack_release: '20.1'
  detection_strategy:
    id: DET0021
    name: Behavioral Detection for Service Stop across Platforms
  technique:
    id: T1489
    name: Service Stop
    tactics:
    - impact
    usage_score: 64
  platforms:
  - Windows
  description: >-
    Adversary disables or stops critical services (e.g., Exchange, SQL, AV, endpoint monitoring) using native utilities
    or API calls, often preceding destructive actions (T1485, T1486). Behavioral chain: Elevated execution context
    + stop-service or sc.exe or ChangeServiceConfigW + terminated or disabled service + possible follow-up file
    manipulation.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0088
    dc_name: Logon Session Metadata
    name: WinEventLog:Security
    channel: EventCode=4672
  - dc: DC0060
    dc_name: Service Creation
    name: WinEventLog:System
    channel: EventCode=7036
  - dc: DC0041
    dc_name: Service Metadata
    name: WinEventLog:Sysmon
    channel: EventCode=4
  mutable_elements:
  - field: TimeWindow
    description: Time span between elevated privilege use and critical service stop
  - field: ServiceName
    description: Service names of interest (e.g., MSExchangeIS, SQLSERVERAGENT)
  - field: ParentProcess
    description: Upstream process lineage leading to service stop
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: ServiceName
    bind: filter
    name: mitre_an0061_filter
  - element: ParentProcess
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Burst of service stop or disable commands
  content_type: anomaly
  severity: medium
  summary: >-
    One user on one host runs several distinct service stop, delete or disable commands (net stop, sc stop/delete/config
    disabled, taskkill /f, Stop-Service, Set-Service Disabled) within ten minutes. Ransomware and wipers stop databases,
    mail and backup services this way before encrypting.
  gaps: >-
    The resulting service state changes (7036) and privilege assignment (4672) are not correlated; the ServiceName
    element is not used to weight critical services.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_an0061_threshold
    default: '5'
    note: Distinct stop/disable command lines per host and user per 10-minute bucket.
  - element: ParentProcess
    bind: lookup
    name: mitre_allowlist_users
    note: Patching and deployment accounts that stop services in bulk.
  spl: |-
    | tstats `mitre_summariesonly` count from `mitre_dc0032_dm` where `mitre_dc0032_dm_where`
        ((Processes.process_name IN ("net.exe", "net1.exe") Processes.process="* stop *")
          OR (Processes.process_name="sc.exe" Processes.process IN ("* stop *", "* delete *", "*start=*disabled*"))
          OR (Processes.process_name="taskkill.exe" Processes.process="*/f*")
          OR (Processes.process_name IN ("powershell.exe", "pwsh.exe") Processes.process IN ("*stop-service*", "*set-service*disabled*")))
        by Processes.dest Processes.user Processes.process _time span=10m
    | `drop_dm_object_name(Processes)`
    | stats sum(count) as count min(_time) as firstTime max(_time) as lastTime dc(process) as distinct_commands values(process) as process by dest user _time
    | where distinct_commands >= `mitre_an0061_threshold`
    | search `mitre_not_allowlisted_user`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0061_filter`
  risk:
    message: $distinct_commands$ service stop commands on $dest$ by $user$ in ten minutes
    objects:
    - field: dest
      type: system
      score: 50
    - field: user
      type: user
      score: 40
  schedule:
    earliest: -30m@m
    latest: -5m@m
  throttle:
    fields:
    - dest
    - user
    period: 3600s
  false_positives:
  - Patch orchestration, application upgrades and clean shutdown scripts.
  baselines: []
  sigma:
    rules:
    - name: an0061_service_stop_command
      logsource:
        product: windows
        category: process_creation
      detection:
        net:
          Image|endswith:
          - \net.exe
          - \net1.exe
          CommandLine|contains: ' stop '
        sc:
          Image|endswith: \sc.exe
          CommandLine|contains:
          - ' stop '
          - ' delete '
          - disabled
        taskkill:
          Image|endswith: \taskkill.exe
          CommandLine|contains: /f
        powershell:
          CommandLine|contains:
          - Stop-Service
          - Set-Service
        condition: net or sc or taskkill or powershell
    correlation:
      type: value_count
      group-by:
      - Computer
      - User
      timespan: 10m
      condition:
        field: CommandLine
        gte: 5
kql: null
esql: null
