# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1124
name: Analytic 1124
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0400#AN1124
  attack_release: '20.1'
  detection_strategy:
    id: DET0400
    name: Behavioral Detection of DNS Tunneling and Application Layer Abuse
  technique:
    id: T1071.004
    name: DNS
    tactics:
    - command-and-control
    usage_score: 68
  platforms:
  - Network Devices
  description: >-
    Detects clients issuing DNS queries with high volume, long subdomain lengths, encoded payload patterns, or to
    known malicious infrastructure; indicative of DNS-based C2 channels.
  log_source_references:
  - dc: DC0085
    dc_name: Network Traffic Content
    name: NSM:Flow
    channel: dns.log
  mutable_elements:
  - field: DomainReputationFeed
    description: List of suspicious/malicious C2 domains
  - field: QueryRatePerClient
    description: Tunable burst rate per IP per second
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: DomainReputationFeed
    bind: lookup
    name: mitre_allowlist_domains
  - element: QueryRatePerClient
    bind: macro
    name: mitre_an1124_queryrateperclient
curated:
  status: implemented
  title: DNS tunnelling pattern from a client (network view)
  content_type: anomaly
  severity: medium
  summary: >-
    Corelight dns.log: in ten minutes one client either queries many distinct names under one parent domain or sends
    a query with a very long subdomain portion. Reports NXDOMAIN counts and query types for triage.
  gaps: >-
    Domain reputation (DomainReputationFeed) is not consulted here; add your threat-intelligence lookup in the filter
    macro or rely on ES threat matching. Parent-domain extraction is the last two labels.
  data_components:
  - DC0085
  feeds:
  - corelight
  tuning:
  - element: QueryRatePerClient
    bind: macro
    name: mitre_an1124_query_threshold
    default: '200'
    note: Distinct query names under one parent domain per client per 10 minutes.
  - element: QueryLengthThreshold (implementation)
    bind: macro
    name: mitre_an1124_length_threshold
    default: '50'
    note: Characters in the subdomain portion of a single query.
  - element: DomainReputationFeed
    bind: lookup
    name: mitre_allowlist_domains
    note: Inverse use; domains known to be benign are excluded. Reputation feeds belong in the filter macro.
  spl: |-
    `mitre_dc0085_corelight` `mitre_st_corelight_dns`
    | `mitre_normalize_zeek`
    | eval query=lower(query)
    | where isnotnull(query) AND NOT like(query, "%.arpa") AND NOT like(query, "%.local")
    | lookup mitre_allowlist_domains domain as query OUTPUT reason as allow_reason
    | where isnull(allow_reason)
    | eval labels=split(query, "."), label_count=mvcount(labels), parent_domain=mvjoin(mvindex(labels, -2, -1), "."), subdomain_length=if(label_count > 2, len(query) - len(parent_domain) - 1, 0)
    | bin _time span=10m
    | stats count min(_time) as firstTime max(_time) as lastTime dc(query) as unique_queries max(subdomain_length) as max_subdomain_length sum(eval(if(rcode_name=="NXDOMAIN", 1, 0))) as nxdomain_count values(qtype_name) as query_types by src parent_domain _time
    | where unique_queries >= `mitre_an1124_query_threshold` OR max_subdomain_length >= `mitre_an1124_length_threshold`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1124_filter`
  risk:
    message: $src$ shows DNS tunnelling patterns towards $parent_domain$
    objects:
    - field: src
      type: system
      score: 45
    threat_objects:
    - field: parent_domain
      type: domain
  schedule:
    earliest: -30m@m
    latest: -5m@m
  throttle:
    fields:
    - src
    - parent_domain
    period: 14400s
  false_positives:
  - >-
    Internal resolvers forwarding for many clients (the resolver becomes the source), CDNs, and security products
    using DNS for lookups.
  baselines: []
  sigma:
    note: The rule matches a single very long query name; the distinct-name rate is left to the SPL.
    logsource:
      product: zeek
      service: dns
    detection:
      selection:
        query|re: ^[^.]{50,}\.|^([^.]+\.){1,6}[^.]{40,}\.
      condition: selection
kql: null
esql: null
