# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1399
name: Analytic 1399
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0508#AN1399
  attack_release: '20.1'
  detection_strategy:
    id: DET0508
    name: Behavioral Detection of Process Injection Across Platforms
  technique:
    id: T1055
    name: Process Injection
    tactics:
    - stealth
    - privilege-escalation
    usage_score: 110
  platforms:
  - Windows
  description: >-
    Detects process injection by correlating memory manipulation API calls (e.g., VirtualAllocEx, WriteProcessMemory),
    suspicious thread creation (e.g., CreateRemoteThread), and unusual DLL loads within another process's context.
  log_source_references:
  - dc: DC0035
    dc_name: Process Access
    name: WinEventLog:Sysmon
    channel: EventCode=10
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0016
    dc_name: Module Load
    name: WinEventLog:Sysmon
    channel: EventCode=7
  - dc: DC0021
    dc_name: OS API Execution
    name: etw:Microsoft-Windows-Kernel-Process
    channel: API calls
  mutable_elements:
  - field: AccessMask
    description: Specific access rights used during process handle acquisition, e.g., PROCESS_VM_WRITE
  - field: TimeWindow
    description: Time correlation window between API calls and thread creation events
  - field: InjectedProcessList
    description: Known high-value targets often abused for injection (e.g., lsass.exe, explorer.exe)
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: AccessMask
    bind: filter
    name: mitre_an1399_filter
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: InjectedProcessList
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Remote thread created in a high-value process
  content_type: anomaly
  severity: medium
  summary: >-
    Sysmon EventCode 8 (CreateRemoteThread) where the target is a commonly injected process (lsass, explorer, svchost,
    winlogon, browsers, dllhost, rundll32, notepad, werfault) and the source is not a Windows system process or
    an allow-listed product.
  gaps: >-
    Memory allocation and write API calls, handle access masks (EventCode 10) and unusual module loads are not correlated;
    injection without CreateRemoteThread (APC, section mapping, hollowing) is not seen by this event.
  data_components:
  - DC0035
  feeds:
  - sysmon
  tuning:
  - element: InjectedProcessList
    bind: macro
    name: mitre_an1399_targets
    default: >-
      TargetImage IN ("*\\lsass.exe", "*\\explorer.exe", "*\\svchost.exe", "*\\winlogon.exe", "*\\services.exe",
      "*\\spoolsv.exe", "*\\notepad.exe", "*\\rundll32.exe", "*\\dllhost.exe", "*\\regsvr32.exe", "*\\werfault.exe",
      "*\\msedge.exe", "*\\chrome.exe", "*\\firefox.exe", "*\\iexplore.exe")
  - element: AccessMask
    bind: lookup
    name: mitre_allowlist_processes
    note: >-
      Not an access mask; products that legitimately inject (EDR, accessibility and screen-sharing tools) are excluded
      by source process name.
  spl: |-
    `mitre_dc0035_sysmon` EventCode=8 `mitre_an1399_targets`
        NOT SourceImage IN ("C:\\Windows\\System32\\csrss.exe", "C:\\Windows\\System32\\wininit.exe", "C:\\Windows\\System32\\winlogon.exe", "C:\\Windows\\System32\\services.exe", "C:\\Windows\\System32\\svchost.exe", "C:\\Windows\\System32\\lsass.exe", "C:\\Windows\\System32\\wbem\\WmiPrvSE.exe", "C:\\Windows\\System32\\dwm.exe", "C:\\Program Files\\Windows Defender\\*", "C:\\ProgramData\\Microsoft\\Windows Defender\\*")
    | `mitre_normalize_host`
    | eval process_name=replace(SourceImage, "^.*\\\\", ""), target_process=replace(TargetImage, "^.*\\\\", ""), user=coalesce(SourceUser, user)
    | search `mitre_not_allowlisted_process`
    | stats count min(_time) as firstTime max(_time) as lastTime values(StartModule) as start_module values(StartFunction) as start_function by dest user SourceImage process_name target_process
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1399_filter`
  risk:
    message: $process_name$ created a remote thread in $target_process$ on $dest$
    objects:
    - field: dest
      type: system
      score: 50
    - field: user
      type: user
      score: 40
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process_name
    - target_process
    period: 3600s
  false_positives:
  - >-
    Security products, debuggers, screen readers, remote-support tools and some browser helper processes.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: create_remote_thread
    detection:
      selection:
        TargetImage|endswith:
        - \lsass.exe
        - \explorer.exe
        - \svchost.exe
        - \winlogon.exe
        - \services.exe
        - \spoolsv.exe
        - \notepad.exe
        - \rundll32.exe
        - \dllhost.exe
        - \regsvr32.exe
        - \werfault.exe
        - \msedge.exe
        - \chrome.exe
        - \firefox.exe
      filter_system:
        SourceImage:
        - C:\Windows\System32\csrss.exe
        - C:\Windows\System32\wininit.exe
        - C:\Windows\System32\winlogon.exe
        - C:\Windows\System32\services.exe
        - C:\Windows\System32\svchost.exe
        - C:\Windows\System32\lsass.exe
        - C:\Windows\System32\wbem\WmiPrvSE.exe
        - C:\Windows\System32\dwm.exe
      condition: selection and not filter_system
kql: null
esql: null
