# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0724
name: Analytic 0724
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0261#AN0724
  attack_release: '20.1'
  detection_strategy:
    id: DET0261
    name: Detection of Local Data Staging Prior to Exfiltration
  technique:
    id: T1074.001
    name: Local Data Staging
    tactics:
    - collection
    usage_score: 186
  platforms:
  - Windows
  description: >-
    Detects file reads across locations followed by writes to temp or staging directories, often compressed or encrypted,
    indicating local staging behavior.
  log_source_references:
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0055
    dc_name: File Access
    name: WinEventLog:Security
    channel: EventCode=4663, 4670, 4656
  mutable_elements:
  - field: StagingDirList
    description: Paths such as C:\Temp, C:\Windows\Tasks, etc.
  - field: ArchivingToolPatterns
    description: Matches to 7z.exe, rar.exe, zip.exe, or custom scripts.
  - field: TimeWindow
    description: How long to correlate file reads followed by compression.
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: StagingDirList
    bind: lookup
    name: mitre_sensitive_paths
  - element: ArchivingToolPatterns
    bind: lookup
    name: mitre_allowlist_processes
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: Many files written into a staging directory by one process
  content_type: anomaly
  severity: medium
  summary: >-
    One process instance (Sysmon ProcessGuid) creates a large number of files in staging directories (Temp, Users\Public,
    ProgramData, PerfLogs, Windows\Tasks, recycle bin) within five minutes: the collect-then-stage step before archiving
    and exfiltration.
  gaps: >-
    The 4663 reads of the source files are not correlated (they need SACLs). Requires Sysmon FileCreate logging
    for these directories; reduced configs often exclude Temp.
  data_components:
  - DC0039
  feeds:
  - sysmon
  tuning:
  - element: StagingDirList
    bind: macro
    name: mitre_an0724_staging_dirs
    default: >-
      TargetFilename IN ("*\\AppData\\Local\\Temp\\*", "*\\Windows\\Temp\\*", "*\\Users\\Public\\*", "*\\ProgramData\\*",
      "*\\PerfLogs\\*", "*\\Windows\\Tasks\\*", "*\\$Recycle.Bin\\*")
  - element: TimeWindow
    bind: macro
    name: mitre_an0724_file_threshold
    default: '50'
    note: Files per process per 5-minute bucket.
  - element: ArchivingToolPatterns
    bind: lookup
    name: mitre_allowlist_processes
    note: Installers, browsers and updaters that legitimately unpack many files (process_name column).
  spl: |-
    `mitre_dc0039_sysmon` EventCode=11 `mitre_an0724_staging_dirs`
    | `mitre_normalize_host`
    | eval process_name=replace(Image, "^.*\\\\", ""), directory=replace(TargetFilename, "\\\\[^\\\\]+$", "")
    | search `mitre_not_allowlisted_process`
    | bin _time span=5m
    | stats count as file_count dc(directory) as directories min(_time) as firstTime max(_time) as lastTime values(directory) as directory by dest user process_name ProcessGuid _time
    | where file_count >= `mitre_an0724_file_threshold`
    | eval directory=mvindex(directory, 0, 4)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0724_filter`
  risk:
    message: $process_name$ wrote $file_count$ files into staging directories on $dest$
    objects:
    - field: dest
      type: system
      score: 35
    - field: user
      type: user
      score: 30
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process_name
    period: 3600s
  false_positives:
  - Installers, browsers caching downloads, software deployment agents; allow-list them by process name.
  baselines: []
  sigma:
    rules:
    - name: an0724_staging_write
      logsource:
        product: windows
        category: file_event
      detection:
        selection:
          TargetFilename|contains:
          - \AppData\Local\Temp\
          - \Windows\Temp\
          - \Users\Public\
          - \ProgramData\
          - \PerfLogs\
          - \Windows\Tasks\
          - \$Recycle.Bin\
        condition: selection
    correlation:
      type: event_count
      group-by:
      - Computer
      - ProcessGuid
      timespan: 5m
      condition:
        gte: 50
kql: null
esql: null
