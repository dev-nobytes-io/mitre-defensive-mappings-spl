# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1185
name: Analytic 1185
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0421#AN1185
  attack_release: '20.1'
  detection_strategy:
    id: DET0421
    name: Detection Strategy for System Services Service Execution
  technique:
    id: T1569.002
    name: Service Execution
    tactics:
    - execution
    usage_score: 95
  platforms:
  - Windows
  description: >-
    Detection focuses on abnormal service executions initiated via service control manager APIs, sc.exe, net.exe,
    or PsExec creating temporary services. Defenders observe process creation of services.exe spawning non-standard
    binaries, registry changes in service keys followed by rapid execution, and network connections originating
    from processes tied to transient services. Correlation across process lineage, registry activity, and service
    logs provides strong signals of malicious service execution.
  log_source_references:
  - dc: DC0060
    dc_name: Service Creation
    name: WinEventLog:Security
    channel: EventCode=4697
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0063
    dc_name: Windows Registry Key Modification
    name: WinEventLog:Sysmon
    channel: EventCode=13, 14
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  mutable_elements:
  - field: ServiceBinaryAllowlist
    description: Known binaries/services expected to be invoked via services.exe
  - field: ParentProcessCorrelationWindow
    description: Time window for correlating service creation with execution events
  - field: RemoteExecutionHosts
    description: Approved remote hosts that may trigger service execution (e.g., via PsExec)
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: ServiceBinaryAllowlist
    bind: lookup
    name: mitre_allowlist_processes
  - element: ParentProcessCorrelationWindow
    bind: macro
    name: mitre_time_window(1)
  - element: RemoteExecutionHosts
    bind: lookup
    name: mitre_allowlist_domains
curated:
  status: implemented
  title: Service control manager started an unexpected binary
  content_type: anomaly
  severity: medium
  summary: >-
    services.exe starts a command interpreter or script host, or a binary whose path is outside the Windows, Program
    Files and Defender directories. Transient services created by PsExec, Impacket and sc.exe-based lateral movement
    look like this.
  gaps: >-
    Service-creation events, service-key registry writes and the network connection from the remote host are not
    correlated; RemoteExecutionHosts is not evaluated.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: ServiceBinaryAllowlist
    bind: macro
    name: mitre_an1185_expected_paths
    default: >-
      Processes.process_path IN ("c:\\windows\\system32\\*", "c:\\windows\\syswow64\\*", "c:\\windows\\microsoft.net\\*",
      "c:\\windows\\servicing\\*", "c:\\windows\\winsxs\\*", "c:\\program files\\*", "c:\\program files (x86)\\*",
      "c:\\programdata\\microsoft\\windows defender\\*")
    note: Directories services are expected to run from. Add vendor paths rather than removing the check.
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where` Processes.parent_process_name="services.exe" Processes.process_path="*\\*"
        (Processes.process_name IN ("cmd.exe", "powershell.exe", "pwsh.exe", "rundll32.exe", "regsvr32.exe", "mshta.exe", "wscript.exe", "cscript.exe") OR NOT `mitre_an1185_expected_paths`)
        by Processes.dest Processes.user Processes.process_name Processes.process_path Processes.process
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_process`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1185_filter`
  risk:
    message: services.exe started $process_name$ on $dest$
    objects:
    - field: dest
      type: system
      score: 40
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process_name
    period: 3600s
  false_positives:
  - Services installed outside Program Files, software deployment tools, and services that wrap cmd.exe.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      parent:
        ParentImage|endswith: \services.exe
      interpreter:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \rundll32.exe
        - \regsvr32.exe
        - \mshta.exe
        - \wscript.exe
        - \cscript.exe
      expected:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
        - C:\Windows\Microsoft.NET\
        - C:\Windows\servicing\
        - C:\Windows\WinSxS\
        - C:\Program Files\
        - C:\Program Files (x86)\
        - C:\ProgramData\Microsoft\Windows Defender\
      condition: parent and (interpreter or not expected)
kql: null
esql: null
