# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1468
name: Analytic 1468
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0530#AN1468
  attack_release: '20.1'
  detection_strategy:
    id: DET0530
    name: Multi-Event Detection for SMB Admin Share Lateral Movement
  technique:
    id: T1021.002
    name: SMB/Windows Admin Shares
    tactics:
    - lateral-movement
    usage_score: 103
  platforms:
  - Windows
  description: >-
    An SMB-based remote file share access followed by lateral movement actions such as remote service creation,
    task scheduling, or suspicious process execution on the target host using ADMIN$ or C$ shares.
  log_source_references:
  - dc: DC0067
    dc_name: Logon Session Creation
    name: WinEventLog:Security
    channel: EventCode=4624, 4648
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  mutable_elements:
  - field: ShareName
    description: Targeted admin share path, such as C$, ADMIN$, IPC$
  - field: TimeWindow
    description: Correlation window between remote file access and remote execution (e.g., 5-10 minutes)
  - field: UserContext
    description: Distinguish expected remote administrators vs. rare/first-time access by specific users
  - field: ProcessList
    description: >-
      List of suspicious binaries or tools executed post remote copy (e.g., cmd.exe, powershell.exe, runonce.exe)
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: ShareName
    bind: filter
    name: mitre_an1468_filter
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
  - element: ProcessList
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Shell or LOLBin executed inside a network logon session
  content_type: anomaly
  severity: medium
  summary: >-
    A process from a watch list (cmd, PowerShell, script hosts, rundll32, regsvr32, mshta, certutil, net, sc, schtasks,
    wmic, reg) runs on a host inside a logon session that was created by a network logon (4624 type 3) from another
    address. Sysmon's LogonId is joined to the 4624 TargetLogonId, so the source address and account of the remote
    execution are reported.
  gaps: >-
    The SMB file write to ADMIN$/C$ itself is not required (use Network Share Access 5145 in the detection strategy).
    Logons that started before the search window are missed.
  data_components:
  - DC0067
  - DC0032
  feeds:
  - wineventlog
  - sysmon
  tuning:
  - element: ProcessList
    bind: macro
    name: mitre_an1468_processes
    default: >-
      Image IN ("*\\cmd.exe", "*\\powershell.exe", "*\\pwsh.exe", "*\\wscript.exe", "*\\cscript.exe", "*\\mshta.exe",
      "*\\rundll32.exe", "*\\regsvr32.exe", "*\\certutil.exe", "*\\net.exe", "*\\net1.exe", "*\\sc.exe", "*\\schtasks.exe",
      "*\\wmic.exe", "*\\reg.exe")
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
    note: Remote administration and deployment accounts.
  - element: TimeWindow
    bind: filter
    name: mitre_an1468_filter
    note: The window is the search time range (default 65 minutes); change dispatch.earliest_time locally.
  spl: |-
    (`mitre_dc0067_wineventlog` EventCode=4624 LogonType=3 NOT TargetUserName="*$" NOT IpAddress IN ("-", "127.0.0.1", "::1"))
      OR (`mitre_dc0032_sysmon` EventCode=1 `mitre_an1468_processes`)
    | `mitre_normalize_host`
    | eval logon_id=lower(coalesce(TargetLogonId, LogonId))
    | stats min(_time) as firstTime max(_time) as lastTime dc(EventCode) as signals values(eval(if(EventCode==4624, IpAddress, null()))) as src values(eval(if(EventCode==4624, TargetUserName, null()))) as user values(Image) as process_path values(CommandLine) as process by dest logon_id
    | where signals=2
    | search `mitre_not_allowlisted_user`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1468_filter`
  risk:
    message: Remote execution on $dest$ from $src$ as $user$
    objects:
    - field: dest
      type: system
      score: 45
    - field: user
      type: user
      score: 45
    threat_objects:
    - field: src
      type: ip_address
  schedule:
    earliest: -65m@m
    latest: -5m@m
  throttle:
    fields:
    - dest
    - logon_id
    period: 14400s
  false_positives:
  - Remote management (SCCM, PDQ, WinRM-based tooling, vulnerability scanners with credentials).
  baselines: []
  sigma:
    note: >-
      The join between the logon and the process is expressed as a temporal correlation with a field alias for the
      logon id.
    rules:
    - name: an1468_network_logon
      logsource:
        product: windows
        service: security
      detection:
        selection:
          EventID: 4624
          LogonType: 3
        machine:
          TargetUserName|endswith: $
        local:
          IpAddress:
          - '-'
          - 127.0.0.1
          - ::1
        condition: selection and not machine and not local
    - name: an1468_session_process
      logsource:
        product: windows
        category: process_creation
      detection:
        selection:
          Image|endswith:
          - \cmd.exe
          - \powershell.exe
          - \pwsh.exe
          - \wscript.exe
          - \cscript.exe
          - \mshta.exe
          - \rundll32.exe
          - \regsvr32.exe
          - \certutil.exe
          - \net.exe
          - \net1.exe
          - \sc.exe
          - \schtasks.exe
          - \wmic.exe
          - \reg.exe
        condition: selection
    correlation:
      type: temporal
      aliases:
        logon_id:
          an1468_network_logon: TargetLogonId
          an1468_session_process: LogonId
      group-by:
      - Computer
      - logon_id
      timespan: 1h
kql: null
esql: null
