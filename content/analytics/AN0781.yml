# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0781
name: Analytic 0781
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0280#AN0781
  attack_release: '20.1'
  detection_strategy:
    id: DET0280
    name: Behavior-Based Registry Modification Detection on Windows
  technique:
    id: T1112
    name: Modify Registry
    tactics:
    - defense-impairment
    - persistence
    usage_score: 209
  platforms:
  - Windows
  description: >-
    Behavior chain involving abnormal registry modifications via CLI, PowerShell, WMI, or direct API calls, especially
    targeting persistence, privilege escalation, or defense evasion keys, potentially followed by service restart
    or process execution. Such as editing Notify/Userinit/Startup keys, or disabling SafeDllSearchMode.
  log_source_references:
  - dc: DC0063
    dc_name: Windows Registry Key Modification
    name: WinEventLog:Sysmon
    channel: EventCode=13, 14
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  mutable_elements:
  - field: RegistryKeyPathPatterns
    description: >-
      Environment-specific list of monitored or critical registry keys, e.g., Run, Services, Security Settings,
      LSASS
  - field: ParentProcessAllowList
    description: >-
      Allowlist of legitimate registry tools (e.g., regedit.exe, msiexec.exe); used to filter known safe writes
  - field: TimeWindow
    description: Correlate registry change with nearby process/service execution within a defined timeframe
  - field: SignatureCheck
    description: Flag unsigned executables or abnormal parent-child lineage performing registry modification
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: RegistryKeyPathPatterns
    bind: lookup
    name: mitre_sensitive_paths
  - element: ParentProcessAllowList
    bind: lookup
    name: mitre_allowlist_processes
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: SignatureCheck
    bind: filter
    name: mitre_an0781_filter
curated:
  status: implemented
  title: Security-relevant registry value modified
  content_type: ttp
  severity: medium
  summary: >-
    A value is set on a registry location that controls logon, credential handling or execution flow: Winlogon Userinit/Shell/Notify,
    LSA security, notification and authentication packages, RunAsPPL, DisableRestrictedAdmin, WDigest UseLogonCredential,
    Image File Execution Options Debugger, SilentProcessExit MonitorProcess, AppInit_DLLs, AppCertDlls, SafeDllSearchMode,
    EnableLUA and fDenyTSConnections. Uses raw Sysmon EventCode 13 so the writing process is available for allow-listing.
  gaps: >-
    The follow-on service restart or process execution and signature checks on the writing process are not correlated.
  data_components:
  - DC0063
  feeds:
  - sysmon
  tuning:
  - element: RegistryKeyPathPatterns
    bind: macro
    name: mitre_an0781_keys
    default: >-
      TargetObject IN ("*\\Winlogon\\Userinit", "*\\Winlogon\\Shell", "*\\Winlogon\\Notify\\*", "*\\Control\\Lsa\\Security
      Packages", "*\\Control\\Lsa\\Notification Packages", "*\\Control\\Lsa\\Authentication Packages", "*\\Control\\Lsa\\RunAsPPL",
      "*\\Control\\Lsa\\DisableRestrictedAdmin", "*\\WDigest\\UseLogonCredential", "*\\Image File Execution Options\\*\\Debugger",
      "*\\SilentProcessExit\\*\\MonitorProcess", "*\\Windows\\AppInit_DLLs", "*\\Session Manager\\AppCertDlls\\*",
      "*\\Session Manager\\SafeDllSearchMode", "*\\Policies\\System\\EnableLUA", "*\\Terminal Server\\fDenyTSConnections")
  - element: ParentProcessAllowList
    bind: lookup
    name: mitre_allowlist_processes
    note: Management tools that set these values by policy (process_name column is the writing process).
  spl: |-
    `mitre_dc0063_sysmon` EventCode=13 `mitre_an0781_keys`
    | `mitre_normalize_host`
    | eval process_name=replace(Image, "^.*\\\\", ""), registry_path=TargetObject, registry_value_data=Details
    | search `mitre_not_allowlisted_process`
    | stats count min(_time) as firstTime max(_time) as lastTime values(registry_value_data) as registry_value_data by dest user process_name registry_path
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0781_filter`
  risk:
    message: Sensitive registry value $registry_path$ modified on $dest$ by $process_name$
    objects:
    - field: dest
      type: system
      score: 55
    - field: user
      type: user
      score: 45
    threat_objects:
    - field: registry_path
      type: registry_path
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - registry_path
    period: 3600s
  false_positives:
  - Group policy processing, OS upgrades and hardening baselines set several of these values.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: registry_set
    detection:
      selection:
        TargetObject|contains:
        - \Winlogon\Userinit
        - \Winlogon\Shell
        - \Winlogon\Notify\
        - \Control\Lsa\Security Packages
        - \Control\Lsa\Notification Packages
        - \Control\Lsa\Authentication Packages
        - \Control\Lsa\RunAsPPL
        - \Control\Lsa\DisableRestrictedAdmin
        - \WDigest\UseLogonCredential
        - \SilentProcessExit\
        - \Windows\AppInit_DLLs
        - \Session Manager\AppCertDlls\
        - \Session Manager\SafeDllSearchMode
        - \Policies\System\EnableLUA
        - \Terminal Server\fDenyTSConnections
      ifeo:
        TargetObject|contains: \Image File Execution Options\
        TargetObject|endswith: \Debugger
      condition: selection or ifeo
kql: null
esql: null
