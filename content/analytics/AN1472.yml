# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1472
name: Analytic 1472
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0532#AN1472
  attack_release: '20.1'
  detection_strategy:
    id: DET0532
    name: Detection of Event Log Clearing on Windows via Behavioral Chain
  technique:
    id: T1685.005
    name: Clear Windows Event Logs
    tactics:
    - defense-impairment
    usage_score: 59
  platforms:
  - Windows
  description: >-
    Detects behavioral sequence where an adversary gains elevated privileges and clears event logs using native
    binaries (e.g., wevtutil), PowerShell, or direct file deletion of .evtx files.
  log_source_references:
  - dc: DC0038
    dc_name: Application Log Content
    name: WinEventLog:Security
    channel: EventCode=1102
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0040
    dc_name: File Deletion
    name: WinEventLog:Sysmon
    channel: EventCode=23
  mutable_elements:
  - field: TimeWindow
    description: Time range between log-clearing command and 1102 event; tunable to reduce false positives
  - field: UserContext
    description: Filter by admin/elevated users; allow tuning to detect abuse of high-privilege accounts
  - field: CommandLinePattern
    description: Match common variations of log-clearing commands like `Remove-EventLog`, `wevtutil cl`
  - field: TargetLogName
    description: Scope detection to Security, System, Application, or custom logs based on environment
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
  - element: CommandLinePattern
    bind: macro
    name: mitre_an1472_commandlinepattern
  - element: TargetLogName
    bind: filter
    name: mitre_an1472_filter
curated:
  status: implemented
  title: Windows event log cleared
  content_type: ttp
  severity: high
  summary: >-
    The Security log was cleared (EventCode 1102), another log was cleared (System EventCode 104), or a process
    ran wevtutil cl / Clear-EventLog / Remove-EventLog. Results are grouped per host and user and list which of
    the three signals were seen.
  gaps: Direct deletion of .evtx files (Sysmon EventCode 23) is not included.
  data_components:
  - DC0038
  - DC0032
  feeds:
  - wineventlog
  - sysmon
  tuning:
  - element: CommandLinePattern
    bind: macro
    name: mitre_an1472_commands
    default: >-
      ((Image="*\\wevtutil.exe" CommandLine IN ("* cl *", "* clear-log *")) OR CommandLine IN ("*Clear-EventLog*",
      "*Remove-EventLog*", "*ClearEventLog(*"))
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
    note: Accounts that clear logs as part of imaging or lab resets.
  spl: |-
    (`mitre_dc0038_wineventlog` EventCode IN (1102, 104)) OR (`mitre_dc0032_sysmon` EventCode=1 `mitre_an1472_commands`)
    | `mitre_normalize_host`
    | eval signal=case(EventCode==1102, "security_log_cleared", EventCode==104, "event_log_cleared", true(), "clear_command")
    | search `mitre_not_allowlisted_user`
    | stats count min(_time) as firstTime max(_time) as lastTime values(signal) as signals values(CommandLine) as process values(Channel) as cleared_log by dest user
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1472_filter`
  risk:
    message: Event log cleared on $dest$ by $user$
    objects:
    - field: dest
      type: system
      score: 70
    - field: user
      type: user
      score: 70
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 3600s
  false_positives:
  - Image preparation (sysprep), lab resets and some log-rotation scripts.
  baselines: []
  sigma:
    rules:
    - name: an1472_security_log_cleared
      logsource:
        product: windows
        service: security
      detection:
        selection:
          EventID: 1102
        condition: selection
    - name: an1472_system_log_cleared
      logsource:
        product: windows
        service: system
      detection:
        selection:
          EventID: 104
        condition: selection
    - name: an1472_clear_command
      logsource:
        product: windows
        category: process_creation
      detection:
        wevtutil:
          Image|endswith: \wevtutil.exe
          CommandLine|contains:
          - ' cl '
          - ' clear-log '
        powershell:
          CommandLine|contains:
          - Clear-EventLog
          - Remove-EventLog
        condition: wevtutil or powershell
kql: null
esql: null
