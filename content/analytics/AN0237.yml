# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0237
name: Analytic 0237
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0087#AN0237
  attack_release: '20.1'
  detection_strategy:
    id: DET0087
    name: Encrypted or Encoded File Payload Detection Strategy
  technique:
    id: T1027.013
    name: Encrypted/Encoded File
    tactics:
    - stealth
    usage_score: 310
  platforms:
  - Windows
  description: >-
    Detection of processes that load or decode encrypted/encoded files in memory and subsequently execute or inject
    them, indicating payload unpacking or memory-resident malware.
  log_source_references:
  - dc: DC0016
    dc_name: Module Load
    name: WinEventLog:Sysmon
    channel: EventCode=7
  - dc: DC0035
    dc_name: Process Access
    name: WinEventLog:Sysmon
    channel: EventCode=10
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  mutable_elements:
  - field: Image
    description: Path of decoder utilities (e.g., certutil.exe, powershell.exe) can vary across environments.
  - field: CommandLine
    description: Base64/hex strings used may change per encoded payload.
  - field: TimeWindow
    description: The duration between file decode and execution may differ across implementations.
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: Image
    bind: lookup
    name: mitre_allowlist_processes
  - element: CommandLine
    bind: macro
    name: mitre_an0237_commandline
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: Binary written by a decoding utility, then executed or loaded
  content_type: ttp
  severity: high
  summary: >-
    A decoder or script host (certutil, PowerShell, cmd, expand, esentutl, extrac32, makecab, mshta, script hosts)
    writes a PE file into a staging path (Sysmon 11), and within ten minutes that file is started as a process (Sysmon
    1) or loaded as a module (Sysmon 7). Joined on host and file path: the decode-then-run chain ATT&CK describes,
    where AN0767 only sees the decode command.
  gaps: >-
    In-memory decoding with no file on disk (reflective loading) is not visible here; AN1095 covers its injection
    step. The process-access leg is not used.
  data_components:
  - DC0039
  - DC0032
  - DC0016
  feeds:
  - sysmon
  tuning:
  - element: Image
    bind: macro
    name: mitre_an0237_decoders
    default: >-
      Image IN ("*\\certutil.exe", "*\\powershell.exe", "*\\pwsh.exe", "*\\cmd.exe", "*\\expand.exe", "*\\esentutl.exe",
      "*\\extrac32.exe", "*\\makecab.exe", "*\\mshta.exe", "*\\wscript.exe", "*\\cscript.exe")
  - element: CommandLine
    bind: macro
    name: mitre_an0237_staging_paths
    default: >-
      ("*\\AppData\\*", "*\\Users\\Public\\*", "*\\Windows\\Temp\\*", "*\\ProgramData\\*", "*\\PerfLogs\\*", "*\\Downloads\\*")
    note: >-
      A parenthesised value list used with IN for the written file, the started image and the loaded module.
  - element: TimeWindow
    bind: macro
    name: mitre_an0237_window_seconds
    default: '600'
  spl: |-
    (`mitre_dc0039_sysmon` EventCode=11 `mitre_an0237_decoders` TargetFilename IN `mitre_an0237_staging_paths` TargetFilename IN ("*.exe", "*.dll", "*.scr", "*.cpl", "*.ocx", "*.sys"))
      OR (`mitre_dc0032_sysmon` EventCode=1 Image IN `mitre_an0237_staging_paths`)
      OR (`mitre_dc0016_sysmon` EventCode=7 ImageLoaded IN `mitre_an0237_staging_paths`)
    | `mitre_normalize_host`
    | eval file_path=lower(case(EventCode==11, TargetFilename, EventCode==7, ImageLoaded, true(), Image))
    | eval decode_time=if(EventCode==11, _time, null()), run_time=if(EventCode!=11, _time, null()), decoder=if(EventCode==11, replace(Image, "^.*\\\\", ""), null()), how=case(EventCode==1, "executed", EventCode==7, "loaded")
    | stats min(decode_time) as decode_time min(run_time) as run_time values(decoder) as decoder values(how) as how values(eval(if(EventCode==7, Image, null()))) as loaded_by values(user) as user by dest file_path
    | where isnotnull(decode_time) AND isnotnull(run_time) AND run_time >= decode_time AND run_time - decode_time <= `mitre_an0237_window_seconds`
    | eval process_name=mvindex(decoder, 0), firstTime=decode_time, lastTime=run_time
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0237_filter`
  risk:
    message: $process_name$ wrote $file_path$ on $dest$, which then ran
    objects:
    - field: dest
      type: system
      score: 70
    - field: user
      type: user
      score: 60
    threat_objects:
    - field: file_path
      type: file_path
    - field: process_name
      type: process_name
  schedule:
    earliest: -75m@m
    latest: -5m@m
  throttle:
    fields:
    - dest
    - file_path
    period: 86400s
  false_positives:
  - Installers launched from PowerShell or cmd that unpack and run their own binaries from Temp.
  baselines: []
  sigma:
    note: >-
      Uses a temporal (unordered) correlation because the Splunk pySigma backend does not implement temporal_ordered;
      the Splunk search enforces the order and also matches module loads.
    rules:
    - name: an0237_decoder_writes_pe
      logsource:
        product: windows
        category: file_event
      detection:
        selection:
          Image|endswith:
          - \certutil.exe
          - \powershell.exe
          - \pwsh.exe
          - \cmd.exe
          - \expand.exe
          - \esentutl.exe
          - \extrac32.exe
          - \mshta.exe
          - \wscript.exe
          - \cscript.exe
          TargetFilename|endswith:
          - .exe
          - .dll
          - .scr
          - .cpl
          TargetFilename|contains:
          - \AppData\
          - \Users\Public\
          - \Windows\Temp\
          - \ProgramData\
          - \PerfLogs\
        condition: selection
    - name: an0237_staged_pe_runs
      logsource:
        product: windows
        category: process_creation
      detection:
        selection:
          Image|contains:
          - \AppData\
          - \Users\Public\
          - \Windows\Temp\
          - \ProgramData\
          - \PerfLogs\
        condition: selection
    correlation:
      type: temporal
      aliases:
        file_path:
          an0237_decoder_writes_pe: TargetFilename
          an0237_staged_pe_runs: Image
      group-by:
      - Computer
      - file_path
      timespan: 10m
kql: null
esql: null
