# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1369
name: Analytic 1369
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0497#AN1369
  attack_release: '20.1'
  detection_strategy:
    id: DET0497
    name: Detection of Defense Impairment through Disabled or Modified Tools across OS Platforms.
  technique:
    id: T1685
    name: Disable or Modify Tools
    tactics:
    - defense-impairment
    usage_score: 173
  platforms:
  - Windows
  description: >-
    Detection of adversary behavior that disables or modifies security tools, including killing AV/EDR processes,
    stopping services, altering Sysmon registry keys, or tampering with exclusion lists. Defenders observe process/service
    termination, registry modification, and abnormal absence of expected telemetry.
  log_source_references:
  - dc: DC0060
    dc_name: Service Creation
    name: WinEventLog:System
    channel: EventCode=7045
  - dc: DC0033
    dc_name: Process Termination
    name: WinEventLog:Sysmon
    channel: EventCode=5
  - dc: DC0063
    dc_name: Windows Registry Key Modification
    name: WinEventLog:Sysmon
    channel: EventCode=13, 14
  mutable_elements:
  - field: ProcessNameExclusions
    description: List of expected administrative tools/processes to prevent false positives.
  - field: TimeWindow
    description: Defines correlation window linking process termination, registry edits, and service stoppage.
  - field: ServiceNames
    description: Customizable list of security service names per enterprise deployment.
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: ProcessNameExclusions
    bind: lookup
    name: mitre_allowlist_processes
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: ServiceNames
    bind: filter
    name: mitre_an1369_filter
curated:
  status: implemented
  title: Security tooling disabled or tampered with
  content_type: ttp
  severity: high
  summary: >-
    Registry values that turn off Microsoft Defender protections, add Defender exclusions, or change the start type
    of security services are written; or sc/net/taskkill/fltmc/PowerShell is used to stop, delete, disable or unload
    security services and drivers (Defender, Sysmon, Trellix, Splunk forwarder).
  gaps: >-
    Termination of security processes by API (Sysmon EventCode 5 does not record the killer) and the resulting absence
    of telemetry are not detected here; pair with a data-check on Host Status.
  data_components:
  - DC0063
  - DC0032
  feeds:
  - sysmon
  tuning:
  - element: ServiceNames
    bind: macro
    name: mitre_an1369_security_services
    default: >-
      CommandLine IN ("*windefend*", "*wdnissvc*", "*mpssvc*", "*sysmon*", "*mfemms*", "*mfefire*", "*mfevtp*",
      "*macmnsvc*", "*masvc*", "*mcshield*", "*mfetp*", "*splunkforwarder*", "*splunkd*")
    note: Service, driver and process names of your security stack. Trellix names vary by product version.
  - element: ProcessNameExclusions
    bind: lookup
    name: mitre_allowlist_processes
    note: Management tooling that legitimately reconfigures security products.
  spl: |-
    (`mitre_dc0063_sysmon` EventCode=13 TargetObject IN ("*\\Windows Defender\\DisableAntiSpyware", "*\\Windows Defender\\DisableAntiVirus", "*\\Real-Time Protection\\Disable*", "*\\Windows Defender\\Exclusions\\*", "*\\Windows Defender\\Features\\TamperProtection", "*\\Services\\WinDefend\\Start", "*\\Services\\Sysmon*\\Start", "*\\Services\\mfe*\\Start", "*\\Services\\SplunkForwarder\\Start"))
      OR (`mitre_dc0032_sysmon` EventCode=1 ((Image IN ("*\\sc.exe", "*\\net.exe", "*\\net1.exe", "*\\taskkill.exe", "*\\fltmc.exe") CommandLine IN ("* stop *", "* delete *", "*disabled*", "*/im *", "* unload *") `mitre_an1369_security_services`) OR CommandLine IN ("*Set-MpPreference*-Disable*", "*Add-MpPreference*-Exclusion*", "*Uninstall-WindowsFeature*Windows-Defender*")))
    | `mitre_normalize_host`
    | eval signal=if(EventCode==13, "registry_tamper", "service_or_process_tamper"), process_name=replace(Image, "^.*\\\\", "")
    | search `mitre_not_allowlisted_process`
    | stats count min(_time) as firstTime max(_time) as lastTime values(signal) as signals values(TargetObject) as registry_path values(Details) as registry_value_data values(CommandLine) as process by dest user process_name
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1369_filter`
  risk:
    message: Security tooling tampered with on $dest$ by $process_name$
    objects:
    - field: dest
      type: system
      score: 70
    - field: user
      type: user
      score: 60
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process_name
    period: 3600s
  false_positives:
  - >-
    Product upgrades and migrations, group policy or management agents writing Defender policy, administrators adding
    exclusions.
  baselines: []
  sigma:
    rules:
    - name: an1369_registry_tamper
      logsource:
        product: windows
        category: registry_set
      detection:
        selection:
          TargetObject|contains:
          - \Windows Defender\DisableAntiSpyware
          - \Real-Time Protection\Disable
          - \Windows Defender\Exclusions\
          - \Services\WinDefend\Start
          - \Services\Sysmon
        condition: selection
    - name: an1369_service_tamper
      logsource:
        product: windows
        category: process_creation
      detection:
        tool:
          Image|endswith:
          - \sc.exe
          - \net.exe
          - \net1.exe
          - \taskkill.exe
          - \fltmc.exe
          CommandLine|contains:
          - ' stop '
          - ' delete '
          - disabled
          - '/im '
          - ' unload '
        target:
          CommandLine|contains:
          - windefend
          - wdnissvc
          - sysmon
          - mfemms
          - mfefire
          - mcshield
          - splunkforwarder
        powershell:
          CommandLine|contains:
          - Set-MpPreference
          - Add-MpPreference
          CommandLine|contains|all:
          - '-'
        condition: (tool and target) or powershell
kql: null
esql: null
