# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0903
name: Analytic 0903
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0320#AN0903
  attack_release: '20.1'
  detection_strategy:
    id: DET0320
    name: Detection of System Network Connections Discovery Across Platforms
  technique:
    id: T1049
    name: System Network Connections Discovery
    tactics:
    - discovery
    usage_score: 137
  platforms:
  - Windows
  description: >-
    Detects usage of commands or binaries (e.g., netstat, PowerShell Get-NetTCPConnection) and WMI or API calls
    to enumerate local or remote network connections.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0064
    dc_name: Command Execution
    name: WinEventLog:PowerShell
    channel: EventCode=4103, 4104, 4105, 4106
  mutable_elements:
  - field: SuspiciousParentProcesses
    description: Non-standard binaries launching PowerShell or netstat (e.g., winword.exe spawning powershell.exe).
  - field: TimeWindow
    description: Correlates discovery behavior before lateral movement or credential access.
  - field: CommandPatternList
    description: Regex or keyword patterns to match discovery utilities (e.g., `netstat`, `Get-NetTCPConnection`).
derived:
  coverage: live
  suggested_content_type: hunting
  suggested_tuning:
  - element: SuspiciousParentProcesses
    bind: lookup
    name: mitre_allowlist_processes
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: CommandPatternList
    bind: macro
    name: mitre_an0903_commandpatternlist
curated:
  status: implemented
  title: Network connection and session discovery commands
  content_type: hunting
  severity: informational
  summary: >-
    Lists hosts and users enumerating connections and sessions: netstat, net session, net use, Get-NetTCPConnection,
    Get-NetUDPEndpoint, Get-SmbSession, Get-SmbConnection, with parent process.
  gaps: PowerShell script-block content and API-level enumeration are not included. No finding or risk.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: SuspiciousParentProcesses
    bind: filter
    name: mitre_an0903_filter
    note: e.g. search parent_process_name IN ("winword.exe", "wscript.exe", "mshta.exe", "w3wp.exe").
  - element: CommandPatternList
    bind: lookup
    name: mitre_allowlist_users
    note: Monitoring accounts that poll connections.
  spl: |-
    | tstats `mitre_summariesonly` count from `mitre_dc0032_dm` where `mitre_dc0032_dm_where`
        (Processes.process_name="netstat.exe"
          OR (Processes.process_name IN ("net.exe", "net1.exe") Processes.process IN ("* session*", "* use*"))
          OR (Processes.process_name IN ("powershell.exe", "pwsh.exe") Processes.process IN ("*get-nettcpconnection*", "*get-netudpendpoint*", "*get-smbsession*", "*get-smbconnection*")))
        by Processes.dest Processes.user Processes.parent_process_name Processes.process _time span=10m
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_user`
    | stats sum(count) as count dc(process) as distinct_commands values(process) as process by dest user parent_process_name _time
    | sort - count
    | `mitre_an0903_filter`
  risk:
    message: ''
    objects: []
    threat_objects: []
  schedule: {}
  throttle: {}
  false_positives:
  - Monitoring agents, VPN clients and administrators.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    level: informational
    detection:
      netstat:
        Image|endswith: \netstat.exe
      net:
        Image|endswith:
        - \net.exe
        - \net1.exe
        CommandLine|contains:
        - ' session'
        - ' use'
      powershell:
        CommandLine|contains:
        - Get-NetTCPConnection
        - Get-NetUDPEndpoint
        - Get-SmbSession
        - Get-SmbConnection
      condition: netstat or net or powershell
kql: null
esql: null
