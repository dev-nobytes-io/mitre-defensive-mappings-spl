# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0105
name: Analytic 0105
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0037#AN0105
  attack_release: '20.1'
  detection_strategy:
    id: DET0037
    name: Detect Suspicious Access to Browser Credential Stores
  technique:
    id: T1555.003
    name: Credentials from Web Browsers
    tactics:
    - credential-access
    usage_score: 119
  platforms:
  - Windows
  description: >-
    Detects unauthorized access to web browser credential stores (e.g., Chrome Login Data, Edge Credential Locker)
    by processes other than the browser itself. Correlates file reads of credential databases with subsequent API
    calls to `CryptUnprotectData` or memory inspection attempts.
  log_source_references:
  - dc: DC0055
    dc_name: File Access
    name: WinEventLog:Security
    channel: EventCode=4663, 4670, 4656
  - dc: DC0035
    dc_name: Process Access
    name: WinEventLog:Sysmon
    channel: EventCode=10
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  mutable_elements:
  - field: MonitoredPaths
    description: Browser-specific credential storage paths such as Chrome Login Data, IE Credential Locker
  - field: TimeWindow
    description: Correlation window between file read and process memory/API access
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: MonitoredPaths
    bind: lookup
    name: mitre_sensitive_paths
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: Browser credential store read by a non-browser process
  content_type: ttp
  severity: high
  summary: >-
    A process that is not the browser itself opens a browser credential or cookie database (Chromium Login Data,
    Cookies and Local State; Firefox logins.json and key4.db), seen as Security 4663 on the file.
  gaps: >-
    DPAPI CryptUnprotectData calls and process-memory inspection are not visible. Requires object-access auditing
    with SACLs on the browser profile files; without them this search returns nothing.
  data_components:
  - DC0055
  feeds:
  - wineventlog
  tuning:
  - element: MonitoredPaths
    bind: macro
    name: mitre_an0105_paths
    default: >-
      ObjectName IN ("*\\Google\\Chrome\\User Data\\*\\Login Data*", "*\\Microsoft\\Edge\\User Data\\*\\Login Data*",
      "*\\BraveSoftware\\*\\Login Data*", "*\\User Data\\Local State", "*\\User Data\\*\\Cookies", "*\\User Data\\*\\Network\\Cookies",
      "*\\Mozilla\\Firefox\\Profiles\\*\\logins.json", "*\\Mozilla\\Firefox\\Profiles\\*\\key4.db")
  - element: TimeWindow
    bind: lookup
    name: mitre_allowlist_processes
    note: >-
      No window is used; allow-list backup, sync and endpoint-security processes that read browser profiles.
  spl: |-
    `mitre_dc0055_wineventlog` EventCode=4663 `mitre_an0105_paths`
        NOT ProcessName IN ("*\\chrome.exe", "*\\msedge.exe", "*\\msedgewebview2.exe", "*\\firefox.exe", "*\\brave.exe", "*\\opera.exe", "*\\MsMpEng.exe", "*\\SearchProtocolHost.exe")
    | `mitre_normalize_host`
    | eval process_name=replace(ProcessName, "^.*\\\\", ""), file_path=ObjectName
    | search `mitre_not_allowlisted_process`
    | stats count min(_time) as firstTime max(_time) as lastTime values(file_path) as file_path values(AccessMask) as access_mask by dest user process_name
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0105_filter`
  risk:
    message: $process_name$ read browser credential stores on $dest$
    objects:
    - field: dest
      type: system
      score: 65
    - field: user
      type: user
      score: 65
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process_name
    period: 3600s
  false_positives:
  - Profile backup and migration tools, password managers importing saved logins, endpoint DLP agents.
  baselines: []
  sigma:
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4663
        ObjectName|contains:
        - \User Data\Default\Login Data
        - \User Data\Local State
        - \Network\Cookies
        - \Firefox\Profiles\
      firefox_files:
        ObjectName|endswith:
        - \logins.json
        - \key4.db
        - Login Data
        - Local State
        - Cookies
      browser:
        ProcessName|endswith:
        - \chrome.exe
        - \msedge.exe
        - \msedgewebview2.exe
        - \firefox.exe
        - \brave.exe
        - \opera.exe
        - \MsMpEng.exe
      condition: selection and firefox_files and not browser
kql: null
esql: null
