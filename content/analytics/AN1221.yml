# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1221
name: Analytic 1221
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0441#AN1221
  attack_release: '20.1'
  detection_strategy:
    id: DET0441
    name: Detection of Suspicious Scheduled Task Creation and Execution on Windows
  technique:
    id: T1053.005
    name: Scheduled Task
    tactics:
    - execution
    - persistence
    - privilege-escalation
    usage_score: 260
  platforms:
  - Windows
  description: >-
    Detects the creation, modification, or deletion of scheduled tasks through Task Scheduler, WMI, PowerShell,
    or API-based methods followed by execution from svchost.exe or taskeng.exe. Includes detection of hidden or
    anomalous scheduled tasks, especially those created under SYSTEM or suspicious user contexts.
  log_source_references:
  - dc: DC0001
    dc_name: Scheduled Job Creation
    name: WinEventLog:Security
    channel: EventCode=4698
  - dc: DC0012
    dc_name: Scheduled Job Modification
    name: WinEventLog:Security
    channel: EventCode=4702
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  - dc: DC0063
    dc_name: Windows Registry Key Modification
    name: WinEventLog:Sysmon
    channel: EventCode=13, 14
  mutable_elements:
  - field: TimeWindow
    description: >-
      Defines threshold for grouping task creation and associated execution within suspicious time proximity.
  - field: UserContext
    description: >-
      Filters based on non-standard user accounts or execution under SYSTEM when not typical for the environment.
  - field: TaskNamePattern
    description: >-
      Allows defenders to flag obfuscated, randomized, or suspicious task names outside normal conventions.
  - field: CommandLineEntropyThreshold
    description: Flags tasks executing heavily obfuscated PowerShell or binary blobs via base64 or encoding.
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
  - element: TaskNamePattern
    bind: macro
    name: mitre_an1221_tasknamepattern
  - element: CommandLineEntropyThreshold
    bind: macro
    name: mitre_an1221_commandlineentropythreshold
curated:
  status: implemented
  title: Scheduled task registered with an interpreter or user-writable action
  content_type: anomaly
  severity: medium
  summary: >-
    A scheduled task is created (Security 4698) whose XML definition runs a script interpreter or proxy execution
    utility, or a binary from AppData, Users\Public, Temp or ProgramData, or carries an encoded command.
  gaps: >-
    Task modification (4702), the task file and TaskCache registry writes, and execution of the task action are
    not correlated. TaskNamePattern and CommandLineEntropyThreshold are not evaluated.
  data_components:
  - DC0001
  feeds:
  - wineventlog
  tuning:
  - element: TaskNamePattern
    bind: macro
    name: mitre_an1221_suspicious_actions
    default: >-
      TaskContent IN ("*\\AppData\\*", "*\\Users\\Public\\*", "*\\Windows\\Temp\\*", "*\\ProgramData\\*", "*powershell*",
      "*pwsh*", "*cmd.exe*", "*wscript*", "*cscript*", "*mshta*", "*rundll32*", "*regsvr32*", "*frombase64*", "*
      -enc *", "*-encodedcommand*")
    note: >-
      Matches the task XML. Do not add http:// patterns; every task definition contains the schema namespace URL.
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
    note: Deployment and patching accounts that register tasks.
  spl: |-
    `mitre_dc0001_wineventlog` EventCode=4698 `mitre_an1221_suspicious_actions`
    | `mitre_normalize_host`
    | eval task_name=TaskName
    | search `mitre_not_allowlisted_user`
    | stats count min(_time) as firstTime max(_time) as lastTime values(TaskContent) as task_content by dest user task_name
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1221_filter`
  risk:
    message: Suspicious scheduled task $task_name$ created on $dest$ by $user$
    objects:
    - field: dest
      type: system
      score: 35
    - field: user
      type: user
      score: 35
    threat_objects:
    - field: task_name
      type: task
  schedule: {}
  throttle:
    fields:
    - dest
    - task_name
    period: 86400s
  false_positives:
  - >-
    Software updaters and management agents register PowerShell or cmd based tasks; add the creating account to
    mitre_allowlist_users.
  baselines: []
  sigma:
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4698
        TaskContent|contains:
        - \AppData\
        - \Users\Public\
        - \Windows\Temp\
        - \ProgramData\
        - powershell
        - cmd.exe
        - wscript
        - cscript
        - mshta
        - rundll32
        - regsvr32
        - FromBase64
        - -EncodedCommand
      condition: selection
kql: null
esql: null
