# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1095
name: Analytic 1095
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0389#AN1095
  attack_release: '20.1'
  detection_strategy:
    id: DET0389
    name: Behavioral Detection of DLL Injection via Windows API
  technique:
    id: T1055.001
    name: Dynamic-link Library Injection
    tactics:
    - stealth
    - privilege-escalation
    usage_score: 78
  platforms:
  - Windows
  description: >-
    Detects DLL injection through correlation of memory allocation and writing to remote process memory (e.g., VirtualAllocEx,
    WriteProcessMemory), followed by remote thread creation (e.g., CreateRemoteThread) that loads a suspicious or
    unsigned DLL using LoadLibrary or reflective loading.
  log_source_references:
  - dc: DC0035
    dc_name: Process Access
    name: WinEventLog:Sysmon
    channel: EventCode=10
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0016
    dc_name: Module Load
    name: WinEventLog:Sysmon
    channel: EventCode=7
  - dc: DC0048
    dc_name: Named Pipe Metadata
    name: WinEventLog:Sysmon
    channel: EventCode=17
  mutable_elements:
  - field: InjectedDLLSignatureStatus
    description: Whether the DLL is unsigned, untrusted, or loaded from a non-standard path
  - field: TimeWindow
    description: Temporal correlation threshold between memory operations and thread creation
  - field: TargetProcessList
    description: List of sensitive or high-value processes targeted for injection (e.g., explorer.exe, winlogon.exe)
  - field: ParentProcessAnomalyThreshold
    description: Degree of deviation from expected parent-child lineage
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: InjectedDLLSignatureStatus
    bind: filter
    name: mitre_an1095_filter
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: TargetProcessList
    bind: lookup
    name: mitre_allowlist_processes
  - element: ParentProcessAnomalyThreshold
    bind: macro
    name: mitre_an1095_parentprocessanomalythreshold
curated:
  status: implemented
  title: Process handle opened for injection from unbacked memory
  content_type: anomaly
  severity: high
  summary: >-
    Sysmon ProcessAccess (10) into a high-value process with an access mask that allows writing memory and creating
    threads, where the call stack contains UNKNOWN frames: the opening code runs from memory with no backing module,
    typical of shellcode and reflectively loaded DLLs preparing to inject.
  gaps: >-
    The follow-on remote thread (AN1399), named pipes and unusual module loads are not correlated. Needs Sysmon
    ProcessAccess logging with CallTrace for the listed targets.
  data_components:
  - DC0035
  feeds:
  - sysmon
  tuning:
  - element: TargetProcessList
    bind: macro
    name: mitre_an1095_targets
    default: >-
      TargetImage IN ("*\\explorer.exe", "*\\winlogon.exe", "*\\lsass.exe", "*\\svchost.exe", "*\\spoolsv.exe",
      "*\\services.exe", "*\\dllhost.exe", "*\\rundll32.exe", "*\\notepad.exe", "*\\msedge.exe", "*\\chrome.exe",
      "*\\firefox.exe")
  - element: InjectedDLLSignatureStatus
    bind: macro
    name: mitre_an1095_access_masks
    default: >-
      GrantedAccess IN ("0x1fffff", "0x1f0fff", "0x1f3fff", "0x143a", "0x147a", "0x1478", "0x0438", "0x043a", "0x0028",
      "0x002a", "0x0020")
    note: >-
      Masks including PROCESS_VM_WRITE and/or PROCESS_CREATE_THREAD; signature status of the injected DLL is not
      visible in this event.
  - element: ParentProcessAnomalyThreshold
    bind: lookup
    name: mitre_allowlist_processes
    note: Security products and JIT runtimes whose stacks contain UNKNOWN frames (process_name column).
  spl: |-
    `mitre_dc0035_sysmon` EventCode=10 `mitre_an1095_targets` `mitre_an1095_access_masks` CallTrace="*UNKNOWN(*"
    | `mitre_normalize_host`
    | eval process_name=replace(SourceImage, "^.*\\\\", ""), target_process=replace(TargetImage, "^.*\\\\", ""), user=coalesce(SourceUser, user)
    | search `mitre_not_allowlisted_process`
    | stats count min(_time) as firstTime max(_time) as lastTime values(GrantedAccess) as granted_access values(target_process) as target_process by dest user SourceImage process_name
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1095_filter`
  risk:
    message: $process_name$ on $dest$ opened a high-value process for injection from unbacked memory
    objects:
    - field: dest
      type: system
      score: 55
    - field: user
      type: user
      score: 45
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process_name
    period: 3600s
  false_positives:
  - >-
    .NET and JavaScript JIT runtimes and some security products produce UNKNOWN frames; allow-list them by source
    process.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_access
    detection:
      selection:
        TargetImage|endswith:
        - \explorer.exe
        - \winlogon.exe
        - \lsass.exe
        - \svchost.exe
        - \spoolsv.exe
        - \services.exe
        - \dllhost.exe
        - \rundll32.exe
        - \notepad.exe
        GrantedAccess:
        - '0x1fffff'
        - '0x1f0fff'
        - '0x1f3fff'
        - '0x143a'
        - '0x147a'
        - '0x1478'
        - '0x0438'
        - '0x043a'
        - '0x0028'
        - '0x002a'
        - '0x0020'
        CallTrace|contains: UNKNOWN(
      condition: selection
kql: null
esql: null
