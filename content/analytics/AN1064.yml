# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1064
name: Analytic 1064
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0378#AN1064
  attack_release: '20.1'
  detection_strategy:
    id: DET0378
    name: Behavioral Detection of Obfuscated Files or Information
  technique:
    id: T1027
    name: Obfuscated Files or Information
    tactics:
    - stealth
    usage_score: 188
  platforms:
  - Windows
  description: >-
    Correlates script execution or suspicious parent processes with creation or modification of encoded, compressed,
    or encrypted file formats (e.g., .zip, .7z, .enc) and abnormal command-line syntax or PowerShell obfuscation.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  mutable_elements:
  - field: PayloadEntropyThreshold
    description: Tune entropy threshold to distinguish obfuscation from legitimate compression
  - field: TimeWindow
    description: Adjust correlation window between script execution and encoded file creation
  - field: SuspiciousParentProcessList
    description: Customize based on environment to include LOLBins or admin tools misused for obfuscation
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: PayloadEntropyThreshold
    bind: macro
    name: mitre_an1064_payloadentropythreshold
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: SuspiciousParentProcessList
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Script host or LOLBin writing an archive or encoded file to a staging path
  content_type: anomaly
  severity: low
  summary: >-
    PowerShell, cmd, script hosts, mshta, certutil or rundll32 create an archive or encoded container (zip, 7z,
    rar, cab, gz, iso, enc, b64, dat) in a user-writable staging path (Sysmon 11).
  gaps: >-
    Payload entropy is not measurable from file events. Command-line obfuscation is AN1394; encoded payloads being
    decoded and run is AN0237.
  data_components:
  - DC0039
  feeds:
  - sysmon
  tuning:
  - element: SuspiciousParentProcessList
    bind: macro
    name: mitre_an1064_writers
    default: >-
      Image IN ("*\\powershell.exe", "*\\pwsh.exe", "*\\cmd.exe", "*\\wscript.exe", "*\\cscript.exe", "*\\mshta.exe",
      "*\\certutil.exe", "*\\rundll32.exe", "*\\regsvr32.exe", "*\\makecab.exe", "*\\diantz.exe")
  - element: PayloadEntropyThreshold
    bind: macro
    name: mitre_an1064_containers
    default: >-
      TargetFilename IN ("*.zip", "*.7z", "*.rar", "*.cab", "*.gz", "*.iso", "*.enc", "*.b64", "*.dat", "*.bin")
      TargetFilename IN ("*\\AppData\\Local\\Temp\\*", "*\\Windows\\Temp\\*", "*\\Users\\Public\\*", "*\\ProgramData\\*",
      "*\\PerfLogs\\*", "*\\Windows\\Tasks\\*")
    note: Entropy is not available; container type and location stand in for it.
  - element: TimeWindow
    bind: filter
    name: mitre_an1064_filter
  spl: |-
    `mitre_dc0039_sysmon` EventCode=11 `mitre_an1064_writers` `mitre_an1064_containers`
    | `mitre_normalize_host`
    | eval process_name=replace(Image, "^.*\\\\", "")
    | stats count min(_time) as firstTime max(_time) as lastTime values(TargetFilename) as file_path by dest user process_name
    | eval file_path=mvindex(file_path, 0, 9)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1064_filter`
  risk:
    message: $process_name$ wrote archive or encoded files to a staging path on $dest$
    objects:
    - field: dest
      type: system
      score: 25
    - field: user
      type: user
      score: 20
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process_name
    period: 3600s
  false_positives:
  - Installers and update scripts unpacking archives into Temp; log-collection scripts.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \cmd.exe
        - \wscript.exe
        - \cscript.exe
        - \mshta.exe
        - \certutil.exe
        - \rundll32.exe
        - \regsvr32.exe
        - \makecab.exe
        - \diantz.exe
        TargetFilename|endswith:
        - .zip
        - .7z
        - .rar
        - .cab
        - .gz
        - .iso
        - .enc
        - .b64
        TargetFilename|contains:
        - \AppData\Local\Temp\
        - \Windows\Temp\
        - \Users\Public\
        - \ProgramData\
        - \PerfLogs\
        - \Windows\Tasks\
      condition: selection
kql: null
esql: null
