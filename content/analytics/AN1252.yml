# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1252
name: Analytic 1252
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0455#AN1252
  attack_release: '20.1'
  detection_strategy:
    id: DET0455
    name: Abuse of PowerShell for Arbitrary Execution
  technique:
    id: T1059.001
    name: PowerShell
    tactics:
    - execution
    usage_score: 341
  platforms:
  - Windows
  description: >-
    Detects behavioral chains where PowerShell is launched with encoded commands, unusual parent processes, or suspicious
    modules loaded, potentially followed by network connections or child process spawning. Supports detection of
    both direct (powershell.exe) and indirect (.NET automation) invocations.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0064
    dc_name: Command Execution
    name: WinEventLog:PowerShell
    channel: EventCode=4103, 4104, 4105, 4106
  - dc: DC0034
    dc_name: Process Metadata
    name: WinEventLog:PowerShell
    channel: EventCode=400, 403
  - dc: DC0016
    dc_name: Module Load
    name: WinEventLog:Sysmon
    channel: EventCode=7
  mutable_elements:
  - field: CommandLinePattern
    description: Regex pattern for encoded, obfuscated, or hidden PowerShell arguments (e.g., '-enc', '-nop').
  - field: ParentProcessName
    description: Filter based on abnormal parents like Excel, WinWord, or mshta spawning PowerShell.
  - field: TimeWindow
    description: Scope detection to off-hours, lateral movement timeframes, or non-maintenance windows.
  - field: LoadedModuleList
    description: Tuneable to monitor rare or never-before-seen .NET assemblies tied to PowerShell abuse.
  - field: ScriptBlockLengthThreshold
    description: >-
      Adjustable threshold for length of script blocks logged by Event ID 4104 (useful for filtering noise).
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: CommandLinePattern
    bind: macro
    name: mitre_an1252_commandlinepattern
  - element: ParentProcessName
    bind: lookup
    name: mitre_allowlist_processes
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: LoadedModuleList
    bind: macro
    name: mitre_an1252_loadedmodulelist
  - element: ScriptBlockLengthThreshold
    bind: macro
    name: mitre_an1252_scriptblocklengththreshold
curated:
  status: implemented
  title: PowerShell started with encoded, download or in-memory execution arguments
  content_type: anomaly
  severity: medium
  summary: >-
    powershell.exe or pwsh.exe is started with an encoded command, a download cradle, Invoke-Expression, reflective
    assembly loading, or a hidden no-profile combination on the command line.
  gaps: >-
    Script block content (4104), engine start events (400/403), module loads and unusual-parent logic are not part
    of this search. Obfuscated arguments that avoid these strings are covered by AN1394.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: CommandLinePattern
    bind: macro
    name: mitre_an1252_suspicious_args
    default: >-
      Processes.process IN ("* -enc *", "* -ec *", "* -en *", "*-encodedcommand*", "* -e jab*", "* -e sqb*", "*
      -e aqb*", "* -e cwb*", "*frombase64string*", "*downloadstring*", "*downloadfile*", "*downloaddata*", "*net.webclient*",
      "*invoke-webrequest*", "*invoke-expression*", "*iex(*", "*iex (*", "* iex *", "*reflection.assembly*load*",
      "*-nop*-w*hidden*", "*invoke-mimikatz*", "*invoke-shellcode*")
  - element: ParentProcessName
    bind: filter
    name: mitre_an1252_filter
    note: >-
      Exclude management agents by parent_process_name, e.g. search NOT parent_process_name IN ("ccmexec.exe", "senseir.exe").
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where` Processes.process_name IN ("powershell.exe", "pwsh.exe", "powershell_ise.exe") `mitre_an1252_suspicious_args`
        by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process
    | `drop_dm_object_name(Processes)`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1252_filter`
  risk:
    message: Suspicious PowerShell arguments on $dest$ by $user$
    objects:
    - field: dest
      type: system
      score: 35
    - field: user
      type: user
      score: 35
    threat_objects:
    - field: process
      type: process
    - field: parent_process_name
      type: parent_process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    - process
    period: 3600s
  false_positives:
  - >-
    Endpoint management, monitoring and installer frameworks routinely use -EncodedCommand and web requests.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      image:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \powershell_ise.exe
      args:
        CommandLine|contains:
        - ' -enc '
        - ' -ec '
        - -EncodedCommand
        - ' -e JAB'
        - ' -e SQB'
        - FromBase64String
        - DownloadString
        - DownloadFile
        - Net.WebClient
        - Invoke-Expression
        - IEX(
        - IEX (
        - Reflection.Assembly
      condition: image and args
kql: null
esql: null
