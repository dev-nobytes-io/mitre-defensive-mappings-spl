# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0360
name: Analytic 0360
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0128#AN0360
  attack_release: '20.1'
  detection_strategy:
    id: DET0128
    name: Detection Strategy for Hidden Windows
  technique:
    id: T1564.003
    name: Hidden Window
    tactics:
    - stealth
    usage_score: 81
  platforms:
  - Windows
  description: >-
    Suspicious use of scripting parameters or registry edits to hide process windows (e.g., powershell.exe -WindowStyle
    Hidden, or registry modifications pushing window positions off screen). Defender view: correlation of hidden
    execution with anomalous process lineage or hVNC-like CreateDesktop API calls.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0063
    dc_name: Windows Registry Key Modification
    name: WinEventLog:Sysmon
    channel: EventCode=13, 14
  mutable_elements:
  - field: HiddenProcessScope
    description: Restrict to processes where hidden execution is unexpected (e.g., PowerShell, cmd, wscript).
  - field: ParentProcessCorrelation
    description: Correlate hidden execution with suspicious parent processes to reduce false positives.
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: HiddenProcessScope
    bind: lookup
    name: mitre_allowlist_processes
  - element: ParentProcessCorrelation
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Interpreter started with a hidden window
  content_type: anomaly
  severity: low
  summary: >-
    PowerShell is started with a hidden WindowStyle argument, or cmd uses start /min or /b to launch an interpreter,
    from a parent that is not a known management agent.
  gaps: >-
    Registry-based window hiding and hVNC-style CreateDesktop use are not covered. Hidden windows are common in
    legitimate automation, hence the low score.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: HiddenProcessScope
    bind: macro
    name: mitre_an0360_hidden_args
    default: >-
      ((Processes.process_name IN ("powershell.exe", "pwsh.exe") Processes.process IN ("*-w hidden*", "*-w h *",
      "*-wi* hidden*", "*-win* hidden*", "*-windowstyle hidden*", "*-windowstyle h *", "*-w 1 *", "*-windowstyle
      1*")) OR (Processes.process_name="cmd.exe" Processes.process IN ("*start /min *", "*start /b *") Processes.process
      IN ("*powershell*", "*wscript*", "*cscript*", "*mshta*", "*rundll32*")))
  - element: ParentProcessCorrelation
    bind: filter
    name: mitre_an0360_filter
    note: >-
      Exclude management agents by parent, e.g. search NOT parent_process_name IN ("ccmexec.exe", "gpscript.exe").
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where` `mitre_an0360_hidden_args`
        by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process
    | `drop_dm_object_name(Processes)`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0360_filter`
  risk:
    message: Hidden-window interpreter on $dest$ started by $parent_process_name$
    objects:
    - field: dest
      type: system
      score: 20
    - field: user
      type: user
      score: 20
    threat_objects:
    - field: process
      type: process
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    - parent_process_name
    period: 14400s
  false_positives:
  - Logon scripts, scheduled maintenance tasks and software updaters.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      powershell:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains:
        - -w hidden
        - -wi hidden
        - -win hidden
        - -windowstyle hidden
        - -WindowStyle 1
      cmd_start:
        Image|endswith: \cmd.exe
        CommandLine|contains:
        - 'start /min '
        - 'start /b '
      cmd_target:
        CommandLine|contains:
        - powershell
        - wscript
        - cscript
        - mshta
        - rundll32
      condition: powershell or (cmd_start and cmd_target)
kql: null
esql: null
