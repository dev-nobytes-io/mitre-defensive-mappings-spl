# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1030
name: Analytic 1030
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0363#AN1030
  attack_release: '20.1'
  detection_strategy:
    id: DET0363
    name: Detection of Credential Dumping from LSASS Memory via Access and Dump Sequence
  technique:
    id: T1003.001
    name: LSASS Memory
    tactics:
    - credential-access
    usage_score: 132
  platforms:
  - Windows
  description: >-
    A non-privileged or abnormal process attempts to open a handle with full access (0x1F0FFF) to lsass.exe and
    subsequently invokes memory dump, file creation, or registry modification indicative of credential scraping.
    This behavior chain reflects staged credential theft activity.
  log_source_references:
  - dc: DC0035
    dc_name: Process Access
    name: WinEventLog:Sysmon
    channel: EventCode=10
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  - dc: DC0013
    dc_name: User Account Metadata
    name: WinEventLog:Security
    channel: EventCode=4673
  - dc: DC0063
    dc_name: Windows Registry Key Modification
    name: WinEventLog:Sysmon
    channel: EventCode=13, 14
  mutable_elements:
  - field: AccessMask
    description: Set to 0x1F0FFF to detect full memory access attempts; can be scoped down to reduce noise.
  - field: TimeWindow
    description: Defines time between LSASS access and dump file creation or registry modification (e.g., 5 minutes).
  - field: ParentProcessName
    description: Allowlist known legitimate tools (e.g., AV/EDR) accessing lsass.exe.
  - field: DumpFilePath
    description: Paths where memory dumps are written, e.g., %TEMP%, C:\Windows\Temp.
  - field: CommandLinePattern
    description: Common dumping syntax like rundll32, procdump, comsvcs.dll, Invoke-Mimikatz.
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: AccessMask
    bind: filter
    name: mitre_an1030_filter
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: ParentProcessName
    bind: lookup
    name: mitre_allowlist_processes
  - element: DumpFilePath
    bind: lookup
    name: mitre_sensitive_paths
  - element: CommandLinePattern
    bind: macro
    name: mitre_an1030_commandlinepattern
curated:
  status: implemented
  title: LSASS memory access by an unexpected process
  content_type: ttp
  severity: high
  summary: >-
    A process outside the Windows system and security-product set opens lsass.exe with an access mask that permits
    reading process memory (Sysmon EventCode 10). This is the handle acquisition step of Mimikatz, comsvcs MiniDump,
    procdump and similar credential dumpers.
  gaps: >-
    The follow-on steps in ATT&CK's chain (dump file creation, 4673 privilege use, registry changes) are not correlated
    here; they are left to the detection strategy layer. Requires a Sysmon ProcessAccess rule scoped to lsass.exe.
  data_components:
  - DC0035
  feeds:
  - sysmon
  tuning:
  - element: AccessMask
    bind: macro
    name: mitre_an1030_access_mask
    default: >-
      GrantedAccess IN ("0x1010", "0x1410", "0x1438", "0x143a", "0x1418", "0x1f0fff", "0x1f1fff", "0x1f2fff", "0x1f3fff",
      "0x1fffff")
    note: Masks that include PROCESS_VM_READ. Narrow to 0x1f0fff-style full access to cut noise.
  - element: ParentProcessName
    bind: lookup
    name: mitre_allowlist_processes
    note: Add EDR, AV and backup agents that legitimately read LSASS (process_name column).
  spl: |-
    `mitre_dc0035_sysmon` EventCode=10 TargetImage="*\\lsass.exe" `mitre_an1030_access_mask`
        NOT SourceImage IN ("C:\\Windows\\System32\\wbem\\WmiPrvSE.exe", "C:\\Windows\\System32\\svchost.exe", "C:\\Windows\\System32\\csrss.exe", "C:\\Windows\\System32\\wininit.exe", "C:\\Windows\\System32\\lsm.exe", "C:\\Windows\\System32\\MRT.exe", "C:\\ProgramData\\Microsoft\\Windows Defender\\*", "C:\\Program Files\\Windows Defender\\*", "C:\\Program Files\\Windows Defender Advanced Threat Protection\\*")
    | `mitre_normalize_host`
    | eval process_name=replace(SourceImage, "^.*\\\\", ""), user=coalesce(SourceUser, user)
    | search `mitre_not_allowlisted_process`
    | stats count min(_time) as firstTime max(_time) as lastTime values(GrantedAccess) as granted_access values(CallTrace) as call_trace by dest user SourceImage process_name
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1030_filter`
  risk:
    message: LSASS memory opened by $process_name$ on $dest$
    objects:
    - field: dest
      type: system
      score: 70
    - field: user
      type: user
      score: 70
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process_name
    period: 3600s
  false_positives:
  - >-
    EDR, antivirus, vulnerability scanners and some backup or monitoring agents read LSASS; add them to mitre_allowlist_processes.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_access
    detection:
      selection:
        TargetImage|endswith: \lsass.exe
        GrantedAccess:
        - '0x1010'
        - '0x1410'
        - '0x1438'
        - '0x143a'
        - '0x1418'
        - '0x1f0fff'
        - '0x1f1fff'
        - '0x1f2fff'
        - '0x1f3fff'
        - '0x1fffff'
      filter_system:
        SourceImage|startswith:
        - C:\Windows\System32\wbem\WmiPrvSE.exe
        - C:\Windows\System32\svchost.exe
        - C:\Windows\System32\csrss.exe
        - C:\Windows\System32\wininit.exe
        - C:\Windows\System32\lsm.exe
        - C:\ProgramData\Microsoft\Windows Defender\
        - C:\Program Files\Windows Defender
      condition: selection and not filter_system
kql: null
esql: null
