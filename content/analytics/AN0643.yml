# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0643
name: Analytic 0643
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0230#AN0643
  attack_release: '20.1'
  detection_strategy:
    id: DET0230
    name: Detect Suspicious or Malicious Code Signing Abuse
  technique:
    id: T1553.002
    name: Code Signing
    tactics:
    - defense-impairment
    usage_score: 129
  platforms:
  - Windows
  description: >-
    Detects execution of binaries signed with unusual or recently issued certificates, correlation of process execution
    with abnormal publisher metadata, and mismatched certificate chains. Monitors for revoked or unknown code signing
    certificates used in high-privilege contexts.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0016
    dc_name: Module Load
    name: WinEventLog:Sysmon
    channel: EventCode=7
  mutable_elements:
  - field: AllowedCertificateAuthorities
    description: Define trusted issuers to suppress noise from legitimate enterprise signing chains
  - field: TimeWindow
    description: Correlation window for detecting execution of binaries with newly observed or anomalous certificates
  - field: CertificateAgeThreshold
    description: Baseline normal age of certificates; flag very recent or expired certificates
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: AllowedCertificateAuthorities
    bind: filter
    name: mitre_an0643_filter
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: CertificateAgeThreshold
    bind: macro
    name: mitre_an0643_certificateagethreshold
curated:
  status: implemented
  title: Module with an expired, revoked or untrusted signature loaded
  content_type: anomaly
  severity: medium
  summary: >-
    Sysmon ImageLoad (7) of a module that is signed but whose signature status is not valid (expired, revoked, untrusted
    root, bad digest), outside the Windows and Program Files directories. Stolen or revoked code-signing certificates
    and tampered signed binaries show up this way.
  gaps: >-
    Certificate issue date and issuing CA (CertificateAgeThreshold, AllowedCertificateAuthorities) are not in Sysmon
    events; process images (EventCode 1) carry no signature fields.
  data_components:
  - DC0016
  feeds:
  - sysmon
  tuning:
  - element: AllowedCertificateAuthorities
    bind: macro
    name: mitre_an0643_bad_status
    default: >-
      SignatureStatus IN ("Expired", "Revoked", "Distrust", "UntrustedRoot", "*Bad*", "*Invalid*", "*NotTrusted*")
  - element: CertificateAgeThreshold
    bind: lookup
    name: mitre_allowlist_processes
    note: Legacy applications known to ship expired-but-benign signatures (process_name column).
  - element: TimeWindow
    bind: filter
    name: mitre_an0643_filter
  spl: |-
    `mitre_dc0016_sysmon` EventCode=7 Signed="true" `mitre_an0643_bad_status` NOT ImageLoaded IN ("C:\\Windows\\*", "C:\\Program Files\\*", "C:\\Program Files (x86)\\*")
    | `mitre_normalize_host`
    | eval process_name=replace(Image, "^.*\\\\", "")
    | search `mitre_not_allowlisted_process`
    | stats count min(_time) as firstTime max(_time) as lastTime values(ImageLoaded) as file_path values(Signature) as signature values(SignatureStatus) as signature_status by dest user process_name
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0643_filter`
  risk:
    message: $process_name$ on $dest$ loaded a module with an invalid signature ($signature$)
    objects:
    - field: dest
      type: system
      score: 35
    - field: user
      type: user
      score: 25
    threat_objects:
    - field: signature
      type: certificate_common_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process_name
    period: 86400s
  false_positives:
  - Old vendor software whose signing certificate has expired without timestamping.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        Signed: 'true'
        SignatureStatus:
        - Expired
        - Revoked
        - Distrust
        - UntrustedRoot
      system_paths:
        ImageLoaded|startswith:
        - C:\Windows\
        - C:\Program Files\
        - C:\Program Files (x86)\
      condition: selection and not system_paths
kql: null
esql: null
