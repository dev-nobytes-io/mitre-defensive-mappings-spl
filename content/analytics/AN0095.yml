# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0095
name: Analytic 0095
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0034#AN0095
  attack_release: '20.1'
  detection_strategy:
    id: DET0034
    name: Detection of Adversarial Process Discovery Behavior
  technique:
    id: T1057
    name: Process Discovery
    tactics:
    - discovery
    usage_score: 379
  platforms:
  - Windows
  description: >-
    Identifies adversary behavior that launches commands or invokes APIs to enumerate active processes (e.g., tasklist.exe,
    Get-Process, or CreateToolhelp32Snapshot). Detects execution combined with parent process lineage, network session
    context, or remote origin.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0035
    dc_name: Process Access
    name: WinEventLog:Sysmon
    channel: EventCode=10
  mutable_elements:
  - field: ParentProcessName
    description: >-
      Used to scope suspicious discovery from non-interactive or non-standard parent processes like Office macros,
      WMI, or script engines
  - field: CommandLinePattern
    description: Adversaries may obfuscate or vary process discovery commands (e.g., aliases, PowerShell variants)
  - field: TimeWindow
    description: Helps detect bursty discovery behavior within a short timeframe
derived:
  coverage: live
  suggested_content_type: hunting
  suggested_tuning:
  - element: ParentProcessName
    bind: lookup
    name: mitre_allowlist_processes
  - element: CommandLinePattern
    bind: macro
    name: mitre_an0095_commandlinepattern
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: Process discovery commands
  content_type: hunting
  severity: informational
  summary: >-
    Lists hosts and users enumerating running processes with tasklist, qprocess, query process, wmic process list/get,
    Get-Process or Win32_Process queries, with the parent process so non-interactive origins (Office, WMI, script
    hosts) stand out.
  gaps: >-
    API-level enumeration (CreateToolhelp32Snapshot) and process-access events are not included. No finding or risk
    is produced.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: ParentProcessName
    bind: filter
    name: mitre_an0095_filter
    note: >-
      Narrow to suspicious parents, e.g. search parent_process_name IN ("winword.exe", "wmiprvse.exe", "wscript.exe").
  - element: CommandLinePattern
    bind: lookup
    name: mitre_allowlist_users
    note: Monitoring and inventory accounts.
  spl: |-
    | tstats `mitre_summariesonly` count from `mitre_dc0032_dm` where `mitre_dc0032_dm_where`
        (Processes.process_name IN ("tasklist.exe", "qprocess.exe")
          OR (Processes.process_name="query.exe" Processes.process="*process*")
          OR (Processes.process_name="wmic.exe" Processes.process="*process*" Processes.process IN ("* list*", "* get*") NOT Processes.process="*call*")
          OR (Processes.process_name IN ("powershell.exe", "pwsh.exe") Processes.process IN ("*get-process*", "* gps *", "*win32_process*") NOT Processes.process="*invoke-wmimethod*"))
        by Processes.dest Processes.user Processes.parent_process_name Processes.process _time span=10m
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_user`
    | stats sum(count) as count dc(process) as distinct_commands values(process) as process by dest user parent_process_name _time
    | sort - count
    | `mitre_an0095_filter`
  risk:
    message: ''
    objects: []
    threat_objects: []
  schedule: {}
  throttle: {}
  false_positives:
  - Monitoring agents and administrators.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    level: informational
    detection:
      tools:
        Image|endswith:
        - \tasklist.exe
        - \qprocess.exe
      wmic:
        Image|endswith: \wmic.exe
        CommandLine|contains|all:
        - process
        CommandLine|contains:
        - ' list'
        - ' get'
      powershell:
        CommandLine|contains:
        - Get-Process
        - Win32_Process
      condition: tools or wmic or powershell
kql: null
esql: null
