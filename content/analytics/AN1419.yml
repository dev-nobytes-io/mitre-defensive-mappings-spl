# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1419
name: Analytic 1419
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0514#AN1419
  attack_release: '20.1'
  detection_strategy:
    id: DET0514
    name: Detection Strategy for Exploitation for Privilege Escalation
  technique:
    id: T1068
    name: Exploitation for Privilege Escalation
    tactics:
    - privilege-escalation
    usage_score: 69
  platforms:
  - Windows
  description: >-
    Detects exploitation attempts targeting vulnerable kernel drivers or OS components, often followed by unusual
    process or token behavior.
  log_source_references:
  - dc: DC0079
    dc_name: Driver Load
    name: WinEventLog:Sysmon
    channel: EventCode=6
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0088
    dc_name: Logon Session Metadata
    name: WinEventLog:Security
    channel: EventCode=4672
  mutable_elements:
  - field: DriverNamePattern
    description: Targeted BYOVD drivers may vary based on campaign and tooling.
  - field: TimeWindow
    description: Controls temporal linking of driver load → process spawn → privilege use.
  - field: ParentProcessPath
    description: Parent-child relationships vary by exploitation vector (e.g., LOLBin vs. dropper).
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: DriverNamePattern
    bind: macro
    name: mitre_an1419_drivernamepattern
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: ParentProcessPath
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Vulnerable or out-of-place driver loaded, or SYSTEM process spawned by a user process
  content_type: ttp
  severity: high
  summary: >-
    Two footprints of local privilege escalation: a kernel driver load (Sysmon 6) whose name is a known vulnerable
    driver used for BYOVD, that is unsigned, or that loads from a user-writable folder; and a process running at
    System integrity whose parent runs as an ordinary user, which is what a token-stealing or kernel exploit leaves
    behind.
  gaps: >-
    The driver list is names, not hashes; renamed vulnerable drivers need the LOLDrivers hash list in a lookup.
    ParentUser needs Sysmon 13.30 or later. Non-English SYSTEM account names need adding to the macro.
  data_components:
  - DC0079
  - DC0032
  feeds:
  - sysmon
  tuning:
  - element: DriverNamePattern
    bind: macro
    name: mitre_an1419_vulnerable_drivers
    default: >-
      ImageLoaded IN ("*\\RTCore64.sys", "*\\RTCore32.sys", "*\\gdrv.sys", "*\\dbutil_2_3.sys", "*\\DBUtilDrv2.sys",
      "*\\aswArPot.sys", "*\\mhyprot2.sys", "*\\mhyprot3.sys", "*\\kprocesshacker.sys", "*\\iqvw64e.sys", "*\\AsIO.sys",
      "*\\AsIO2.sys", "*\\AsIO3.sys", "*\\WinRing0x64.sys", "*\\zamguard64.sys", "*\\zam64.sys", "*\\truesight.sys",
      "*\\ene.sys", "*\\GLCKIO2.sys", "*\\NalDrv.sys", "*\\speedfan.sys", "*\\cpuz141.sys", "*\\rwdrv.sys", "*\\PhyMem.sys",
      "*\\HW.sys", "*\\viragt64.sys", "*\\wnbios.sys")
  - element: DriverPath
    bind: macro
    name: mitre_an1419_writable_paths
    default: >-
      ImageLoaded IN ("C:\\Users\\*", "C:\\ProgramData\\*", "C:\\Windows\\Temp\\*", "C:\\PerfLogs\\*", "C:\\$Recycle.Bin\\*",
      "*\\AppData\\*")
  - element: ParentProcessPath
    bind: macro
    name: mitre_an1419_system_accounts
    default: >-
      ParentUser IN ("NT AUTHORITY\\*", "AUTORITE NT\\*", "NT-AUTORITÄT\\*", "Window Manager\\*", "Font Driver Host\\*",
      "-")
  - element: TimeWindow
    bind: filter
    name: mitre_an1419_filter
  spl: |-
    (`mitre_dc0079_sysmon` EventCode=6 (`mitre_an1419_vulnerable_drivers` OR `mitre_an1419_writable_paths` OR Signed="false"))
    OR (`mitre_dc0032_sysmon` EventCode=1 IntegrityLevel="System" ParentUser="*" NOT `mitre_an1419_system_accounts`)
    | `mitre_normalize_host`
    | eval user=if(EventCode==1, ParentUser, null()), signal=if(EventCode==6, "driver load: ".ImageLoaded." (signed=".coalesce(Signed, "unknown").", ".coalesce(Signature, "no signature").")", "SYSTEM process from user parent: ".ParentImage." -> ".Image), process_name=if(EventCode==1, lower(replace(Image, "^.*\\\\", "")), lower(replace(ImageLoaded, "^.*\\\\", "")))
    | stats count min(_time) as firstTime max(_time) as lastTime values(signal) as signal values(process_name) as process_name values(user) as user by dest
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1419_filter`
  risk:
    message: Privilege escalation footprint on $dest$ ($signal$)
    objects:
    - field: dest
      type: system
      score: 70
    - field: user
      type: user
      score: 60
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    period: 86400s
  false_positives:
  - >-
    Hardware monitoring, overclocking and anti-cheat utilities that ship the listed drivers legitimately.
  - >-
    Management agents that start SYSTEM processes on behalf of a user session (check the parent and allow-list it
    in the filter).
  baselines: []
  sigma:
    rules:
    - name: an1419_vulnerable_driver
      logsource:
        product: windows
        category: driver_load
      detection:
        names:
          ImageLoaded|endswith:
          - \RTCore64.sys
          - \gdrv.sys
          - \dbutil_2_3.sys
          - \aswArPot.sys
          - \mhyprot2.sys
          - \kprocesshacker.sys
          - \iqvw64e.sys
          - \AsIO2.sys
          - \WinRing0x64.sys
          - \zamguard64.sys
          - \truesight.sys
        unsigned:
          Signed: 'false'
        condition: names or unsigned
    - name: an1419_system_child_of_user
      logsource:
        product: windows
        category: process_creation
      detection:
        selection:
          IntegrityLevel: System
        system_parent:
          ParentUser|startswith:
          - NT AUTHORITY\
          - AUTORITE NT\
        condition: selection and not system_parent
kql: null
esql: null
