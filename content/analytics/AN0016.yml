# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0016
name: Analytic 0016
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0007#AN0016
  attack_release: '20.1'
  detection_strategy:
    id: DET0007
    name: Detection of Domain Trust Discovery via API, Script, and CLI Enumeration
  technique:
    id: T1482
    name: Domain Trust Discovery
    tactics:
    - discovery
    usage_score: 47
  platforms:
  - Windows
  description: >-
    Adversary uses nltest, PowerShell, or Win32/.NET API to enumerate domain trust relationships (via DSEnumerateDomainTrusts,
    GetAllTrustRelationships, or LDAP queries), followed by discovery or authentication staging.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0016
    dc_name: Module Load
    name: WinEventLog:Sysmon
    channel: EventCode=7
  - dc: DC0035
    dc_name: Process Access
    name: WinEventLog:Sysmon
    channel: EventCode=10
  - dc: DC0064
    dc_name: Command Execution
    name: WinEventLog:PowerShell
    channel: Get-ADTrust|GetAllTrustRelationships
  - dc: DC0071
    dc_name: Active Directory Object Access
    name: WinEventLog:Security
    channel: EventCode=4662
  mutable_elements:
  - field: ParentImage
    description: Tune based on expected script hosts or authorized administrators invoking trust enumeration.
  - field: TimeWindow
    description: Correlate enumeration + subsequent Kerberos activity or DC interaction within a bounded window.
  - field: UserContext
    description: Prioritize detection for non-admin or unexpected user accounts performing enumeration.
  - field: API_Name
    description: Flag uncommon or low-prevalence API calls like DSEnumerateDomainTrusts for inspection.
derived:
  coverage: mapped
  suggested_content_type: hunting
  suggested_tuning:
  - element: ParentImage
    bind: lookup
    name: mitre_allowlist_processes
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
  - element: API_Name
    bind: filter
    name: mitre_an0016_filter
curated:
  status: implemented
  title: Domain trust enumeration
  content_type: anomaly
  severity: low
  summary: >-
    nltest /domain_trusts, /all_trusts or /trusted_domains, dsquery or AdFind filters for trustedDomain objects,
    Get-ADTrust, PowerView Get-DomainTrust and Get-NetDomainTrust, or the .NET GetAllTrustRelationships call, from
    a process command line or a PowerShell script block. Trust mapping is a standard step before moving between
    domains and appears in most pre-ransomware discovery bursts.
  gaps: >-
    LDAP queries for trustedDomain objects from tooling with no command line need directory-service access auditing
    (4662 with SACLs on the System container) or Corelight ldap.log; the API-level DsEnumerateDomainTrusts call
    is invisible.
  data_components:
  - DC0032
  - DC0029
  feeds:
  - sysmon
  - powershell_logging
  tuning:
  - element: API_Name
    bind: macro
    name: mitre_an0016_patterns
    default: >-
      ("*domain_trusts*", "*all_trusts*", "*trusted_domains*", "*trustedDomain*", "*trustdmp*", "*Get-ADTrust*",
      "*Get-DomainTrust*", "*Get-NetDomainTrust*", "*Get-NetForestTrust*", "*Get-ForestTrust*", "*GetAllTrustRelationships*")
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
    note: Identity and AD-health accounts.
  - element: ParentImage
    bind: filter
    name: mitre_an0016_filter
  spl: |-
    (`mitre_dc0032_sysmon` EventCode=1 CommandLine IN `mitre_an0016_patterns`)
    OR (`mitre_dc0029_powershell_logging` EventCode=4104 ScriptBlockText IN `mitre_an0016_patterns`)
    | `mitre_normalize_host`
    | eval process_name=lower(replace(coalesce(Image, "powershell.exe"), "^.*\\\\", "")), evidence=substr(coalesce(CommandLine, ScriptBlockText), 1, 300)
    | search `mitre_not_allowlisted_user`
    | stats count min(_time) as firstTime max(_time) as lastTime values(evidence) as evidence values(process_name) as process_name by dest user
    | eval evidence=mvindex(evidence, 0, 4)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0016_filter`
  risk:
    message: Domain trusts enumerated on $dest$ by $user$
    objects:
    - field: dest
      type: system
      score: 25
    - field: user
      type: user
      score: 30
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 86400s
  false_positives:
  - Domain administrators and AD health tooling checking trusts.
  baselines: []
  sigma:
    rules:
    - name: an0016_trust_command
      logsource:
        product: windows
        category: process_creation
      detection:
        selection:
          CommandLine|contains:
          - domain_trusts
          - all_trusts
          - trusted_domains
          - trustedDomain
          - trustdmp
          - Get-ADTrust
          - Get-DomainTrust
          - GetAllTrustRelationships
        condition: selection
    - name: an0016_trust_script
      logsource:
        product: windows
        category: ps_script
      detection:
        selection:
          ScriptBlockText|contains:
          - Get-ADTrust
          - Get-DomainTrust
          - Get-NetDomainTrust
          - Get-ForestTrust
          - GetAllTrustRelationships
        condition: selection
kql: null
esql: null
