# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0091
name: Analytic 0091
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0032#AN0091
  attack_release: '20.1'
  detection_strategy:
    id: DET0032
    name: Detection Strategy for Hidden Files and Directories
  technique:
    id: T1564.001
    name: Hidden Files and Directories
    tactics:
    - stealth
    usage_score: 76
  platforms:
  - Windows
  description: >-
    Suspicious use of attrib.exe or PowerShell commands to set hidden attributes on files/directories. Defender
    view: processes modifying file attributes to 'hidden' or creating files with ADS (alternate data streams).
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  mutable_elements:
  - field: MonitoredExtensions
    description: Filter hidden file detection by sensitive file extensions (.exe, .dll, .bat).
  - field: ADSMonitoring
    description: Enable detection of alternate data streams depending on organizational usage.
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: MonitoredExtensions
    bind: lookup
    name: mitre_sensitive_paths
  - element: ADSMonitoring
    bind: filter
    name: mitre_an0091_filter
curated:
  status: implemented
  title: File hidden with attrib or written to an alternate data stream
  content_type: anomaly
  severity: medium
  summary: >-
    attrib +h (or PowerShell setting the Hidden attribute) on a file or folder, or a Sysmon FileCreateStreamHash
    (15) for a named alternate data stream other than the Zone.Identifier and SmartScreen streams Windows writes
    itself. Both hide a payload from casual listing and from tools that ignore attributes or streams.
  gaps: >-
    Attributes set through the SetFileAttributes API without a command line are invisible; ADS coverage depends
    on the Sysmon config logging FileCreateStreamHash for the paths that matter.
  data_components:
  - DC0032
  - DC0039
  feeds:
  - sysmon
  tuning:
  - element: MonitoredExtensions
    bind: macro
    name: mitre_an0091_hide_commands
    default: >-
      ((Image="*\\attrib.exe" CommandLine="*+h*") OR CommandLine IN ("*FileAttributes]::Hidden*", "*Attributes*=*Hidden*",
      "*attrib*+h *"))
  - element: ADSMonitoring
    bind: macro
    name: mitre_an0091_benign_streams
    default: >-
      TargetFilename IN ("*:Zone.Identifier", "*:SmartScreen", "*:favicon", "*:OECustomProperty", "*:com.dropbox.*",
      "*:AFP_AfpInfo", "*:encryptable")
  - element: ProcessName
    bind: lookup
    name: mitre_allowlist_processes
    note: Backup, sync and imaging tools that set attributes or streams routinely.
  spl: |-
    (`mitre_dc0032_sysmon` EventCode=1 `mitre_an0091_hide_commands`)
    OR (`mitre_dc0039_sysmon` EventCode=15 TargetFilename="*:*:*" NOT `mitre_an0091_benign_streams`)
    | `mitre_normalize_host`
    | eval process_name=lower(replace(Image, "^.*\\\\", "")), technique=if(EventCode==15, "alternate data stream", "hidden attribute"), artifact=if(EventCode==15, TargetFilename, CommandLine)
    | search `mitre_not_allowlisted_process`
    | stats count min(_time) as firstTime max(_time) as lastTime values(technique) as technique values(artifact) as artifact values(process_name) as process_name by dest user
    | eval artifact=mvindex(artifact, 0, 19)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0091_filter`
  risk:
    message: Files hidden on $dest$ by $user$ ($technique$)
    objects:
    - field: dest
      type: system
      score: 30
    - field: user
      type: user
      score: 25
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 86400s
  false_positives:
  - >-
    Installers and sync clients that hide their own folders; browsers and Office writing private streams not yet
    in the benign list.
  baselines: []
  sigma:
    rules:
    - name: an0091_attrib_hidden
      logsource:
        product: windows
        category: process_creation
      detection:
        attrib:
          Image|endswith: \attrib.exe
          CommandLine|contains: +h
        powershell:
          CommandLine|contains: FileAttributes]::Hidden
        condition: attrib or powershell
    - name: an0091_named_stream
      logsource:
        product: windows
        category: create_stream_hash
      detection:
        selection:
          TargetFilename|re: ^.*:.*:.+$
        benign:
          TargetFilename|endswith:
          - :Zone.Identifier
          - :SmartScreen
          - :favicon
        condition: selection and not benign
kql: null
esql: null
