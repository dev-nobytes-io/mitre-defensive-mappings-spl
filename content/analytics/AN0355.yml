# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0355
name: Analytic 0355
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0127#AN0355
  attack_release: '20.1'
  detection_strategy:
    id: DET0127
    name: Behavioral Detection of Masquerading Across Platforms via Metadata and Execution Discrepancy
  technique:
    id: T1036
    name: Masquerading
    tactics:
    - stealth
    usage_score: 89
  platforms:
  - Windows
  description: >-
    Adversary renames LOLBINs or deploys binaries with spoofed file names, internal PE metadata, or misleading icons
    to appear legitimate. File creation is followed by execution or service registration inconsistent with known
    usage.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0060
    dc_name: Service Creation
    name: WinEventLog:System
    channel: EventCode=7045
  mutable_elements:
  - field: OriginalFilenameMismatch
    description: Compare executable file name with PE metadata OriginalFilename field
  - field: KnownSystemUtilityPaths
    description: Tune based on expected installation directories for signed binaries
  - field: TimeWindow
    description: Correlation window between file creation and service/process execution
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: OriginalFilenameMismatch
    bind: lookup
    name: mitre_sensitive_paths
  - element: KnownSystemUtilityPaths
    bind: lookup
    name: mitre_sensitive_paths
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: Renamed system utility (file name does not match PE original name)
  content_type: ttp
  severity: medium
  summary: >-
    Sysmon reports an OriginalFileName belonging to a commonly abused utility (cmd, PowerShell, script hosts, mshta,
    rundll32, regsvr32, certutil, bitsadmin, wmic, msbuild, installutil, net, reg, schtasks, sc, PsExec, ProcDump)
    while the image on disk has a different file name.
  gaps: >-
    Service registration of the renamed binary (7045) and spoofed icons or other PE metadata are not evaluated.
  data_components:
  - DC0032
  feeds:
  - sysmon
  tuning:
  - element: OriginalFilenameMismatch
    bind: macro
    name: mitre_an0355_original_names
    default: >-
      OriginalFileName IN ("Cmd.Exe", "PowerShell.EXE", "pwsh.dll", "cscript.exe", "wscript.exe", "MSHTA.EXE", "RUNDLL32.EXE",
      "REGSVR32.EXE", "CertUtil.exe", "bitsadmin.exe", "wmic.exe", "MSBuild.exe", "InstallUtil.exe", "net.exe",
      "net1.exe", "reg.exe", "schtasks.exe", "sc.exe", "psexec.c", "procdump")
  - element: KnownSystemUtilityPaths
    bind: filter
    name: mitre_an0355_filter
  spl: |-
    `mitre_dc0032_sysmon` EventCode=1 `mitre_an0355_original_names`
    | `mitre_normalize_host`
    | eval process_name=lower(replace(Image, "^.*\\\\", "")), original_file_name=lower(OriginalFileName)
    | eval expected=case(original_file_name=="pwsh.dll", "pwsh.exe", original_file_name=="psexec.c", "psexec.exe;psexec64.exe", original_file_name=="procdump", "procdump.exe;procdump64.exe", true(), original_file_name)
    | where NOT like(";".expected.";", "%;".process_name.";%")
    | stats count min(_time) as firstTime max(_time) as lastTime values(CommandLine) as process values(ParentImage) as parent_process by dest user Image process_name original_file_name
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0355_filter`
  risk:
    message: Renamed $original_file_name$ executed as $process_name$ on $dest$
    objects:
    - field: dest
      type: system
      score: 55
    - field: user
      type: user
      score: 45
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - Image
    period: 86400s
  false_positives:
  - Software that bundles a renamed copy of a Windows utility; some packaging tools.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      cmd:
        OriginalFileName: Cmd.Exe
      cmd_name:
        Image|endswith: \cmd.exe
      ps:
        OriginalFileName: PowerShell.EXE
      ps_name:
        Image|endswith: \powershell.exe
      rundll:
        OriginalFileName: RUNDLL32.EXE
      rundll_name:
        Image|endswith: \rundll32.exe
      regsvr:
        OriginalFileName: REGSVR32.EXE
      regsvr_name:
        Image|endswith: \regsvr32.exe
      mshta:
        OriginalFileName: MSHTA.EXE
      mshta_name:
        Image|endswith: \mshta.exe
      certutil:
        OriginalFileName: CertUtil.exe
      certutil_name:
        Image|endswith: \certutil.exe
      wscript:
        OriginalFileName: wscript.exe
      wscript_name:
        Image|endswith: \wscript.exe
      cscript:
        OriginalFileName: cscript.exe
      cscript_name:
        Image|endswith: \cscript.exe
      condition: >-
        (cmd and not cmd_name) or (ps and not ps_name) or (rundll and not rundll_name) or (regsvr and not regsvr_name)
        or (mshta and not mshta_name) or (certutil and not certutil_name) or (wscript and not wscript_name) or (cscript
        and not cscript_name)
kql: null
esql: null
