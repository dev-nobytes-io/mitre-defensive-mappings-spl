# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1067
name: Analytic 1067
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0378#AN1067
  attack_release: '20.1'
  detection_strategy:
    id: DET0378
    name: Behavioral Detection of Obfuscated Files or Information
  technique:
    id: T1027
    name: Obfuscated Files or Information
    tactics:
    - stealth
    usage_score: 188
  platforms:
  - Network Devices
  description: >-
    Identifies transfer of base64, uuencoded, or high-entropy files over HTTP, FTP, or custom protocols in lateral
    movement or exfiltration streams.
  log_source_references:
  - dc: DC0085
    dc_name: Network Traffic Content
    name: networkdevice:IDS
    channel: content inspection / PCAP / HTTP body
  mutable_elements:
  - field: EntropyThreshold
    description: Adjust threshold to reduce false positives in compressed but benign data
  - field: ProtocolScope
    description: Refine by enabling inspection of specific exfil vectors (e.g., FTP, HTTP POST)
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: EntropyThreshold
    bind: macro
    name: mitre_an1067_entropythreshold
  - element: ProtocolScope
    bind: macro
    name: mitre_an1067_protocolscope
curated:
  status: implemented
  title: Executable transferred under a non-executable file name
  content_type: ttp
  severity: medium
  summary: >-
    Corelight files.log records a file whose content type is a Windows or Linux executable while its name ends in
    a document, image, archive or text extension. Disguising payloads this way is how they slip past extension-based
    filtering in transit.
  gaps: >-
    Base64 or encrypted payloads inside HTTP bodies are not identified (no entropy in files.log); files with no
    name in the protocol are skipped.
  data_components:
  - DC0085
  feeds:
  - corelight
  tuning:
  - element: EntropyThreshold
    bind: macro
    name: mitre_an1067_disguise_ext
    default: >-
      filename IN ("*.jpg", "*.jpeg", "*.png", "*.gif", "*.bmp", "*.ico", "*.txt", "*.log", "*.pdf", "*.doc", "*.docx",
      "*.xls", "*.xlsx", "*.csv", "*.dat", "*.tmp", "*.zip", "*.css", "*.js", "*.html", "*.xml", "*.json")
  - element: ProtocolScope
    bind: filter
    name: mitre_an1067_filter
  spl: |-
    `mitre_dc0085_corelight` `mitre_st_corelight_files` mime_type IN ("application/x-dosexec", "application/x-executable", "application/x-mach-o-executable", "application/x-elf")
    | search `mitre_an1067_disguise_ext`
    | eval src=mvindex(split(tx_hosts, ","), 0), dest=mvindex(split(rx_hosts, ","), 0), file_hash=coalesce(sha256, sha1, md5)
    | stats count min(_time) as firstTime max(_time) as lastTime values(filename) as file_name values(mime_type) as mime_type values(source) as protocol values(file_hash) as file_hash by src dest
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1067_filter`
  risk:
    message: Executable disguised as $file_name$ sent from $src$ to $dest$
    objects:
    - field: dest
      type: system
      score: 50
    threat_objects:
    - field: file_hash
      type: file_hash
    - field: src
      type: ip_address
  schedule: {}
  throttle:
    fields:
    - dest
    - file_hash
    period: 86400s
  false_positives:
  - Software updaters that download executables under generic names (.dat, .tmp).
  baselines: []
  sigma:
    logsource:
      product: zeek
      service: files
    detection:
      selection:
        mime_type:
        - application/x-dosexec
        - application/x-executable
        - application/x-elf
        filename|endswith:
        - .jpg
        - .jpeg
        - .png
        - .gif
        - .txt
        - .pdf
        - .doc
        - .docx
        - .xls
        - .xlsx
        - .csv
        - .zip
        - .css
        - .html
      condition: selection
kql: null
esql: null
