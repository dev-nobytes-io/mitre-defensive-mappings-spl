id: AN1551
name: Analytic 1551
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0562#AN1551
  attack_release: '20.1'
  detection_strategy:
    id: DET0562
    name: Multi-Platform Execution Guardrails Environmental Validation Detection Strategy
  technique:
    id: T1480
    name: Execution Guardrails
    tactics:
    - stealth
    usage_score: 58
  platforms:
  - Windows
  description: >-
    Windows environmental validation behavioral chain: (1) Rapid system discovery reconnaissance through WMI queries,
    registry enumeration, and network share discovery, (2) Environment-specific artifact collection (hostname, domain,
    IP addresses, installed software, hardware identifiers), (3) Cryptographic operations or conditional logic based
    on collected environmental values, (4) Selective payload execution contingent on environmental validation results,
    (5) Temporal correlation between discovery activities and subsequent execution or network communication
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0002
    dc_name: User Account Authentication
    name: WinEventLog:Security
    channel: EventCode=4648
  - dc: DC0067
    dc_name: Logon Session Creation
    name: WinEventLog:Security
    channel: EventCode=4624, 4648
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  - dc: DC0016
    dc_name: Module Load
    name: WinEventLog:Sysmon
    channel: EventCode=7
  - dc: DC0020
    dc_name: Process Modification
    name: WinEventLog:Sysmon
    channel: EventCode=8
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  - dc: DC0063
    dc_name: Windows Registry Key Modification
    name: WinEventLog:Sysmon
    channel: EventCode=13, 14
  - dc: DC0008
    dc_name: WMI Creation
    name: WinEventLog:WMI
    channel: EventCode=5857, 5858, 5860, 5861
  - dc: DC0064
    dc_name: Command Execution
    name: WinEventLog:PowerShell
    channel: EventCode=4103, 4104, 4105, 4106
  mutable_elements:
  - field: DiscoveryTimeWindow
    description: >-
      Maximum time window for correlating multiple discovery activities indicating reconnaissance phase - adjust
      based on normal system behavior (default: 300 seconds)
  - field: DiscoveryActivityThreshold
    description: >-
      Minimum number of different discovery techniques within time window to trigger detection - balance between
      false positives and coverage (default: 4 activities)
  - field: CryptographicLibraryWhitelist
    description: >-
      Approved cryptographic libraries and modules for legitimate organizational use - maintain based on approved
      software inventory
  - field: WMIQueryComplexityThreshold
    description: >-
      Complexity score for WMI queries indicating reconnaissance vs. legitimate administration - tune based on administrative
      patterns
  - field: EnvironmentalArtifactList
    description: >-
      Environment-specific values commonly targeted by guardrails (hostnames, domains, network shares) - customize
      for organizational environment
  - field: ExecutionDelayBaseline
    description: >-
      Statistical baseline for normal delay between discovery and execution activities - establish through historical
      analysis
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: DiscoveryTimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: DiscoveryActivityThreshold
    bind: macro
    name: mitre_an1551_discoveryactivitythreshold
  - element: CryptographicLibraryWhitelist
    bind: macro
    name: mitre_an1551_cryptographiclibrarywhitelist
  - element: WMIQueryComplexityThreshold
    bind: macro
    name: mitre_an1551_wmiquerycomplexitythreshold
  - element: EnvironmentalArtifactList
    bind: macro
    name: mitre_an1551_environmentalartifactlist
  - element: ExecutionDelayBaseline
    bind: filter
    name: mitre_an1551_filter
curated:
  status: implemented
  title: Environment checks by a process that then talks to the internet
  content_type: anomaly
  severity: medium
  summary: >-
    One parent process spawns several distinct environment-discovery commands (whoami, hostname, ipconfig, systeminfo,
    nltest, wmic computersystem/csproduct/bios, reg query MachineGuid) within the search window and the same parent
    process (matched by Sysmon ProcessGuid) makes an outbound connection to an external address. Guardrailed payloads
    collect host, domain and hardware identifiers, check them, and only then fetch or run the next stage.
  gaps: >-
    Checks done in-process through APIs or WMI (no child processes) are invisible here; the WMI-Activity and module-load
    legs ATT&CK lists are not joined.
  data_components:
  - DC0032
  - DC0082
  feeds:
  - sysmon
  tuning:
  - element: EnvironmentalArtifactList
    bind: macro
    name: mitre_an1551_discovery
    default: >-
      (Image IN ("*\\whoami.exe", "*\\hostname.exe", "*\\ipconfig.exe", "*\\systeminfo.exe", "*\\nltest.exe", "*\\getmac.exe",
      "*\\quser.exe", "*\\net.exe", "*\\net1.exe") OR (Image="*\\wmic.exe" CommandLine IN ("*computersystem*", "*csproduct*",
      "*bios*", "*os get*", "*nicconfig*")) OR (Image="*\\reg.exe" CommandLine="*MachineGuid*"))
  - element: DiscoveryActivityThreshold
    bind: macro
    name: mitre_an1551_threshold
    default: '3'
    note: Distinct discovery binaries spawned by one parent process.
  - element: CryptographicLibraryWhitelist
    bind: lookup
    name: mitre_allowlist_processes
    note: Inventory and management agents that collect host facts and report home.
  - element: DiscoveryTimeWindow
    bind: filter
    name: mitre_an1551_filter
    note: The window is the search range (20 minutes on a 15-minute schedule).
  spl: |-
    (`mitre_dc0032_sysmon` EventCode=1 `mitre_an1551_discovery`)
    OR (`mitre_dc0082_sysmon` EventCode=3 Initiated="true")
    | `mitre_normalize_host`
    | eval guid=if(EventCode==1, ParentProcessGuid, ProcessGuid), discovery=if(EventCode==1, lower(replace(Image, "^.*\\\\", "")), null()), external=if(EventCode==3 AND NOT `mitre_is_internal(DestinationIp)` AND NOT match(DestinationIp, "^(127\.|::1|fe80:|169\.254\.)"), DestinationIp, null()), parent=if(EventCode==1, ParentImage, Image)
    | stats dc(discovery) as distinct_discovery values(discovery) as discovery values(external) as dest_ip values(parent) as parent_process values(user) as user min(_time) as firstTime max(_time) as lastTime by dest guid
    | where distinct_discovery >= `mitre_an1551_threshold` AND isnotnull(dest_ip)
    | eval parent_process_name=lower(replace(mvindex(parent_process, 0), "^.*\\\\", "")), process_name=parent_process_name
    | search `mitre_not_allowlisted_process`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1551_filter`
  risk:
    message: $parent_process_name$ on $dest$ ran $distinct_discovery$ environment checks and connected out
    objects:
    - field: dest
      type: system
      score: 40
    threat_objects:
    - field: parent_process_name
      type: process_name
  schedule:
    cron: '*/15 * * * *'
    earliest: -20m@m
    latest: now
  throttle:
    fields:
    - dest
    - parent_process_name
    period: 86400s
  false_positives:
  - >-
    Inventory, monitoring and RMM agents that shell out for host facts; login scripts that also map drives over
    the internet.
  baselines: []
  sigma:
    rules:
    - name: an1551_discovery_child
      logsource:
        product: windows
        category: process_creation
      detection:
        selection:
          Image|endswith:
          - \whoami.exe
          - \hostname.exe
          - \ipconfig.exe
          - \systeminfo.exe
          - \nltest.exe
          - \getmac.exe
        condition: selection
    correlation:
      type: value_count
      group-by:
      - Computer
      - ParentProcessGuid
      timespan: 10m
      condition:
        field: Image
        gte: 3
kql: null
esql: null
