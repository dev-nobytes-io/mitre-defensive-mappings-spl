# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0578
name: Analytic 0578
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0202#AN0578
  attack_release: '20.1'
  detection_strategy:
    id: DET0202
    name: Behavioral Detection of Windows Command Shell Execution
  technique:
    id: T1059.003
    name: Windows Command Shell
    tactics:
    - execution
    usage_score: 480
  platforms:
  - Windows
  description: >-
    Detects interactive or scripted abuse of cmd.exe, batch files, or shell invocation chains. Focuses on parent-child
    relationships (e.g., cmd.exe launched from unusual parents), anomalous command-line parameters, and chaining
    with discovery, credential access, or lateral movement behaviors.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0016
    dc_name: Module Load
    name: WinEventLog:Sysmon
    channel: EventCode=7
  - dc: DC0029
    dc_name: Script Execution
    name: EDR:scriptblock
    channel: Process Tree + Script Block Logging
  mutable_elements:
  - field: ParentProcessName
    description: Cmd.exe launched from uncommon parents (e.g., msedge.exe, winword.exe) may indicate abuse.
  - field: TimeWindow
    description: Cmd or .bat execution during non-working hours may indicate automation or C2 activity.
  - field: CommandLinePattern
    description: Flags suspicious switches (e.g., /c ping, /k whoami) or command chaining (&&, ^).
  - field: ScriptStoragePath
    description: Batch file execution from %TEMP%, C:\Users\Public, or external drives.
  - field: UserContext
    description: Flags admin-level users executing cmd outside expected baselines.
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: ParentProcessName
    bind: lookup
    name: mitre_allowlist_processes
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: CommandLinePattern
    bind: macro
    name: mitre_an0578_commandlinepattern
  - element: ScriptStoragePath
    bind: lookup
    name: mitre_sensitive_paths
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
curated:
  status: implemented
  title: cmd.exe started by an unusual parent or running a batch file from a staging path
  content_type: anomaly
  severity: low
  summary: >-
    cmd.exe is started by a browser, mail or chat client, Java, the print spooler, SQL Server or LSASS, or it runs
    a .bat/.cmd file located in Users\Public, a Temp directory or Downloads.
  gaps: >-
    Office and script-host parents are covered by AN0819 and AN0209 and are excluded here to avoid double counting.
    Module loads, script block logging, time-of-day and admin-context conditions are not evaluated.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: ParentProcessName
    bind: macro
    name: mitre_an0578_unusual_parents
    default: >-
      Processes.parent_process_name IN ("msedge.exe", "chrome.exe", "firefox.exe", "iexplore.exe", "brave.exe",
      "outlook.exe", "thunderbird.exe", "teams.exe", "ms-teams.exe", "java.exe", "javaw.exe", "spoolsv.exe", "lsass.exe",
      "sqlservr.exe")
  - element: ScriptStoragePath
    bind: macro
    name: mitre_an0578_script_paths
    default: >-
      Processes.process IN ("*\\users\\public\\*.bat*", "*\\users\\public\\*.cmd*", "*\\appdata\\local\\temp\\*.bat*",
      "*\\appdata\\local\\temp\\*.cmd*", "*\\windows\\temp\\*.bat*", "*\\windows\\temp\\*.cmd*", "*\\downloads\\*.bat*",
      "*\\downloads\\*.cmd*")
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where` Processes.process_name="cmd.exe"
        (`mitre_an0578_unusual_parents` OR `mitre_an0578_script_paths`) NOT Processes.process="*chrome-extension://*"
        by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_user`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0578_filter`
  risk:
    message: Unusual cmd.exe execution on $dest$ from $parent_process_name$
    objects:
    - field: dest
      type: system
      score: 30
    - field: user
      type: user
      score: 30
    threat_objects:
    - field: parent_process_name
      type: parent_process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    - parent_process_name
    period: 3600s
  false_positives:
  - >-
    Browser native-messaging hosts, Java application launchers, SQL Agent jobs and installers that unpack batch
    files to Temp.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      cmd:
        Image|endswith: \cmd.exe
      parent:
        ParentImage|endswith:
        - \msedge.exe
        - \chrome.exe
        - \firefox.exe
        - \iexplore.exe
        - \outlook.exe
        - \thunderbird.exe
        - \java.exe
        - \javaw.exe
        - \spoolsv.exe
        - \lsass.exe
        - \sqlservr.exe
      script:
        CommandLine|contains:
        - \Users\Public\
        - \AppData\Local\Temp\
        - \Windows\Temp\
        - \Downloads\
        CommandLine|re: (?i)\.(bat|cmd)
      native_messaging:
        CommandLine|contains: chrome-extension://
      condition: cmd and (parent or script) and not native_messaging
kql: null
esql: null
