# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1308
name: Analytic 1308
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0475#AN1308
  attack_release: '20.1'
  detection_strategy:
    id: DET0475
    name: Detection Strategy for T1218.011 Rundll32 Abuse
  technique:
    id: T1218.011
    name: Rundll32
    tactics:
    - stealth
    usage_score: 137
  platforms:
  - Windows
  description: >-
    Detects rundll32.exe invoked with atypical arguments (.dll, .cpl, javascript:, mshtml). DLLs not normally loaded
    by rundll32 are mapped into memory. Control_RunDLL or RunHTMLApplication invoked. Suspicious DLLs or scripts
    accessed from disk or network. Rundll32 reaches out to external domains (e.g., fetching .sct or .hta).
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0016
    dc_name: Module Load
    name: WinEventLog:Sysmon
    channel: EventCode=7
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  mutable_elements:
  - field: TimeWindow
    description: Correlating rundll32 invocation with DLL load or network activity within X seconds.
  - field: ParentProcessFilter
    description: >-
      Limit detection to suspicious parent processes (e.g., explorer.exe, office apps) vs. trusted installers.
  - field: AllowedDLLs
    description: Baseline list of legitimate DLLs frequently executed by rundll32 in the environment.
  - field: ExternalIPRange
    description: Scope of external IP ranges considered anomalous for rundll32 network connections.
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: ParentProcessFilter
    bind: lookup
    name: mitre_allowlist_processes
  - element: AllowedDLLs
    bind: filter
    name: mitre_an1308_filter
  - element: ExternalIPRange
    bind: lookup
    name: mitre_internal_networks
curated:
  status: implemented
  title: Rundll32 executing script, remote or user-writable payloads
  content_type: ttp
  severity: medium
  summary: >-
    rundll32.exe is started with a javascript:/vbscript: moniker, mshtml RunHTMLApplication, a URL, or a DLL or
    CPL that lives in a user-writable directory (Users, ProgramData, Temp, AppData, Public).
  gaps: >-
    Module loads, file creation and network connections by rundll32 are not correlated; an AllowedDLLs baseline
    is approximated by path only.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: AllowedDLLs
    bind: macro
    name: mitre_an1308_suspicious_args
    default: >-
      Processes.process IN ("*javascript:*", "*vbscript:*", "*runhtmlapplication*", "*http://*", "*https://*", "*\\users\\public\\*",
      "*\\appdata\\*", "*\\programdata\\*", "*\\windows\\temp\\*", "*\\perflogs\\*", "*\\downloads\\*")
    note: >-
      Remove a path here only if software you trust is installed there; prefer an exclusion in the filter macro.
  - element: ParentProcessFilter
    bind: filter
    name: mitre_an1308_filter
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where` Processes.process_name="rundll32.exe" `mitre_an1308_suspicious_args`
        by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process
    | `drop_dm_object_name(Processes)`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1308_filter`
  risk:
    message: Suspicious rundll32 invocation on $dest$ by $user$
    objects:
    - field: dest
      type: system
      score: 50
    - field: user
      type: user
      score: 50
    threat_objects:
    - field: process
      type: process
  schedule: {}
  throttle:
    fields:
    - dest
    - process
    period: 3600s
  false_positives:
  - >-
    Per-user installed software (collaboration clients, printer utilities) that registers DLLs under AppData or
    ProgramData.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - 'javascript:'
        - 'vbscript:'
        - RunHTMLApplication
        - http://
        - https://
        - \Users\Public\
        - \AppData\
        - \ProgramData\
        - \Windows\Temp\
      condition: selection
kql: null
esql: null
