# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0980
name: Analytic 0980
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0346#AN0980
  attack_release: '20.1'
  detection_strategy:
    id: DET0346
    name: Detect Screen Capture via Commands and API Calls
  technique:
    id: T1113
    name: Screen Capture
    tactics:
    - collection
    usage_score: 192
  platforms:
  - Windows
  description: >-
    Unusual use of screen capture APIs (e.g., CopyFromScreen) or command-line tools to write image files to disk.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0016
    dc_name: Module Load
    name: WinEventLog:Sysmon
    channel: EventCode=7
  mutable_elements:
  - field: ParentProcessName
    description: >-
      Depends on allowed parent process behaviors in the environment (e.g., explorer.exe vs powershell.exe)
  - field: TimeWindow
    description: Can tune alert thresholds for rapid or scheduled screenshots (e.g., interval-based screen capture)
  - field: ImageExtension
    description: To detect file writes (e.g., .bmp, .png) that deviate from typical user activity
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: ParentProcessName
    bind: lookup
    name: mitre_allowlist_processes
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: ImageExtension
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Screenshot captured from a script or command-line tool
  content_type: anomaly
  severity: medium
  summary: >-
    A command line uses the .NET screen-capture API (CopyFromScreen, System.Drawing bitmaps) or a screenshot utility
    (NirCmd savescreenshot, Problem Steps Recorder with output), or a script host, PowerShell or LOLBin writes an
    image file into a staging path (Sysmon 11).
  gaps: >-
    API use from compiled malware (no telling command line) and image writes by unusual binaries outside the interpreter
    list are not seen; module loads of GDI libraries are too common to use.
  data_components:
  - DC0032
  - DC0039
  feeds:
  - sysmon
  tuning:
  - element: ImageExtension
    bind: macro
    name: mitre_an0980_image_writes
    default: >-
      TargetFilename IN ("*.png", "*.jpg", "*.jpeg", "*.bmp", "*.gif") TargetFilename IN ("*\\AppData\\Local\\Temp\\*",
      "*\\Windows\\Temp\\*", "*\\Users\\Public\\*", "*\\ProgramData\\*", "*\\PerfLogs\\*")
  - element: ParentProcessName
    bind: filter
    name: mitre_an0980_filter
  - element: TimeWindow
    bind: filter
    name: mitre_an0980_filter
    note: Interval-based capture shows as a high count per process.
  spl: |-
    (`mitre_dc0032_sysmon` EventCode=1 (CommandLine IN ("*CopyFromScreen*", "*System.Drawing.Bitmap*", "*Graphics]::FromImage*", "*savescreenshot*") OR (Image="*\\psr.exe" CommandLine="*/output*")))
      OR (`mitre_dc0039_sysmon` EventCode=11 Image IN ("*\\powershell.exe", "*\\pwsh.exe", "*\\wscript.exe", "*\\cscript.exe", "*\\mshta.exe", "*\\rundll32.exe", "*\\regsvr32.exe", "*\\cmd.exe") `mitre_an0980_image_writes`)
    | `mitre_normalize_host`
    | eval signal=if(EventCode==11, "interpreter_wrote_image", "capture_command"), process_name=replace(Image, "^.*\\\\", "")
    | stats count min(_time) as firstTime max(_time) as lastTime values(signal) as signals values(CommandLine) as process values(TargetFilename) as file_path by dest user process_name
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0980_filter`
  risk:
    message: Screen capture activity by $process_name$ on $dest$
    objects:
    - field: dest
      type: system
      score: 40
    - field: user
      type: user
      score: 40
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process_name
    period: 3600s
  false_positives:
  - Support tooling that captures screenshots, Problem Steps Recorder sessions requested by help desk.
  baselines: []
  sigma:
    rules:
    - name: an0980_capture_command
      logsource:
        product: windows
        category: process_creation
      detection:
        api:
          CommandLine|contains:
          - CopyFromScreen
          - System.Drawing.Bitmap
          - savescreenshot
        psr:
          Image|endswith: \psr.exe
          CommandLine|contains: /output
        condition: api or psr
    - name: an0980_interpreter_image_write
      logsource:
        product: windows
        category: file_event
      detection:
        selection:
          Image|endswith:
          - \powershell.exe
          - \pwsh.exe
          - \wscript.exe
          - \cscript.exe
          - \mshta.exe
          - \rundll32.exe
          - \regsvr32.exe
          TargetFilename|endswith:
          - .png
          - .jpg
          - .jpeg
          - .bmp
          - .gif
          TargetFilename|contains:
          - \AppData\Local\Temp\
          - \Windows\Temp\
          - \Users\Public\
          - \ProgramData\
        condition: selection
kql: null
esql: null
