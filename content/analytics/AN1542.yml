# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1542
name: Analytic 1542
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0559#AN1542
  attack_release: '20.1'
  detection_strategy:
    id: DET0559
    name: Multi-Platform Shutdown or Reboot Detection via Execution and Host Status Events
  technique:
    id: T1529
    name: System Shutdown/Reboot
    tactics:
    - impact
    usage_score: 37
  platforms:
  - Network Devices
  description: >-
    Monitor CLI 'reload' commands issued without scheduled maintenance, and correlate to TACACS+/AAA logs for privilege
    validation.
  log_source_references:
  - dc: DC0064
    dc_name: Command Execution
    name: networkdevice:syslog
    channel: reload command issued
  - dc: DC0018
    dc_name: Host Status
    name: networkdevice:syslog
    channel: System reboot scheduled or performed
  mutable_elements:
  - field: PrivilegeLevel
    description: TACACS+/AAA role thresholds for command execution.
  - field: ChangeTicketCorrelation
    description: Track change control windows or ITSM integration.
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: PrivilegeLevel
    bind: filter
    name: mitre_an1542_filter
  - element: ChangeTicketCorrelation
    bind: filter
    name: mitre_an1542_filter
curated:
  status: implemented
  title: Firewall restart or shutdown
  content_type: anomaly
  severity: medium
  summary: >-
    A Palo Alto system log records a device restart, reboot or shutdown. An unplanned restart of a perimeter firewall
    is either an outage or someone using a reload to apply tampered configuration or software.
  gaps: >-
    Matched on the description text because restart event ids differ across PAN-OS versions; change-window correlation
    (ChangeTicketCorrelation) is left to the filter macro. Routers and switches need the netdev_syslog feed.
  data_components:
  - DC0018
  feeds:
  - palo_alto
  tuning:
  - element: ChangeTicketCorrelation
    bind: filter
    name: mitre_an1542_filter
    note: Exclude maintenance windows, e.g. search NOT date_wday="sunday".
  - element: PrivilegeLevel
    bind: macro
    name: mitre_an1542_patterns
    default: description IN ("*restart*", "*reboot*", "*shutdown*", "*shut down*")
  spl: |-
    `mitre_dc0018_palo_alto` `mitre_st_palo_alto_system` `mitre_an1542_patterns`
    | `mitre_normalize_pan_system`
    | stats count min(_time) as firstTime max(_time) as lastTime values(description) as description values(user) as user values(pan_event_id) as signature by dvc
    | rename dvc as dest
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1542_filter`
  risk:
    message: Firewall $dest$ restarted or shut down
    objects:
    - field: dest
      type: system
      score: 25
  schedule: {}
  throttle:
    fields:
    - dest
    period: 3600s
  false_positives:
  - Planned upgrades and HA failover tests.
  baselines: []
  sigma:
    logsource:
      product: paloalto
      service: system
    detection:
      selection:
        description|contains:
        - restart
        - reboot
        - shutdown
        - shut down
      condition: selection
kql: null
esql: null
