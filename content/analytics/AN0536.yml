# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0536
name: Analytic 0536
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0188#AN0536
  attack_release: '20.1'
  detection_strategy:
    id: DET0188
    name: Local Storage Discovery via Drive Enumeration and Filesystem Probing
  technique:
    id: T1680
    name: Local Storage Discovery
    tactics:
    - discovery
    usage_score: 116
  platforms:
  - Windows
  description: >-
    Drive enumeration using PowerShell (`Get-PSDrive`), `wmic logicaldisk`, or Win32 API indicative of local volume
    enumeration by non-admin users or executed outside of baseline system inventory scripts.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  mutable_elements:
  - field: user_context
    description: Non-system accounts performing drive enumeration may be higher fidelity indicators
  - field: parent_process_name
    description: Baseline parent-child process lineage can help distinguish admin tools from malicious scripts
derived:
  coverage: mapped
  suggested_content_type: hunting
  suggested_tuning:
  - element: user_context
    bind: lookup
    name: mitre_account_roles
  - element: parent_process_name
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Local drive and volume enumeration commands
  content_type: hunting
  severity: informational
  summary: >-
    Lists hosts and users enumerating drives and volumes: wmic logicaldisk/volume, fsutil fsinfo drives, mountvol,
    Get-PSDrive, Get-Volume, Get-Disk, Get-Partition, in ten-minute buckets.
  gaps: API-level enumeration has no command line. No finding or risk.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: user_context
    bind: lookup
    name: mitre_allowlist_users
  - element: parent_process_name
    bind: filter
    name: mitre_an0536_filter
  spl: |-
    | tstats `mitre_summariesonly` count from `mitre_dc0032_dm` where `mitre_dc0032_dm_where`
        ((Processes.process_name="wmic.exe" Processes.process IN ("*logicaldisk*", "*volume*"))
          OR (Processes.process_name="fsutil.exe" Processes.process="*fsinfo*")
          OR Processes.process_name="mountvol.exe"
          OR (Processes.process_name IN ("powershell.exe", "pwsh.exe") Processes.process IN ("*get-psdrive*", "*get-volume*", "*get-disk*", "*get-partition*", "*win32_logicaldisk*")))
        by Processes.dest Processes.user Processes.parent_process_name Processes.process _time span=10m
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_user`
    | stats sum(count) as count dc(process) as distinct_commands values(process) as process by dest user parent_process_name _time
    | sort - distinct_commands
    | `mitre_an0536_filter`
  risk:
    message: ''
    objects: []
    threat_objects: []
  schedule: {}
  throttle: {}
  false_positives:
  - Inventory agents, backup software and administrators.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    level: informational
    detection:
      wmic:
        Image|endswith: \wmic.exe
        CommandLine|contains:
        - logicaldisk
        - volume
      tools:
        Image|endswith:
        - \mountvol.exe
      powershell:
        CommandLine|contains:
        - Get-PSDrive
        - Get-Volume
        - Get-Disk
        - Get-Partition
        - Win32_LogicalDisk
      condition: 1 of them
kql: null
esql: null
