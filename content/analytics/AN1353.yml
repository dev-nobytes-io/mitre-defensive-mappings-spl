id: AN1353
name: Analytic 1353
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0491#AN1353
  attack_release: '20.1'
  detection_strategy:
    id: DET0491
    name: Peripheral Device Enumeration via System Utilities and API Calls
  technique:
    id: T1120
    name: Peripheral Device Discovery
    tactics:
    - discovery
    usage_score: 69
  platforms:
  - Windows
  description: >-
    Suspicious enumeration of attached peripherals via WMI, PowerShell, or low-level API calls potentially chained
    with removable device interactions.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0035
    dc_name: Process Access
    name: WinEventLog:Sysmon
    channel: EventCode=10
  mutable_elements:
  - field: CommandLineRegex
    description: >-
      Regex patterns for device enumeration utilities (e.g., 'Get-PnpDevice', 'wmic path Win32_USBController')
  - field: TimeWindow
    description: Time threshold for grouping device discovery with follow-on access or manipulation
  - field: UserContext
    description: Filter privileged or service accounts known to legitimately execute enumeration scripts
derived:
  coverage: live
  suggested_content_type: hunting
  suggested_tuning:
  - element: CommandLineRegex
    bind: macro
    name: mitre_an1353_commandlineregex
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
curated:
  status: implemented
  title: Peripheral and USB device enumeration
  content_type: hunting
  severity: informational
  summary: >-
    Lists enumeration of attached devices: Get-PnpDevice, Win32_PnPEntity, Win32_USBControllerDevice, pnputil /enum-devices,
    devcon, and reg query of USBSTOR or Enum\USB, in ten-minute buckets.
  gaps: >-
    API-level enumeration (SetupDi calls) has no command line; process access is not used. No finding or risk.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: CommandLineRegex
    bind: filter
    name: mitre_an1353_filter
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
  - element: TimeWindow
    bind: filter
    name: mitre_an1353_filter
  spl: |-
    | tstats `mitre_summariesonly` count from `mitre_dc0032_dm` where `mitre_dc0032_dm_where`
        ((Processes.process_name IN ("powershell.exe", "pwsh.exe") Processes.process IN ("*get-pnpdevice*", "*win32_pnpentity*", "*win32_usbcontrollerdevice*", "*win32_usbhub*"))
          OR (Processes.process_name="pnputil.exe" Processes.process="*enum-devices*")
          OR Processes.process_name="devcon.exe"
          OR (Processes.process_name="reg.exe" Processes.process="*query*" Processes.process IN ("*usbstor*", "*enum\\usb*"))
          OR (Processes.process_name="wmic.exe" Processes.process IN ("*pnpentity*", "*usbcontroller*")))
        by Processes.dest Processes.user Processes.parent_process_name Processes.process _time span=10m
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_user`
    | stats sum(count) as count dc(process) as distinct_commands values(process) as process by dest user parent_process_name _time
    | sort - count
    | `mitre_an1353_filter`
  risk:
    message: ''
    objects: []
    threat_objects: []
  schedule: {}
  throttle: {}
  false_positives:
  - Device-management and inventory tooling, help-desk diagnostics.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    level: informational
    detection:
      powershell:
        CommandLine|contains:
        - Get-PnpDevice
        - Win32_PnPEntity
        - Win32_USBControllerDevice
      pnputil:
        Image|endswith: \pnputil.exe
        CommandLine|contains: enum-devices
      usbstor:
        CommandLine|contains|all:
        - query
        - USBSTOR
      condition: 1 of them
kql: null
esql: null
