# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1483
name: Analytic 1483
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0538#AN1483
  attack_release: '20.1'
  detection_strategy:
    id: DET0538
    name: Detection Strategy for Protocol Tunneling accross OS platforms.
  technique:
    id: T1572
    name: Protocol Tunneling
    tactics:
    - command-and-control
    usage_score: 66
  platforms:
  - Windows
  description: >-
    Processes such as plink.exe, ssh.exe, or netsh.exe establishing outbound network connections where traffic patterns
    show encapsulated protocols (e.g., RDP over SSH). Defender observations include anomalous process-to-network
    relationships, large asymmetric data flows, and port usage mismatches.
  log_source_references:
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  mutable_elements:
  - field: AllowedTools
    description: Whitelist legitimate tunneling tools (e.g., used by admins).
  - field: DataAsymmetryThreshold
    description: Ratio of sent vs received bytes that indicates tunneling activity.
  - field: TimeWindow
    description: Correlate process creation with network connection within N seconds.
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: AllowedTools
    bind: lookup
    name: mitre_allowlist_processes
  - element: DataAsymmetryThreshold
    bind: macro
    name: mitre_an1483_dataasymmetrythreshold
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: Port forwarding or tunnelling tool started
  content_type: ttp
  severity: medium
  summary: >-
    plink or ssh is started with a local, remote or dynamic port-forward switch; netsh adds a portproxy rule; or
    a known tunnelling client (chisel, ngrok, frpc, cloudflared tunnel, ligolo) is started.
  gaps: >-
    The resulting network connection and the DataAsymmetryThreshold on flow byte counts are not evaluated here;
    see the network analytics for flow-side detection.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: AllowedTools
    bind: macro
    name: mitre_an1483_patterns
    default: >-
      ((Processes.process_name IN ("plink.exe", "ssh.exe") Processes.process IN ("* -r *", "* -l *", "* -d *", "*:127.0.0.1:*",
      "*:localhost:*")) OR (Processes.process_name="netsh.exe" Processes.process="*portproxy*add*") OR Processes.process_name
      IN ("chisel.exe", "ngrok.exe", "frpc.exe", "ligolo*.exe", "gost.exe") OR (Processes.process_name="cloudflared.exe"
      Processes.process="*tunnel*"))
    note: >-
      Matching is case-insensitive, so ssh -L/-R/-D and -l (login name) both match; exclude administrators in the
      filter macro if that is noisy.
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where` `mitre_an1483_patterns`
        by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process
    | `drop_dm_object_name(Processes)`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1483_filter`
  risk:
    message: Tunnelling tool $process_name$ started on $dest$ by $user$
    objects:
    - field: dest
      type: system
      score: 55
    - field: user
      type: user
      score: 45
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    - process_name
    period: 3600s
  false_positives:
  - Administrators and developers using SSH port forwarding or approved tunnel clients.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      ssh:
        Image|endswith:
        - \plink.exe
        - \ssh.exe
        CommandLine|contains:
        - ' -R '
        - ' -L '
        - ' -D '
      netsh:
        Image|endswith: \netsh.exe
        CommandLine|contains|all:
        - portproxy
        - add
      tools:
        Image|endswith:
        - \chisel.exe
        - \ngrok.exe
        - \frpc.exe
        - \gost.exe
      condition: ssh or netsh or tools
kql: null
esql: null
