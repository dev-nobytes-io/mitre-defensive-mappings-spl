# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1374
name: Analytic 1374
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0497#AN1374
  attack_release: '20.1'
  detection_strategy:
    id: DET0497
    name: Detection of Defense Impairment through Disabled or Modified Tools across OS Platforms.
  technique:
    id: T1685
    name: Disable or Modify Tools
    tactics:
    - defense-impairment
    usage_score: 173
  platforms:
  - Network Devices
  description: >-
    Detects disabling AAA, syslog, SNMP traps, ACL logging, or security features on routers/switches/firewalls;
    correlates privileged login followed by configuration commit reducing visibility.
  log_source_references:
  - dc: DC0041
    dc_name: Service Metadata
    name: networkdevice:config
    channel: 'write: Startup configuration changes disabling security checks'
  - dc: DC0018
    dc_name: Host Status
    name: networkdevice:syslog
    channel: no logging host, no aaa new-model, no snmp-server, commit
  mutable_elements:
  - field: ConfigBaseline
    description: Reference configuration state for detecting unauthorized modifications.
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: ConfigBaseline
    bind: filter
    name: mitre_an1374_filter
curated:
  status: implemented
  title: Firewall logging or monitoring configuration changed
  content_type: ttp
  severity: medium
  summary: >-
    A Palo Alto configuration log entry where an administrator deletes, sets or edits an object under the logging
    and monitoring parts of the configuration: log settings, syslog, SNMP trap or e-mail server profiles, and log-forwarding
    profiles. Deleting or redirecting these reduces visibility.
  gaps: >-
    Comparison against a reference configuration (ConfigBaseline) is not implemented, and removal of a log-forwarding
    profile from an individual security rule is only caught if the rule path names the profile. Covers the firewall
    only; routers and switches need the netdev_syslog feed.
  data_components:
  - DC0041
  feeds:
  - palo_alto
  tuning:
  - element: ConfigBaseline
    bind: macro
    name: mitre_an1374_visibility_paths
    default: >-
      path IN ("*log-settings*", "*syslog*", "*snmptrap*", "*log-forwarding*", "*log-collector*", "*email*server*",
      "*logging-service*")
    note: Configuration paths treated as visibility-relevant.
  spl: |-
    `mitre_dc0041_palo_alto` `mitre_st_palo_alto_config` cmd IN ("delete", "set", "edit", "rename", "move") `mitre_an1374_visibility_paths`
    | `mitre_normalize_pan`
    | eval dest=coalesce(dvc_name, dvc, host), config_path=path
    | search `mitre_not_allowlisted_user`
    | stats count min(_time) as firstTime max(_time) as lastTime values(cmd) as config_action values(config_path) as config_path values(client) as client by dest user
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1374_filter`
  risk:
    message: Logging configuration changed on firewall $dest$ by $user$
    objects:
    - field: dest
      type: system
      score: 60
    - field: user
      type: user
      score: 50
  schedule:
    earliest: -20m@m
    latest: -5m@m
  throttle:
    fields:
    - dest
    - user
    period: 3600s
  false_positives:
  - Planned changes to log collectors or SIEM destinations; Panorama template pushes.
  baselines: []
  sigma:
    logsource:
      product: paloalto
      service: config
    detection:
      selection:
        cmd:
        - delete
        - set
        - edit
        - rename
        - move
        path|contains:
        - log-settings
        - syslog
        - snmptrap
        - log-forwarding
        - log-collector
        - logging-service
      condition: selection
kql: null
esql: null
