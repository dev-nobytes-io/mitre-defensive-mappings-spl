# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1100
name: Analytic 1100
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0392#AN1100
  attack_release: '20.1'
  detection_strategy:
    id: DET0392
    name: Multi-Platform Software Discovery Behavior Chain
  technique:
    id: T1518
    name: Software Discovery
    tactics:
    - discovery
    usage_score: 69
  platforms:
  - Windows
  description: >-
    Adversary spawns a process or script to enumerate installed software using WMI, registry, or PowerShell, potentially
    followed by additional discovery or evasion behavior.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0064
    dc_name: Command Execution
    name: WinEventLog:PowerShell
    channel: Execution of 'Get-WmiObject Win32_Product' or similar PowerShell cmdlets
  mutable_elements:
  - field: TimeWindow
    description: Detection may be scoped to multiple discovery commands within a short timeframe.
  - field: ParentProcess
    description: Tuning based on whether discovery activity stems from suspicious versus approved management tools.
derived:
  coverage: live
  suggested_content_type: hunting
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: ParentProcess
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Installed software enumeration
  content_type: hunting
  severity: informational
  summary: >-
    Lists queries for installed software: wmic product, Win32_Product, Get-Package, Get-AppxPackage, and registry
    reads of the Uninstall keys through reg or PowerShell, in ten-minute buckets with the parent.
  gaps: >-
    Registry reads through APIs are invisible. AN0589 overlaps on reg query of Uninstall. No finding or risk.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: ParentProcess
    bind: filter
    name: mitre_an1100_filter
  - element: TimeWindow
    bind: lookup
    name: mitre_allowlist_users
    note: Software inventory accounts.
  spl: |-
    | tstats `mitre_summariesonly` count from `mitre_dc0032_dm` where `mitre_dc0032_dm_where`
        ((Processes.process_name="wmic.exe" Processes.process="*product*")
          OR (Processes.process_name IN ("powershell.exe", "pwsh.exe") Processes.process IN ("*win32_product*", "*get-package*", "*get-appxpackage*", "*\\uninstall\\*"))
          OR (Processes.process_name="reg.exe" Processes.process="*query*" Processes.process="*\\uninstall*"))
        by Processes.dest Processes.user Processes.parent_process_name Processes.process _time span=10m
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_user`
    | stats sum(count) as count dc(process) as distinct_commands values(process) as process by dest user parent_process_name _time
    | sort - count
    | `mitre_an1100_filter`
  risk:
    message: ''
    objects: []
    threat_objects: []
  schedule: {}
  throttle: {}
  false_positives:
  - Software inventory and licence-management tools.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    level: informational
    detection:
      wmic:
        Image|endswith: \wmic.exe
        CommandLine|contains: product
      powershell:
        CommandLine|contains:
        - Win32_Product
        - Get-Package
        - Get-AppxPackage
      condition: wmic or powershell
kql: null
esql: null
