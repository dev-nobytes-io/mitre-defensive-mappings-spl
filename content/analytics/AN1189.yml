# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1189
name: Analytic 1189
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0425#AN1189
  attack_release: '20.1'
  detection_strategy:
    id: DET0425
    name: Suspicious Use of Web Services for C2
  technique:
    id: T1102
    name: Web Service
    tactics:
    - command-and-control
    usage_score: 71
  platforms:
  - Windows
  description: >-
    Detects unusual outbound connections to web services from uncommon processes using SSL/TLS, particularly those
    exhibiting high outbound data volume or persistence.
  log_source_references:
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  - dc: DC0085
    dc_name: Network Traffic Content
    name: NSM:Flow
    channel: SSL/TLS Inspection or PCAP
  mutable_elements:
  - field: ProcessName
    description: To tune for unexpected or uncommon executables initiating network connections
  - field: DataTransferThreshold
    description: Volume of outbound data in short time window (e.g., >1MB in <5 min)
  - field: TimeWindow
    description: Look for connections persisting outside of normal business hours
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: ProcessName
    bind: lookup
    name: mitre_allowlist_processes
  - element: DataTransferThreshold
    bind: macro
    name: mitre_an1189_datatransferthreshold
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: Non-browser process resolving web services used for C2
  content_type: anomaly
  severity: medium
  summary: >-
    Sysmon DNS queries (22) for paste sites, code hosting raw content, chat-platform APIs and webhooks, and consumer
    cloud-storage APIs, made by a process that is not a browser or the vendor's own client. Malware uses these services
    for C2 and staging because they are trusted and encrypted.
  gaps: >-
    Data volume is not measured (Sysmon 22 has no bytes); join with Corelight ssl/conn on the resolved address to
    add it. Processes that use DoH or a hard-coded IP are invisible.
  data_components:
  - DC0085
  feeds:
  - sysmon
  tuning:
  - element: DomainCategory
    bind: macro
    name: mitre_an1189_web_services
    default: >-
      QueryName IN ("pastebin.com", "*.pastebin.com", "paste.ee", "hastebin.com", "rentry.co", "ghostbin.*", "raw.githubusercontent.com",
      "gist.githubusercontent.com", "*.gitlab.io", "api.telegram.org", "discord.com", "discordapp.com", "cdn.discordapp.com",
      "hooks.slack.com", "api.dropboxapi.com", "content.dropboxapi.com", "graph.microsoft.com", "*.ngrok.io", "*.ngrok-free.app",
      "*.trycloudflare.com", "api.notion.com", "api.trello.com", "*.workers.dev", "transfer.sh", "file.io", "*.webhook.site",
      "script.google.com", "docs.google.com", "drive.google.com")
  - element: ProcessName
    bind: macro
    name: mitre_an1189_expected_clients
    default: >-
      Image IN ("*\\chrome.exe", "*\\msedge.exe", "*\\firefox.exe", "*\\brave.exe", "*\\opera.exe", "*\\iexplore.exe",
      "*\\Teams.exe", "*\\ms-teams.exe", "*\\slack.exe", "*\\Discord.exe", "*\\Telegram.exe", "*\\Dropbox.exe",
      "*\\OneDrive.exe", "*\\outlook.exe", "*\\olk.exe", "*\\git-remote-https.exe", "*\\Code.exe", "*\\GoogleDriveFS.exe",
      "*\\msedgewebview2.exe", "*\\svchost.exe")
  - element: DataTransferThreshold
    bind: filter
    name: mitre_an1189_filter
    note: Volume is not available from Sysmon; tune by process here.
  - element: TimeWindow
    bind: lookup
    name: mitre_allowlist_processes
    note: Approved automation (backup agents, CI runners) using these APIs.
  spl: |-
    `mitre_dc0085_sysmon` EventCode=22 `mitre_an1189_web_services` NOT `mitre_an1189_expected_clients`
    | `mitre_normalize_host`
    | eval process_name=lower(replace(Image, "^.*\\\\", "")), query=lower(QueryName)
    | search `mitre_not_allowlisted_process`
    | stats count min(_time) as firstTime max(_time) as lastTime values(query) as query values(Image) as process by dest user process_name
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1189_filter`
  risk:
    message: $process_name$ on $dest$ resolved web services used for C2 ($query$)
    objects:
    - field: dest
      type: system
      score: 35
    threat_objects:
    - field: query
      type: domain
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process_name
    period: 86400s
  false_positives:
  - >-
    Developer tools, scripting runtimes and CLI clients (git, python, node, curl) used legitimately against these
    APIs.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: dns_query
    detection:
      selection:
        QueryName|endswith:
        - pastebin.com
        - raw.githubusercontent.com
        - gist.githubusercontent.com
        - api.telegram.org
        - cdn.discordapp.com
        - hooks.slack.com
        - api.dropboxapi.com
        - ngrok-free.app
        - trycloudflare.com
        - transfer.sh
      clients:
        Image|endswith:
        - \chrome.exe
        - \msedge.exe
        - \firefox.exe
        - \brave.exe
        - \Teams.exe
        - \slack.exe
        - \Discord.exe
        - \Telegram.exe
        - \Dropbox.exe
        - \OneDrive.exe
      condition: selection and not clients
kql: null
esql: null
