# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1527
name: Analytic 1527
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0552#AN1527
  attack_release: '20.1'
  detection_strategy:
    id: DET0552
    name: Detection of Windows Service Creation or Modification
  technique:
    id: T1543.003
    name: Windows Service
    tactics:
    - persistence
    - privilege-escalation
    usage_score: 172
  platforms:
  - Windows
  description: >-
    Detects creation or modification of Windows Services through command-line tools (e.g., `sc.exe`, `powershell.exe`),
    Registry key changes under `HKLM\System\CurrentControlSet\Services`, and service execution under SYSTEM with
    unsigned or anomalous binary paths. Detects privilege escalation via driver installation or `CreateServiceW`
    usage. Correlates parent-child lineage, startup behavior, and rare service names.
  log_source_references:
  - dc: DC0060
    dc_name: Service Creation
    name: WinEventLog:Security
    channel: EventCode=4697
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0063
    dc_name: Windows Registry Key Modification
    name: WinEventLog:Sysmon
    channel: EventCode=13, 14
  - dc: DC0079
    dc_name: Driver Load
    name: WinEventLog:Sysmon
    channel: EventCode=6
  mutable_elements:
  - field: ServiceNamePattern
    description: Regex for suspicious or uncommon service names (e.g., `svhostx`, `winhelp`, etc.)
  - field: ImagePathFilter
    description: Flag services whose image path resides in uncommon directories (e.g., `C:\Users\`, `C:\Temp\`)
  - field: DriverExtensionList
    description: Watch for `.sys` files loaded by `sc`, Registry, or `ZwLoadDriver` APIs
  - field: StartupTypeChangeWindow
    description: Temporal window to correlate Registry `Start` key changes with service creation
  - field: UnsignedBinaryAlert
    description: Raise alerts for unsigned binaries registered as services
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: ServiceNamePattern
    bind: macro
    name: mitre_an1527_servicenamepattern
  - element: ImagePathFilter
    bind: lookup
    name: mitre_allowlist_processes
  - element: DriverExtensionList
    bind: lookup
    name: mitre_sensitive_paths
  - element: StartupTypeChangeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: UnsignedBinaryAlert
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Service installed with an interpreter or user-writable binary path
  content_type: ttp
  severity: medium
  summary: >-
    A new service is registered (System 7045 or Security 4697) whose image path runs a command interpreter or LOLBin,
    or points into Users, ProgramData, Temp, AppData, PerfLogs or an ADMIN$ / loopback UNC path. Covers PsExec-style
    and malware service persistence.
  gaps: >-
    Service key registry changes, driver loads (Sysmon 6), signature checks and rare-name analysis from ATT&CK's
    description are not included.
  data_components:
  - DC0060
  feeds:
  - wineventlog
  tuning:
  - element: ImagePathFilter
    bind: macro
    name: mitre_an1527_suspicious_paths
    default: >-
      service_path IN ("*\\Users\\*", "*\\ProgramData\\*", "*\\Windows\\Temp\\*", "*\\AppData\\*", "*\\PerfLogs\\*",
      "*%COMSPEC%*", "*cmd.exe*", "*cmd /c*", "*powershell*", "*pwsh*", "*rundll32*", "*regsvr32*", "*mshta*", "*\\ADMIN$\\*",
      "*\\\\127.0.0.1\\*")
  - element: ServiceNamePattern
    bind: filter
    name: mitre_an1527_filter
  spl: |-
    `mitre_dc0060_wineventlog` EventCode IN (7045, 4697)
    | `mitre_normalize_host`
    | eval service_path=coalesce(ImagePath, ServiceFileName), service_name=ServiceName, service_account=coalesce(AccountName, ServiceAccount)
    | search `mitre_an1527_suspicious_paths` NOT service_path="*\\ProgramData\\Microsoft\\Windows Defender\\*"
    | stats count min(_time) as firstTime max(_time) as lastTime values(service_account) as service_account values(EventCode) as signature_id by dest user service_name service_path
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1527_filter`
  risk:
    message: Suspicious service $service_name$ installed on $dest$
    objects:
    - field: dest
      type: system
      score: 60
    - field: user
      type: user
      score: 40
    threat_objects:
    - field: service_name
      type: service
  schedule: {}
  throttle:
    fields:
    - dest
    - service_name
    period: 3600s
  false_positives:
  - >-
    Vendor software that installs services from ProgramData; remote administration with PsExec-like tools.
  baselines: []
  sigma:
    logsource:
      product: windows
      service: system
    detection:
      selection:
        EventID: 7045
        ImagePath|contains:
        - \Users\
        - \ProgramData\
        - \Windows\Temp\
        - \AppData\
        - \PerfLogs\
        - '%COMSPEC%'
        - cmd.exe
        - powershell
        - rundll32
        - regsvr32
        - mshta
        - \ADMIN$\
      filter:
        ImagePath|contains: \ProgramData\Microsoft\Windows Defender\
      condition: selection and not filter
kql: null
esql: null
