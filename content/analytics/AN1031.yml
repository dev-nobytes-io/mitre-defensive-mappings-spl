# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1031
name: Analytic 1031
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0364#AN1031
  attack_release: '20.1'
  detection_strategy:
    id: DET0364
    name: Behavioral Detection Strategy for WMI Execution Abuse on Windows
  technique:
    id: T1047
    name: Windows Management Instrumentation
    tactics:
    - execution
    usage_score: 204
  platforms:
  - Windows
  description: >-
    Detects adversarial abuse of WMI to execute local or remote commands via WMIC, PowerShell, or COM API through
    a multi-event chain: process creation, command execution, and corresponding network connection if remote.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  - dc: DC0008
    dc_name: WMI Creation
    name: WinEventLog:WMI
    channel: EventCode=5857, 5858, 5860, 5861
  mutable_elements:
  - field: WMIQueryScope
    description: Restrict detection scope to suspicious WMI namespaces like `\root\cimv2`, `\root\subscription`.
  - field: TimeWindow
    description: Set maximum allowable time window to correlate WMI process creation and remote connections.
  - field: UserContext
    description: Tune based on interactive vs. system-level execution (e.g., via SYSTEM or low-privileged users).
  - field: RemoteDestinationThreshold
    description: Number of unique remote hosts contacted using WMI within a time window.
  - field: SuspiciousCommandPatterns
    description: >-
      Regex patterns to identify adversary-like usage (e.g., `wmic process call`, `powershell Invoke-WmiMethod`).
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: WMIQueryScope
    bind: macro
    name: mitre_an1031_wmiqueryscope
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
  - element: RemoteDestinationThreshold
    bind: macro
    name: mitre_an1031_remotedestinationthreshold
  - element: SuspiciousCommandPatterns
    bind: macro
    name: mitre_an1031_suspiciouscommandpatterns
curated:
  status: implemented
  title: WMI used to create processes locally or on remote hosts
  content_type: anomaly
  severity: medium
  summary: >-
    WMI process creation from the command line (wmic process call create, Invoke-WmiMethod or Invoke-CimMethod on
    Win32_Process), WMI-launched shells and LOLBins (WmiPrvSE as parent, the target side of remote WMI execution),
    and one host directing wmic /node at several remote systems.
  gaps: >-
    WMI-Activity operational events (5857-5861) and the network leg (DCOM/WinRM connections) are not correlated;
    COM-API use without a command line is invisible here.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: SuspiciousCommandPatterns
    bind: macro
    name: mitre_an1031_patterns
    default: >-
      ((Processes.process_name="wmic.exe" Processes.process IN ("*process*call*create*", "*/node:*")) OR (Processes.process_name
      IN ("powershell.exe", "pwsh.exe") Processes.process IN ("*invoke-wmimethod*", "*invoke-cimmethod*", "*win32_process*create*",
      "*[wmiclass]*")) OR (Processes.parent_process_name="wmiprvse.exe" Processes.process_name IN ("cmd.exe", "powershell.exe",
      "pwsh.exe", "rundll32.exe", "regsvr32.exe", "mshta.exe", "wscript.exe", "cscript.exe", "certutil.exe")))
  - element: RemoteDestinationThreshold
    bind: macro
    name: mitre_an1031_remote_threshold
    default: '3'
    note: Distinct /node targets from one host and user in the search window.
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
    note: Management accounts (SCCM, monitoring) that use WMI execution.
  - element: WMIQueryScope
    bind: filter
    name: mitre_an1031_filter
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where` `mitre_an1031_patterns`
        by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process
    | `drop_dm_object_name(Processes)`
    | rex field=process "(?i)/node:\"?(?<wmi_target>[^\s\",]+)"
    | eval exec=if(match(process, "(?i)call\s+create|invoke-wmimethod|invoke-cimmethod|win32_process|\[wmiclass\]") OR parent_process_name=="wmiprvse.exe", 1, 0)
    | search `mitre_not_allowlisted_user`
    | stats sum(count) as count min(firstTime) as firstTime max(lastTime) as lastTime max(exec) as exec dc(wmi_target) as remote_targets values(wmi_target) as wmi_target values(parent_process_name) as parent_process_name values(process) as process by dest user
    | where exec=1 OR remote_targets >= `mitre_an1031_remote_threshold`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1031_filter`
  risk:
    message: WMI process execution on $dest$ by $user$
    objects:
    - field: dest
      type: system
      score: 35
    - field: user
      type: user
      score: 35
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 3600s
  false_positives:
  - Configuration Manager, monitoring products and administrators using WMI remoting.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      wmic_create:
        Image|endswith: \wmic.exe
        CommandLine|contains|all:
        - process
        - call
        - create
      powershell:
        CommandLine|contains:
        - Invoke-WmiMethod
        - Invoke-CimMethod
        - '[wmiclass]'
      wmiprvse_child:
        ParentImage|endswith: \WmiPrvSE.exe
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \rundll32.exe
        - \regsvr32.exe
        - \mshta.exe
        - \wscript.exe
        - \cscript.exe
        - \certutil.exe
      condition: wmic_create or powershell or wmiprvse_child
kql: null
esql: null
