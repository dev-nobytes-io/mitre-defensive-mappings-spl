# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1571
name: Analytic 1571
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0570#AN1571
  attack_release: '20.1'
  detection_strategy:
    id: DET0570
    name: Detection Strategy for Exfiltration to Cloud Storage
  technique:
    id: T1567.002
    name: Exfiltration to Cloud Storage
    tactics:
    - exfiltration
    usage_score: 72
  platforms:
  - Windows
  description: >-
    Unusual processes (e.g., powershell.exe, excel.exe) accessing large local files and subsequently initiating
    HTTPS POST requests to domains associated with cloud storage services (e.g., dropbox.com, drive.google.com,
    box.com). Defender perspective: correlation between file reads in sensitive directories and high outbound traffic
    volume to known storage APIs.
  log_source_references:
  - dc: DC0055
    dc_name: File Access
    name: WinEventLog:Security
    channel: EventCode=4663, 4670, 4656
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  mutable_elements:
  - field: CloudStorageDomains
    description: List of monitored domains for cloud services (dropbox.com, drive.google.com, onedrive.live.com).
  - field: ExfilVolumeThreshold
    description: Data volume threshold (e.g., >10MB in single session) used to flag abnormal transfers.
  - field: UserContext
    description: User accounts permitted to use sanctioned cloud services versus unexpected accounts.
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: CloudStorageDomains
    bind: lookup
    name: mitre_allowlist_domains
  - element: ExfilVolumeThreshold
    bind: macro
    name: mitre_an1571_exfilvolumethreshold
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
curated:
  status: implemented
  title: Large upload to a cloud storage application
  content_type: anomaly
  severity: medium
  summary: >-
    Palo Alto traffic logs where App-ID identifies a consumer cloud storage service and the bytes sent by one source
    and user within the hour exceed a threshold.
  gaps: >-
    ATT&CK describes the endpoint view (file reads, then a non-browser process posting to storage APIs via Sysmon).
    This implementation uses the same Network Connection Creation component through the firewall, where volume is
    measurable; the reading process is not known.
  data_components:
  - DC0082
  feeds:
  - palo_alto
  tuning:
  - element: CloudStorageDomains
    bind: macro
    name: mitre_an1571_cloud_storage_apps
    default: >-
      app IN ("dropbox*", "google-drive*", "ms-onedrive*", "onedrive*", "boxnet*", "mega*", "wetransfer*", "pcloud*",
      "icloud*", "sendspace*", "mediafire*", "4shared*", "amazon-cloud-drive*")
    note: App-ID names. Remove the sanctioned service for your organisation, or exclude its users.
  - element: ExfilVolumeThreshold
    bind: macro
    name: mitre_an1571_bytes_threshold
    default: '52428800'
    note: Bytes sent per source and user per hour (default 50 MB).
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
  spl: |-
    `mitre_dc0082_palo_alto` `mitre_st_palo_alto_traffic` `mitre_an1571_cloud_storage_apps`
    | `mitre_normalize_pan`
    | fillnull value="unknown" user
    | stats count min(_time) as firstTime max(_time) as lastTime sum(bytes_out) as bytes_out values(app) as app dc(dest) as distinct_destinations by src user
    | where bytes_out >= `mitre_an1571_bytes_threshold`
    | search `mitre_not_allowlisted_user`
    | eval mb_out=round(bytes_out / 1048576, 1)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1571_filter`
  risk:
    message: $src$ ($user$) uploaded $mb_out$ MB to cloud storage
    objects:
    - field: src
      type: system
      score: 40
    - field: user
      type: user
      score: 40
  schedule:
    cron: 23 * * * *
    earliest: -65m@m
    latest: -5m@m
  throttle:
    fields:
    - src
    - user
    period: 14400s
  false_positives:
  - Sanctioned sync clients, backups to personal storage allowed by policy, large legitimate shares.
  baselines: []
  sigma:
    note: The rule matches the application; the byte threshold per source is left to the SPL.
    level: low
    logsource:
      product: paloalto
      service: traffic
    detection:
      selection:
        app|startswith:
        - dropbox
        - google-drive
        - ms-onedrive
        - onedrive
        - boxnet
        - mega
        - wetransfer
        - pcloud
        - icloud
        - sendspace
        - mediafire
        - 4shared
      condition: selection
kql: null
esql: null
