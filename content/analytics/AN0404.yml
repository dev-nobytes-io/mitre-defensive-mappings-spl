# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0404
name: Analytic 0404
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0143#AN0404
  attack_release: '20.1'
  detection_strategy:
    id: DET0143
    name: Detection Strategy for Encrypted Channel via Symmetric Cryptography across OS Platforms
  technique:
    id: T1573.001
    name: Symmetric Cryptography
    tactics:
    - command-and-control
    usage_score: 203
  platforms:
  - Network Devices
  description: >-
    Flows showing encrypted payloads with high entropy not matching TLS handshake patterns, particularly when occurring
    on non-standard ports. Defender observes NetFlow/IPFIX byte distribution anomalies or IDS/IPS detecting symmetric
    encryption patterns without associated key exchange.
  log_source_references:
  - dc: DC0078
    dc_name: Network Traffic Flow
    name: NSM:Flow
    channel: Flow records with entropy signatures resembling symmetric encryption
  - dc: DC0085
    dc_name: Network Traffic Content
    name: NSM:Connections
    channel: Symmetric encryption detected without TLS handshake sequence
  mutable_elements:
  - field: PortProfiles
    description: Baseline expected encryption by port/protocol.
  - field: TrafficVolumeThreshold
    description: Volume thresholds for distinguishing benign VPN traffic from hidden C2.
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: PortProfiles
    bind: lookup
    name: mitre_sensitive_paths
  - element: TrafficVolumeThreshold
    bind: macro
    name: mitre_an0404_trafficvolumethreshold
curated:
  status: implemented
  title: Long-lived or high-volume external session with no identified protocol
  content_type: anomaly
  severity: low
  summary: >-
    Corelight conn.log sessions to external hosts on non-standard ports where Zeek recognised no application protocol
    (service is empty), and that last a long time or move a lot of data: the shape of custom encrypted C2 that does
    not use TLS.
  gaps: Payload entropy is not available in conn.log; benign proprietary protocols look the same.
  data_components:
  - DC0078
  feeds:
  - corelight
  tuning:
  - element: PortProfiles
    bind: macro
    name: mitre_an0404_standard_ports
    default: dest_port IN (22, 25, 53, 80, 123, 443, 465, 587, 853, 993, 995, 3389, 8080, 8443)
    note: Matched with NOT.
  - element: TrafficVolumeThreshold
    bind: macro
    name: mitre_an0404_condition
    default: (duration >= 1800 OR bytes_out + bytes_in >= 52428800)
  spl: |-
    `mitre_dc0078_corelight` `mitre_st_corelight_conn` proto=tcp
    | `mitre_normalize_zeek`
    | where NOT `mitre_is_internal(dest)` AND `mitre_is_internal(src)` AND (isnull(service) OR service=="-" OR service=="")
    | search NOT `mitre_an0404_standard_ports`
    | eval duration=tonumber(duration), bytes_out=coalesce(tonumber(bytes_out), 0), bytes_in=coalesce(tonumber(bytes_in), 0)
    | where `mitre_an0404_condition`
    | stats count min(_time) as firstTime max(_time) as lastTime max(duration) as duration sum(bytes_out) as bytes_out sum(bytes_in) as bytes_in by src dest dest_port
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0404_filter`
  risk:
    message: $src$ held an unidentified-protocol session to $dest$ on port $dest_port$
    objects:
    - field: src
      type: system
      score: 20
    threat_objects:
    - field: dest
      type: ip_address
  schedule:
    cron: 41 * * * *
    earliest: -65m@m
    latest: -5m@m
  throttle:
    fields:
    - src
    - dest
    period: 86400s
  false_positives:
  - Proprietary vendor protocols, games, peer-to-peer and some VPN clients.
  baselines: []
  sigma:
    logsource:
      product: zeek
      service: conn
    detection:
      selection:
        proto: tcp
        duration|gte: 1800
      known_service:
        service|contains:
        - ssl
        - http
        - ssh
        - dns
        - smtp
        - rdp
      condition: selection and not known_service
kql: null
esql: null
