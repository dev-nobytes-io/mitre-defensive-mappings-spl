# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1240
name: Analytic 1240
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0447#AN1240
  attack_release: '20.1'
  detection_strategy:
    id: DET0447
    name: T1136.001 Detection Strategy - Local Account Creation Across Platforms
  technique:
    id: T1136.001
    name: Local Account
    tactics:
    - persistence
    usage_score: 49
  platforms:
  - Network Devices
  description: >-
    Account created via CLI using 'username' command or REST API. Detectable through AAA logging or CLI history
    telemetry.
  log_source_references:
  - dc: DC0014
    dc_name: User Account Creation
    name: networkdevice:syslog
    channel: username <user> privilege <level>
  mutable_elements:
  - field: PrivilegeLevel
    description: Some devices allow unprivileged user creation—adjust based on role risk
  - field: RemoteSessionFlag
    description: Creation via Telnet, SSH, or serial console affects detection priority
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: PrivilegeLevel
    bind: filter
    name: mitre_an1240_filter
  - element: RemoteSessionFlag
    bind: filter
    name: mitre_an1240_filter
curated:
  status: implemented
  title: Administrator account added on the firewall
  content_type: ttp
  severity: medium
  summary: >-
    A Palo Alto configuration change adds or clones an entry under the management administrator users (mgt-config
    users), or under a shared administrator role, outside the accounts allowed to manage administrators.
  gaps: >-
    The new account's role cannot be read from the change because the current add-on drops the change detail fields.
    Routers and switches need the netdev_syslog feed.
  data_components:
  - DC0014
  feeds:
  - palo_alto
  tuning:
  - element: PrivilegeLevel
    bind: macro
    name: mitre_an1240_paths
    default: path IN ("*mgt-config*users*", "*mgt-config*password-complexity*", "*admin-role*")
  - element: RemoteSessionFlag
    bind: lookup
    name: mitre_allowlist_users
    note: Administrators allowed to manage firewall accounts.
  spl: |-
    `mitre_dc0014_palo_alto` `mitre_st_palo_alto_config` cmd IN ("set", "add", "clone", "edit") `mitre_an1240_paths`
    | `mitre_normalize_pan`
    | eval dest=coalesce(dvc_name, dest, host), config_path=path
    | search `mitre_not_allowlisted_user`
    | stats count min(_time) as firstTime max(_time) as lastTime values(cmd) as config_action values(config_path) as config_path values(client) as client by dest user
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1240_filter`
  risk:
    message: Administrator account change on firewall $dest$ by $user$
    objects:
    - field: dest
      type: system
      score: 50
    - field: user
      type: user
      score: 50
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 3600s
  false_positives:
  - Onboarding of new firewall administrators; Panorama template pushes.
  baselines: []
  sigma:
    logsource:
      product: paloalto
      service: config
    detection:
      selection:
        cmd:
        - set
        - add
        - clone
        - edit
        path|contains:
        - mgt-config
        - admin-role
      condition: selection
kql: null
esql: null
