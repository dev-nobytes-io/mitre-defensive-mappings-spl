# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1376
name: Analytic 1376
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0499#AN1376
  attack_release: '20.1'
  detection_strategy:
    id: DET0499
    name: Behavioral Detection of Fallback or Alternate C2 Channels
  technique:
    id: T1008
    name: Fallback Channels
    tactics:
    - command-and-control
    usage_score: 64
  platforms:
  - Windows
  description: >-
    Establishing network connections on uncommon ports or protocols following C2 disruption or blocking. Often executed
    by processes that typically exhibit no network activity.
  log_source_references:
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  - dc: DC0078
    dc_name: Network Traffic Flow
    name: NSM:Flow
    channel: uncommon ports
  mutable_elements:
  - field: DestinationPort
    description: Can be tuned to include unexpected or high-entropy ports not typically associated with the process.
  - field: ProcessName
    description: Useful to filter benign applications vs suspicious fallback attempts.
  - field: DataVolumeRatio
    description: Tunable ratio of sent/received bytes to indicate potential C2 beaconing or exfiltration.
  - field: TimeWindow
    description: Adjust temporal window to match likely fallback C2 retries after primary channel fails.
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: DestinationPort
    bind: lookup
    name: mitre_internal_networks
  - element: ProcessName
    bind: lookup
    name: mitre_allowlist_processes
  - element: DataVolumeRatio
    bind: macro
    name: mitre_an1376_datavolumeratio
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: One process connecting out on many uncommon ports
  content_type: anomaly
  severity: low
  summary: >-
    A process on a host makes outbound connections (Sysmon 3) to external addresses on several distinct uncommon
    ports within an hour. Malware whose primary channel is blocked cycles through fallback ports and protocols;
    ordinary software uses a small fixed set.
  gaps: >-
    Fallback to the same port on another domain is not counted here (AN1189 and the network analytics cover destinations).
    Peer-to-peer and game clients are noisy and must be allow-listed.
  data_components:
  - DC0082
  feeds:
  - sysmon
  tuning:
  - element: DestinationPort
    bind: macro
    name: mitre_an1376_common_ports
    default: >-
      DestinationPort IN (22, 25, 53, 80, 88, 110, 123, 135, 139, 143, 389, 443, 445, 465, 587, 636, 993, 995, 1433,
      3268, 3269, 3389, 5985, 5986, 8080, 8443)
  - element: DataVolumeRatio
    bind: macro
    name: mitre_an1376_port_threshold
    default: '4'
    note: Distinct uncommon external ports per process per hour.
  - element: ProcessName
    bind: lookup
    name: mitre_allowlist_processes
  - element: TimeWindow
    bind: filter
    name: mitre_an1376_filter
  spl: |-
    `mitre_dc0082_sysmon` EventCode=3 Initiated="true" NOT `mitre_an1376_common_ports`
    | `mitre_normalize_host`
    | where NOT `mitre_is_internal(DestinationIp)` AND NOT match(DestinationIp, "^(127\.|::1|fe80:|169\.254\.)")
    | eval process_name=lower(replace(Image, "^.*\\\\", ""))
    | search `mitre_not_allowlisted_process`
    | bin _time span=1h
    | stats dc(DestinationPort) as distinct_ports values(DestinationPort) as dest_port dc(DestinationIp) as distinct_dests values(DestinationIp) as dest_ip min(_time) as firstTime max(_time) as lastTime by dest user process_name _time
    | where distinct_ports >= `mitre_an1376_port_threshold`
    | eval dest_ip=mvindex(dest_ip, 0, 19)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1376_filter`
  risk:
    message: $process_name$ on $dest$ tried $distinct_ports$ uncommon external ports in an hour
    objects:
    - field: dest
      type: system
      score: 25
    threat_objects:
    - field: process_name
      type: process_name
  schedule:
    cron: 17 * * * *
    earliest: -65m@m
    latest: -5m@m
  throttle:
    fields:
    - dest
    - process_name
    period: 14400s
  false_positives:
  - Peer-to-peer, VoIP, game and remote-support clients; vulnerability scanners on admin hosts.
  baselines: []
  sigma:
    rules:
    - name: an1376_uncommon_port
      logsource:
        product: windows
        category: network_connection
      detection:
        selection:
          Initiated: 'true'
        common:
          DestinationPort:
          - 22
          - 53
          - 80
          - 123
          - 443
          - 445
          - 3389
          - 8080
          - 8443
        condition: selection and not common
    correlation:
      type: value_count
      group-by:
      - Computer
      - Image
      timespan: 1h
      condition:
        field: DestinationPort
        gte: 4
kql: null
esql: null
