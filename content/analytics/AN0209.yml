# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0209
name: Analytic 0209
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0076#AN0209
  attack_release: '20.1'
  detection_strategy:
    id: DET0076
    name: Behavioral Detection of Visual Basic Execution (VBS/VBA/VBScript)
  technique:
    id: T1059.005
    name: Visual Basic
    tactics:
    - execution
    usage_score: 193
  platforms:
  - Windows
  description: >-
    Detects execution of VB-based scripts or macros (VBS/VBA/VBScript) through cscript.exe/wscript.exe, Office-based
    process chains, or HTA usage. Focuses on chained behavior: Office or HTML container spawns script host > script
    host spawns PowerShell, network connections, or process injection.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0016
    dc_name: Module Load
    name: WinEventLog:Sysmon
    channel: EventCode=7
  mutable_elements:
  - field: ParentProcess
    description: Microsoft Word/Excel or mshta.exe spawning wscript.exe/cscript.exe.
  - field: UserContext
    description: Script execution by non-admin users or service accounts.
  - field: TimeWindow
    description: Script execution outside normal business hours or patching cycle.
  - field: PayloadEntropyThreshold
    description: High entropy indicative of obfuscation or encoding in the script.
  - field: ModuleName
    description: Loading of vbscript.dll, scrrun.dll, or other scripting engine modules.
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: ParentProcess
    bind: lookup
    name: mitre_allowlist_processes
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: PayloadEntropyThreshold
    bind: macro
    name: mitre_an0209_payloadentropythreshold
  - element: ModuleName
    bind: filter
    name: mitre_an0209_filter
curated:
  status: implemented
  title: Script host chain from Office or into a second-stage interpreter
  content_type: anomaly
  severity: medium
  summary: >-
    Two links of the Visual Basic execution chain: an Office application starts wscript, cscript or mshta; or one
    of those script hosts starts PowerShell, cmd or a proxy-execution utility.
  gaps: >-
    Scripting-engine module loads (vbscript.dll, scrrun.dll), script entropy and time-of-day conditions are not
    evaluated.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: ParentProcess
    bind: macro
    name: mitre_an0209_office_parents
    default: >-
      Processes.parent_process_name IN ("winword.exe", "excel.exe", "powerpnt.exe", "outlook.exe", "msaccess.exe",
      "mspub.exe", "onenote.exe")
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
    note: Accounts that run logon or management VBScript by design.
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where`
        ((`mitre_an0209_office_parents` Processes.process_name IN ("wscript.exe", "cscript.exe", "mshta.exe"))
          OR (Processes.parent_process_name IN ("wscript.exe", "cscript.exe", "mshta.exe") Processes.process_name IN ("powershell.exe", "pwsh.exe", "cmd.exe", "rundll32.exe", "regsvr32.exe", "certutil.exe", "bitsadmin.exe", "schtasks.exe", "msiexec.exe", "wmic.exe")))
        by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_user`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0209_filter`
  risk:
    message: Script host chain $parent_process_name$ to $process_name$ on $dest$
    objects:
    - field: dest
      type: system
      score: 40
    - field: user
      type: user
      score: 40
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    - process_name
    period: 3600s
  false_positives:
  - Logon scripts, software deployment and legacy line-of-business automation written in VBScript.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      office_parent:
        ParentImage|endswith:
        - \winword.exe
        - \excel.exe
        - \powerpnt.exe
        - \outlook.exe
        - \msaccess.exe
        - \mspub.exe
        - \onenote.exe
      script_host:
        Image|endswith:
        - \wscript.exe
        - \cscript.exe
        - \mshta.exe
      script_parent:
        ParentImage|endswith:
        - \wscript.exe
        - \cscript.exe
        - \mshta.exe
      second_stage:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \cmd.exe
        - \rundll32.exe
        - \regsvr32.exe
        - \certutil.exe
        - \bitsadmin.exe
        - \schtasks.exe
        - \msiexec.exe
        - \wmic.exe
      condition: (office_parent and script_host) or (script_parent and second_stage)
kql: null
esql: null
