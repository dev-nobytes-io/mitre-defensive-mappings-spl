# Edit ONLY `curated`, `kql` and `esql`.
id: AN0983
name: Analytic 0983
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0347#AN0983
  attack_release: '20.1'
  detection_strategy:
    id: DET0347
    name: Detection Strategy for Masquerading via Legitimate Resource Name or Location
  technique:
    id: T1036.005
    name: Match Legitimate Resource Name or Location
    tactics:
    - stealth
    usage_score: 307
  platforms:
  - Windows
  description: >-
    Detects processes or binaries executed from trusted directories (e.g., System32) or using trusted names (e.g.,
    svchost.exe) where the metadata, hash, or parent process does not align with legitimate activity patterns.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  mutable_elements:
  - field: trusted_directory_list
    description: Paths such as C:\Windows\System32 that adversaries may abuse
  - field: process_baseline_age
    description: Time window to determine process novelty (e.g., 30 days)
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: trusted_directory_list
    bind: lookup
    name: mitre_sensitive_paths
  - element: process_baseline_age
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Windows system process name running from an unexpected directory
  content_type: ttp
  severity: medium
  summary: >-
    A process named like a core Windows binary (svchost, lsass, services, csrss, smss, wininit, winlogon, explorer,
    spoolsv, taskhostw, dllhost, conhost, rundll32, RuntimeBroker, sihost, ctfmon, dwm, fontdrvhost) whose image
    path is outside System32, SysWOW64, WinSxS and the other expected locations.
  gaps: >-
    Hash, signer and file-age (process_baseline_age) comparisons and the file-creation leg are not evaluated. Requires
    process_path to be populated in the Endpoint data model.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: trusted_directory_list
    bind: macro
    name: mitre_an0983_trusted_paths
    default: >-
      Processes.process_path IN ("c:\\windows\\system32\\*", "c:\\windows\\syswow64\\*", "c:\\windows\\explorer.exe",
      "c:\\windows\\winsxs\\*", "c:\\windows\\servicing\\*", "c:\\windows\\systemapps\\*", "c:\\windows\\immersivecontrolpanel\\*",
      "\\device\\harddiskvolume*\\windows\\system32\\*")
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where`
        Processes.process_name IN ("svchost.exe", "lsass.exe", "services.exe", "csrss.exe", "smss.exe", "wininit.exe", "winlogon.exe", "explorer.exe", "spoolsv.exe", "taskhostw.exe", "dllhost.exe", "conhost.exe", "rundll32.exe", "runtimebroker.exe", "sihost.exe", "ctfmon.exe", "dwm.exe", "fontdrvhost.exe")
        Processes.process_path="*\\*" NOT `mitre_an0983_trusted_paths`
        by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process_path
    | `drop_dm_object_name(Processes)`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0983_filter`
  risk:
    message: $process_name$ ran from $process_path$ on $dest$
    objects:
    - field: dest
      type: system
      score: 55
    - field: user
      type: user
      score: 35
    threat_objects:
    - field: process_path
      type: file_path
  schedule: {}
  throttle:
    fields:
    - dest
    - process_path
    period: 86400s
  false_positives:
  - >-
    Windows upgrade staging directories ($WINDOWS.~BT), container or WSL images, and software that ships its own
    conhost or rundll32.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      name:
        Image|endswith:
        - \svchost.exe
        - \lsass.exe
        - \services.exe
        - \csrss.exe
        - \smss.exe
        - \wininit.exe
        - \winlogon.exe
        - \explorer.exe
        - \spoolsv.exe
        - \taskhostw.exe
        - \dllhost.exe
        - \conhost.exe
        - \rundll32.exe
        - \RuntimeBroker.exe
        - \sihost.exe
        - \ctfmon.exe
        - \dwm.exe
        - \fontdrvhost.exe
      trusted:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
        - C:\Windows\explorer.exe
        - C:\Windows\WinSxS\
        - C:\Windows\servicing\
        - C:\Windows\SystemApps\
        - C:\Windows\ImmersiveControlPanel\
      condition: name and not trusted
kql: null
esql: null
