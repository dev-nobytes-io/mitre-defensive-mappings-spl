# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0589
name: Analytic 0589
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0209#AN0589
  attack_release: '20.1'
  detection_strategy:
    id: DET0209
    name: Detection of Registry Query for Environmental Discovery
  technique:
    id: T1012
    name: Query Registry
    tactics:
    - discovery
    usage_score: 141
  platforms:
  - Windows
  description: >-
    Registry read access associated with suspicious or non-interactive processes querying system config, installed
    software, or security settings.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0063
    dc_name: Windows Registry Key Modification
    name: WinEventLog:Sysmon
    channel: EventCode=13, 14
  - dc: DC0064
    dc_name: Command Execution
    name: WinEventLog:PowerShell
    channel: EventCode=4103, 4104, 4105, 4106
  mutable_elements:
  - field: TargetRegistryPath
    description: >-
      Focus detection on registry hives or keys likely to reveal environment info (e.g., HKLM\SOFTWARE\Microsoft\Windows
      NT\CurrentVersion).
  - field: ParentProcess
    description: May tune for suspicious parent processes such as cmd.exe, wscript.exe, or mshta.exe.
  - field: TimeWindow
    description: Controls how closely registry access must follow process creation for correlation.
derived:
  coverage: live
  suggested_content_type: hunting
  suggested_tuning:
  - element: TargetRegistryPath
    bind: lookup
    name: mitre_sensitive_paths
  - element: ParentProcess
    bind: lookup
    name: mitre_allowlist_processes
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: Registry queries for environment, software and security configuration
  content_type: hunting
  severity: informational
  summary: >-
    Lists reg query, reg export and PowerShell registry reads against keys that reveal the environment: OS version,
    installed software, security products, saved RDP and PuTTY sessions, autoruns, and stored credentials (Winlogon,
    SNMP, VNC).
  gaps: >-
    Registry reads through APIs are not visible to Sysmon (EventCode 13/14 are writes); only the command line is
    seen. No finding or risk is produced.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: TargetRegistryPath
    bind: macro
    name: mitre_an0589_keys
    default: >-
      Processes.process IN ("*currentversion\\uninstall*", "*windows nt\\currentversion*", "*\\terminal server client*",
      "*simontatham\\putty*", "*\\winlogon*", "*\\snmp\\parameters*", "*realvnc*", "*tightvnc*", "*\\currentversion\\run*",
      "*windows defender*", "*\\policies\\*", "*\\control\\lsa*")
  - element: ParentProcess
    bind: filter
    name: mitre_an0589_filter
  spl: |-
    | tstats `mitre_summariesonly` count from `mitre_dc0032_dm` where `mitre_dc0032_dm_where`
        ((Processes.process_name="reg.exe" Processes.process IN ("* query *", "* export *"))
          OR (Processes.process_name IN ("powershell.exe", "pwsh.exe") Processes.process IN ("*get-itemproperty*", "*get-childitem*hklm:*", "*get-childitem*hkcu:*", "*registry::*")))
        `mitre_an0589_keys`
        by Processes.dest Processes.user Processes.parent_process_name Processes.process _time span=10m
    | `drop_dm_object_name(Processes)`
    | stats sum(count) as count dc(process) as distinct_commands values(process) as process by dest user parent_process_name _time
    | sort - distinct_commands
    | `mitre_an0589_filter`
  risk:
    message: ''
    objects: []
    threat_objects: []
  schedule: {}
  throttle: {}
  false_positives:
  - Inventory agents and installers reading the Uninstall key; administrators.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    level: informational
    detection:
      reg:
        Image|endswith: \reg.exe
        CommandLine|contains:
        - ' query '
        - ' export '
      keys:
        CommandLine|contains:
        - CurrentVersion\Uninstall
        - Windows NT\CurrentVersion
        - \Terminal Server Client
        - SimonTatham\PuTTY
        - \Winlogon
        - \SNMP\Parameters
        - RealVNC
        - TightVNC
        - Windows Defender
        - \Control\Lsa
      condition: reg and keys
kql: null
esql: null
