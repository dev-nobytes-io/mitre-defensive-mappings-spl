# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0846
name: Analytic 0846
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0303#AN0846
  attack_release: '20.1'
  detection_strategy:
    id: DET0303
    name: Local Account Enumeration Across Host Platforms
  technique:
    id: T1087.001
    name: Local Account
    tactics:
    - discovery
    usage_score: 87
  platforms:
  - Windows
  description: Adversary enumeration of local user accounts using Net.exe, WMI, or PowerShell.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  mutable_elements:
  - field: CommandLinePattern
    description: Detects variations of 'net user', 'net localgroup', 'Get-LocalUser'.
  - field: UserContext
    description: Restrict monitoring to low-privileged or unexpected users executing enumeration.
  - field: TimeWindow
    description: Tune for bursts of enumeration commands in short succession.
derived:
  coverage: live
  suggested_content_type: hunting
  suggested_tuning:
  - element: CommandLinePattern
    bind: macro
    name: mitre_an0846_commandlinepattern
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: Local account and group enumeration commands
  content_type: hunting
  severity: informational
  summary: >-
    Lists net user and net localgroup without /domain, wmic useraccount and group, and the Get-LocalUser / Get-LocalGroupMember
    cmdlets, in ten-minute buckets per host and user.
  gaps: >-
    Domain enumeration is AN0363. The 4798/4799 enumeration events (Group Enumeration) would add API-level visibility
    and are a candidate second leg. No finding or risk.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: CommandLinePattern
    bind: filter
    name: mitre_an0846_filter
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
  - element: TimeWindow
    bind: filter
    name: mitre_an0846_filter
    note: Bucket fixed at 10 minutes.
  spl: |-
    | tstats `mitre_summariesonly` count from `mitre_dc0032_dm` where `mitre_dc0032_dm_where`
        (((Processes.process_name IN ("net.exe", "net1.exe") Processes.process IN ("* user*", "* localgroup*")) NOT Processes.process="* /do*")
          OR (Processes.process_name="wmic.exe" Processes.process IN ("*useraccount*", "* group*"))
          OR (Processes.process_name IN ("powershell.exe", "pwsh.exe") Processes.process IN ("*get-localuser*", "*get-localgroup*", "*win32_useraccount*")))
        by Processes.dest Processes.user Processes.parent_process_name Processes.process _time span=10m
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_user`
    | stats sum(count) as count dc(process) as distinct_commands values(process) as process values(parent_process_name) as parent_process_name by dest user _time
    | sort - distinct_commands
    | `mitre_an0846_filter`
  risk:
    message: ''
    objects: []
    threat_objects: []
  schedule: {}
  throttle: {}
  false_positives:
  - Administrators, provisioning scripts and compliance scanners.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    level: informational
    detection:
      net:
        Image|endswith:
        - \net.exe
        - \net1.exe
        CommandLine|contains:
        - ' user'
        - ' localgroup'
      domain:
        CommandLine|contains: ' /do'
      powershell:
        CommandLine|contains:
        - Get-LocalUser
        - Get-LocalGroup
        - Win32_UserAccount
      condition: (net and not domain) or powershell
kql: null
esql: null
