# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0819
name: Analytic 0819
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0294#AN0819
  attack_release: '20.1'
  detection_strategy:
    id: DET0294
    name: User Execution – Malicious File via download/open → spawn chain (T1204.002)
  technique:
    id: T1204.002
    name: Malicious File
    tactics:
    - execution
    usage_score: 296
  platforms:
  - Windows
  description: >-
    User opens a file delivered by email, web, chat, or share. The handler application (Word/PDF reader/archiver)
    creates a file in user-controlled paths (Downloads, Temp, Desktop) and then spawns a new or unusual child process
    (e.g., powershell.exe, wscript.exe, cmd.exe, regsvr32.exe, rundll32.exe, msiexec.exe). Optional precursors include
    FileStreamCreated (URL/UNC) and Office → system32 batch writes.
  log_source_references:
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0059
    dc_name: File Metadata
    name: WinEventLog:Sysmon
    channel: EventCode=15
  mutable_elements:
  - field: TimeWindow
    description: Seconds/minutes to correlate file write to child spawn (e.g., 0–5m).
  - field: SuspiciousExtensions
    description: >-
      Extensions and double-extension patterns to flag (exe,scr,lnk,pif,cpl,js,vbs,bat,cmd,ps1,hta,iso,lnk->cmd,docm,xlsm,pdf->exe,
      etc.).
  - field: UserPaths
    description: Paths considered user-controlled (Downloads, Temp, Desktop, profile AppData staging).
  - field: ParentApps
    description: List of user-facing apps that commonly open attachments for your org (reduce FPs or add weight).
  - field: SignerAllowList
    description: Trusted code signers/publishers to suppress benign admin tools.
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: SuspiciousExtensions
    bind: lookup
    name: mitre_sensitive_paths
  - element: UserPaths
    bind: lookup
    name: mitre_account_roles
  - element: ParentApps
    bind: lookup
    name: mitre_allowlist_processes
  - element: SignerAllowList
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Document or mail application spawned an interpreter or LOLBin
  content_type: ttp
  severity: high
  summary: >-
    An Office application, Outlook, a PDF reader or an archive tool starts PowerShell, cmd, a script host or a proxy-execution
    utility (mshta, regsvr32, rundll32, msiexec, certutil, bitsadmin). This is the spawn step of a malicious attachment
    or lure document.
  gaps: >-
    The preceding file write to Downloads/Temp/Desktop, the Zone.Identifier stream (Sysmon 15) and the SuspiciousExtensions,
    UserPaths and SignerAllowList elements are not evaluated.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: ParentApps
    bind: macro
    name: mitre_an0819_parent_apps
    default: >-
      Processes.parent_process_name IN ("winword.exe", "excel.exe", "powerpnt.exe", "outlook.exe", "msaccess.exe",
      "mspub.exe", "visio.exe", "onenote.exe", "eqnedt32.exe", "acrord32.exe", "acrobat.exe", "foxitpdfreader.exe",
      "winrar.exe", "7zfm.exe", "7zg.exe")
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where` `mitre_an0819_parent_apps`
        Processes.process_name IN ("powershell.exe", "pwsh.exe", "cmd.exe", "wscript.exe", "cscript.exe", "mshta.exe", "regsvr32.exe", "rundll32.exe", "msiexec.exe", "certutil.exe", "bitsadmin.exe", "schtasks.exe", "wmic.exe", "msbuild.exe", "installutil.exe", "curl.exe")
        by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process
    | `drop_dm_object_name(Processes)`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0819_filter`
  risk:
    message: $parent_process_name$ spawned $process_name$ on $dest$ for $user$
    objects:
    - field: dest
      type: system
      score: 60
    - field: user
      type: user
      score: 60
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    - process_name
    period: 3600s
  false_positives:
  - >-
    Office add-ins and document-automation macros that shell out; rundll32 launched by Outlook for printing or protocol
    handlers.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      parent:
        ParentImage|endswith:
        - \winword.exe
        - \excel.exe
        - \powerpnt.exe
        - \outlook.exe
        - \msaccess.exe
        - \mspub.exe
        - \visio.exe
        - \onenote.exe
        - \eqnedt32.exe
        - \acrord32.exe
        - \acrobat.exe
      child:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \cmd.exe
        - \wscript.exe
        - \cscript.exe
        - \mshta.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \msiexec.exe
        - \certutil.exe
        - \bitsadmin.exe
        - \schtasks.exe
        - \wmic.exe
        - \msbuild.exe
      condition: parent and child
kql: null
esql: null
