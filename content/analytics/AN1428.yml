# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1428
name: Analytic 1428
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0516#AN1428
  attack_release: '20.1'
  detection_strategy:
    id: DET0516
    name: Behavioral Detection of Command and Scripting Interpreter Abuse
  technique:
    id: T1059
    name: Command and Scripting Interpreter
    tactics:
    - execution
    usage_score: 67
  platforms:
  - Windows
  description: >-
    Detects the execution of scripting or command interpreters (e.g., powershell.exe, cmd.exe, wscript.exe) outside
    expected administrative time windows or from abnormal user contexts, often followed by encoded/obfuscated arguments
    or secondary execution events.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  mutable_elements:
  - field: CommandLinePattern
    description: Tunable to match encoded or uncommon script execution patterns specific to the environment.
  - field: ParentProcessName
    description: May vary across managed/unmanaged workstations or user-driven script activity.
  - field: TimeWindow
    description: Used to restrict analysis to work hours or known admin maintenance windows.
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: CommandLinePattern
    bind: macro
    name: mitre_an1428_commandlinepattern
  - element: ParentProcessName
    bind: lookup
    name: mitre_allowlist_processes
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: Command interpreter used by a person outside working hours
  content_type: anomaly
  severity: low
  summary: >-
    cmd, PowerShell or a script host started by a user account (not SYSTEM, not a machine or service account) outside
    working hours, with an interactive parent (explorer, a terminal, an RDP session). Hands-on-keyboard intrusions
    often happen when the account's owner is not working.
  gaps: >-
    Working hours are fixed in a macro, not learned per user; time is evaluated in the search head's time zone.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_an1428_off_hours
    default: (hour < 7 OR hour >= 20 OR weekday IN ("Saturday", "Sunday"))
    note: Evaluated on the 1-hour bucket time.
  - element: ParentProcessName
    bind: macro
    name: mitre_an1428_interactive_parents
    default: >-
      Processes.parent_process_name IN ("explorer.exe", "windowsterminal.exe", "conhost.exe", "openconsole.exe",
      "rdpclip.exe", "runtimebroker.exe")
  - element: CommandLinePattern
    bind: lookup
    name: mitre_account_roles
    note: Accounts with role=service are excluded through mitre_accounts_with_role(service).
  spl: |-
    | tstats `mitre_summariesonly` count from `mitre_dc0032_dm` where `mitre_dc0032_dm_where`
        Processes.process_name IN ("cmd.exe", "powershell.exe", "pwsh.exe", "wscript.exe", "cscript.exe", "mshta.exe") `mitre_an1428_interactive_parents`
        by Processes.dest Processes.user Processes.process_name _time span=1h
    | `drop_dm_object_name(Processes)`
    | where NOT match(user, "(?i)(^|\\\\)(system|local service|network service)$|\$$")
    | eval hour=tonumber(strftime(_time, "%H")), weekday=strftime(_time, "%A")
    | where `mitre_an1428_off_hours`
    | search NOT `mitre_accounts_with_role(service)`
    | stats sum(count) as count values(process_name) as process_name min(_time) as firstTime max(_time) as lastTime by dest user
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1428_filter`
  risk:
    message: $user$ used command interpreters on $dest$ outside working hours
    objects:
    - field: user
      type: user
      score: 15
    - field: dest
      type: system
      score: 15
  schedule:
    cron: 7 * * * *
    earliest: -65m@m
    latest: -5m@m
  throttle:
    fields:
    - dest
    - user
    period: 43200s
  false_positives:
  - On-call administrators and developers working late; shift workers.
  baselines: []
  sigma:
    not_expressible: >-
      The condition is a time-of-day window and an account-role lookup; Sigma has no time-of-day or lookup construct.
kql: null
esql: null
