# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0926
name: Analytic 0926
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0325#AN0926
  attack_release: '20.1'
  detection_strategy:
    id: DET0325
    name: External Proxy Behavior via Outbound Relay to Intermediate Infrastructure
  technique:
    id: T1090.002
    name: External Proxy
    tactics:
    - command-and-control
    usage_score: 39
  platforms:
  - Network Devices
  description: >-
    Changes to NAT/firewall policies enabling outbound port forwarding from internal IPs to Internet-based proxy
    endpoints. Log spikes in outbound flows to CDN, VPS, or anomalous ASNs with few return packets.
  log_source_references:
  - dc: DC0051
    dc_name: Firewall Rule Modification
    name: Firewall Audit Logs
    channel: Outbound NAT Rule Changes
  - dc: DC0078
    dc_name: Network Traffic Flow
    name: NSM:Flow
    channel: Outbound flow records
  - dc: DC0082
    dc_name: Network Connection Creation
    name: networkdevice:syslog
    channel: Dynamic route changes
  mutable_elements:
  - field: FlowThreshold
    description: Number of flows or bytes transferred per minute—flag surges to unrecognized ASNs.
  - field: DestinationIPCategory
    description: 'Proxy destination categories: CDN, TOR exit node, anonymous hosting.'
  - field: ConfigChangeUser
    description: Track if unexpected user or automation changed NAT/forwarding rules.
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: FlowThreshold
    bind: macro
    name: mitre_an0926_flowthreshold
  - element: DestinationIPCategory
    bind: lookup
    name: mitre_internal_networks
  - element: ConfigChangeUser
    bind: lookup
    name: mitre_account_roles
curated:
  status: implemented
  title: Proxy-avoidance sites or anonymising proxy applications
  content_type: anomaly
  severity: medium
  summary: >-
    Palo Alto URL filtering logs in the proxy-avoidance-and-anonymizers category, or traffic App-IDs for anonymising
    proxies and personal VPN services (Psiphon, Ultrasurf, Hotspot Shield and similar), from an internal source.
  gaps: >-
    NAT and port-forwarding rule changes that create proxies on the firewall itself are covered by AN1233; outbound-flow
    spikes to VPS address space are not modelled (no ASN enrichment).
  data_components:
  - DC0085
  - DC0078
  feeds:
  - palo_alto
  tuning:
  - element: DestinationIPCategory
    bind: macro
    name: mitre_an0926_categories
    default: url_category IN ("proxy-avoidance-and-anonymizers", "*proxy-avoidance*")
  - element: FlowThreshold
    bind: macro
    name: mitre_an0926_apps
    default: >-
      app IN ("psiphon", "ultrasurf", "hotspot-shield", "your-freedom", "hola-unblocker", "zenmate", "windscribe",
      "opera-vpn", "browsec", "urban-vpn")
    note: App-ID names of anonymising proxies and consumer VPNs; trim to what policy forbids.
  - element: ConfigChangeUser
    bind: lookup
    name: mitre_allowlist_users
  spl: |-
    (`mitre_dc0085_palo_alto` `mitre_st_palo_alto_threat` log_subtype=url) OR (`mitre_dc0078_palo_alto` `mitre_st_palo_alto_traffic` `mitre_an0926_apps`)
    | `mitre_normalize_pan`
    | search `mitre_an0926_categories` OR sourcetype="pan:traffic"
    | search `mitre_not_allowlisted_user`
    | stats count min(_time) as firstTime max(_time) as lastTime values(url) as url values(app) as app values(action) as action values(url_category) as url_category by src user
    | eval url=mvindex(url, 0, 9)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0926_filter`
  risk:
    message: $src$ reached an anonymising proxy or proxy-avoidance site
    objects:
    - field: src
      type: system
      score: 30
    - field: user
      type: user
      score: 30
  schedule: {}
  throttle:
    fields:
    - src
    period: 14400s
  false_positives:
  - >-
    Users trying to bypass web filtering for non-malicious reasons; travellers using personal VPNs on corporate
    devices.
  baselines: []
  sigma:
    rules:
    - name: an0926_proxy_category
      logsource:
        product: paloalto
        service: threat
      detection:
        selection:
          raw_category|contains: proxy-avoidance
        condition: selection
    - name: an0926_proxy_app
      logsource:
        product: paloalto
        service: traffic
      detection:
        selection:
          app:
          - psiphon
          - ultrasurf
          - hotspot-shield
          - your-freedom
          - hola-unblocker
          - zenmate
          - windscribe
        condition: selection
kql: null
esql: null
