# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1626
name: Analytic 1626
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0591#AN1626
  attack_release: '20.1'
  detection_strategy:
    id: DET0591
    name: Cross-Platform Behavioral Detection of File Timestomping via Metadata Tampering
  technique:
    id: T1070.006
    name: Timestomp
    tactics:
    - stealth
    usage_score: 74
  platforms:
  - Windows
  description: >-
    Detects attempts to modify file timestamps via API usage (e.g., `SetFileTime`), CLI tools (e.g., `w32tm`, PowerShell),
    or double-timestomp behavior where $SI and $FN timestamps are mismatched or reverted.
  log_source_references:
  - dc: DC0059
    dc_name: File Metadata
    name: WinEventLog:Sysmon
    channel: EventCode=15
  - dc: DC0055
    dc_name: File Access
    name: WinEventLog:Security
    channel: EventCode=4663, 4670, 4656
  - dc: DC0021
    dc_name: OS API Execution
    name: EDR:file
    channel: SetFileTime
  mutable_elements:
  - field: TimeWindow
    description: Correlate timestamp change with preceding file creation or suspicious access
  - field: APINamePattern
    description: Include SetFileTime, NtSetInformationFile, or other timestamp APIs
  - field: TimestampDeltaThreshold
    description: Trigger on excessive backdating (e.g., >90 days)
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: APINamePattern
    bind: macro
    name: mitre_an1626_apinamepattern
  - element: TimestampDeltaThreshold
    bind: macro
    name: mitre_an1626_timestampdeltathreshold
curated:
  status: implemented
  title: File creation time moved backwards (timestomp)
  content_type: anomaly
  severity: medium
  summary: >-
    Sysmon 2 (a process changed a file's creation time) where the new creation time is earlier than the previous
    one by more than a day, written by a process that does not normally restore timestamps; or a PowerShell script
    block that assigns CreationTime, LastWriteTime or LastAccessTime. Backdating makes a dropped file blend in with
    the operating system files around it.
  gaps: >-
    Sysmon 2 reports only the creation time ($STANDARD_INFORMATION); $FILE_NAME mismatches need an NTFS parser.
    Sysmon configs often scope event 2 to user-writable paths. Security 4663 is not used (it does not record the
    timestamps).
  data_components:
  - DC0061
  - DC0029
  feeds:
  - sysmon
  - powershell_logging
  tuning:
  - element: TimestampDeltaThreshold
    bind: macro
    name: mitre_an1626_backdate_seconds
    default: '86400'
  - element: APINamePattern
    bind: macro
    name: mitre_an1626_script_patterns
    default: >-
      ScriptBlockText IN ("*.CreationTime =*", "*.CreationTime=*", "*.LastWriteTime =*", "*.LastWriteTime=*", "*.LastAccessTime
      =*", "*.LastAccessTime=*", "*CreationTimeUtc*=*", "*SetFileTime*", "*SetCreationTime(*", "*SetLastWriteTime(*")
  - element: ProcessName
    bind: macro
    name: mitre_an1626_benign_writers
    default: >-
      Image IN ("*\\7z.exe", "*\\7zG.exe", "*\\7zFM.exe", "*\\WinRAR.exe", "*\\explorer.exe", "*\\msiexec.exe",
      "*\\TiWorker.exe", "*\\TrustedInstaller.exe", "*\\OneDrive.exe", "*\\robocopy.exe", "*\\chrome.exe", "*\\msedge.exe",
      "*\\firefox.exe", "*\\setup.exe", "*\\svchost.exe")
  - element: TimeWindow
    bind: filter
    name: mitre_an1626_filter
  spl: |-
    (`mitre_dc0061_sysmon` EventCode=2 NOT `mitre_an1626_benign_writers`)
    OR (`mitre_dc0029_powershell_logging` EventCode=4104 `mitre_an1626_script_patterns`)
    | `mitre_normalize_host`
    | eval new_ctime=strptime(CreationUtcTime, "%Y-%m-%d %H:%M:%S.%3N"), old_ctime=strptime(PreviousCreationUtcTime, "%Y-%m-%d %H:%M:%S.%3N")
    | where EventCode==4104 OR (old_ctime - new_ctime) >= `mitre_an1626_backdate_seconds`
    | eval process_name=lower(replace(coalesce(Image, "powershell.exe"), "^.*\\\\", "")), file_path=if(EventCode==2, TargetFilename, null()), script=if(EventCode==4104, substr(ScriptBlockText, 1, 300), null())
    | stats count min(_time) as firstTime max(_time) as lastTime values(file_path) as file_path values(script) as script values(process_name) as process_name values(user) as user by dest
    | eval file_path=mvindex(file_path, 0, 19)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1626_filter`
  risk:
    message: File timestamps backdated on $dest$ by $process_name$
    objects:
    - field: dest
      type: system
      score: 35
    threat_objects:
    - field: process_name
      type: process_name
    - field: file_path
      type: file_path
  schedule: {}
  throttle:
    fields:
    - dest
    period: 86400s
  false_positives:
  - >-
    Archive extraction and copy tools that preserve original timestamps (allow-list them in the benign-writers macro).
  - Build systems and package managers that normalise timestamps for reproducible output.
  baselines: []
  sigma:
    rules:
    - name: an1626_creation_time_changed
      logsource:
        product: windows
        category: file_change
      detection:
        selection:
          TargetFilename|endswith:
          - .exe
          - .dll
          - .sys
          - .ps1
          - .bat
          - .vbs
        benign:
          Image|endswith:
          - \7z.exe
          - \WinRAR.exe
          - \explorer.exe
          - \msiexec.exe
          - \TiWorker.exe
          - \OneDrive.exe
        condition: selection and not benign
    - name: an1626_script_sets_timestamps
      logsource:
        product: windows
        category: ps_script
      detection:
        selection:
          ScriptBlockText|contains:
          - .CreationTime =
          - .LastWriteTime =
          - .LastAccessTime =
          - SetFileTime
        condition: selection
kql: null
esql: null
