# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0831
name: Analytic 0831
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0298#AN0831
  attack_release: '20.1'
  detection_strategy:
    id: DET0298
    name: Detect Archiving via Utility (T1560.001)
  technique:
    id: T1560.001
    name: Archive via Utility
    tactics:
    - collection
    usage_score: 140
  platforms:
  - Windows
  description: >-
    Detects adversarial archiving using built-in or third-party utilities (makecab, diantz, xcopy, certutil, 7z,
    WinRAR, WinZip). Correlates suspicious process creation events with command-line arguments for compression/encoding,
    followed by creation of archive files (.cab, .zip, .7z, .rar). Identifies anomalous loading of crypt32.dll for
    encryption operations or execution of diantz.exe to compress remotely staged files.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  - dc: DC0016
    dc_name: Module Load
    name: WinEventLog:Sysmon
    channel: EventCode=7
  mutable_elements:
  - field: SuspiciousExtensions
    description: List of archive extensions considered high risk (.cab, .zip, .7z, .rar).
  - field: ProcessAllowlist
    description: Known business utilities allowed to create archives without alerting.
  - field: FileSizeThresholdMB
    description: Minimum archive size threshold to filter out benign small compressions.
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: SuspiciousExtensions
    bind: lookup
    name: mitre_sensitive_paths
  - element: ProcessAllowlist
    bind: lookup
    name: mitre_allowlist_processes
  - element: FileSizeThresholdMB
    bind: macro
    name: mitre_an0831_filesizethresholdmb
curated:
  status: implemented
  title: Archive created with a password, split volumes or a built-in packer
  content_type: anomaly
  severity: low
  summary: >-
    7-Zip or WinRAR adds files to an archive with a password or volume-split switch; makecab or diantz is run; PowerShell
    Compress-Archive is used; or tar.exe creates an archive. These are the common staging steps before exfiltration.
  gaps: >-
    The resulting archive file creation, crypt32.dll loads and the FileSizeThresholdMB element are not evaluated.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: SuspiciousExtensions
    bind: macro
    name: mitre_an0831_patterns
    default: >-
      ((Processes.process_name IN ("7z.exe", "7za.exe", "7zr.exe", "rar.exe", "winrar.exe") Processes.process="*
      a *" Processes.process IN ("* -p*", "* -hp*", "* -v*")) OR Processes.process_name IN ("makecab.exe", "diantz.exe")
      OR (Processes.process_name IN ("powershell.exe", "pwsh.exe") Processes.process="*compress-archive*") OR (Processes.process_name="tar.exe"
      Processes.process IN ("* -c*", "* -a *", "*--create*")))
  - element: ProcessAllowlist
    bind: lookup
    name: mitre_allowlist_users
    note: Backup and packaging service accounts (allow-listing by user is more precise than by utility name).
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where` `mitre_an0831_patterns`
        by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_user`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0831_filter`
  risk:
    message: Data archived with $process_name$ on $dest$ by $user$
    objects:
    - field: dest
      type: system
      score: 25
    - field: user
      type: user
      score: 25
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    - process_name
    period: 3600s
  false_positives:
  - Backup jobs, software packaging and users compressing files for mail.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      packer:
        Image|endswith:
        - \7z.exe
        - \7za.exe
        - \7zr.exe
        - \rar.exe
        - \winrar.exe
        CommandLine|contains|all:
        - ' a '
        CommandLine|contains:
        - ' -p'
        - ' -hp'
        - ' -v'
      builtin:
        Image|endswith:
        - \makecab.exe
        - \diantz.exe
      powershell:
        CommandLine|contains: Compress-Archive
      condition: packer or builtin or powershell
kql: null
esql: null
