# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0392
name: Analytic 0392
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0140#AN0392
  attack_release: '20.1'
  detection_strategy:
    id: DET0140
    name: Behavioral Detection of Malicious File Deletion
  technique:
    id: T1070.004
    name: File Deletion
    tactics:
    - stealth
    usage_score: 380
  platforms:
  - Windows
  description: >-
    Detects adversary behavior deleting artifacts (e.g., dropped payloads, evidence files) using native or external
    utilities (e.g., del, erase, SDelete). Detects deletion events correlated with unusual process lineage or timing
    post-execution.
  log_source_references:
  - dc: DC0040
    dc_name: File Deletion
    name: WinEventLog:Sysmon
    channel: EventCode=23
  - dc: DC0055
    dc_name: File Access
    name: WinEventLog:Security
    channel: EventCode=4663, 4670, 4656
  - dc: DC0064
    dc_name: Command Execution
    name: WinEventLog:PowerShell
    channel: EventCode=4103, 4104, 4105, 4106
  mutable_elements:
  - field: TimeWindow
    description: Defines correlation window after suspicious binary execution or login session.
  - field: FilePathPattern
    description: Focuses on deletion of temp files, malware staging dirs, or known indicators.
  - field: UserContext
    description: Privilege level or impersonated user deleting sensitive files.
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: FilePathPattern
    bind: lookup
    name: mitre_sensitive_paths
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
curated:
  status: implemented
  title: Secure deletion, self-deletion or interpreter removing executables
  content_type: anomaly
  severity: medium
  summary: >-
    Three deletion patterns used to remove artifacts: secure-delete tools (SDelete, cipher /w, fsutil USN journal
    deletion); a command line that waits and then deletes, the usual self-deletion idiom (ping/timeout/choice followed
    by del); and a script interpreter or LOLBin deleting an executable or script from a staging path (Sysmon 23/26).
  gaps: >-
    The correlation with the deleting process's earlier execution and with 4663 object access is not made; plain
    del of user files is out of scope.
  data_components:
  - DC0032
  - DC0040
  feeds:
  - sysmon
  tuning:
  - element: FilePathPattern
    bind: macro
    name: mitre_an0392_artifact_paths
    default: >-
      TargetFilename IN ("*\\AppData\\Local\\Temp\\*", "*\\Windows\\Temp\\*", "*\\Users\\Public\\*", "*\\ProgramData\\*",
      "*\\PerfLogs\\*", "*\\Downloads\\*") TargetFilename IN ("*.exe", "*.dll", "*.ps1", "*.bat", "*.cmd", "*.vbs",
      "*.js", "*.hta", "*.scr")
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
  - element: TimeWindow
    bind: filter
    name: mitre_an0392_filter
    note: Not correlated with prior execution in this search.
  spl: |-
    (`mitre_dc0032_sysmon` EventCode=1 (Image IN ("*\\sdelete.exe", "*\\sdelete64.exe") OR OriginalFileName="sdelete.exe"
        OR (Image="*\\cipher.exe" CommandLine="* /w:*")
        OR (Image="*\\fsutil.exe" CommandLine="*usn*deletejournal*")
        OR (Image="*\\cmd.exe" CommandLine IN ("*ping*127.0.0.1*&*del *", "*timeout*&*del *", "*choice /c*&*del *", "*ping -n*&*del *"))))
      OR (`mitre_dc0040_sysmon` EventCode IN (23, 26) Image IN ("*\\cmd.exe", "*\\powershell.exe", "*\\pwsh.exe", "*\\wscript.exe", "*\\cscript.exe", "*\\mshta.exe", "*\\rundll32.exe", "*\\regsvr32.exe") `mitre_an0392_artifact_paths`)
    | `mitre_normalize_host`
    | eval signal=case(EventCode IN (23, 26), "interpreter_deleted_executable", match(CommandLine, "(?i)sdelete|cipher|fsutil"), "secure_delete", true(), "self_delete"), process_name=replace(Image, "^.*\\\\", "")
    | search `mitre_not_allowlisted_user`
    | stats count min(_time) as firstTime max(_time) as lastTime values(signal) as signals values(CommandLine) as process values(TargetFilename) as file_path by dest user process_name
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0392_filter`
  risk:
    message: Artifact deletion by $process_name$ on $dest$
    objects:
    - field: dest
      type: system
      score: 35
    - field: user
      type: user
      score: 30
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process_name
    period: 3600s
  false_positives:
  - >-
    Installers and updaters that remove their own temporary executables; administrators wiping free space.
  baselines: []
  sigma:
    rules:
    - name: an0392_delete_command
      logsource:
        product: windows
        category: process_creation
      detection:
        sdelete:
          Image|endswith:
          - \sdelete.exe
          - \sdelete64.exe
        cipher:
          Image|endswith: \cipher.exe
          CommandLine|contains: ' /w:'
        fsutil:
          Image|endswith: \fsutil.exe
          CommandLine|contains|all:
          - usn
          - deletejournal
        self_delete:
          Image|endswith: \cmd.exe
          CommandLine|contains|all:
          - '&'
          - 'del '
          CommandLine|contains:
          - 127.0.0.1
          - timeout
          - choice /c
        condition: 1 of them
    - name: an0392_interpreter_delete
      logsource:
        product: windows
        category: file_delete
      detection:
        selection:
          Image|endswith:
          - \cmd.exe
          - \powershell.exe
          - \pwsh.exe
          - \wscript.exe
          - \cscript.exe
          - \mshta.exe
          - \rundll32.exe
          - \regsvr32.exe
          TargetFilename|contains:
          - \AppData\Local\Temp\
          - \Windows\Temp\
          - \Users\Public\
          - \ProgramData\
          - \PerfLogs\
          TargetFilename|endswith:
          - .exe
          - .dll
          - .ps1
          - .bat
          - .cmd
          - .vbs
          - .js
          - .hta
          - .scr
        condition: selection
kql: null
esql: null
