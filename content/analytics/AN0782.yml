# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0782
name: Analytic 0782
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0281#AN0782
  attack_release: '20.1'
  detection_strategy:
    id: DET0281
    name: Detection Strategy for Compressed Payload Creation and Execution
  technique:
    id: T1027.015
    name: Compression
    tactics:
    - stealth
    usage_score: 52
  platforms:
  - Windows
  description: >-
    Monitors for compression tool usage (e.g., 7zip, WinRAR, MakeCab) that follows or precedes file modification,
    suspicious file types (e.g., .exe, .dll) being compressed, or dropped from self-extracting archives followed
    by immediate execution.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  mutable_elements:
  - field: CompressedFileType
    description: Zip, .rar, .cab, .gz – tune based on expected legitimate use of compression in environment
  - field: SFXExecutionDelay
    description: Expected time between archive unpacking and first execution – short delays are suspicious
  - field: UserContext
    description: Restrict detection to non-admin or interactive users if excessive FPs from sys admin activity
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: CompressedFileType
    bind: lookup
    name: mitre_sensitive_paths
  - element: SFXExecutionDelay
    bind: filter
    name: mitre_an0782_filter
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
curated:
  status: implemented
  title: Executable extracted from an archive and run within minutes
  content_type: anomaly
  severity: medium
  summary: >-
    An archiver or Explorer's built-in extraction writes an executable, script or library (Sysmon 11) into a user-writable
    folder, and a process starts from that exact path within five minutes. Compressed delivery (ZIP, RAR, 7z, ISO-in-ZIP,
    self-extractors) hides the payload from gateway scanning until the user runs it.
  gaps: >-
    Payloads loaded as DLLs (rundll32 or sideloading) rather than run as a process are not matched; self-extracting
    archives that execute in memory without writing a file are invisible.
  data_components:
  - DC0039
  - DC0032
  feeds:
  - sysmon
  tuning:
  - element: CompressedFileType
    bind: macro
    name: mitre_an0782_extractors
    default: >-
      Image IN ("*\\7z.exe", "*\\7zG.exe", "*\\7zFM.exe", "*\\WinRAR.exe", "*\\rar.exe", "*\\unrar.exe", "*\\expand.exe",
      "*\\extrac32.exe", "*\\tar.exe", "*\\explorer.exe", "*\\PeaZip.exe", "*\\Bandizip.exe", "*\\winzip64.exe",
      "*\\winzip32.exe")
  - element: PayloadTypes
    bind: macro
    name: mitre_an0782_payload_types
    default: >-
      TargetFilename IN ("*.exe", "*.scr", "*.com", "*.pif", "*.bat", "*.cmd", "*.vbs", "*.js", "*.jse", "*.wsf",
      "*.hta", "*.ps1", "*.lnk", "*.msi")
  - element: UserContext
    bind: macro
    name: mitre_an0782_user_paths
    default: >-
      Image IN ("C:\\Users\\*", "C:\\ProgramData\\*", "C:\\Windows\\Temp\\*", "C:\\$Recycle.Bin\\*", "C:\\PerfLogs\\*")
  - element: SFXExecutionDelay
    bind: macro
    name: mitre_an0782_window_seconds
    default: '300'
  spl: |-
    (`mitre_dc0039_sysmon` EventCode=11 `mitre_an0782_extractors` `mitre_an0782_payload_types`)
    OR (`mitre_dc0032_sysmon` EventCode=1 `mitre_an0782_user_paths`)
    | `mitre_normalize_host`
    | eval file_path=lower(if(EventCode==11, TargetFilename, Image)), extract_time=if(EventCode==11, _time, null()), exec_time=if(EventCode==1, _time, null()), extractor=if(EventCode==11, lower(replace(Image, "^.*\\\\", "")), null()), command=if(EventCode==1, CommandLine, null())
    | stats min(extract_time) as extract_time min(exec_time) as exec_time values(extractor) as extractor values(command) as process values(user) as user by dest file_path
    | where isnotnull(extract_time) AND isnotnull(exec_time) AND exec_time >= extract_time AND exec_time - extract_time <= `mitre_an0782_window_seconds`
    | eval process_name=replace(file_path, "^.*\\\\", ""), firstTime=extract_time, lastTime=exec_time
    | search `mitre_not_allowlisted_process`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0782_filter`
  risk:
    message: $process_name$ extracted by $extractor$ and run on $dest$
    objects:
    - field: dest
      type: system
      score: 35
    - field: user
      type: user
      score: 30
    threat_objects:
    - field: file_path
      type: file_path
  schedule:
    cron: '*/15 * * * *'
    earliest: -25m@m
    latest: -5m@m
  throttle:
    fields:
    - dest
    - file_path
    period: 86400s
  false_positives:
  - >-
    Users unzipping and running installers or portable tools from Downloads; software updaters that unpack into
    Temp.
  baselines: []
  sigma:
    rules:
    - name: an0782_archiver_writes_executable
      logsource:
        product: windows
        category: file_event
      detection:
        extractor:
          Image|endswith:
          - \7z.exe
          - \7zG.exe
          - \WinRAR.exe
          - \expand.exe
          - \extrac32.exe
          - \tar.exe
        payload:
          TargetFilename|endswith:
          - .exe
          - .scr
          - .bat
          - .cmd
          - .vbs
          - .js
          - .hta
          - .ps1
          - .lnk
        condition: extractor and payload
kql: null
esql: null
