# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1258
name: Analytic 1258
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0457#AN1258
  attack_release: '20.1'
  detection_strategy:
    id: DET0457
    name: Detection of Non-Application Layer Protocols for C2
  technique:
    id: T1095
    name: Non-Application Layer Protocol
    tactics:
    - command-and-control
    usage_score: 130
  platforms:
  - Network Devices
  description: >-
    Non-standard port/protocol pairings or low-entropy ICMP traffic resembling tunneling patterns (e.g., fixed-size
    pings with delays).
  log_source_references:
  - dc: DC0085
    dc_name: Network Traffic Content
    name: NSM:Firewall
    channel: ICMP/UDP protocol anomaly
  - dc: DC0078
    dc_name: Network Traffic Flow
    name: NSM:Flow
    channel: conn.log, icmp.log
  mutable_elements:
  - field: ProtocolEntropyThreshold
    description: ICMP/UDP packet content entropy filter to identify encoded payloads.
  - field: SessionDurationThreshold
    description: Long ICMP/UDP sessions beyond expected limits (e.g., >5min).
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: ProtocolEntropyThreshold
    bind: macro
    name: mitre_an1258_protocolentropythreshold
  - element: SessionDurationThreshold
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: ICMP session with unusual volume or duration
  content_type: anomaly
  severity: medium
  summary: >-
    Corelight conn.log ICMP flows between a pair of hosts whose combined payload bytes or longest flow duration
    within the hour exceed thresholds. Normal ping is small and short; ICMP tunnels carry sustained data.
  gaps: >-
    Payload entropy is not available in conn.log and is not evaluated. UDP on non-standard ports is not included.
    The firewall view (Palo Alto traffic for app=ping/icmp) can be added through the Network Traffic Flow umbrella
    macro.
  data_components:
  - DC0078
  feeds:
  - corelight
  tuning:
  - element: SessionDurationThreshold
    bind: macro
    name: mitre_an1258_duration_threshold
    default: '300'
    note: Seconds.
  - element: ProtocolEntropyThreshold
    bind: macro
    name: mitre_an1258_bytes_threshold
    default: '100000'
    note: Entropy is not measurable here; total ICMP bytes per host pair per hour is used instead.
  spl: |-
    `mitre_dc0078_corelight` `mitre_st_corelight_conn` proto=icmp
    | `mitre_normalize_zeek`
    | stats count min(_time) as firstTime max(_time) as lastTime sum(bytes_out) as bytes_out sum(bytes_in) as bytes_in max(duration) as max_duration by src dest
    | eval total_bytes=coalesce(bytes_out, 0) + coalesce(bytes_in, 0)
    | where total_bytes >= `mitre_an1258_bytes_threshold` OR max_duration >= `mitre_an1258_duration_threshold`
    | search `mitre_not_allowlisted_dest`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1258_filter`
  risk:
    message: Unusual ICMP volume or duration between $src$ and $dest$
    objects:
    - field: src
      type: system
      score: 40
    threat_objects:
    - field: dest
      type: ip_address
  schedule:
    cron: 11 * * * *
    earliest: -65m@m
    latest: -5m@m
  throttle:
    fields:
    - src
    - dest
    period: 14400s
  false_positives:
  - Monitoring systems that ping continuously, path MTU discovery, traceroute-heavy troubleshooting.
  baselines: []
  sigma:
    note: >-
      Sigma can express the long-duration condition only; byte aggregation per host pair is left to the SPL.
    logsource:
      product: zeek
      service: conn
    detection:
      selection:
        proto: icmp
        duration|gte: 300
      condition: selection
kql: null
esql: null
