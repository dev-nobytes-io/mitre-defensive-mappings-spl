# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1583
name: Analytic 1583
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0574#AN1583
  attack_release: '20.1'
  detection_strategy:
    id: DET0574
    name: Detection Strategy for Remote System Enumeration Behavior
  technique:
    id: T1018
    name: Remote System Discovery
    tactics:
    - discovery
    usage_score: 161
  platforms:
  - Windows
  description: >-
    Execution of network enumeration utilities (e.g., net.exe, ping.exe, tracert.exe) in short succession, often
    chained with lateral movement tools or system enumeration commands.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  mutable_elements:
  - field: TimeWindow
    description: Define bursty execution patterns of enumeration commands (e.g., <30s)
  - field: CommandLinePattern
    description: Tunable per org’s scripting/IT tools (e.g., exclude SCCM, PsExec)
  - field: ParentProcess
    description: Flag suspicious process ancestry (e.g., Word.exe spawning net.exe)
derived:
  coverage: mapped
  suggested_content_type: hunting
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: CommandLinePattern
    bind: macro
    name: mitre_an1583_commandlinepattern
  - element: ParentProcess
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Burst of remote system discovery commands
  content_type: anomaly
  severity: low
  summary: >-
    One user on one host runs several distinct network enumeration commands within ten minutes: net view, net group
    "domain computers", nltest, ping, tracert, nslookup, arp, nbtstat -A, adfind, dsquery computer, Get-ADComputer,
    Test-Connection. A ping sweep counts because each target is a distinct command line.
  gaps: >-
    Network connections produced by the enumeration (Sysmon 3) are not correlated; AN1057 covers the connection-side
    scan pattern.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_an1583_threshold
    default: '5'
    note: Distinct enumeration command lines per host and user per 10-minute bucket.
  - element: CommandLinePattern
    bind: lookup
    name: mitre_allowlist_users
    note: Monitoring and deployment accounts (SCCM, scanners).
  - element: ParentProcess
    bind: filter
    name: mitre_an1583_filter
  spl: |-
    | tstats `mitre_summariesonly` count from `mitre_dc0032_dm` where `mitre_dc0032_dm_where`
        ((Processes.process_name IN ("net.exe", "net1.exe") Processes.process IN ("* view*", "*domain computers*", "*domain controllers*"))
          OR Processes.process_name IN ("nltest.exe", "ping.exe", "tracert.exe", "nslookup.exe", "adfind.exe", "nbtscan.exe")
          OR (Processes.process_name="arp.exe" Processes.process="* -a*")
          OR (Processes.process_name="nbtstat.exe" Processes.process="* -a *")
          OR (Processes.process_name="dsquery.exe" Processes.process="*computer*")
          OR (Processes.process_name IN ("powershell.exe", "pwsh.exe") Processes.process IN ("*get-adcomputer*", "*get-domaincomputer*", "*get-netcomputer*", "*test-connection*", "*test-netconnection*")))
        by Processes.dest Processes.user Processes.process _time span=10m
    | `drop_dm_object_name(Processes)`
    | stats sum(count) as count min(_time) as firstTime max(_time) as lastTime dc(process) as distinct_commands values(process) as process by dest user _time
    | where distinct_commands >= `mitre_an1583_threshold`
    | search `mitre_not_allowlisted_user`
    | eval process=mvindex(process, 0, 19)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1583_filter`
  risk:
    message: $distinct_commands$ remote system discovery commands on $dest$ by $user$ in ten minutes
    objects:
    - field: dest
      type: system
      score: 20
    - field: user
      type: user
      score: 20
  schedule:
    earliest: -30m@m
    latest: -5m@m
  throttle:
    fields:
    - dest
    - user
    period: 3600s
  false_positives:
  - Monitoring scripts, network troubleshooting and software deployment.
  baselines: []
  sigma:
    rules:
    - name: an1583_discovery_command
      logsource:
        product: windows
        category: process_creation
      detection:
        net:
          Image|endswith:
          - \net.exe
          - \net1.exe
          CommandLine|contains:
          - ' view'
          - domain computers
          - domain controllers
        tools:
          Image|endswith:
          - \nltest.exe
          - \ping.exe
          - \tracert.exe
          - \nslookup.exe
          - \adfind.exe
          - \nbtscan.exe
        powershell:
          CommandLine|contains:
          - Get-ADComputer
          - Get-DomainComputer
          - Test-Connection
          - Test-NetConnection
        condition: net or tools or powershell
    correlation:
      type: value_count
      group-by:
      - Computer
      - User
      timespan: 10m
      condition:
        field: CommandLine
        gte: 5
kql: null
esql: null
