# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0559
name: Analytic 0559
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0195#AN0559
  attack_release: '20.1'
  detection_strategy:
    id: DET0195
    name: Behavioral Detection of System Network Configuration Discovery
  technique:
    id: T1016
    name: System Network Configuration Discovery
    tactics:
    - discovery
    usage_score: 351
  platforms:
  - Windows
  description: >-
    Execution of built-in tools (e.g., ipconfig, route, netsh) or PowerShell/WMI queries to enumerate IP, MAC, interface
    status, or routing configuration.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0064
    dc_name: Command Execution
    name: WinEventLog:PowerShell
    channel: EventCode=4103, 4104, 4105, 4106
  mutable_elements:
  - field: ParentProcess
    description: Filter known/legit CLI chains (e.g., explorer.exe → cmd.exe) to reduce FP
  - field: UserContext
    description: Target executions by non-admin or unexpected users
  - field: TimeWindow
    description: Cluster enumeration commands within short time windows
derived:
  coverage: live
  suggested_content_type: hunting
  suggested_tuning:
  - element: ParentProcess
    bind: lookup
    name: mitre_allowlist_processes
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: Network configuration discovery commands
  content_type: hunting
  severity: informational
  summary: >-
    Lists hosts and users running ipconfig, route print, arp -a, nbtstat, getmac, netsh interface or wlan show,
    wmic nicconfig, or the Get-NetIPConfiguration / Get-NetAdapter / Get-NetRoute / Get-DnsClientServerAddress cmdlets,
    in ten-minute buckets.
  gaps: PowerShell script-block content is not included. No finding or risk is produced.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: ParentProcess
    bind: filter
    name: mitre_an0559_filter
    note: e.g. search NOT parent_process_name="explorer.exe" to drop interactive use.
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
  spl: |-
    | tstats `mitre_summariesonly` count from `mitre_dc0032_dm` where `mitre_dc0032_dm_where`
        (Processes.process_name IN ("ipconfig.exe", "nbtstat.exe", "getmac.exe")
          OR (Processes.process_name="route.exe" Processes.process="*print*")
          OR (Processes.process_name="arp.exe" Processes.process="* -a*")
          OR (Processes.process_name="netsh.exe" Processes.process="*show*" Processes.process IN ("*interface*", "*wlan*", "* ip *"))
          OR (Processes.process_name="wmic.exe" Processes.process="*nicconfig*")
          OR (Processes.process_name IN ("powershell.exe", "pwsh.exe") Processes.process IN ("*get-netipconfiguration*", "*get-netadapter*", "*get-netroute*", "*get-dnsclientserveraddress*", "*get-netipaddress*")))
        by Processes.dest Processes.user Processes.parent_process_name Processes.process _time span=10m
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_user`
    | stats sum(count) as count dc(process) as distinct_commands values(process) as process values(parent_process_name) as parent_process_name by dest user _time
    | sort - distinct_commands
    | `mitre_an0559_filter`
  risk:
    message: ''
    objects: []
    threat_objects: []
  schedule: {}
  throttle: {}
  false_positives:
  - VPN clients, network troubleshooting and logon scripts.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    level: informational
    detection:
      tools:
        Image|endswith:
        - \ipconfig.exe
        - \nbtstat.exe
        - \getmac.exe
      route:
        Image|endswith: \route.exe
        CommandLine|contains: print
      arp:
        Image|endswith: \arp.exe
        CommandLine|contains: ' -a'
      powershell:
        CommandLine|contains:
        - Get-NetIPConfiguration
        - Get-NetAdapter
        - Get-NetRoute
        - Get-DnsClientServerAddress
      condition: tools or route or arp or powershell
kql: null
esql: null
