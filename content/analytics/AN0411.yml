# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0411
name: Analytic 0411
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0146#AN0411
  attack_release: '20.1'
  detection_strategy:
    id: DET0146
    name: Detection of Data Destruction Across Platforms via Mass Overwrite and Deletion Patterns
  technique:
    id: T1485
    name: Data Destruction
    tactics:
    - impact
    usage_score: 50
  platforms:
  - Windows
  description: >-
    Adversary spawns command-line tools (e.g., del, cipher /w, SDelete) or scripts to recursively delete or overwrite
    user/system files. This may be correlated with abnormal file IO activity, registry writes, or tampering in critical
    system directories.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  - dc: DC0040
    dc_name: File Deletion
    name: WinEventLog:Sysmon
    channel: EventCode=23
  mutable_elements:
  - field: TargetFilename
    description: Filter file deletion activity to sensitive locations (e.g., %System32%, Documents, DB paths).
  - field: ProcessCommandLine
    description: Tune for aggressive overwrite flags (e.g., /w, /q, /s) or temp file overwrites.
  - field: VolumeThreshold
    description: Threshold of unique file deletions or modifications within time window.
  - field: TimeWindow
    description: Correlate rapid file delete/overwrite behavior from same process/user.
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: TargetFilename
    bind: lookup
    name: mitre_sensitive_paths
  - element: ProcessCommandLine
    bind: lookup
    name: mitre_allowlist_processes
  - element: VolumeThreshold
    bind: macro
    name: mitre_an0411_volumethreshold
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: Mass file deletion by one process, or disk wipe commands
  content_type: anomaly
  severity: high
  summary: >-
    One process deletes more than a threshold of distinct files in five minutes (Sysmon 23 and 26), or a command
    line wipes a disk or volume (diskpart clean, format /y, Clear-Disk, Remove-Partition) or recursively deletes
    a profile or share root. Destructive actors and wipers delete at a rate no normal application does outside cleanup
    tools.
  gaps: >-
    Sysmon 23/26 volume depends on the FileDelete rules in the Sysmon config (often scoped to a few extensions);
    overwrite-in-place wipers that never delete, and raw-disk writes, need DC0040's other sources and AN0602 for
    ransomware. Secure-delete tools are AN0392.
  data_components:
  - DC0040
  - DC0032
  feeds:
  - sysmon
  tuning:
  - element: VolumeThreshold
    bind: macro
    name: mitre_an0411_threshold
    default: '300'
    note: Distinct files deleted per process per 5 minutes.
  - element: ProcessCommandLine
    bind: macro
    name: mitre_an0411_wipe_commands
    default: >-
      ((Image="*\\diskpart.exe" CommandLine="*clean*") OR (Image="*\\format.com" CommandLine="*/y*") OR CommandLine
      IN ("*Clear-Disk*", "*Remove-Partition*", "*Format-Volume*", "*rd /s /q C:\\Users*", "*rmdir /s /q C:\\Users*",
      "*del /s /q /f C:\\Users*", "*Remove-Item*C:\\Users*-Recurse*"))
  - element: TargetFilename
    bind: macro
    name: mitre_an0411_benign_deleters
    default: >-
      Image IN ("*\\cleanmgr.exe", "*\\TiWorker.exe", "*\\TrustedInstaller.exe", "*\\MsMpEng.exe", "*\\msiexec.exe",
      "*\\OneDrive.exe", "*\\chrome.exe", "*\\msedge.exe", "*\\firefox.exe", "*\\Teams.exe", "*\\ms-teams.exe",
      "*\\svchost.exe", "*\\SearchIndexer.exe", "*\\DismHost.exe", "*\\setup.exe")
  - element: TimeWindow
    bind: filter
    name: mitre_an0411_filter
  spl: |-
    (`mitre_dc0040_sysmon` EventCode IN (23, 26) NOT `mitre_an0411_benign_deleters`)
    OR (`mitre_dc0032_sysmon` EventCode=1 `mitre_an0411_wipe_commands`)
    | `mitre_normalize_host`
    | eval process_name=lower(replace(Image, "^.*\\\\", "")), deleted=if(EventCode IN (23, 26), TargetFilename, null()), wipe=if(EventCode==1, CommandLine, null())
    | search `mitre_not_allowlisted_process`
    | bin _time span=5m
    | stats dc(deleted) as files_deleted values(wipe) as wipe_command values(user) as user min(_time) as firstTime max(_time) as lastTime by dest process_name _time
    | where files_deleted >= `mitre_an0411_threshold` OR isnotnull(wipe_command)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0411_filter`
  risk:
    message: $process_name$ deleted $files_deleted$ files or wiped storage on $dest$
    objects:
    - field: dest
      type: system
      score: 60
    - field: user
      type: user
      score: 40
    threat_objects:
    - field: process_name
      type: process_name
  schedule:
    cron: '*/10 * * * *'
    earliest: -15m@m
    latest: -5m@m
  throttle:
    fields:
    - dest
    - process_name
    period: 14400s
  false_positives:
  - >-
    Build and test tooling cleaning output folders; profile cleanup and re-imaging scripts; storage administrators
    formatting new volumes.
  baselines: []
  sigma:
    rules:
    - name: an0411_wipe_command
      logsource:
        product: windows
        category: process_creation
      detection:
        diskpart:
          Image|endswith: \diskpart.exe
          CommandLine|contains: clean
        powershell:
          CommandLine|contains:
          - Clear-Disk
          - Remove-Partition
          - Format-Volume
        condition: diskpart or powershell
    - name: an0411_file_deleted
      logsource:
        product: windows
        category: file_delete
      detection:
        selection:
          TargetFilename|contains: \Users\
        condition: selection
    correlation:
      type: value_count
      rules:
      - an0411_file_deleted
      group-by:
      - Computer
      - Image
      timespan: 5m
      condition:
        field: TargetFilename
        gte: 300
kql: null
esql: null
