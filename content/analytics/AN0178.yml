# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0178
name: Analytic 0178
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0066#AN0178
  attack_release: '20.1'
  detection_strategy:
    id: DET0066
    name: User Execution – Malicious Link (click → suspicious egress → download/write → follow-on activity)
  technique:
    id: T1204.001
    name: Malicious Link
    tactics:
    - execution
    usage_score: 149
  platforms:
  - Windows
  description: >-
    Behavioral chain: (1) a user-facing app (browser/Office/email client) launches a URL or handles a link, then
    (2) the same process lineage makes an outbound connection to an untrusted domain/IP, (3) a file is downloaded
    or unpacked to a user-writable location shortly after the click. Optional enrichment: subsequent child execution
    by LOLBINs.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  - dc: DC0085
    dc_name: Network Traffic Content
    name: NSM:Flow
    channel: Suspicious URL patterns, uncommon TLDs, short-lived domains, URL shorteners; HTTP method GET/POST
  mutable_elements:
  - field: TimeWindow
    description: Correlation window (e.g., 15m) between link click / first egress / file write.
  - field: BrowserParents
    description: >-
      Processes considered link sources: chrome.exe, msedge.exe, firefox.exe, winword.exe, outlook.exe, teams.exe.
  - field: UserPaths
    description: >-
      User-writable directories to monitor (%USERPROFILE%\Downloads, %TEMP%, %APPDATA%\*, OneDrive caches).
  - field: SuspiciousTLDs
    description: High-risk TLD and domain list (e.g., .top .xyz .monster; newly observed domains/NOD).
  - field: AllowedCDNs
    description: Corporate CDNs/update hosts to reduce false positives.
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: BrowserParents
    bind: lookup
    name: mitre_allowlist_processes
  - element: UserPaths
    bind: lookup
    name: mitre_account_roles
  - element: SuspiciousTLDs
    bind: filter
    name: mitre_an0178_filter
  - element: AllowedCDNs
    bind: filter
    name: mitre_an0178_filter
curated:
  status: implemented
  title: High-risk file type downloaded by a browser or mail client
  content_type: anomaly
  severity: medium
  summary: >-
    Sysmon FileCreateStreamHash (15) records a Zone.Identifier stream (mark of the web) on a file with an executable,
    script, shortcut or disk-image extension, written by a browser or mail client. The HostUrl in the stream is
    extracted so the download domain can be allow-listed or investigated.
  gaps: >-
    The click (URL launch) and the following execution are not joined here; DET0294 covers write-then-run. Downloads
    that strip the mark of the web (some archivers, curl) are not seen.
  data_components:
  - DC0059
  feeds:
  - sysmon
  tuning:
  - element: SuspiciousTLDs
    bind: macro
    name: mitre_an0178_risky_types
    default: >-
      TargetFilename IN ("*.exe:Zone.Identifier", "*.scr:Zone.Identifier", "*.js:Zone.Identifier", "*.jse:Zone.Identifier",
      "*.vbs:Zone.Identifier", "*.vbe:Zone.Identifier", "*.wsf:Zone.Identifier", "*.hta:Zone.Identifier", "*.lnk:Zone.Identifier",
      "*.iso:Zone.Identifier", "*.img:Zone.Identifier", "*.vhd:Zone.Identifier", "*.vhdx:Zone.Identifier", "*.one:Zone.Identifier",
      "*.msi:Zone.Identifier", "*.bat:Zone.Identifier", "*.cmd:Zone.Identifier", "*.ps1:Zone.Identifier", "*.cpl:Zone.Identifier",
      "*.appx:Zone.Identifier", "*.msix:Zone.Identifier")
  - element: BrowserParents
    bind: macro
    name: mitre_an0178_downloaders
    default: >-
      Image IN ("*\\chrome.exe", "*\\msedge.exe", "*\\firefox.exe", "*\\brave.exe", "*\\opera.exe", "*\\iexplore.exe",
      "*\\outlook.exe", "*\\thunderbird.exe", "*\\teams.exe", "*\\ms-teams.exe")
  - element: AllowedCDNs
    bind: lookup
    name: mitre_allowlist_domains
    note: Software vendors' download domains (domain column, wildcards allowed).
  - element: UserPaths
    bind: filter
    name: mitre_an0178_filter
  - element: TimeWindow
    bind: filter
    name: mitre_an0178_filter
  spl: |-
    `mitre_dc0059_sysmon` EventCode=15 `mitre_an0178_downloaders` `mitre_an0178_risky_types`
    | `mitre_normalize_host`
    | rex field=Contents "(?i)HostUrl=(?<url>[^\s\r\n]+)"
    | rex field=url "(?i)^[a-z]+://(?<url_domain>[^/:]+)"
    | lookup mitre_allowlist_domains domain AS url_domain OUTPUT reason AS allow_reason
    | where isnull(allow_reason)
    | eval file_path=replace(TargetFilename, ":Zone.Identifier$", ""), process_name=replace(Image, "^.*\\\\", "")
    | stats count min(_time) as firstTime max(_time) as lastTime values(file_path) as file_path values(url) as url by dest user process_name url_domain
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0178_filter`
  risk:
    message: $user$ downloaded a high-risk file type from $url_domain$ on $dest$
    objects:
    - field: dest
      type: system
      score: 30
    - field: user
      type: user
      score: 30
    threat_objects:
    - field: url_domain
      type: domain
  schedule: {}
  throttle:
    fields:
    - dest
    - url_domain
    period: 14400s
  false_positives:
  - Software downloads by users and administrators from vendor sites not yet allow-listed.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: create_stream_hash
    detection:
      selection:
        Image|endswith:
        - \chrome.exe
        - \msedge.exe
        - \firefox.exe
        - \brave.exe
        - \outlook.exe
        - \teams.exe
        TargetFilename|endswith:
        - .exe:Zone.Identifier
        - .scr:Zone.Identifier
        - .js:Zone.Identifier
        - .vbs:Zone.Identifier
        - .hta:Zone.Identifier
        - .lnk:Zone.Identifier
        - .iso:Zone.Identifier
        - .img:Zone.Identifier
        - .vhd:Zone.Identifier
        - .one:Zone.Identifier
        - .msi:Zone.Identifier
      condition: selection
kql: null
esql: null
