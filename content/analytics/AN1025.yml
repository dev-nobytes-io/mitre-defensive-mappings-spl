# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1025
name: Analytic 1025
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0360#AN1025
  attack_release: '20.1'
  detection_strategy:
    id: DET0360
    name: Behavioral Detection of Domain Group Discovery
  technique:
    id: T1069.002
    name: Domain Groups
    tactics:
    - discovery
    usage_score: 54
  platforms:
  - Windows
  description: >-
    Detection of domain group enumeration through command-line utilities such as 'net group /domain' or PowerShell
    cmdlets, followed by suspicious access to API calls or LSASS memory.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0064
    dc_name: Command Execution
    name: WinEventLog:PowerShell
    channel: EventCode=4103, 4104, 4105, 4106
  mutable_elements:
  - field: TimeWindow
    description: Adjustable window to track chained discovery activity (e.g., 5-10 minutes).
  - field: UserContext
    description: Tune to focus on non-admin users or service accounts performing enumeration.
  - field: ProcessLineageDepth
    description: How far back the parent-child process chain is correlated.
derived:
  coverage: mapped
  suggested_content_type: hunting
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
  - element: ProcessLineageDepth
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Domain group enumeration
  content_type: hunting
  severity: informational
  summary: >-
    Lists domain group queries: net group /domain, Get-ADGroup and Get-ADGroupMember, PowerView Get-DomainGroup
    and Get-NetGroup, dsquery group, and AdFind group filters, in ten-minute buckets per host, user and parent.
  gaps: >-
    LDAP queries from tooling with no command line (SharpHound, BloodHound collectors, in-memory PowerView) are
    invisible; LDAP query auditing on domain controllers (event 1644) or Corelight ldap.log would catch them. No
    finding or risk.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
    note: Identity-management and audit accounts.
  - element: ProcessLineageDepth
    bind: filter
    name: mitre_an1025_filter
  spl: |-
    | tstats `mitre_summariesonly` count from `mitre_dc0032_dm` where `mitre_dc0032_dm_where`
        ((Processes.process_name IN ("net.exe", "net1.exe") Processes.process="*group*" Processes.process="*/do*")
          OR (Processes.process_name IN ("powershell.exe", "pwsh.exe") Processes.process IN ("*Get-ADGroup*", "*Get-DomainGroup*", "*Get-NetGroup*", "*Get-ADPrincipalGroupMembership*"))
          OR (Processes.process_name="dsquery.exe" Processes.process="*group*")
          OR (Processes.process_name IN ("adfind.exe", "AdFind.exe") Processes.process="*group*"))
        by Processes.dest Processes.user Processes.parent_process_name Processes.process _time span=10m
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_user`
    | stats sum(count) as count dc(process) as distinct_commands values(process) as process by dest user parent_process_name _time
    | sort - distinct_commands
    | `mitre_an1025_filter`
  risk:
    message: ''
    objects: []
    threat_objects: []
  schedule: {}
  throttle: {}
  false_positives:
  - Helpdesk and identity administrators checking memberships.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    level: informational
    detection:
      net:
        Image|endswith:
        - \net.exe
        - \net1.exe
        CommandLine|contains|all:
        - group
        - /do
      powershell:
        CommandLine|contains:
        - Get-ADGroup
        - Get-DomainGroup
        - Get-NetGroup
      dsquery:
        Image|endswith: \dsquery.exe
        CommandLine|contains: group
      condition: net or powershell or dsquery
kql: null
esql: null
