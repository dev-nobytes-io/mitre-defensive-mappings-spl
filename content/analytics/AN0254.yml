# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0254
name: Analytic 0254
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0093#AN0254
  attack_release: '20.1'
  detection_strategy:
    id: DET0093
    name: Behavioral Detection of User Discovery via Local and Remote Enumeration
  technique:
    id: T1033
    name: System Owner/User Discovery
    tactics:
    - discovery
    usage_score: 300
  platforms:
  - Windows
  description: >-
    Adversary launches built-in system tools (e.g., whoami, query user, net user) or scripts that enumerate user
    account information via local execution or remote API queries (e.g., WMI, PowerShell).
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0064
    dc_name: Command Execution
    name: WinEventLog:PowerShell
    channel: EventCode=4103, 4104, 4105, 4106
  mutable_elements:
  - field: ParentProcessContext
    description: Identify if enumeration originates from non-interactive shell or system service
  - field: TimeWindow
    description: Tune temporal grouping of enumeration + lateral movement attempts
  - field: UserContext
    description: Flag unexpected users issuing enumeration commands (e.g., service accounts)
derived:
  coverage: mapped
  suggested_content_type: hunting
  suggested_tuning:
  - element: ParentProcessContext
    bind: lookup
    name: mitre_allowlist_processes
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
curated:
  status: implemented
  title: User and session discovery commands
  content_type: hunting
  severity: informational
  summary: >-
    Lists hosts and users running whoami, quser, qwinsta, query user/session or echoing the USERNAME variable, with
    parent process, in ten-minute buckets. whoami from a service, web server or script-host parent is the usual
    lead.
  gaps: >-
    Account enumeration (net user, Get-LocalUser, Get-ADUser) belongs to T1087 and is covered by AN0363. No finding
    or risk is produced.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: ParentProcessContext
    bind: filter
    name: mitre_an0254_filter
    note: e.g. search parent_process_name IN ("w3wp.exe", "services.exe", "wmiprvse.exe", "wscript.exe").
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
  spl: |-
    | tstats `mitre_summariesonly` count from `mitre_dc0032_dm` where `mitre_dc0032_dm_where`
        (Processes.process_name IN ("whoami.exe", "quser.exe", "qwinsta.exe")
          OR (Processes.process_name="query.exe" Processes.process IN ("*user*", "*session*"))
          OR (Processes.process_name="cmd.exe" Processes.process="*echo*%username%*"))
        by Processes.dest Processes.user Processes.parent_process_name Processes.process _time span=10m
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_user`
    | stats sum(count) as count dc(process) as distinct_commands values(process) as process by dest user parent_process_name _time
    | sort - count
    | `mitre_an0254_filter`
  risk:
    message: ''
    objects: []
    threat_objects: []
  schedule: {}
  throttle: {}
  false_positives:
  - Logon scripts, management tooling and administrators.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    level: informational
    detection:
      tools:
        Image|endswith:
        - \whoami.exe
        - \quser.exe
        - \qwinsta.exe
      query:
        Image|endswith: \query.exe
        CommandLine|contains:
        - user
        - session
      condition: tools or query
kql: null
esql: null
