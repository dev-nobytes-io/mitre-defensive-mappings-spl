# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1057
name: Analytic 1057
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0376#AN1057
  attack_release: '20.1'
  detection_strategy:
    id: DET0376
    name: Behavioral Detection Strategy for Network Service Discovery Across Platforms
  technique:
    id: T1046
    name: Network Service Discovery
    tactics:
    - discovery
    usage_score: 118
  platforms:
  - Windows
  description: >-
    Detects processes performing network enumeration (e.g., port scans, service probing) by correlating process
    creation, socket connections, and sequential destination IP probing within a time window.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  mutable_elements:
  - field: ScanRateThreshold
    description: >-
      Defines the number of unique destination IPs or ports accessed within a time window that may indicate a scan.
  - field: KnownScannerExeList
    description: List of binaries allowed to scan or used by IT (e.g., Nmap, Nessus).
  - field: TimeWindow
    description: Temporal bounds for correlating sequential connections (e.g., 60 seconds).
derived:
  coverage: mapped
  suggested_content_type: hunting
  suggested_tuning:
  - element: ScanRateThreshold
    bind: macro
    name: mitre_an1057_scanratethreshold
  - element: KnownScannerExeList
    bind: macro
    name: mitre_an1057_knownscannerexelist
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: Process connecting to many hosts or ports in one minute
  content_type: anomaly
  severity: medium
  summary: >-
    Sysmon network connections (EventCode 3) where a single process on a host initiates connections to an unusually
    large number of distinct destination addresses or distinct destination ports within one minute, the footprint
    of a port scan or service sweep.
  gaps: >-
    Sysmon records established connections, so SYN scans against closed ports are under-counted; the network view
    (Corelight conn.log with rejected and unanswered states) is the stronger source and can be added through the
    same data component.
  data_components:
  - DC0082
  feeds:
  - sysmon
  tuning:
  - element: ScanRateThreshold
    bind: macro
    name: mitre_an1057_threshold
    default: '30'
    note: Distinct destination hosts, or distinct destination ports, per process per minute.
  - element: KnownScannerExeList
    bind: lookup
    name: mitre_allowlist_processes
    note: Vulnerability scanners, discovery agents and monitoring tools (process_name column).
  - element: TimeWindow
    bind: filter
    name: mitre_an1057_filter
    note: Bucket size is fixed at one minute.
  spl: |-
    `mitre_dc0082_sysmon` EventCode=3 Initiated=true
    | `mitre_normalize_host`
    | eval process_name=replace(Image, "^.*\\\\", "")
    | search `mitre_not_allowlisted_process`
    | bin _time span=1m
    | stats count min(_time) as firstTime max(_time) as lastTime dc(DestinationIp) as distinct_hosts dc(DestinationPort) as distinct_ports by dest user process_name _time
    | where distinct_hosts >= `mitre_an1057_threshold` OR distinct_ports >= `mitre_an1057_threshold`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1057_filter`
  risk:
    message: $process_name$ on $dest$ contacted $distinct_hosts$ hosts and $distinct_ports$ ports in one minute
    objects:
    - field: dest
      type: system
      score: 40
    - field: user
      type: user
      score: 30
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process_name
    period: 3600s
  false_positives:
  - Browsers on busy pages, peer-to-peer and update clients, discovery and monitoring tools.
  baselines: []
  sigma:
    rules:
    - name: an1057_outbound_connection
      logsource:
        product: windows
        category: network_connection
      detection:
        selection:
          Initiated: 'true'
        condition: selection
    correlation:
      type: value_count
      group-by:
      - Computer
      - Image
      timespan: 1m
      condition:
        field: DestinationIp
        gte: 30
kql: null
esql: null
