# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0965
name: Analytic 0965
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0341#AN0965
  attack_release: '20.1'
  detection_strategy:
    id: DET0341
    name: Clipboard Data Access with Anomalous Context
  technique:
    id: T1115
    name: Clipboard Data
    tactics:
    - collection
    usage_score: 51
  platforms:
  - Windows
  description: >-
    Detection of clipboard access via OS utilities (e.g., clip.exe, Get-Clipboard) by non-interactive or abnormal
    parent processes, potentially chained with staging or exfiltration commands.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0035
    dc_name: Process Access
    name: WinEventLog:Sysmon
    channel: EventCode=10
  mutable_elements:
  - field: TimeWindow
    description: Defines how far back to look for parent-child relationships and follow-on network activity.
  - field: UserContext
    description: Filters based on service vs interactive users to reduce noise.
  - field: ParentProcessName
    description: Tunable list of expected/benign clipboard accessors.
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
  - element: ParentProcessName
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Clipboard read from a script or command line
  content_type: anomaly
  severity: low
  summary: >-
    Get-Clipboard, the .NET Windows.Forms Clipboard GetText/GetDataObject calls, or the user32 GetClipboardData
    API referenced from a PowerShell script block (4104) or a process command line. Clipboard stealers and crypto
    wallet swappers read the clipboard on a loop.
  gaps: >-
    Native code calling GetClipboardData without PowerShell is invisible (needs EDR API telemetry); Sysmon 24 (ClipboardChange)
    archives contents and is not enabled in most configs.
  data_components:
  - DC0032
  - DC0029
  feeds:
  - sysmon
  - powershell_logging
  tuning:
  - element: ParentProcessName
    bind: macro
    name: mitre_an0965_patterns
    default: >-
      ("*Get-Clipboard*", "*Clipboard]::GetText*", "*Clipboard]::GetDataObject*", "*Clipboard]::GetImage*", "*GetClipboardData*",
      "*Clipboard]::ContainsText*")
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
    note: Accounts running sanctioned clipboard-automation scripts.
  - element: TimeWindow
    bind: filter
    name: mitre_an0965_filter
  spl: |-
    (`mitre_dc0032_sysmon` EventCode=1 CommandLine IN `mitre_an0965_patterns`)
    OR (`mitre_dc0029_powershell_logging` EventCode=4104 ScriptBlockText IN `mitre_an0965_patterns`)
    | `mitre_normalize_host`
    | eval process_name=lower(replace(coalesce(Image, "powershell.exe"), "^.*\\\\", "")), evidence=substr(coalesce(CommandLine, ScriptBlockText), 1, 300)
    | search `mitre_not_allowlisted_user`
    | stats count min(_time) as firstTime max(_time) as lastTime values(evidence) as evidence values(process_name) as process_name by dest user
    | eval evidence=mvindex(evidence, 0, 4)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0965_filter`
  risk:
    message: Clipboard read by script on $dest$ as $user$
    objects:
    - field: dest
      type: system
      score: 25
    - field: user
      type: user
      score: 20
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 86400s
  false_positives:
  - Helpdesk and productivity scripts that paste into forms; PowerShell modules that wrap the clipboard.
  baselines: []
  sigma:
    rules:
    - name: an0965_clipboard_command
      logsource:
        product: windows
        category: process_creation
      detection:
        selection:
          CommandLine|contains:
          - Get-Clipboard
          - Clipboard]::GetText
          - GetClipboardData
        condition: selection
    - name: an0965_clipboard_script
      logsource:
        product: windows
        category: ps_script
      detection:
        selection:
          ScriptBlockText|contains:
          - Get-Clipboard
          - Clipboard]::GetText
          - Clipboard]::GetDataObject
          - GetClipboardData
        condition: selection
kql: null
esql: null
