# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0797
name: Analytic 0797
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0287#AN0797
  attack_release: '20.1'
  detection_strategy:
    id: DET0287
    name: Exploitation for Client Execution – cross-platform behavior chain (browser/Office/3rd-party apps)
  technique:
    id: T1203
    name: Exploitation for Client Execution
    tactics:
    - execution
    usage_score: 108
  platforms:
  - Windows
  description: >-
    Cause→effect chain: (1) A client app (browser, Office, PDF/Flash/reader) experiences a crash/abnormal exit or
    loads from an unusual location, then (2) drops or modifies a file in user-writable paths, and/or (3) spawns
    an unexpected child (e.g., powershell/cmd/mshta/rundll32/wscript/installer), and (4) establishes outbound C2-like
    connections shortly after. Correlate application logs, file writes, process lineage, and network egress within
    a short window.
  log_source_references:
  - dc: DC0038
    dc_name: Application Log Content
    name: WinEventLog:Application
    channel: EventCode=1000
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  mutable_elements:
  - field: TimeWindow
    description: Correlation window (e.g., 15m) between crash/write/child/network.
  - field: HighRiskChildren
    description: >-
      List of child processes that should rarely spawn from Office/browsers (powershell.exe, cmd.exe, wscript.exe,
      mshta.exe, rundll32.exe, regsvr32.exe, msiexec.exe, curl.exe).
  - field: UserPaths
    description: Writable paths to watch (Downloads, %TEMP%, %APPDATA%, OneDrive, Office startup folders).
  - field: AllowedPlugins
    description: Known add-ins/extensions and updater binaries to reduce noise.
  - field: EgressAllowlist
    description: Known update/CDN domains and proxy egress CIDRs for suppression.
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: HighRiskChildren
    bind: filter
    name: mitre_an0797_filter
  - element: UserPaths
    bind: lookup
    name: mitre_account_roles
  - element: AllowedPlugins
    bind: filter
    name: mitre_an0797_filter
  - element: EgressAllowlist
    bind: macro
    name: mitre_an0797_egressallowlist
curated:
  status: implemented
  title: Client application crashed, then spawned a shell or LOLBin
  content_type: ttp
  severity: high
  summary: >-
    A browser, Office application or document reader launches WerFault (it crashed), and within ten minutes the
    same application on the same host starts a shell, script host or proxy-execution utility. A crash followed by
    unexpected children is the footprint of a client-side exploit that partly failed or recovered.
  gaps: >-
    Application log 1000 crash records are not used (their EventData fields are unnamed in XML collection); the
    file-drop and egress legs are not joined.
  data_components:
  - DC0032
  feeds:
  - sysmon
  tuning:
  - element: HighRiskChildren
    bind: macro
    name: mitre_an0797_children
    default: >-
      Image IN ("*\\cmd.exe", "*\\powershell.exe", "*\\pwsh.exe", "*\\wscript.exe", "*\\cscript.exe", "*\\mshta.exe",
      "*\\rundll32.exe", "*\\regsvr32.exe", "*\\msiexec.exe", "*\\certutil.exe", "*\\bitsadmin.exe")
  - element: AllowedPlugins
    bind: macro
    name: mitre_an0797_client_apps
    default: >-
      ParentImage IN ("*\\chrome.exe", "*\\msedge.exe", "*\\firefox.exe", "*\\iexplore.exe", "*\\winword.exe", "*\\excel.exe",
      "*\\powerpnt.exe", "*\\outlook.exe", "*\\acrord32.exe", "*\\acrobat.exe", "*\\foxitpdfreader.exe", "*\\java.exe",
      "*\\javaw.exe")
  - element: TimeWindow
    bind: macro
    name: mitre_an0797_window_seconds
    default: '600'
  spl: |-
    `mitre_dc0032_sysmon` EventCode=1 `mitre_an0797_client_apps` (Image="*\\WerFault.exe" OR `mitre_an0797_children`)
    | `mitre_normalize_host`
    | eval client_app=lower(replace(ParentImage, "^.*\\\\", "")), crash_time=if(match(Image, "(?i)werfault\.exe$"), _time, null()), child_time=if(NOT match(Image, "(?i)werfault\.exe$"), _time, null()), child=if(isnotnull(child_time), CommandLine, null())
    | stats min(crash_time) as crash_time max(child_time) as child_time values(child) as process values(user) as user by dest client_app
    | where isnotnull(crash_time) AND isnotnull(child_time) AND abs(child_time - crash_time) <= `mitre_an0797_window_seconds`
    | eval parent_process_name=client_app, firstTime=min(crash_time, child_time), lastTime=max(crash_time, child_time)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0797_filter`
  risk:
    message: $parent_process_name$ crashed and spawned a shell on $dest$
    objects:
    - field: dest
      type: system
      score: 70
    - field: user
      type: user
      score: 50
    threat_objects:
    - field: parent_process_name
      type: parent_process_name
  schedule:
    earliest: -75m@m
    latest: -5m@m
  throttle:
    fields:
    - dest
    - parent_process_name
    period: 86400s
  false_positives:
  - An add-in that both crashes and legitimately shells out (rare); unstable plug-ins in browsers.
  baselines: []
  sigma:
    note: >-
      Uses a temporal (unordered) correlation because the Splunk pySigma backend does not implement temporal_ordered.
    rules:
    - name: an0797_client_crash
      logsource:
        product: windows
        category: process_creation
      detection:
        selection:
          Image|endswith: \WerFault.exe
          ParentImage|endswith:
          - \chrome.exe
          - \msedge.exe
          - \firefox.exe
          - \winword.exe
          - \excel.exe
          - \powerpnt.exe
          - \outlook.exe
          - \acrord32.exe
          - \acrobat.exe
        condition: selection
    - name: an0797_client_child
      logsource:
        product: windows
        category: process_creation
      detection:
        selection:
          ParentImage|endswith:
          - \chrome.exe
          - \msedge.exe
          - \firefox.exe
          - \winword.exe
          - \excel.exe
          - \powerpnt.exe
          - \outlook.exe
          - \acrord32.exe
          - \acrobat.exe
          Image|endswith:
          - \cmd.exe
          - \powershell.exe
          - \pwsh.exe
          - \wscript.exe
          - \cscript.exe
          - \mshta.exe
          - \rundll32.exe
          - \regsvr32.exe
        condition: selection
    correlation:
      type: temporal
      group-by:
      - Computer
      - ParentImage
      timespan: 10m
kql: null
esql: null
