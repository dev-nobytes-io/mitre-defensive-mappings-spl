id: AN0354
name: Analytic 0354
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0126#AN0354
  attack_release: '20.1'
  detection_strategy:
    id: DET0126
    name: Detection Strategy for SSH Key Injection in Authorized Keys
  technique:
    id: T1098.004
    name: SSH Authorized Keys
    tactics:
    - persistence
    - privilege-escalation
    usage_score: 13
  platforms:
  - Network Devices
  description: >-
    Use of command-line like `ip ssh pubkey-chain` to bind SSH keys to privileged accounts on routers or switches.
  log_source_references:
  - dc: DC0064
    dc_name: Command Execution
    name: networkdevice:cli
    channel: ip ssh pubkey-chain
  mutable_elements:
  - field: CLIUserRole
    description: Was the role allowed to push persistent config changes?
  - field: DeviceModel
    description: Variations in syntax or log behavior across device OS
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: CLIUserRole
    bind: lookup
    name: mitre_account_roles
  - element: DeviceModel
    bind: filter
    name: mitre_an0354_filter
curated:
  status: implemented
  title: SSH public key added to a firewall administrator
  content_type: ttp
  severity: high
  summary: >-
    A Palo Alto configuration change sets a public key on an administrator account (mgt-config users ... public-key),
    which allows SSH login without the password and survives password resets.
  gaps: Routers and switches (ip ssh pubkey-chain) need the netdev_syslog feed.
  data_components:
  - DC0064
  feeds:
  - palo_alto
  tuning:
  - element: CLIUserRole
    bind: lookup
    name: mitre_allowlist_users
    note: Administrators who manage key-based access.
  - element: DeviceModel
    bind: filter
    name: mitre_an0354_filter
  spl: |-
    `mitre_dc0064_palo_alto` `mitre_st_palo_alto_config` cmd IN ("set", "edit", "add") path="*mgt-config*users*" path="*public-key*"
    | `mitre_normalize_pan`
    | eval dest=coalesce(dvc_name, dest, host), config_path=path
    | search `mitre_not_allowlisted_user`
    | stats count min(_time) as firstTime max(_time) as lastTime values(config_path) as config_path values(client) as client by dest user
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0354_filter`
  risk:
    message: SSH key added to an administrator on firewall $dest$ by $user$
    objects:
    - field: dest
      type: system
      score: 60
    - field: user
      type: user
      score: 60
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 3600s
  false_positives:
  - Planned move to key-based administrator access.
  baselines: []
  sigma:
    logsource:
      product: paloalto
      service: config
    detection:
      selection:
        cmd:
        - set
        - edit
        - add
        path|contains|all:
        - mgt-config
        - public-key
      condition: selection
kql: null
esql: null
