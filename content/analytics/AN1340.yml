# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1340
name: Analytic 1340
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0487#AN1340
  attack_release: '20.1'
  detection_strategy:
    id: DET0487
    name: Distributed Password Spraying via Authentication Failures Across Multiple Accounts
  technique:
    id: T1110.003
    name: Password Spraying
    tactics:
    - credential-access
    usage_score: 34
  platforms:
  - Network Devices
  description: >-
    Authentication failure logs on routers/switches showing repeated use of default or common passwords across multiple
    accounts
  log_source_references:
  - dc: DC0002
    dc_name: User Account Authentication
    name: networkdevice:syslog
    channel: AAA or TACACS authentication failures
  mutable_elements:
  - field: AuthFailureBurst
    description: Cluster of failed attempts in short period indicating spray
  - field: InterfaceFilter
    description: Limit detection to console/SSH vs web UI interfaces
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: AuthFailureBurst
    bind: filter
    name: mitre_an1340_filter
  - element: InterfaceFilter
    bind: filter
    name: mitre_an1340_filter
curated:
  status: implemented
  title: One source failing to authenticate as many accounts on the firewall
  content_type: anomaly
  severity: high
  summary: >-
    Palo Alto auth-fail system events from one source address for several distinct accounts within ten minutes:
    password spraying against the management interface or an authentication profile.
  gaps: >-
    Sources are parsed from the event description on older add-on versions; if neither the add-on nor the description
    provides a source, the event is skipped. Routers and switches need the netdev_syslog feed.
  data_components:
  - DC0002
  feeds:
  - palo_alto
  tuning:
  - element: AuthFailureBurst
    bind: macro
    name: mitre_an1340_threshold
    default: '5'
    note: Distinct accounts failing from one source per 10 minutes.
  - element: InterfaceFilter
    bind: filter
    name: mitre_an1340_filter
  spl: |-
    `mitre_dc0002_palo_alto` `mitre_st_palo_alto_system`
    | `mitre_normalize_pan_system`
    | where pan_subtype=="auth" AND pan_event_id=="auth-fail" AND isnotnull(src)
    | bin _time span=10m
    | stats count as failures dc(user) as distinct_users values(user) as user min(_time) as firstTime max(_time) as lastTime by dvc src _time
    | where distinct_users >= `mitre_an1340_threshold`
    | rename dvc as dest
    | eval user=mvindex(user, 0, 19)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1340_filter`
  risk:
    message: $src$ failed to log in to firewall $dest$ as $distinct_users$ accounts
    objects:
    - field: dest
      type: system
      score: 40
    threat_objects:
    - field: src
      type: ip_address
  schedule: {}
  throttle:
    fields:
    - dest
    - src
    period: 3600s
  false_positives:
  - A shared jump host with several administrators mistyping passwords.
  baselines: []
  sigma:
    rules:
    - name: an1340_auth_fail
      logsource:
        product: paloalto
        service: system
      detection:
        selection:
          log_subtype: auth
          event_id: auth-fail
        condition: selection
    correlation:
      type: value_count
      group-by:
      - src
      timespan: 10m
      condition:
        field: user
        gte: 5
kql: null
esql: null
