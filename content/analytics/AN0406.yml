# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0406
name: Analytic 0406
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0145#AN0406
  attack_release: '20.1'
  detection_strategy:
    id: DET0145
    name: Detection of Disabled or Modified System Firewalls across OS Platforms.
  technique:
    id: T1686
    name: Disable or Modify System Firewall
    tactics:
    - defense-impairment
    usage_score: 45
  platforms:
  - Windows
  description: >-
    Detection of firewall tampering by monitoring processes executing netsh, PowerShell Set-NetFirewallProfile,
    or sc stop mpssvc. Registry modifications under HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy
    also indicate adversarial actions.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0063
    dc_name: Windows Registry Key Modification
    name: WinEventLog:Sysmon
    channel: EventCode=13, 14
  mutable_elements:
  - field: MonitoredCommands
    description: List of admin tools and scripts allowed to legitimately modify firewall settings.
  - field: AlertThreshold
    description: Number of firewall rule changes within a time window before triggering alert.
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: MonitoredCommands
    bind: macro
    name: mitre_an0406_monitoredcommands
  - element: AlertThreshold
    bind: macro
    name: mitre_an0406_alertthreshold
curated:
  status: implemented
  title: Windows Firewall disabled or its service stopped
  content_type: ttp
  severity: high
  summary: >-
    netsh turns a firewall profile off, PowerShell sets a profile to disabled, the firewall service (MpsSvc) is
    stopped or disabled, or a FirewallPolicy EnableFirewall registry value is set to 0.
  gaps: Rule additions that open specific ports (netsh advfirewall firewall add rule) are left to hunting.
  data_components:
  - DC0032
  - DC0063
  feeds:
  - sysmon
  tuning:
  - element: MonitoredCommands
    bind: macro
    name: mitre_an0406_commands
    default: >-
      ((Image="*\\netsh.exe" CommandLine IN ("*state off*", "*opmode disable*", "*opmode mode=disable*")) OR (Image
      IN ("*\\powershell.exe", "*\\pwsh.exe") CommandLine="*Set-NetFirewallProfile*" CommandLine="*-Enabled*False*")
      OR (Image IN ("*\\sc.exe", "*\\net.exe", "*\\net1.exe") CommandLine="*mpssvc*" CommandLine IN ("* stop*",
      "*disabled*")))
  - element: AlertThreshold
    bind: filter
    name: mitre_an0406_filter
  spl: |-
    (`mitre_dc0032_sysmon` EventCode=1 `mitre_an0406_commands`)
      OR (`mitre_dc0063_sysmon` EventCode=13 TargetObject="*\\FirewallPolicy\\*\\EnableFirewall" Details="DWORD (0x00000000)")
    | `mitre_normalize_host`
    | eval signal=if(EventCode==13, "registry_disable", "command_disable"), process_name=replace(Image, "^.*\\\\", "")
    | stats count min(_time) as firstTime max(_time) as lastTime values(signal) as signals values(CommandLine) as process values(TargetObject) as registry_path by dest user process_name
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0406_filter`
  risk:
    message: Windows Firewall disabled on $dest$ by $process_name$
    objects:
    - field: dest
      type: system
      score: 60
    - field: user
      type: user
      score: 50
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    period: 3600s
  false_positives:
  - Troubleshooting by administrators; third-party firewalls that disable the Windows one at install.
  baselines: []
  sigma:
    rules:
    - name: an0406_command
      logsource:
        product: windows
        category: process_creation
      detection:
        netsh:
          Image|endswith: \netsh.exe
          CommandLine|contains:
          - state off
          - opmode disable
          - opmode mode=disable
        powershell:
          CommandLine|contains|all:
          - Set-NetFirewallProfile
          - -Enabled
          - 'False'
        service:
          CommandLine|contains|all:
          - mpssvc
          CommandLine|contains:
          - ' stop'
          - disabled
        condition: 1 of them
    - name: an0406_registry
      logsource:
        product: windows
        category: registry_set
      detection:
        selection:
          TargetObject|contains: \FirewallPolicy\
          TargetObject|endswith: \EnableFirewall
          Details: DWORD (0x00000000)
        condition: selection
kql: null
esql: null
