# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1229
name: Analytic 1229
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0445#AN1229
  attack_release: '20.1'
  detection_strategy:
    id: DET0445
    name: Detection of Proxy Infrastructure Setup and Traffic Bridging
  technique:
    id: T1090
    name: Proxy
    tactics:
    - command-and-control
    usage_score: 108
  platforms:
  - Windows
  description: >-
    Suspicious process spawning (e.g., `rundll32`, `svchost`, `powershell`, or `netsh`) followed by network connection
    creation to internal hosts or uncommon external endpoints on high or non-standard ports.
  log_source_references:
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0078
    dc_name: Network Traffic Flow
    name: NSM:Connections
    channel: Outbound Connection
  mutable_elements:
  - field: ParentProcessName
    description: >-
      Legitimate system processes that may rarely spawn network-capable child processes (e.g., `rundll32`, `svchost`).
  - field: DestinationPort
    description: Watch for high-numbered ports or well-known proxy ports like 1080, 8080, 4444.
  - field: TimeWindow
    description: Capture unusual spikes in outbound connections over a short period.
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: ParentProcessName
    bind: lookup
    name: mitre_allowlist_processes
  - element: DestinationPort
    bind: lookup
    name: mitre_internal_networks
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: Script host or LOLBin accepting inbound network connections
  content_type: anomaly
  severity: high
  summary: >-
    Sysmon network connection events (3) with Initiated=false, meaning the process accepted an inbound connection,
    where the process is a script interpreter, shell or proxy-execution utility. A host that relays traffic for
    an attacker (SOCKS or port-forward implants in PowerShell or rundll32) has to listen; these processes almost
    never do.
  gaps: netsh portproxy forwarding is AN1483; listeners in custom binaries are not covered.
  data_components:
  - DC0082
  feeds:
  - sysmon
  tuning:
  - element: ParentProcessName
    bind: macro
    name: mitre_an1229_listeners
    default: >-
      Image IN ("*\\powershell.exe", "*\\pwsh.exe", "*\\cmd.exe", "*\\rundll32.exe", "*\\regsvr32.exe", "*\\mshta.exe",
      "*\\wscript.exe", "*\\cscript.exe", "*\\msbuild.exe", "*\\installutil.exe", "*\\certutil.exe", "*\\notepad.exe",
      "*\\dllhost.exe")
  - element: DestinationPort
    bind: filter
    name: mitre_an1229_filter
  - element: TimeWindow
    bind: filter
    name: mitre_an1229_filter
  spl: |-
    `mitre_dc0082_sysmon` EventCode=3 Initiated=false `mitre_an1229_listeners`
    | `mitre_normalize_host`
    | eval process_name=replace(Image, "^.*\\\\", ""), src=SourceIp, listen_port=DestinationPort
    | where NOT match(SourceIp, "^(127\.|::1)")
    | stats count min(_time) as firstTime max(_time) as lastTime dc(src) as distinct_clients values(src) as src values(listen_port) as listen_port by dest user process_name
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1229_filter`
  risk:
    message: $process_name$ on $dest$ accepted inbound connections
    objects:
    - field: dest
      type: system
      score: 55
    - field: user
      type: user
      score: 40
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process_name
    period: 14400s
  false_positives:
  - >-
    PowerShell remoting endpoints are wsmprovhost, not powershell, so they do not match; developer test servers
    run from scripts.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: network_connection
    detection:
      selection:
        Initiated: 'false'
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \cmd.exe
        - \rundll32.exe
        - \regsvr32.exe
        - \mshta.exe
        - \wscript.exe
        - \cscript.exe
        - \msbuild.exe
        - \installutil.exe
      loopback:
        SourceIp|startswith:
        - '127.'
        - ::1
      condition: selection and not loopback
kql: null
esql: null
