# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN0478
name: Analytic 0478
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0168#AN0478
  attack_release: '20.1'
  detection_strategy:
    id: DET0168
    name: Virtualization/Sandbox Evasion via System Checks across Windows, Linux, macOS
  technique:
    id: T1497.001
    name: System Checks
    tactics:
    - stealth
    - discovery
    usage_score: 81
  platforms:
  - Windows
  description: >-
    Script or binary performs a rapid sequence of system discovery checks (e.g., CPU count, RAM size, registry keys,
    running processes) indicative of VM detection
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0016
    dc_name: Module Load
    name: WinEventLog:Sysmon
    channel: EventCode=7
  - dc: DC0035
    dc_name: Process Access
    name: WinEventLog:Sysmon
    channel: EventCode=10
  mutable_elements:
  - field: TimeWindow
    description: Sequence of system enumeration events within X seconds
  - field: ProcessAncestry
    description: >-
      Parent-child lineage to identify potentially suspicious launch sources (e.g., Office, browser, WMI, PowerShell)
  - field: UserContext
    description: Limit to non-admin or interactive sessions if desired
derived:
  coverage: mapped
  suggested_content_type: ttp
  suggested_tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: ProcessAncestry
    bind: lookup
    name: mitre_allowlist_processes
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
curated:
  status: implemented
  title: Burst of virtual-machine and sandbox detection checks
  content_type: anomaly
  severity: medium
  summary: >-
    One user on one host runs several distinct VM-detection checks within ten minutes: hardware model and manufacturer
    queries, BIOS and disk serials, video controller, and registry or file lookups for VirtualBox, VMware, QEMU,
    Hyper-V or sandbox artefacts. Malware does this before deciding whether to detonate.
  gaps: >-
    API-based checks (CPUID, timing, RAM size through GlobalMemoryStatusEx) leave no command line; module loads
    and process access legs are not used.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_an0478_threshold
    default: '3'
    note: Distinct check command lines per host and user per 10 minutes.
  - element: ProcessAncestry
    bind: macro
    name: mitre_an0478_checks
    default: >-
      ((Processes.process_name="wmic.exe" Processes.process IN ("*computersystem*model*", "*computersystem*manufacturer*",
      "*bios*serialnumber*", "*diskdrive*", "*baseboard*", "*videocontroller*")) OR (Processes.process_name IN ("powershell.exe",
      "pwsh.exe") Processes.process IN ("*win32_computersystem*", "*win32_bios*", "*win32_diskdrive*", "*win32_videocontroller*",
      "*win32_baseboard*", "*msacpi_thermalzonetemperature*")) OR Processes.process IN ("*vbox*", "*virtualbox*",
      "*vmware*", "*vmtools*", "*qemu*", "*hardware\\acpi\\dsdt*", "*systembiosversion*", "*sandboxie*", "*sbiedll*"))
  - element: UserContext
    bind: lookup
    name: mitre_allowlist_users
    note: Inventory and hardware-management accounts.
  spl: |-
    | tstats `mitre_summariesonly` count from `mitre_dc0032_dm` where `mitre_dc0032_dm_where` `mitre_an0478_checks`
        by Processes.dest Processes.user Processes.parent_process_name Processes.process _time span=10m
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_user`
    | stats sum(count) as count dc(process) as distinct_checks values(process) as process values(parent_process_name) as parent_process_name min(_time) as firstTime max(_time) as lastTime by dest user _time
    | where distinct_checks >= `mitre_an0478_threshold`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an0478_filter`
  risk:
    message: $distinct_checks$ VM and sandbox checks on $dest$ by $user$
    objects:
    - field: dest
      type: system
      score: 40
    - field: user
      type: user
      score: 35
  schedule:
    earliest: -30m@m
    latest: -5m@m
  throttle:
    fields:
    - dest
    - user
    period: 3600s
  false_positives:
  - Hardware inventory scripts and virtualisation-aware installers (VMware Tools, Hyper-V integration).
  baselines: []
  sigma:
    rules:
    - name: an0478_vm_check
      logsource:
        product: windows
        category: process_creation
      detection:
        wmi:
          CommandLine|contains:
          - Win32_ComputerSystem
          - Win32_BIOS
          - Win32_DiskDrive
          - Win32_VideoController
          - MSAcpi_ThermalZoneTemperature
        artefacts:
          CommandLine|contains:
          - VBOX
          - VirtualBox
          - VMware
          - vmtools
          - QEMU
          - HARDWARE\ACPI\DSDT
          - SystemBiosVersion
          - Sandboxie
          - SbieDll
        condition: wmi or artefacts
    correlation:
      type: value_count
      group-by:
      - Computer
      - User
      timespan: 10m
      condition:
        field: CommandLine
        gte: 3
kql: null
esql: null
