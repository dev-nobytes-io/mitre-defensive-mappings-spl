# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1611
name: Analytic 1611
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0586#AN1611
  attack_release: '20.1'
  detection_strategy:
    id: DET0586
    name: Detection of NTDS.dit Credential Dumping from Domain Controllers
  technique:
    id: T1003.003
    name: NTDS
    tactics:
    - credential-access
    usage_score: 50
  platforms:
  - Windows
  description: >-
    Detects credential dumping attempts targeting the NTDS.dit database by monitoring shadow copy creation, suspicious
    file access to %SystemRoot%\NTDS\ntds.dit, and the use of tooling like ntdsutil.exe or volume management APIs.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0061
    dc_name: File Modification
    name: WinEventLog:Sysmon
    channel: EventCode=2
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  - dc: DC0097
    dc_name: Volume Creation
    name: WinEventLog:Microsoft-Windows-VSS
    channel: Volume Shadow Copy Creation
  mutable_elements:
  - field: TargetFilePath
    description: >-
      Tunable for NTDS file location or backup paths if organization uses custom domain controller storage structure.
  - field: ParentProcessName
    description: Can suppress backup-related parent processes to reduce false positives.
  - field: TimeWindow
    description: Temporal correlation between shadow copy creation and NTDS file access (e.g., 5 min window).
  - field: UserContext
    description: Tune based on expected privileged user/service account behavior.
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: TargetFilePath
    bind: lookup
    name: mitre_sensitive_paths
  - element: ParentProcessName
    bind: lookup
    name: mitre_allowlist_processes
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
  - element: UserContext
    bind: lookup
    name: mitre_account_roles
curated:
  status: implemented
  title: NTDS.dit extracted with ntdsutil, shadow copies or esentutl
  content_type: ttp
  severity: critical
  summary: >-
    Commands that copy the Active Directory database: ntdsutil IFM or "create full", copying ntds.dit out of a volume
    shadow copy path, esentutl copying ntds.dit with /vss, or diskshadow/vssadmin creating a shadow copy on a domain
    controller followed by access to NTDS paths in the same command.
  gaps: >-
    Raw volume reads by custom tooling and the VSS operational log are not used; DCSync over the network is a different
    technique (T1003.006).
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: TargetFilePath
    bind: macro
    name: mitre_an1611_patterns
    default: >-
      ((Processes.process_name="ntdsutil.exe" Processes.process IN ("*ifm*", "*create full*", "*snapshot*")) OR
      Processes.process IN ("*harddiskvolumeshadowcopy*ntds*", "*\\ntds\\ntds.dit*", "*ntds.dit*system*") OR (Processes.process_name="esentutl.exe"
      Processes.process="*ntds*") OR (Processes.process_name="vssadmin.exe" Processes.process="*create shadow*")
      OR (Processes.process_name="diskshadow.exe" Processes.process="*/s *"))
  - element: ParentProcessName
    bind: lookup
    name: mitre_allowlist_processes
    note: AD backup software (process_name column).
  - element: UserContext
    bind: filter
    name: mitre_an1611_filter
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where` `mitre_an1611_patterns`
        by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process
    | `drop_dm_object_name(Processes)`
    | search `mitre_not_allowlisted_process`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1611_filter`
  risk:
    message: NTDS.dit extraction with $process_name$ on $dest$ by $user$
    objects:
    - field: dest
      type: system
      score: 90
    - field: user
      type: user
      score: 90
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 3600s
  false_positives:
  - >-
    Domain controller backups and IFM media creation for new DCs; vssadmin shadow creation by backup agents.
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      ntdsutil:
        Image|endswith: \ntdsutil.exe
        CommandLine|contains:
        - ifm
        - create full
      shadow_copy_ntds:
        CommandLine|contains|all:
        - HarddiskVolumeShadowCopy
        - ntds
      esentutl:
        Image|endswith: \esentutl.exe
        CommandLine|contains: ntds
      condition: 1 of them
kql: null
esql: null
