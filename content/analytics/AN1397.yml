# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1397
name: Analytic 1397
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0506#AN1397
  attack_release: '20.1'
  detection_strategy:
    id: DET0506
    name: Detecting Mshta-based Proxy Execution via Suspicious HTA or Script Invocation
  technique:
    id: T1218.005
    name: Mshta
    tactics:
    - stealth
    usage_score: 49
  platforms:
  - Windows
  description: >-
    Detection of mshta.exe execution where command-line arguments reference remote or local HTA/script content (VBScript/JScript)
    followed by subsequent file creation, network retrieval, or process spawning that indicates payload execution
    outside standard Internet Explorer security context. Correlation includes parent process lineage, command-line
    inspection, and network connection creation to untrusted or anomalous endpoints.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Security
    channel: EventCode=4688
  - dc: DC0082
    dc_name: Network Connection Creation
    name: WinEventLog:Sysmon
    channel: EventCode=3, 22
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  mutable_elements:
  - field: CommandLinePattern
    description: >-
      Regex patterns for mshta.exe arguments referencing remote HTA/script content; may need tuning to exclude known-good
      internal scripts.
  - field: SuspiciousParentProcesses
    description: >-
      List of parent processes considered suspicious when spawning mshta.exe (e.g., Office applications, script
      interpreters).
  - field: AllowedHTASources
    description: Whitelist of domains/paths from which legitimate HTAs are executed.
  - field: TimeWindow
    description: >-
      Time threshold for correlating mshta.exe execution with subsequent network connections or file creations.
derived:
  coverage: live
  suggested_content_type: anomaly
  suggested_tuning:
  - element: CommandLinePattern
    bind: macro
    name: mitre_an1397_commandlinepattern
  - element: SuspiciousParentProcesses
    bind: lookup
    name: mitre_allowlist_processes
  - element: AllowedHTASources
    bind: lookup
    name: mitre_internal_networks
  - element: TimeWindow
    bind: macro
    name: mitre_time_window(1)
curated:
  status: implemented
  title: Mshta running inline script or remote HTA, connecting out, or spawning a shell
  content_type: ttp
  severity: high
  summary: >-
    mshta with javascript:, vbscript: or an http(s) URL on the command line, or an HTA from Downloads, Temp, Public
    or ProgramData; mshta opening an outbound connection to an external address; or mshta starting a shell, script
    host or download utility. Enterprises rarely run HTAs at all, and none of these shapes are normal administration.
  gaps: >-
    The file-creation leg (payload written by mshta) is not joined. HTAs embedded in other containers (LNK, ISO)
    are caught only when mshta runs.
  data_components:
  - DC0032
  - DC0082
  feeds:
  - sysmon
  tuning:
  - element: CommandLinePattern
    bind: macro
    name: mitre_an1397_suspicious_args
    default: >-
      CommandLine IN ("*javascript:*", "*vbscript:*", "*http://*", "*https://*", "*\\AppData\\Local\\Temp\\*", "*\\Downloads\\*",
      "*\\Users\\Public\\*", "*\\ProgramData\\*", "*\\INetCache\\*")
  - element: SuspiciousParentProcesses
    bind: macro
    name: mitre_an1397_children
    default: >-
      Image IN ("*\\cmd.exe", "*\\powershell.exe", "*\\pwsh.exe", "*\\wscript.exe", "*\\cscript.exe", "*\\rundll32.exe",
      "*\\regsvr32.exe", "*\\certutil.exe", "*\\bitsadmin.exe", "*\\curl.exe", "*\\msiexec.exe")
  - element: AllowedHTASources
    bind: lookup
    name: mitre_allowlist_processes
    note: Line-of-business HTAs (process_name mshta.exe with the parent that launches them).
  - element: TimeWindow
    bind: filter
    name: mitre_an1397_filter
  spl: |-
    (`mitre_dc0032_sysmon` EventCode=1 (((Image="*\\mshta.exe" OR OriginalFileName="MSHTA.EXE") `mitre_an1397_suspicious_args`) OR (ParentImage="*\\mshta.exe" `mitre_an1397_children`)))
    OR (`mitre_dc0082_sysmon` EventCode=3 Initiated="true" Image="*\\mshta.exe")
    | `mitre_normalize_host`
    | where EventCode==1 OR NOT `mitre_is_internal(DestinationIp)`
    | eval process_name="mshta.exe", signal=case(EventCode==3, "connection to ".DestinationIp.":".DestinationPort, match(ParentImage, "(?i)mshta\.exe$"), "child: ".CommandLine, true(), "args: ".CommandLine)
    | search `mitre_not_allowlisted_process`
    | stats count min(_time) as firstTime max(_time) as lastTime values(signal) as signal values(user) as user by dest
    | eval signal=mvindex(signal, 0, 9)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1397_filter`
  risk:
    message: Mshta proxy execution on $dest$ ($signal$)
    objects:
    - field: dest
      type: system
      score: 60
    - field: user
      type: user
      score: 45
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    period: 86400s
  false_positives:
  - Legacy line-of-business HTA applications served from an intranet URL.
  baselines: []
  sigma:
    rules:
    - name: an1397_mshta_args
      logsource:
        product: windows
        category: process_creation
      detection:
        image:
        - Image|endswith: \mshta.exe
        - OriginalFileName: MSHTA.EXE
        args:
          CommandLine|contains:
          - 'javascript:'
          - 'vbscript:'
          - http://
          - https://
          - \AppData\Local\Temp\
          - \Downloads\
          - \Users\Public\
        condition: image and args
    - name: an1397_mshta_child
      logsource:
        product: windows
        category: process_creation
      detection:
        selection:
          ParentImage|endswith: \mshta.exe
          Image|endswith:
          - \cmd.exe
          - \powershell.exe
          - \pwsh.exe
          - \wscript.exe
          - \cscript.exe
          - \rundll32.exe
          - \certutil.exe
        condition: selection
    - name: an1397_mshta_network
      logsource:
        product: windows
        category: network_connection
      detection:
        selection:
          Image|endswith: \mshta.exe
          Initiated: 'true'
        condition: selection
kql: null
esql: null
