# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1525
name: Analytic 1525
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0551#AN1525
  attack_release: '20.1'
  detection_strategy:
    id: DET0551
    name: Password Guessing via Multi-Source Authentication Failure Correlation
  technique:
    id: T1110.001
    name: Password Guessing
    tactics:
    - credential-access
    usage_score: 17
  platforms:
  - Network Devices
  description: Login attempt failures over SNMP, Telnet, or SSH interface, often reflected in logs or syslog events
  log_source_references:
  - dc: DC0002
    dc_name: User Account Authentication
    name: networkdevice:syslog
    channel: login failed
  mutable_elements:
  - field: InterfaceType
    description: Specify monitoring of Telnet/SSH/SNMP for login activity
  - field: FailedAttemptThreshold
    description: How many failures in short succession should trigger alerting
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: InterfaceType
    bind: filter
    name: mitre_an1525_filter
  - element: FailedAttemptThreshold
    bind: macro
    name: mitre_an1525_failedattemptthreshold
curated:
  status: implemented
  title: Repeated authentication failures for one account on the firewall
  content_type: anomaly
  severity: medium
  summary: >-
    Palo Alto system logs (subtype auth, event auth-fail) show many failed logins for the same account on the same
    firewall within ten minutes: password guessing against the management interface or an authentication profile.
  gaps: >-
    Only the firewall is covered; routers and switches need the netdev_syslog feed. The interface (web, SSH, API)
    is not separated because the description text varies by PAN-OS version.
  data_components:
  - DC0002
  feeds:
  - palo_alto
  tuning:
  - element: FailedAttemptThreshold
    bind: macro
    name: mitre_an1525_threshold
    default: '10'
    note: Failures per account per firewall per 10 minutes.
  - element: InterfaceType
    bind: filter
    name: mitre_an1525_filter
  spl: |-
    `mitre_dc0002_palo_alto` `mitre_st_palo_alto_system`
    | `mitre_normalize_pan_system`
    | where pan_subtype=="auth" AND pan_event_id=="auth-fail"
    | bin _time span=10m
    | stats count as failures min(_time) as firstTime max(_time) as lastTime dc(src) as distinct_sources values(src) as src by dvc user _time
    | where failures >= `mitre_an1525_threshold`
    | rename dvc as dest
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1525_filter`
  risk:
    message: $failures$ failed logins for $user$ on firewall $dest$ in ten minutes
    objects:
    - field: user
      type: user
      score: 30
    - field: dest
      type: system
      score: 20
    threat_objects:
    - field: src
      type: ip_address
  schedule: {}
  throttle:
    fields:
    - dest
    - user
    period: 3600s
  false_positives:
  - Expired credentials on a monitoring or backup system that logs in to the firewall.
  baselines: []
  sigma:
    logsource:
      product: paloalto
      service: system
    detection:
      selection:
        log_subtype: auth
        event_id: auth-fail
      condition: selection
kql: null
esql: null
