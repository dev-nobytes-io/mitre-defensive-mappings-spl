# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1108
name: Analytic 1108
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0394#AN1108
  attack_release: '20.1'
  detection_strategy:
    id: DET0394
    name: Web Shell Detection via Server Behavior and File Execution Chains
  technique:
    id: T1505.003
    name: Web Shell
    tactics:
    - persistence
    usage_score: 112
  platforms:
  - Windows
  description: >-
    Unexpected file creation in web directories followed by web server processes (e.g., w3wp.exe) spawning command
    shells or script interpreters (e.g., cmd.exe, powershell.exe)
  log_source_references:
  - dc: DC0039
    dc_name: File Creation
    name: WinEventLog:Sysmon
    channel: EventCode=11
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0067
    dc_name: Logon Session Creation
    name: WinEventLog:Security
    channel: EventCode=4624, 4648
  - dc: DC0085
    dc_name: Network Traffic Content
    name: NSM:Flow
    channel: Inbound HTTP POST with suspicious payload size or user-agent
  mutable_elements:
  - field: WebRootPath
    description: Custom web server directory depending on IIS or third-party hosting environment
  - field: ParentProcess
    description: Different server binaries (e.g., php-cgi.exe, apache.exe) that may launch scripts
derived:
  coverage: live
  suggested_content_type: ttp
  suggested_tuning:
  - element: WebRootPath
    bind: lookup
    name: mitre_sensitive_paths
  - element: ParentProcess
    bind: lookup
    name: mitre_allowlist_processes
curated:
  status: implemented
  title: Web server process spawned a shell or script interpreter
  content_type: ttp
  severity: high
  summary: >-
    A web server worker (IIS w3wp, Apache, nginx, PHP, Tomcat, Exchange UM worker) starts cmd, PowerShell, a script
    host or a discovery/LOLBin utility. Legitimate web applications rarely do this; web shells and exploited upload
    handlers always do.
  gaps: >-
    File creation in the web root, the associated logon, and the inbound HTTP POST seen by Corelight are not correlated
    here.
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  tuning:
  - element: ParentProcess
    bind: macro
    name: mitre_an1108_web_servers
    default: >-
      Processes.parent_process_name IN ("w3wp.exe", "httpd.exe", "nginx.exe", "php-cgi.exe", "php.exe", "tomcat*.exe",
      "umworkerprocess.exe", "caddy.exe")
  - element: WebRootPath
    bind: filter
    name: mitre_an1108_filter
    note: >-
      Not used by this implementation; scope by dest in the filter macro if only some servers host web applications.
  spl: |-
    | tstats `mitre_summariesonly` count min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where` `mitre_an1108_web_servers`
        Processes.process_name IN ("cmd.exe", "powershell.exe", "pwsh.exe", "wscript.exe", "cscript.exe", "mshta.exe", "rundll32.exe", "regsvr32.exe", "certutil.exe", "bitsadmin.exe", "whoami.exe", "net.exe", "net1.exe", "ipconfig.exe", "systeminfo.exe", "tasklist.exe", "nltest.exe", "wmic.exe", "curl.exe", "sh.exe", "bash.exe")
        by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process
    | `drop_dm_object_name(Processes)`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1108_filter`
  risk:
    message: Web server process $parent_process_name$ spawned $process_name$ on $dest$
    objects:
    - field: dest
      type: system
      score: 80
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process_name
    period: 3600s
  false_positives:
  - Applications that shell out by design (CGI wrappers, some CMS plugins, deployment hooks).
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_creation
    detection:
      parent:
        ParentImage|endswith:
        - \w3wp.exe
        - \httpd.exe
        - \nginx.exe
        - \php-cgi.exe
        - \php.exe
        - \UMWorkerProcess.exe
      child:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        - \cscript.exe
        - \mshta.exe
        - \rundll32.exe
        - \regsvr32.exe
        - \certutil.exe
        - \bitsadmin.exe
        - \whoami.exe
        - \net.exe
        - \net1.exe
        - \ipconfig.exe
        - \systeminfo.exe
        - \tasklist.exe
        - \nltest.exe
        - \wmic.exe
      condition: parent and child
kql: null
esql: null
