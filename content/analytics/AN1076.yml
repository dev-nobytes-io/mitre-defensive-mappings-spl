# `attack` and `derived` are regenerated by `mitremap scaffold` from ATT&CK + config.
# Edit ONLY `curated`, `kql` and `esql`.
id: AN1076
name: Analytic 1076
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0382#AN1076
  attack_release: '20.1'
  detection_strategy:
    id: DET0382
    name: Detection Strategy for Process Hollowing on Windows
  technique:
    id: T1055.012
    name: Process Hollowing
    tactics:
    - stealth
    - privilege-escalation
    usage_score: 52
  platforms:
  - Windows
  description: >-
    Detects adversary use of suspended process creation, using the CREATE_SUSPENDED flag via CreateProcess, followed
    by unmapping the memory of the child process (NtUnmapViewOfSection) and replacing it with malicious code via
    VirtualAllocEx/WriteProcessMemory, then SetThreadContext and ResumeThread to begin execution within the hollowed
    process.
  log_source_references:
  - dc: DC0032
    dc_name: Process Creation
    name: WinEventLog:Sysmon
    channel: EventCode=1
  - dc: DC0035
    dc_name: Process Access
    name: WinEventLog:Sysmon
    channel: EventCode=10
  - dc: DC0020
    dc_name: Process Modification
    name: WinEventLog:Sysmon
    channel: EventCode=8
  - dc: DC0021
    dc_name: OS API Execution
    name: etw:Microsoft-Windows-Kernel-Process
    channel: NtUnmapViewOfSection, VirtualAllocEx, WriteProcessMemory, SetThreadContext, ResumeThread
  mutable_elements:
  - field: HollowedImageNamePattern
    description: Regex to match common decoy executables used for hollowing (e.g., 'svchost.exe', 'notepad.exe')
  - field: TimeWindow_ProcessCreateToResume
    description: Temporal threshold for unmap/write/execute sequence (e.g., within 5–10 seconds)
  - field: SuspendedProcessStartFlag
    description: CreateProcess flag used to identify suspended thread creation
  - field: MemoryWriteSizeThreshold
    description: Minimum byte size to flag suspicious memory overwrite in hollowed process
derived:
  coverage: mapped
  suggested_content_type: anomaly
  suggested_tuning:
  - element: HollowedImageNamePattern
    bind: lookup
    name: mitre_allowlist_processes
  - element: TimeWindow_ProcessCreateToResume
    bind: macro
    name: mitre_time_window(1)
  - element: SuspendedProcessStartFlag
    bind: lookup
    name: mitre_allowlist_processes
  - element: MemoryWriteSizeThreshold
    bind: macro
    name: mitre_an1076_memorywritesizethreshold
curated:
  status: implemented
  title: Process image replaced in memory (Sysmon process tampering)
  content_type: anomaly
  severity: high
  summary: >-
    Sysmon 25 (ProcessTampering) reports that a process's mapped image no longer matches the file on disk ("Image
    is replaced") or was locked in a way used by herpaderping and ghosting. That is the observable end state of
    process hollowing: the CREATE_SUSPENDED, unmap, write and resume sequence ATT&CK describes.
  gaps: >-
    Needs Sysmon 13 or later with ProcessTampering enabled. Some packers, JIT-heavy applications and security products
    trigger it legitimately; the API-level ETW sequence (NtUnmapViewOfSection, SetThreadContext) is not collected.
  data_components:
  - DC0020
  feeds:
  - sysmon
  tuning:
  - element: HollowedImageNamePattern
    bind: macro
    name: mitre_an1076_benign_images
    default: >-
      Image IN ("*\\Program Files\\Microsoft Visual Studio\\*", "*\\Program Files (x86)\\Microsoft Visual Studio\\*",
      "*\\AppData\\Local\\Programs\\Microsoft VS Code\\*", "*\\Program Files\\WindowsApps\\*", "*\\MsMpEng.exe",
      "*\\MpCmdRun.exe")
  - element: SuspendedProcessStartFlag
    bind: lookup
    name: mitre_allowlist_processes
    note: Applications confirmed to trigger ProcessTampering benignly.
  - element: TimeWindow_ProcessCreateToResume
    bind: filter
    name: mitre_an1076_filter
  spl: |-
    `mitre_dc0020_sysmon` EventCode=25 Type IN ("Image is replaced", "Image is locked for access") NOT `mitre_an1076_benign_images`
    | `mitre_normalize_host`
    | eval process_name=lower(replace(Image, "^.*\\\\", ""))
    | search `mitre_not_allowlisted_process`
    | stats count min(_time) as firstTime max(_time) as lastTime values(Type) as tamper_type values(Image) as process by dest user process_name
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_an1076_filter`
  risk:
    message: Process image of $process_name$ tampered on $dest$ ($tamper_type$)
    objects:
    - field: dest
      type: system
      score: 60
    - field: user
      type: user
      score: 40
    threat_objects:
    - field: process_name
      type: process_name
  schedule: {}
  throttle:
    fields:
    - dest
    - process_name
    period: 86400s
  false_positives:
  - >-
    Developer tools, game launchers, browsers with JIT sandboxes and some security products (allow-list after review).
  baselines: []
  sigma:
    logsource:
      product: windows
      category: process_tampering
    detection:
      selection:
        Type:
        - Image is replaced
        - Image is locked for access
      condition: selection
kql: null
esql: null
