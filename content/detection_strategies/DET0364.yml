# `attack` is regenerated by `mitremap scaffold`. Edit ONLY `curated`.
id: DET0364
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0364
  name: Behavioral Detection Strategy for WMI Execution Abuse on Windows
  attack_release: '20.1'
  technique:
    id: T1047
    name: Windows Management Instrumentation
    tactics:
    - execution
    usage_score: 204
  analytics:
  - id: AN1031
    platforms:
    - Windows
    implemented: true
    content_type: anomaly
curated:
  status: implemented
  title: Remote WMI process creation followed by execution on the target
  shape: sequence
  severity: high
  summary: >-
    A host runs wmic /node:<target> process call create or Invoke-WmiMethod / Invoke-CimMethod with -ComputerName
    <target>, and within two minutes WmiPrvSE starts a process on that target. Joined across hosts on the target's
    short host name, so both ends of the remote execution are in one finding.
  gaps: >-
    Targets given as IP addresses do not join to host names (add them to the asset map and extend the join if needed);
    only the first target of a comma-separated /node list is used; DCOM and WinRM connections are not used.
  extends:
  - AN1031
  data_components:
  - DC0032
  feeds:
  - sysmon
  join_key: target host name
  window: 2 minutes
  tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_det0364_window_seconds
    default: '120'
  - element: SuspiciousCommandPatterns
    bind: macro
    name: mitre_det0364_remote_wmi
    default: >-
      ((Image="*\\wmic.exe" CommandLine="*/node:*" CommandLine="*process*call*create*") OR (Image IN ("*\\powershell.exe",
      "*\\pwsh.exe") CommandLine IN ("*Invoke-WmiMethod*", "*Invoke-CimMethod*") CommandLine="*-ComputerName*"))
  spl: |
    (`mitre_dc0032_sysmon` EventCode=1 `mitre_det0364_remote_wmi`)
      OR (`mitre_dc0032_sysmon` EventCode=1 ParentImage="*\\WmiPrvSE.exe")
    | `mitre_normalize_host`
    | rex field=CommandLine "(?i)/node:\"?(?<wmi_target>[^\s\",]+)"
    | rex field=CommandLine "(?i)-ComputerName\s+\"?(?<ps_target>[^\s\",]+)"
    | eval remote_target=coalesce(wmi_target, ps_target), is_source=if(isnotnull(remote_target) AND NOT match(ParentImage, "(?i)wmiprvse\.exe$"), 1, 0)
    | eval target_host=lower(mvindex(split(if(is_source==1, remote_target, dest), "."), 0))
    | eval src_time=if(is_source==1, _time, null()), exec_time=if(is_source==0, _time, null()), src=if(is_source==1, dest, null()), src_user=if(is_source==1, user, null()), target_process=if(is_source==0, CommandLine, null())
    | stats min(src_time) as src_time min(exec_time) as exec_time values(src) as src values(src_user) as user values(target_process) as process by target_host
    | where isnotnull(src_time) AND isnotnull(exec_time) AND exec_time >= src_time AND exec_time - src_time <= `mitre_det0364_window_seconds`
    | rename target_host as dest
    | eval firstTime=src_time, lastTime=exec_time
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_det0364_filter`
  risk:
    message: Remote WMI execution on $dest$ from $src$
    objects:
    - field: dest
      type: system
      score: 70
    - field: user
      type: user
      score: 60
    threat_objects:
    - field: src
      type: hostname
  throttle:
    fields:
    - dest
    - src
    period: 3600s
  false_positives:
  - Administrators and management tools that use WMI to run commands on other hosts.
  sigma:
    not_expressible: >-
      The join is on a host name extracted from the source command line and compared with the target's Computer
      field across two hosts; Sigma correlations can only group on a field both events carry.
