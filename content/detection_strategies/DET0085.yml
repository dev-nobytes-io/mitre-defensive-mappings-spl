# `attack` is regenerated by `mitremap scaffold`. Edit ONLY `curated`.
id: DET0085
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0085
  name: Credential Dumping from SAM via Registry Dump and Local File Access
  attack_release: '20.1'
  technique:
    id: T1003.002
    name: Security Account Manager
    tactics:
    - credential-access
    usage_score: 59
  analytics:
  - id: AN0235
    platforms:
    - Windows
    implemented: true
    content_type: ttp
curated:
  status: implemented
  title: SYSTEM hive saved together with SAM or SECURITY
  shape: sequence
  severity: critical
  summary: >-
    The same user on the same host saves or exports the SYSTEM hive and the SAM or SECURITY hive within three minutes.
    SAM hashes are encrypted with the boot key stored in SYSTEM, so both together are what offline hash extraction
    needs; either alone (AN0235) is a weaker signal.
  gaps: >-
    Hive reads through shadow-copy paths and raw volume access are not paired here; AN0235 still raises them individually.
  extends:
  - AN0235
  data_components:
  - DC0032
  feeds:
  - sysmon
  - wineventlog
  join_key: host and user
  window: 3 minutes
  tuning:
  - element: TimeWindow
    bind: macro
    name: mitre_det0085_window_seconds
    default: '180'
  - element: RegistryPath
    bind: macro
    name: mitre_an0235_hives
    note: Shared with AN0235.
  spl: |
    | tstats `mitre_summariesonly` min(_time) as firstTime max(_time) as lastTime
        from `mitre_dc0032_dm` where `mitre_dc0032_dm_where` Processes.process IN ("* save *", "* export *") `mitre_an0235_hives`
        by Processes.dest Processes.user Processes.process
    | `drop_dm_object_name(Processes)`
    | eval hive=case(match(lower(process), "\\\\sam\\s"), "SAM", match(lower(process), "\\\\security\\s"), "SECURITY", match(lower(process), "\\\\system\\s"), "SYSTEM")
    | stats min(firstTime) as firstTime max(lastTime) as lastTime dc(hive) as hive_count values(hive) as hives values(process) as process by dest user
    | where hive_count >= 2 AND isnotnull(mvfind(hives, "^SYSTEM$")) AND lastTime - firstTime <= `mitre_det0085_window_seconds`
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_det0085_filter`
  risk:
    message: $user$ saved the SYSTEM and SAM or SECURITY hives on $dest$
    objects:
    - field: dest
      type: system
      score: 90
    - field: user
      type: user
      score: 90
  throttle:
    fields:
    - dest
    - user
    period: 86400s
  false_positives:
  - System-state backups that export every hive.
  sigma:
    rules:
    - name: det0085_system_hive
      logsource:
        product: windows
        category: process_creation
      detection:
        selection:
          CommandLine|contains:
          - ' save '
          - ' export '
        hive:
          CommandLine|contains:
          - 'hklm\system '
          - 'hkey_local_machine\system '
        condition: selection and hive
    - name: det0085_sam_hive
      logsource:
        product: windows
        category: process_creation
      detection:
        selection:
          CommandLine|contains:
          - ' save '
          - ' export '
        hive:
          CommandLine|contains:
          - 'hklm\sam '
          - 'hkey_local_machine\sam '
          - 'hklm\security '
          - 'hkey_local_machine\security '
        condition: selection and hive
    correlation:
      type: temporal
      group-by:
      - Computer
      - User
      timespan: 3m
