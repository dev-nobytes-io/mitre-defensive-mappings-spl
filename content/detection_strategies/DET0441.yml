# `attack` is regenerated by `mitremap scaffold`. Edit ONLY `curated`.
id: DET0441
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0441
  name: Detection of Suspicious Scheduled Task Creation and Execution on Windows
  attack_release: '20.1'
  technique:
    id: T1053.005
    name: Scheduled Task
    tactics:
    - execution
    - persistence
    - privilege-escalation
    usage_score: 260
  analytics:
  - id: AN1221
    platforms:
    - Windows
    implemented: true
    content_type: anomaly
curated:
  status: implemented
  title: Suspicious scheduled task created and then run by Task Scheduler
  shape: sequence
  severity: high
  summary: >-
    A scheduled task whose action runs an interpreter or a user-writable binary is registered (Security 4698), and
    within ten minutes Task Scheduler starts a process from the task's command (Sysmon 1 with the Schedule service
    or taskeng as parent). Joined on host and the executable path in the task XML.
  gaps: >-
    Commands written with environment variables (%windir%, %appdata%) are not expanded, so they do not join; tasks
    set to run at the next logon or boot fall outside the window.
  extends:
  - AN1221
  data_components:
  - DC0001
  - DC0032
  feeds:
  - wineventlog
  - sysmon
  join_key: host and task command path
  window: 10 minutes
  tuning:
  - element: TaskNamePattern
    bind: macro
    name: mitre_an1221_suspicious_actions
    note: Shared with AN1221.
  - element: TimeWindow
    bind: macro
    name: mitre_det0441_window_seconds
    default: '600'
  spl: |
    (`mitre_dc0001_wineventlog` EventCode=4698 `mitre_an1221_suspicious_actions`)
      OR (`mitre_dc0032_sysmon` EventCode=1 (ParentImage="*\\taskeng.exe" OR (ParentImage="*\\svchost.exe" ParentCommandLine="*Schedule*")))
    | `mitre_normalize_host`
    | rex field=TaskContent "(?i)(?:<|&lt;)Command(?:>|&gt;)\s*\"?(?<task_command>[^\"<&]+?)\"?\s*(?:<|&lt;)/Command"
    | eval file_path=lower(trim(if(EventCode==4698, task_command, Image))), created_time=if(EventCode==4698, _time, null()), run_time=if(EventCode==1, _time, null())
    | where isnotnull(file_path)
    | stats min(created_time) as created_time min(run_time) as run_time values(TaskName) as task_name values(eval(if(EventCode==1, CommandLine, null()))) as process values(eval(if(EventCode==4698, SubjectUserName, null()))) as user by dest file_path
    | where isnotnull(created_time) AND isnotnull(run_time) AND run_time >= created_time AND run_time - created_time <= `mitre_det0441_window_seconds`
    | eval firstTime=created_time, lastTime=run_time
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_det0441_filter`
  risk:
    message: Scheduled task $task_name$ on $dest$ was created and ran $file_path$
    objects:
    - field: dest
      type: system
      score: 60
    - field: user
      type: user
      score: 50
    threat_objects:
    - field: file_path
      type: file_path
  throttle:
    fields:
    - dest
    - task_name
    period: 86400s
  false_positives:
  - Software deployment that registers and immediately runs a PowerShell-based task.
  sigma:
    note: >-
      The task command sits inside the task XML, which Sigma cannot alias to the image path; the rule pairs creation
      and a Task Scheduler launch on the host only. The correlation is temporal (unordered) because the Splunk pySigma
      backend does not implement temporal_ordered; the Splunk search enforces the order.
    rules:
    - name: det0441_task_created
      logsource:
        product: windows
        service: security
      detection:
        selection:
          EventID: 4698
          TaskContent|contains:
          - \AppData\
          - \Users\Public\
          - \Windows\Temp\
          - \ProgramData\
          - powershell
          - cmd.exe
          - wscript
          - cscript
          - mshta
          - rundll32
          - regsvr32
        condition: selection
    - name: det0441_task_launch
      logsource:
        product: windows
        category: process_creation
      detection:
        taskeng:
          ParentImage|endswith: \taskeng.exe
        schedule:
          ParentImage|endswith: \svchost.exe
          ParentCommandLine|contains: Schedule
        condition: taskeng or schedule
    correlation:
      type: temporal
      group-by:
      - Computer
      timespan: 10m
