# `attack` is regenerated by `mitremap scaffold`. Edit ONLY `curated`.
id: DET0363
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0363
  name: Detection of Credential Dumping from LSASS Memory via Access and Dump Sequence
  attack_release: '20.1'
  technique:
    id: T1003.001
    name: LSASS Memory
    tactics:
    - credential-access
    usage_score: 132
  analytics:
  - id: AN1030
    platforms:
    - Windows
    implemented: true
    content_type: ttp
curated:
  status: implemented
  title: LSASS memory read followed by a file write from the same process
  shape: sequence
  severity: critical
  summary: >-
    The process that opened lsass.exe with a memory-read access mask (Sysmon 10) then writes a dump-like file (Sysmon
    11) within five minutes. The two events are joined on the process GUID, so this is the access-then-dump chain
    ATT&CK describes rather than two coincidences on one host.
  gaps: >-
    The 4673 privileged-service call and registry legs are not used. Dumps written by a second process (for example
    a helper spawned for the write) break the GUID join.
  extends:
  - AN1030
  data_components:
  - DC0035
  - DC0039
  feeds:
  - sysmon
  join_key: process GUID
  window: 5 minutes
  tuning:
  - element: DumpFilePath
    bind: macro
    name: mitre_det0363_dump_files
    default: >-
      TargetFilename IN ("*.dmp", "*.dump", "*.mdmp", "*lsass*", "*\\Temp\\*", "*\\Users\\Public\\*", "*\\ProgramData\\*",
      "*\\PerfLogs\\*")
    note: >-
      The GUID join already ties the write to the LSASS reader, so this can be widened to TargetFilename=* if your
      Sysmon config logs those writes.
  - element: TimeWindow
    bind: macro
    name: mitre_det0363_window_seconds
    default: '300'
  - element: AccessMask
    bind: macro
    name: mitre_an1030_access_mask
    note: Shared with AN1030.
  spl: |
    (`mitre_dc0035_sysmon` EventCode=10 TargetImage="*\\lsass.exe" `mitre_an1030_access_mask`)
      OR (`mitre_dc0039_sysmon` EventCode=11 `mitre_det0363_dump_files`)
    | `mitre_normalize_host`
    | eval process_guid=coalesce(SourceProcessGUID, ProcessGuid), user=coalesce(SourceUser, User, user)
    | eval access_time=if(EventCode==10, _time, null()), write_time=if(EventCode==11, _time, null()), process_path=coalesce(SourceImage, Image)
    | stats min(access_time) as access_time min(write_time) as write_time values(process_path) as process_path values(TargetFilename) as file_path values(GrantedAccess) as granted_access values(user) as user by dest process_guid
    | where isnotnull(access_time) AND isnotnull(write_time) AND write_time >= access_time AND write_time - access_time <= `mitre_det0363_window_seconds`
    | eval process_name=replace(mvindex(process_path, 0), "^.*\\\\", ""), firstTime=access_time, lastTime=write_time
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_det0363_filter`
  risk:
    message: $process_name$ read LSASS memory and wrote a file on $dest$
    objects:
    - field: dest
      type: system
      score: 90
    - field: user
      type: user
      score: 90
    threat_objects:
    - field: process_name
      type: process_name
  throttle:
    fields:
    - dest
    - process_guid
    period: 86400s
  false_positives:
  - Crash-dump tooling (WerFault, procdump run by administrators for support cases).
  sigma:
    note: >-
      Uses a temporal (unordered) correlation because the Splunk pySigma backend does not implement temporal_ordered;
      the Splunk search enforces the order.
    rules:
    - name: det0363_lsass_access
      logsource:
        product: windows
        category: process_access
      detection:
        selection:
          TargetImage|endswith: \lsass.exe
          GrantedAccess:
          - '0x1010'
          - '0x1410'
          - '0x1438'
          - '0x143a'
          - '0x1418'
          - '0x1f0fff'
          - '0x1f1fff'
          - '0x1f2fff'
          - '0x1f3fff'
          - '0x1fffff'
        condition: selection
    - name: det0363_dump_write
      logsource:
        product: windows
        category: file_event
      detection:
        selection:
          TargetFilename|endswith:
          - .dmp
          - .dump
          - .mdmp
        condition: selection
    correlation:
      type: temporal
      aliases:
        process_guid:
          det0363_lsass_access: SourceProcessGUID
          det0363_dump_write: ProcessGuid
      group-by:
      - Computer
      - process_guid
      timespan: 5m
