# `attack` is regenerated by `mitremap scaffold`. Edit ONLY `curated`.
id: DET0365
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0365
  name: Detect Registry and Startup Folder Persistence (Windows)
  attack_release: '20.1'
  technique:
    id: T1547.001
    name: Registry Run Keys / Startup Folder
    tactics:
    - persistence
    - privilege-escalation
    usage_score: 329
  analytics:
  - id: AN1032
    platforms:
    - Windows
    implemented: true
    content_type: anomaly
curated:
  status: implemented
  title: Run key set to a user-writable binary that also executes
  shape: sequence
  severity: high
  summary: >-
    A Run or RunOnce value is written pointing to a file in a user-writable location (Sysmon 13), and a process
    runs from that same file within ten minutes either side (Sysmon 1). Malware usually registers the binary it
    is already running from, so the execution often precedes the registry write.
  gaps: >-
    Startup-folder shortcuts and execution at the next logon (outside the window) are not paired. Values pointing
    at a shared interpreter (powershell.exe with arguments) match on the interpreter path, which is broader; AN1032
    still scores those.
  extends:
  - AN1032
  data_components:
  - DC0063
  - DC0032
  feeds:
  - sysmon
  join_key: host and executable path
  window: 10 minutes
  tuning:
  - element: RegistryKeyPath
    bind: macro
    name: mitre_det0365_run_keys
    default: >-
      TargetObject IN ("*\\CurrentVersion\\Run\\*", "*\\CurrentVersion\\RunOnce\\*", "*\\CurrentVersion\\RunOnceEx\\*",
      "*\\CurrentVersion\\Policies\\Explorer\\Run\\*")
  - element: ImagePath
    bind: macro
    name: mitre_det0365_user_writable
    default: >-
      (Details IN ("*\\AppData\\*", "*\\Users\\Public\\*", "*\\Temp\\*", "*\\ProgramData\\*", "*\\Downloads\\*")
      OR Image IN ("*\\AppData\\*", "*\\Users\\Public\\*", "*\\Temp\\*", "*\\ProgramData\\*", "*\\Downloads\\*"))
  - element: TimeWindow
    bind: macro
    name: mitre_det0365_window_seconds
    default: '600'
  spl: |
    (`mitre_dc0063_sysmon` EventCode=13 `mitre_det0365_run_keys` `mitre_det0365_user_writable`)
      OR (`mitre_dc0032_sysmon` EventCode=1 `mitre_det0365_user_writable`)
    | `mitre_normalize_host`
    | rex field=Details "(?i)^\"?(?<run_path>[a-z]:\\\\[^\"]+?\.(exe|scr|com|dll|bat|cmd|vbs|js|ps1|hta))"
    | eval file_path=lower(if(EventCode==13, run_path, Image)), set_time=if(EventCode==13, _time, null()), exec_time=if(EventCode==1, _time, null())
    | where isnotnull(file_path)
    | stats min(set_time) as set_time min(exec_time) as exec_time values(TargetObject) as registry_path values(Details) as registry_value_data values(eval(if(EventCode==13, Image, null()))) as writer values(user) as user by dest file_path
    | where isnotnull(set_time) AND isnotnull(exec_time) AND abs(exec_time - set_time) <= `mitre_det0365_window_seconds`
    | eval firstTime=min(set_time, exec_time), lastTime=max(set_time, exec_time)
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_det0365_filter`
  risk:
    message: Run key on $dest$ points to $file_path$, which also executed
    objects:
    - field: dest
      type: system
      score: 60
    - field: user
      type: user
      score: 50
    threat_objects:
    - field: file_path
      type: file_path
    - field: registry_path
      type: registry_path
  throttle:
    fields:
    - dest
    - file_path
    period: 86400s
  false_positives:
  - >-
    Per-user applications that register themselves at install and start immediately (collaboration clients, updaters).
  sigma:
    note: >-
      The Run value data carries quotes and arguments, so Sigma cannot alias it to the image path; the rule pairs
      the two events on the host only.
    rules:
    - name: det0365_run_key_user_path
      logsource:
        product: windows
        category: registry_set
      detection:
        key:
          TargetObject|contains:
          - \CurrentVersion\Run\
          - \CurrentVersion\RunOnce\
          - \CurrentVersion\Policies\Explorer\Run\
        data:
          Details|contains:
          - \AppData\
          - \Users\Public\
          - \Temp\
          - \ProgramData\
          - \Downloads\
        condition: key and data
    - name: det0365_user_path_exec
      logsource:
        product: windows
        category: process_creation
      detection:
        selection:
          Image|contains:
          - \AppData\
          - \Users\Public\
          - \Temp\
          - \ProgramData\
          - \Downloads\
        condition: selection
    correlation:
      type: temporal
      group-by:
      - Computer
      timespan: 10m
