# `attack` is regenerated by `mitremap scaffold`. Edit ONLY `curated`.
id: DET0294
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0294
  name: User Execution – Malicious File via download/open → spawn chain (T1204.002)
  attack_release: '20.1'
  technique:
    id: T1204.002
    name: Malicious File
    tactics:
    - execution
    usage_score: 296
  analytics:
  - id: AN0819
    platforms:
    - Windows
    implemented: true
    content_type: ttp
  - id: AN0820
    platforms:
    - macOS
    implemented: false
    content_type: null
  - id: AN0821
    platforms:
    - Linux
    implemented: false
    content_type: null
curated:
  status: implemented
  title: File written by a document or archive application, then executed
  shape: sequence
  severity: high
  summary: >-
    A document, mail, PDF or archive application writes an executable or script into a user-controlled path (Sysmon
    11), and within five minutes a process is started from that file, or a script host or shell is started with
    that file on its command line (Sysmon 1). Joined on host and file path.
  gaps: >-
    The Zone.Identifier stream (Sysmon 15) and signer allow-listing are not used. Payloads extracted to a different
    name before running break the path join.
  extends:
  - AN0819
  data_components:
  - DC0039
  - DC0032
  feeds:
  - sysmon
  join_key: host and file path
  window: 5 minutes
  tuning:
  - element: ParentApps
    bind: macro
    name: mitre_det0294_writer_apps
    default: >-
      Image IN ("*\\winword.exe", "*\\excel.exe", "*\\powerpnt.exe", "*\\outlook.exe", "*\\msaccess.exe", "*\\onenote.exe",
      "*\\acrord32.exe", "*\\acrobat.exe", "*\\foxitpdfreader.exe", "*\\winrar.exe", "*\\7zfm.exe", "*\\7zg.exe",
      "*\\explorer.exe")
    note: explorer.exe covers files extracted from ZIP and ISO containers by the shell.
  - element: UserPaths
    bind: macro
    name: mitre_det0294_user_paths
    default: >-
      (TargetFilename IN ("*\\Downloads\\*", "*\\AppData\\Local\\Temp\\*", "*\\Desktop\\*", "*\\Users\\Public\\*",
      "*\\INetCache\\*", "*\\Content.Outlook\\*") OR Image IN ("*\\Downloads\\*", "*\\AppData\\Local\\Temp\\*",
      "*\\Desktop\\*", "*\\Users\\Public\\*", "*\\INetCache\\*", "*\\Content.Outlook\\*") OR CommandLine IN ("*\\Downloads\\*",
      "*\\AppData\\Local\\Temp\\*", "*\\Desktop\\*", "*\\Users\\Public\\*", "*\\INetCache\\*", "*\\Content.Outlook\\*"))
  - element: SuspiciousExtensions
    bind: macro
    name: mitre_det0294_extensions
    default: >-
      TargetFilename IN ("*.exe", "*.scr", "*.com", "*.pif", "*.cpl", "*.dll", "*.js", "*.jse", "*.vbs", "*.vbe",
      "*.wsf", "*.hta", "*.bat", "*.cmd", "*.ps1", "*.lnk", "*.msi")
  - element: TimeWindow
    bind: macro
    name: mitre_det0294_window_seconds
    default: '300'
  spl: |
    (`mitre_dc0039_sysmon` EventCode=11 `mitre_det0294_writer_apps` `mitre_det0294_user_paths` `mitre_det0294_extensions`)
      OR (`mitre_dc0032_sysmon` EventCode=1 `mitre_det0294_user_paths`)
    | `mitre_normalize_host`
    | rex field=CommandLine "(?i)(?<cmd_path>[a-z]:\\\\[^\"]+?\.(js|jse|vbs|vbe|wsf|hta|bat|cmd|ps1|lnk|dll|cpl|msi))"
    | eval file_path=lower(case(EventCode==11, TargetFilename, isnotnull(cmd_path), cmd_path, true(), Image))
    | eval write_time=if(EventCode==11, _time, null()), exec_time=if(EventCode==1, _time, null()), writer=if(EventCode==11, Image, null()), launched=if(EventCode==1, Image, null())
    | stats min(write_time) as write_time min(exec_time) as exec_time values(writer) as writer values(launched) as launched values(CommandLine) as process values(user) as user by dest file_path
    | where isnotnull(write_time) AND isnotnull(exec_time) AND exec_time >= write_time AND exec_time - write_time <= `mitre_det0294_window_seconds`
    | eval writer_name=replace(mvindex(writer, 0), "^.*\\\\", ""), firstTime=write_time, lastTime=exec_time
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_det0294_filter`
  risk:
    message: File written by $writer_name$ was executed on $dest$
    objects:
    - field: dest
      type: system
      score: 70
    - field: user
      type: user
      score: 70
    threat_objects:
    - field: file_path
      type: file_path
  throttle:
    fields:
    - dest
    - file_path
    period: 86400s
  false_positives:
  - >-
    Users installing software downloaded through the browser and opened from Explorer; signed installers can be
    excluded by path in the filter macro.
  sigma:
    note: >-
      Scripts launched through an interpreter carry the path on the command line, which a Sigma alias cannot extract;
      the rule pairs direct executable launches only. The correlation is temporal (unordered) because the Splunk
      pySigma backend does not implement temporal_ordered; the Splunk search enforces the order.
    rules:
    - name: det0294_document_app_write
      logsource:
        product: windows
        category: file_event
      detection:
        selection:
          Image|endswith:
          - \winword.exe
          - \excel.exe
          - \powerpnt.exe
          - \outlook.exe
          - \acrord32.exe
          - \acrobat.exe
          - \winrar.exe
          - \7zfm.exe
          - \explorer.exe
          TargetFilename|contains:
          - \Downloads\
          - \AppData\Local\Temp\
          - \Desktop\
          - \Users\Public\
          - \INetCache\
          - \Content.Outlook\
          TargetFilename|endswith:
          - .exe
          - .scr
          - .com
          - .pif
          - .cpl
        condition: selection
    - name: det0294_user_path_exec
      logsource:
        product: windows
        category: process_creation
      detection:
        selection:
          Image|contains:
          - \Downloads\
          - \AppData\Local\Temp\
          - \Desktop\
          - \Users\Public\
          - \INetCache\
          - \Content.Outlook\
        condition: selection
    correlation:
      type: temporal
      aliases:
        file_path:
          det0294_document_app_write: TargetFilename
          det0294_user_path_exec: Image
      group-by:
      - Computer
      - file_path
      timespan: 5m
