# `attack` is regenerated by `mitremap scaffold`. Edit ONLY `curated`.
id: DET0140
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0140
  name: Behavioral Detection of Malicious File Deletion
  attack_release: '20.1'
  technique:
    id: T1070.004
    name: File Deletion
    tactics:
    - stealth
    usage_score: 380
  analytics:
  - id: AN0392
    platforms:
    - Windows
    implemented: true
    content_type: anomaly
  - id: AN0393
    platforms:
    - Linux
    implemented: false
    content_type: null
  - id: AN0394
    platforms:
    - macOS
    implemented: false
    content_type: null
  - id: AN0395
    platforms:
    - ESXi
    implemented: false
    content_type: null
curated:
  status: implemented
  title: Binary or script run from a staging path, then deleted
  shape: sequence
  severity: high
  summary: >-
    A program or script runs from a staging path (Sysmon 1, directly or on an interpreter's command line) and the
    same file is deleted within ten minutes (Sysmon 23/26). Droppers and hands-on-keyboard tooling clean up this
    way; legitimate software rarely deletes its own binary minutes after running it.
  gaps: >-
    Deletion by a different name (renamed before deletion) or by wiping tools that overwrite in place is not joined;
    AN0392 still reports secure deletion on its own.
  extends:
  - AN0392
  data_components:
  - DC0032
  - DC0040
  feeds:
  - sysmon
  join_key: host and file path
  window: 10 minutes
  tuning:
  - element: FilePathPattern
    bind: macro
    name: mitre_det0140_staging_paths
    default: >-
      ("*\\AppData\\Local\\Temp\\*", "*\\Windows\\Temp\\*", "*\\Users\\Public\\*", "*\\ProgramData\\*", "*\\PerfLogs\\*",
      "*\\Downloads\\*")
    note: A parenthesised value list used with IN.
  - element: TimeWindow
    bind: macro
    name: mitre_det0140_window_seconds
    default: '600'
  spl: |
    (`mitre_dc0032_sysmon` EventCode=1 (Image IN `mitre_det0140_staging_paths` OR CommandLine IN `mitre_det0140_staging_paths`))
      OR (`mitre_dc0040_sysmon` EventCode IN (23, 26) TargetFilename IN `mitre_det0140_staging_paths` TargetFilename IN ("*.exe", "*.dll", "*.scr", "*.ps1", "*.bat", "*.cmd", "*.vbs", "*.js", "*.hta"))
    | `mitre_normalize_host`
    | rex field=CommandLine "(?i)(?<cmd_path>[a-z]:\\\\[^\"]+?\.(ps1|bat|cmd|vbs|js|hta|dll))"
    | eval file_path=lower(case(EventCode IN (23, 26), TargetFilename, isnotnull(cmd_path), cmd_path, true(), Image))
    | eval exec_time=if(EventCode==1, _time, null()), delete_time=if(EventCode IN (23, 26), _time, null()), deleter=if(EventCode IN (23, 26), replace(Image, "^.*\\\\", ""), null())
    | stats min(exec_time) as exec_time max(delete_time) as delete_time values(deleter) as deleter values(eval(if(EventCode==1, CommandLine, null()))) as process values(user) as user by dest file_path
    | where isnotnull(exec_time) AND isnotnull(delete_time) AND delete_time >= exec_time AND delete_time - exec_time <= `mitre_det0140_window_seconds`
    | eval firstTime=exec_time, lastTime=delete_time
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_det0140_filter`
  risk:
    message: $file_path$ ran on $dest$ and was deleted shortly after
    objects:
    - field: dest
      type: system
      score: 60
    - field: user
      type: user
      score: 50
    threat_objects:
    - field: file_path
      type: file_path
  throttle:
    fields:
    - dest
    - file_path
    period: 86400s
  false_positives:
  - Installers and updaters that run a bootstrapper from Temp and remove it when done.
  sigma:
    note: >-
      Uses a temporal (unordered) correlation because the Splunk pySigma backend does not implement temporal_ordered;
      scripts run through an interpreter are joined only in the Splunk search.
    rules:
    - name: det0140_staged_exec
      logsource:
        product: windows
        category: process_creation
      detection:
        selection:
          Image|contains:
          - \AppData\Local\Temp\
          - \Windows\Temp\
          - \Users\Public\
          - \ProgramData\
          - \PerfLogs\
          - \Downloads\
        condition: selection
    - name: det0140_staged_delete
      logsource:
        product: windows
        category: file_delete
      detection:
        selection:
          TargetFilename|contains:
          - \AppData\Local\Temp\
          - \Windows\Temp\
          - \Users\Public\
          - \ProgramData\
          - \PerfLogs\
          - \Downloads\
          TargetFilename|endswith:
          - .exe
          - .dll
          - .scr
        condition: selection
    correlation:
      type: temporal
      aliases:
        file_path:
          det0140_staged_exec: Image
          det0140_staged_delete: TargetFilename
      group-by:
      - Computer
      - file_path
      timespan: 10m
