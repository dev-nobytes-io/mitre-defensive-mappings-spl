  title: DNS tunnelling seen from both the endpoint and the network
  shape: risk_threshold
  severity: high
  summary: >-
    The same risk object carries both AN1121 (Sysmon DNS queries from a non-browser process) and AN1124 (Corelight
    dns.log pattern) within an hour. Agreement between the two vantage points raises confidence well above either
    alone.
