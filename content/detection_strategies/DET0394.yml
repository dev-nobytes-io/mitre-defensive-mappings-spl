# `attack` is regenerated by `mitremap scaffold`. Edit ONLY `curated`.
id: DET0394
attack:
  url: https://attack.mitre.org/detectionstrategies/DET0394
  name: Web Shell Detection via Server Behavior and File Execution Chains
  attack_release: '20.1'
  technique:
    id: T1505.003
    name: Web Shell
    tactics:
    - persistence
    usage_score: 112
  analytics:
  - id: AN1108
    platforms:
    - Windows
    implemented: true
    content_type: ttp
  - id: AN1109
    platforms:
    - Linux
    implemented: false
    content_type: null
  - id: AN1110
    platforms:
    - macOS
    implemented: false
    content_type: null
curated:
  status: implemented
  title: Script file dropped in a web root, then the web server spawned a shell
  shape: sequence
  severity: critical
  summary: >-
    A server-side script file (aspx, ashx, asmx, asp, php, jsp, cfm) is created under a web root (Sysmon 11) and
    within an hour a web server worker on the same host starts a shell or LOLBin (Sysmon 1). This is the write-then-use
    chain of a web shell; AN1108 alone sees only the second half.
  gaps: >-
    The inbound HTTP POST to the new file (Corelight http.log) and the associated logon are not joined. A web shell
    planted more than an hour before its first use is missed by this sequence.
  extends:
  - AN1108
  data_components:
  - DC0039
  - DC0032
  feeds:
  - sysmon
  join_key: host
  window: 1 hour
  tuning:
  - element: WebRootPath
    bind: macro
    name: mitre_det0394_web_roots
    default: >-
      TargetFilename IN ("*\\inetpub\\wwwroot\\*", "*\\inetpub\\*\\*", "*\\FrontEnd\\HttpProxy\\*", "*\\ClientAccess\\*",
      "*\\htdocs\\*", "*\\webapps\\*", "*\\www\\*", "*\\wwwroot\\*")
  - element: ScriptExtensions
    bind: macro
    name: mitre_det0394_script_ext
    default: >-
      TargetFilename IN ("*.aspx", "*.ashx", "*.asmx", "*.asp", "*.cer", "*.php", "*.php5", "*.phtml", "*.jsp",
      "*.jspx", "*.cfm")
  - element: ParentProcess
    bind: macro
    name: mitre_det0394_web_workers
    default: >-
      ParentImage IN ("*\\w3wp.exe", "*\\httpd.exe", "*\\nginx.exe", "*\\php-cgi.exe", "*\\php.exe", "*\\tomcat*.exe",
      "*\\UMWorkerProcess.exe")
  - element: TimeWindow
    bind: macro
    name: mitre_det0394_window_seconds
    default: '3600'
  spl: |
    (`mitre_dc0039_sysmon` EventCode=11 `mitre_det0394_web_roots` `mitre_det0394_script_ext`)
      OR (`mitre_dc0032_sysmon` EventCode=1 `mitre_det0394_web_workers` Image IN ("*\\cmd.exe", "*\\powershell.exe", "*\\pwsh.exe", "*\\wscript.exe", "*\\cscript.exe", "*\\mshta.exe", "*\\rundll32.exe", "*\\regsvr32.exe", "*\\certutil.exe", "*\\whoami.exe", "*\\net.exe", "*\\net1.exe", "*\\nltest.exe", "*\\systeminfo.exe"))
    | `mitre_normalize_host`
    | eval write_time=if(EventCode==11, _time, null()), spawn_time=if(EventCode==1, _time, null())
    | stats min(write_time) as write_time max(spawn_time) as spawn_time values(TargetFilename) as file_path values(eval(if(EventCode==1, Image, null()))) as spawned values(CommandLine) as process values(ParentImage) as web_worker by dest
    | where isnotnull(write_time) AND isnotnull(spawn_time) AND spawn_time >= write_time AND spawn_time - write_time <= `mitre_det0394_window_seconds`
    | eval firstTime=write_time, lastTime=spawn_time
    | `mitre_ctime(firstTime)` | `mitre_ctime(lastTime)`
    | `mitre_det0394_filter`
  risk:
    message: Script dropped in a web root on $dest$ followed by web server shell activity
    objects:
    - field: dest
      type: system
      score: 90
    threat_objects:
    - field: file_path
      type: file_path
  schedule:
    earliest: -125m@m
    latest: -5m@m
  throttle:
    fields:
    - dest
    period: 86400s
  false_positives:
  - Application deployments that publish pages and then run setup scripts through the application pool.
  sigma:
    note: >-
      Uses a temporal (unordered) correlation because the Splunk pySigma backend does not implement temporal_ordered;
      the Splunk search enforces the order.
    rules:
    - name: det0394_web_root_script
      logsource:
        product: windows
        category: file_event
      detection:
        selection:
          TargetFilename|contains:
          - \inetpub\
          - \FrontEnd\HttpProxy\
          - \ClientAccess\
          - \htdocs\
          - \webapps\
          - \wwwroot\
          TargetFilename|endswith:
          - .aspx
          - .ashx
          - .asmx
          - .asp
          - .php
          - .jsp
          - .jspx
          - .cfm
        condition: selection
    - name: det0394_web_worker_shell
      logsource:
        product: windows
        category: process_creation
      detection:
        parent:
          ParentImage|endswith:
          - \w3wp.exe
          - \httpd.exe
          - \nginx.exe
          - \php-cgi.exe
          - \UMWorkerProcess.exe
        child:
          Image|endswith:
          - \cmd.exe
          - \powershell.exe
          - \pwsh.exe
          - \wscript.exe
          - \cscript.exe
          - \mshta.exe
          - \rundll32.exe
          - \certutil.exe
          - \whoami.exe
        condition: parent and child
    correlation:
      type: temporal
      group-by:
      - Computer
      timespan: 1h
